<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Đặt Câu Hỏi Tiếng Anh - 5W1H</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .pulse-recording { animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); transform: scale(0.95); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); transform: scale(1); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); transform: scale(0.95); }
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex justify-center items-center p-0 sm:p-6">
    <div id="root" class="w-full max-w-6xl h-[100vh] sm:h-[90vh]"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [inputText, setInputText] = useState("");
            const [chunks, setChunks] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            
            // Interaction States
            const [userQuestion, setUserQuestion] = useState("");
            const [isRecording, setIsRecording] = useState(false);
            const [recognitionError, setRecognitionError] = useState("");
            
            // Evaluation States
            const [isEvaluating, setIsEvaluating] = useState(false);
            const [feedback, setFeedback] = useState(null);

            // Hints States (New Feature)
            const [isLoadingHints, setIsLoadingHints] = useState(false);
            const [hintsData, setHintsData] = useState(null);

            // Refs
            const recognitionRef = useRef(null);
            const transcriptRef = useRef("");

            useEffect(() => { lucide.createIcons(); }, [chunks, currentIndex, isRecording, feedback, isEvaluating, hintsData, isLoadingHints]);

            useEffect(() => {
                if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    const recognition = new SpeechRecognition();
                    recognition.continuous = true;
                    recognition.interimResults = true;
                    recognition.lang = 'en-US'; 

                    recognition.onresult = (event) => {
                        let interim = '';
                        let final = '';
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            if (event.results[i].isFinal) {
                                final += event.results[i][0].transcript + ' ';
                            } else {
                                interim += event.results[i][0].transcript;
                            }
                        }
                        transcriptRef.current += final;
                        setUserQuestion((transcriptRef.current + interim).trim());
                    };

                    recognition.onerror = (e) => {
                        setIsRecording(false);
                        setRecognitionError(e.error === 'not-allowed' ? "Vui lòng cấp quyền Micro." : "Lỗi thu âm: " + e.error);
                    };

                    recognition.onend = () => setIsRecording(false);
                    recognitionRef.current = recognition;
                } else {
                    setRecognitionError("Trình duyệt của bạn không hỗ trợ nhận diện giọng nói.");
                }
            }, []);

            const handleStartProcessing = () => {
                if (!inputText.trim()) return;
                
                const sentences = inputText.match(/[^.?!]+[.?!]+(?=\s|$)|[^.?!]+$/g);
                if (!sentences) {
                    setChunks([inputText]);
                } else {
                    const newChunks = [];
                    for (let i = 0; i < sentences.length; i += 2) {
                        newChunks.push(sentences.slice(i, i + 2).join(' ').trim());
                    }
                    setChunks(newChunks);
                }
                setCurrentIndex(0);
                resetTurn();
            };

            const resetTurn = () => {
                setUserQuestion("");
                transcriptRef.current = "";
                setFeedback(null);
                setHintsData(null); // Clear hints on new turn
                setRecognitionError("");
                if (isRecording) {
                    recognitionRef.current?.stop();
                    setIsRecording(false);
                }
            };

            const toggleRecording = () => {
                setRecognitionError("");
                if (isRecording) {
                    recognitionRef.current?.stop();
                } else {
                    transcriptRef.current = "";
                    setUserQuestion("");
                    recognitionRef.current?.start();
                    setIsRecording(true);
                }
            };

            const fetchHints = async () => {
                setIsLoadingHints(true);
                setRecognitionError("");

                const currentContext = chunks[currentIndex];
                const apiKey = ""; 
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const prompt = `
Bạn là một giáo viên tiếng Anh hỗ trợ học viên mất gốc.
Đoạn văn học viên đang đọc: "${currentContext}"

Nhiệm vụ:
1. Dịch đoạn văn trên. (Nếu đoạn gốc là tiếng Việt thì dịch sang tiếng Anh, nếu là tiếng Anh thì dịch sang tiếng Việt) để học viên tham khảo từ vựng.
2. Đưa ra 3 ý tưởng để học viên tự đặt câu hỏi 5W1H (What, Where, When, Who, Why, How, How much...) dựa vào nội dung. 
LƯU Ý QUAN TRỌNG: Ở phần ý tưởng, CHỈ được đưa ra "Từ để hỏi tiếng Anh" và "Gợi ý bằng tiếng Việt". TUYỆT ĐỐI KHÔNG viết ra câu hỏi tiếng Anh hoàn chỉnh để học viên phải tự suy nghĩ.

Trả về định dạng JSON chính xác sau:
{
    "translation": "(Bản dịch của đoạn văn)",
    "suggestions": [
        { "wh_word": "When", "idea_vi": "Hỏi về thời gian diễn ra sự kiện" },
        { "wh_word": "Where", "idea_vi": "Hỏi về địa điểm" }
    ]
}`;

                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                "translation": { type: "STRING" },
                                "suggestions": {
                                    type: "ARRAY",
                                    items: {
                                        type: "OBJECT",
                                        properties: {
                                            "wh_word": { type: "STRING" },
                                            "idea_vi": { type: "STRING" }
                                        }
                                    }
                                }
                            },
                            required: ["translation", "suggestions"]
                        }
                    }
                };

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    if (result.candidates && result.candidates[0].content.parts[0].text) {
                        setHintsData(JSON.parse(result.candidates[0].content.parts[0].text));
                    }
                } catch (error) {
                    setRecognitionError("Không thể tải gợi ý lúc này. Vui lòng thử lại.");
                } finally {
                    setIsLoadingHints(false);
                }
            };

            const evaluateWithAI = async () => {
                if (!userQuestion.trim()) {
                    setRecognitionError("Vui lòng nhập hoặc nói câu hỏi của bạn.");
                    return;
                }
                
                if (isRecording) {
                    recognitionRef.current?.stop();
                    setIsRecording(false);
                }

                setIsEvaluating(true);
                setRecognitionError("");

                const currentContext = chunks[currentIndex];
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const prompt = `
Bạn là giáo viên giao tiếp tiếng Anh cơ bản.
Ngữ cảnh: "${currentContext}"
Câu hỏi học viên đặt ra (Tiếng Anh): "${userQuestion}"

Nhiệm vụ: Đánh giá câu hỏi trên phương diện GIAO TIẾP. Bỏ qua các lỗi ngữ pháp nhỏ, chỉ cần đúng từ để hỏi (5W1H) và người nghe hiểu được ý là đạt.

Hãy trả về dưới định dạng JSON:
{
    "score": (số nguyên 0-100),
    "feedback_vi": (Nhận xét tiếng Việt: Khen ngợi, thân thiện. Chỉ ra lỗi sai thật nhẹ nhàng nếu có.),
    "suggested_questions": [
        (Mảng 2-3 câu hỏi mẫu tiếng Anh cực kỳ cơ bản, ngắn gọn nhất có thể)
    ]
}`;

                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                "score": { type: "INTEGER" },
                                "feedback_vi": { type: "STRING" },
                                "suggested_questions": { type: "ARRAY", items: { type: "STRING" } }
                            },
                            required: ["score", "feedback_vi", "suggested_questions"]
                        }
                    }
                };

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    setFeedback(JSON.parse(result.candidates[0].content.parts[0].text));
                } catch (error) {
                    setRecognitionError("Lỗi chấm điểm. Vui lòng thử lại.");
                } finally {
                    setIsEvaluating(false);
                }
            };

            const nextChunk = () => {
                if (currentIndex < chunks.length - 1) {
                    setCurrentIndex(currentIndex + 1);
                    resetTurn();
                } else {
                    setChunks([]);
                    setInputText("");
                }
            };

            if (chunks.length === 0) {
                return (
                    <div className="w-full h-full bg-white sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative border border-gray-100">
                        <div className="bg-gradient-to-r from-blue-700 to-indigo-700 p-8 text-white">
                            <h1 className="text-3xl font-extrabold mb-2">Luyện Đặt Câu Hỏi (5W1H) 💡</h1>
                            <p className="text-blue-100 text-lg opacity-90">Phát triển phản xạ hỏi đáp tự nhiên như người bản xứ</p>
                        </div>
                        
                        <div className="flex-1 p-8 flex flex-col bg-white">
                            <h2 className="text-xl text-gray-800 font-bold mb-3 flex items-center">
                                <i data-lucide="file-text" className="w-6 h-6 mr-2 text-indigo-600"></i>
                                Nhập tài liệu học tập
                            </h2>
                            <p className="text-gray-500 mb-6 text-lg">
                                Hãy dán một đoạn văn bản (Tiếng Việt hoặc Tiếng Anh) vào đây. Máy sẽ chia nhỏ để bạn tập đặt câu hỏi khai thác thông tin.
                            </p>
                            
                            <textarea 
                                value={inputText}
                                onChange={(e) => setInputText(e.target.value)}
                                placeholder="Ví dụ: Công ty chúng tôi được thành lập vào năm 2010 tại Hà Nội..."
                                className="w-full flex-1 p-5 border-2 border-gray-200 rounded-2xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 outline-none resize-none transition-all text-gray-700 bg-gray-50 text-lg"
                            ></textarea>
                            
                            <button 
                                onClick={handleStartProcessing}
                                disabled={!inputText.trim()}
                                className="mt-6 w-full md:w-1/2 mx-auto py-4 bg-indigo-600 text-white rounded-2xl font-bold text-xl shadow-lg hover:bg-indigo-700 transform hover:-translate-y-0.5 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center"
                            >
                                <i data-lucide="play-circle" className="w-6 h-6 mr-2"></i> Bắt đầu Luyện tập
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="w-full h-full bg-white sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-gray-100">
                    {/* Header */}
                    <div className="bg-white px-6 py-4 shadow-sm z-20 border-b border-gray-200 flex items-center justify-between shrink-0">
                        <div>
                            <span className="text-sm font-black text-gray-400 uppercase tracking-wider">Tiến trình học</span>
                            <div className="font-bold text-indigo-700 text-lg">Đoạn {currentIndex + 1} / {chunks.length}</div>
                        </div>
                        <button onClick={() => setChunks([])} className="text-gray-500 hover:text-red-500 p-2 rounded-full hover:bg-red-50 transition flex items-center font-semibold text-sm">
                            <i data-lucide="home" className="w-4 h-4 mr-1"></i> Trở về
                        </button>
                    </div>

                    {/* 2-Column Layout */}
                    <div className="flex-1 flex flex-col md:flex-row overflow-hidden">
                        
                        {/* COLUMN 1: Context & Hints (Left side on desktop, Top on mobile) */}
                        <div className="w-full md:w-1/2 flex flex-col border-b md:border-b-0 md:border-r border-gray-200 bg-slate-50 overflow-y-auto shrink-0 md:shrink">
                            <div className="p-6 md:p-8 flex flex-col gap-6">
                                
                                {/* Info Box */}
                                <div>
                                    <h3 className="text-sm font-bold text-indigo-500 uppercase tracking-wider mb-3 flex items-center">
                                        <i data-lucide="book-open" className="w-4 h-4 mr-2"></i> Đoạn văn bản
                                    </h3>
                                    <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-200 text-gray-800 text-lg font-medium leading-relaxed">
                                        {chunks[currentIndex]}
                                    </div>
                                </div>

                                {/* Hints Section */}
                                {!hintsData && !isLoadingHints && (
                                    <button 
                                        onClick={fetchHints}
                                        className="w-full py-4 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-2xl font-bold flex items-center justify-center transition border border-amber-200 shadow-sm"
                                    >
                                        <i data-lucide="lightbulb" className="w-5 h-5 mr-2"></i> Cần gợi ý & Bản dịch?
                                    </button>
                                )}

                                {isLoadingHints && (
                                    <div className="w-full py-4 text-amber-600 font-bold flex items-center justify-center animate-pulse">
                                        <i data-lucide="loader-2" className="w-5 h-5 mr-2 animate-spin"></i> AI đang phân tích gợi ý...
                                    </div>
                                )}

                                {hintsData && (
                                    <div className="animate-in fade-in zoom-in-95 duration-300 flex flex-col gap-4">
                                        {/* Translation */}
                                        <div className="bg-white rounded-2xl p-5 border border-indigo-100 shadow-sm">
                                            <h4 className="text-xs font-bold text-gray-400 uppercase mb-2">Bản dịch tham khảo:</h4>
                                            <p className="text-gray-700 italic">{hintsData.translation}</p>
                                        </div>
                                        
                                        {/* Suggestions */}
                                        <div className="bg-gradient-to-br from-amber-50 to-orange-50 rounded-2xl p-5 border border-amber-200 shadow-sm">
                                            <h4 className="font-bold text-amber-800 mb-3 flex items-center">
                                                <i data-lucide="target" className="w-5 h-5 mr-2"></i> Ý tưởng đặt câu:
                                            </h4>
                                            <ul className="space-y-3">
                                                {hintsData.suggestions.map((sg, idx) => (
                                                    <li key={idx} className="flex items-start">
                                                        <span className="bg-amber-500 text-white font-bold px-3 py-1 rounded-lg text-sm mr-3 mt-0.5 shadow-sm">
                                                            {sg.wh_word}
                                                        </span>
                                                        <span className="text-gray-700 font-medium">{sg.idea_vi}</span>
                                                    </li>
                                                ))}
                                            </ul>
                                            <p className="text-xs text-amber-600 mt-4 italic text-center">
                                                * Dựa vào gợi ý trên, bạn hãy tự lắp ghép thành câu tiếng Anh nhé!
                                            </p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* COLUMN 2: Interaction & Feedback (Right side on desktop, Bottom on mobile) */}
                        <div className="w-full md:w-1/2 flex flex-col bg-white overflow-y-auto shrink-0 md:shrink">
                            <div className="p-6 md:p-8 flex flex-col gap-6 flex-1">
                                
                                {/* Instruction */}
                                {!feedback && (
                                    <div className="text-center animate-in fade-in duration-500 pt-2">
                                        <span className="inline-block bg-indigo-100 text-indigo-800 text-sm font-bold px-4 py-1.5 rounded-full mb-3">
                                            Nhiệm vụ của bạn
                                        </span>
                                        <h3 className="text-gray-700 text-lg font-medium">Dựa vào thông tin bên trái, hãy đặt 1 câu hỏi tiếng Anh.</h3>
                                    </div>
                                )}

                                {/* Input Area */}
                                {!feedback && (
                                    <div className="bg-gray-50 rounded-3xl p-3 shadow-inner border border-gray-200 focus-within:border-indigo-400 focus-within:ring-4 focus-within:ring-indigo-500/10 transition-all flex-1 md:flex-none flex flex-col min-h-[250px]">
                                        <textarea
                                            value={userQuestion}
                                            onChange={(e) => setUserQuestion(e.target.value)}
                                            placeholder="Gõ câu hỏi tiếng Anh của bạn vào đây..."
                                            className="w-full p-4 flex-1 outline-none resize-none text-gray-800 bg-transparent text-xl font-medium"
                                        ></textarea>
                                        
                                        {recognitionError && <p className="text-red-500 text-sm px-4 pb-3">{recognitionError}</p>}
                                        
                                        <div className="flex flex-col sm:flex-row justify-between items-center gap-3 mt-auto p-2">
                                            <button 
                                                onClick={toggleRecording}
                                                className={`w-full sm:w-auto flex items-center justify-center px-5 py-3.5 rounded-2xl text-base font-bold transition-all
                                                    ${isRecording ? 'bg-red-100 text-red-600 pulse-recording' : 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-100 shadow-sm'}`}
                                            >
                                                <i data-lucide={isRecording ? "square" : "mic"} className="w-5 h-5 mr-2"></i>
                                                {isRecording ? "Đang nghe..." : "Nói bằng Micro"}
                                            </button>
                                            
                                            <button 
                                                onClick={evaluateWithAI}
                                                disabled={!userQuestion.trim() || isEvaluating}
                                                className="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 text-white px-8 py-3.5 rounded-2xl text-base font-bold shadow-md transition flex items-center justify-center"
                                            >
                                                {isEvaluating ? (
                                                    <><i data-lucide="loader-2" className="w-5 h-5 mr-2 animate-spin"></i> Đang chấm...</>
                                                ) : (
                                                    <><i data-lucide="send" className="w-5 h-5 mr-2"></i> Chấm điểm</>
                                                )}
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {/* Feedback Area */}
                                {feedback && (
                                    <div className="animate-in slide-in-from-bottom-4 duration-500 flex flex-col gap-5 pb-6">
                                        <div className="bg-gray-50 rounded-2xl p-5 border border-gray-200">
                                            <p className="text-xs text-gray-500 font-bold uppercase mb-2">Câu hỏi của bạn:</p>
                                            <p className="text-gray-800 text-xl font-medium italic">"{userQuestion}"</p>
                                        </div>

                                        <div className="bg-white rounded-2xl p-6 shadow-md border-t-4" style={{ borderColor: feedback.score >= 80 ? '#10b981' : feedback.score >= 50 ? '#f59e0b' : '#ef4444' }}>
                                            <div className="flex items-center mb-4">
                                                <div className={`w-14 h-14 rounded-full flex items-center justify-center text-white font-black text-2xl shadow-sm mr-4 shrink-0
                                                    ${feedback.score >= 80 ? 'bg-green-500' : feedback.score >= 50 ? 'bg-amber-500' : 'bg-red-500'}`}>
                                                    {feedback.score}
                                                </div>
                                                <h3 className="font-bold text-gray-800 text-xl">Nhận xét từ Giáo viên AI</h3>
                                            </div>
                                            <p className="text-gray-600 text-lg leading-relaxed">{feedback.feedback_vi}</p>
                                        </div>

                                        <div className="bg-indigo-50 rounded-2xl p-6 border border-indigo-100">
                                            <h3 className="font-bold text-indigo-800 mb-4 flex items-center text-lg">
                                                <i data-lucide="sparkles" className="w-6 h-6 mr-2 text-indigo-600"></i>
                                                Câu hỏi mẫu (Ngắn gọn & Tự nhiên):
                                            </h3>
                                            <ul className="space-y-3">
                                                {feedback.suggested_questions.map((q, idx) => (
                                                    <li key={idx} className="bg-white p-4 rounded-xl border border-indigo-200 shadow-sm flex items-start text-lg">
                                                        <i data-lucide="check-circle-2" className="w-6 h-6 mr-3 text-indigo-500 shrink-0 mt-0.5"></i>
                                                        <span className="font-bold text-gray-800">{q}</span>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Footer Actions (Next Button) */}
                            {feedback && (
                                <div className="mt-auto bg-gray-50 p-5 border-t border-gray-200 flex gap-4 shrink-0 z-10">
                                    <button 
                                        onClick={resetTurn}
                                        className="flex-1 py-4 bg-white border-2 border-gray-200 text-gray-700 font-bold text-lg rounded-2xl hover:bg-gray-100 transition shadow-sm"
                                    >
                                        Thử lại câu này
                                    </button>
                                    <button 
                                        onClick={nextChunk}
                                        className="flex-1 py-4 bg-indigo-600 text-white font-bold text-lg rounded-2xl shadow-lg hover:bg-indigo-700 transition flex items-center justify-center"
                                    >
                                        {currentIndex < chunks.length - 1 ? "Phần tiếp theo" : "Hoàn thành"}
                                        <i data-lucide="arrow-right" className="w-6 h-6 ml-2"></i>
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
