
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Đặt Câu Hỏi - Tiếng Anh cùng Bob</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .pulse-recording { animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); transform: scale(0.95); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); transform: scale(1); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); transform: scale(0.95); }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .active-chunk { border-left: 4px solid #4f46e5; background-color: #eef2ff; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex justify-center items-center p-0 sm:p-4">
    <div id="root" class="w-full max-w-[1400px] h-[100dvh] sm:h-[95vh]"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // COMPONENT ICON: Sửa triệt để lỗi màn hình trắng khi render lại DOM
        const Icon = ({ name, className }) => {
            const iconRef = useRef(null);
            
            useEffect(() => {
                if (iconRef.current && window.lucide && window.lucide.icons[name]) {
                    iconRef.current.innerHTML = ''; // Xóa nội dung cũ để tránh xung đột React
                    const svg = window.lucide.createElement(window.lucide.icons[name]);
                    if (className) {
                        className.split(' ').forEach(cls => {
                            if(cls) svg.classList.add(cls);
                        });
                    }
                    iconRef.current.appendChild(svg);
                }
            }, [name, className]);

            return <span ref={iconRef} className="inline-flex items-center justify-center shrink-0"></span>;
        };

        function App() {
            const [inputText, setInputText] = useState("");
            const [chunks, setChunks] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            
            const [userQuestion, setUserQuestion] = useState("");
            const [isRecording, setIsRecording] = useState(false);
            const [recognitionError, setRecognitionError] = useState("");
            
            const [isEvaluating, setIsEvaluating] = useState(false);
            const [feedback, setFeedback] = useState(null);

            const [isLoadingHints, setIsLoadingHints] = useState(false);
            const [hintsData, setHintsData] = useState(null);

            const recognitionRef = useRef(null);
            const transcriptRef = useRef("");

            useEffect(() => {
                if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    const recognition = new SpeechRecognition();
                    recognition.continuous = true;
                    recognition.interimResults = true;
                    recognition.lang = 'en-US'; 

                    recognition.onresult = (event) => {
                        let interim = '';
                        let final = '';
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            if (event.results[i].isFinal) {
                                final += event.results[i][0].transcript + ' ';
                            } else {
                                interim += event.results[i][0].transcript;
                            }
                        }
                        transcriptRef.current += final;
                        setUserQuestion((transcriptRef.current + interim).trim());
                    };

                    recognition.onerror = (e) => {
                        setIsRecording(false);
                        setRecognitionError(e.error === 'not-allowed' ? "Vui lòng cấp quyền Micro để dùng giọng nói." : "Lỗi thu âm: " + e.error);
                    };

                    recognition.onend = () => setIsRecording(false);
                    recognitionRef.current = recognition;
                } else {
                    setRecognitionError("Trình duyệt không hỗ trợ nhận diện giọng nói (Khuyên dùng Google Chrome).");
                }
            }, []);

            const handleStartProcessing = () => {
                if (!inputText.trim()) return;
                
                let sentences = [];
                if (window.Intl && Intl.Segmenter) {
                    const segmenter = new Intl.Segmenter('en', { granularity: 'sentence' });
                    sentences = Array.from(segmenter.segment(inputText)).map(s => s.segment.trim()).filter(s => s.length > 0);
                } else {
                    const match = inputText.match(/[^.?!]+[.?!]+(?=\s|$)|[^.?!]+$/g);
                    sentences = match ? match.map(s => s.trim()).filter(s => s.length > 0) : [inputText];
                }

                const newChunks = [];
                let currentChunk = [];
                let currentWordCount = 0;

                for (let i = 0; i < sentences.length; i++) {
                    const sentence = sentences[i];
                    const words = sentence.split(/\s+/).length;
                    
                    currentChunk.push(sentence);
                    currentWordCount += words;
                    
                    if (currentChunk.length >= 2 || currentWordCount >= 15) {
                        newChunks.push(currentChunk.join(" "));
                        currentChunk = [];
                        currentWordCount = 0;
                    }
                }

                if (currentChunk.length > 0) {
                    newChunks.push(currentChunk.join(" "));
                }

                setChunks(newChunks);
                setCurrentIndex(0);
                resetTurn();
            };

            const resetTurn = () => {
                setUserQuestion("");
                transcriptRef.current = "";
                setFeedback(null);
                setHintsData(null);
                setRecognitionError("");
                if (isRecording) {
                    recognitionRef.current?.stop();
                    setIsRecording(false);
                }
            };

            const toggleRecording = () => {
                setRecognitionError("");
                if (isRecording) {
                    recognitionRef.current?.stop();
                } else {
                    transcriptRef.current = "";
                    setUserQuestion("");
                    recognitionRef.current?.start();
                    setIsRecording(true);
                }
            };

            const parseAIResponse = (text) => {
                try {
                    let cleanedText = text.replace(/```json/g, '').replace(/```/g, '').trim();
                    const start = cleanedText.indexOf('{');
                    const end = cleanedText.lastIndexOf('}');
                    if (start !== -1 && end !== -1) {
                        cleanedText = cleanedText.substring(start, end + 1);
                    }
                    return JSON.parse(cleanedText);
                } catch (e) {
                    console.error("Lỗi parse JSON:", e, text);
                    return null;
                }
            };

            // TỐI ƯU PROMPT: Dành cho học viên trưởng thành, tập trung giao tiếp tự nhiên
            const fetchHints = async () => {
                setIsLoadingHints(true);
                setRecognitionError("");

                const currentContext = chunks[currentIndex];
                const prompt = `Đoạn văn bản: "${currentContext}". 
Hãy đóng vai là giáo viên tại "Tiếng Anh cùng Bob", hỗ trợ học viên (từ 20 tuổi trở lên) luyện phản xạ giao tiếp.
Trả về CHỈ MỘT OBJECT JSON duy nhất theo ĐÚNG định dạng sau (không giải thích thêm):
{
  "translation": "<Dịch đoạn văn bản sang tiếng Việt với văn phong tự nhiên>",
  "suggestions": [
    {"wh_word": "What/Where/When/Who/Why/How", "idea_vi": "<Một gợi ý ngắn gọn để học viên tự đặt câu hỏi phản xạ>"}
  ]
}
Tối đa 3 suggestions.`;

                try {
                    const response = await fetch('https://text.pollinations.ai/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            messages: [
                                { role: 'system', content: 'You are a helpful English teacher API. You must output ONLY valid JSON without any markdown formatting.' },
                                { role: 'user', content: prompt }
                            ],
                            jsonMode: true
                        })
                    });
                    
                    const resultText = await response.text();
                    const parsed = parseAIResponse(resultText);
                    
                    if (parsed && parsed.translation) {
                        setHintsData(parsed);
                    } else {
                        throw new Error("Dữ liệu trả về bị lỗi.");
                    }
                } catch (error) {
                    setRecognitionError("Không thể lấy gợi ý lúc này. Vui lòng thử lại.");
                    setHintsData({
                        translation: "Đang gặp lỗi mạng. Bạn hãy cố gắng tự đọc hiểu câu này nhé!",
                        suggestions: [
                            { wh_word: "What", idea_vi: "Hỏi về sự việc chính" },
                            { wh_word: "Who", idea_vi: "Hỏi về người được nhắc đến" }
                        ]
                    });
                } finally {
                    setIsLoadingHints(false);
                }
            };

            // TỐI ƯU PROMPT: Bỏ qua ngữ pháp học thuật, tập trung độ trôi chảy thực tế
            const evaluateWithAI = async () => {
                if (!userQuestion.trim()) {
                    setRecognitionError("Bạn chưa nhập câu hỏi!");
                    return;
                }

                if (isRecording) {
                    recognitionRef.current?.stop();
                    setIsRecording(false);
                }

                setIsEvaluating(true);
                setRecognitionError("");
                const currentContext = chunks[currentIndex];

                const prompt = `Bạn là giáo viên giao tiếp tại "Tiếng Anh cùng Bob". Học viên của bạn là người lớn (trên 20 tuổi).
Đoạn văn bản gốc: "${currentContext}". 
Câu hỏi của học viên: "${userQuestion}". 

Nhiệm vụ:
1. Đánh giá độ trôi chảy và tự nhiên của câu hỏi. Ưu tiên ngôn ngữ giao tiếp thực tế hàng ngày, không dùng phong cách IELTS hay ngữ pháp học thuật cứng nhắc.
2. Sửa lại câu hỏi nếu quá lủng củng hoặc sai ngữ pháp nặng. Nếu câu hỏi đã tự nhiên và khai thác đúng ý đoạn văn, hãy giữ nguyên.

Trả về CHỈ MỘT OBJECT JSON duy nhất theo ĐÚNG định dạng sau:
{
  "score": <số từ 0 đến 100>,
  "corrected_question": "<Câu tiếng Anh giao tiếp mượt mà nhất>",
  "feedback_vi": "<Nhận xét thân thiện: Đánh giá độ tự nhiên của câu, động viên học viên phát huy>",
  "suggested_questions": [
    {"en": "<Cách hỏi tự nhiên khác 1 (phong cách native speaker)>", "vi": "<Dịch nghĩa>"},
    {"en": "<Cách hỏi tự nhiên khác 2 (phong cách native speaker)>", "vi": "<Dịch nghĩa>"}
  ]
}`;

                try {
                    const response = await fetch('https://text.pollinations.ai/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            messages: [
                                { role: 'system', content: 'You are a helpful English teacher API. You must output ONLY valid JSON without any markdown formatting.' },
                                { role: 'user', content: prompt }
                            ],
                            jsonMode: true
                        })
                    });
                    
                    const resultText = await response.text();
                    const parsed = parseAIResponse(resultText);
                    
                    if (parsed && parsed.feedback_vi) {
                        setFeedback(parsed);
                    } else {
                        throw new Error("Lỗi định dạng JSON");
                    }
                } catch (error) {
                    setRecognitionError("Lỗi kết nối máy chủ AI khi chấm điểm. Vui lòng thử lại.");
                } finally {
                    setIsEvaluating(false);
                }
            };

            // MÀN HÌNH TRANG CHỦ
            if (chunks.length === 0) {
                return (
                    <div className="w-full h-full bg-white sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative border border-gray-100">
                        <div className="bg-gradient-to-r from-blue-700 to-indigo-700 p-6 sm:p-10 text-white flex justify-between items-start">
                            <div>
                                <h1 className="text-2xl sm:text-3xl font-extrabold mb-2 flex items-center">
                                    <Icon name="bot" className="w-8 h-8 mr-3 text-green-300" /> Tiếng Anh cùng Bob: Phản Xạ
                                </h1>
                                <p className="text-blue-100 text-base sm:text-lg opacity-90 flex items-center">
                                    <span className="bg-green-500/20 text-green-100 border border-green-400/30 px-2 py-0.5 rounded-full text-xs font-bold mr-2">Core API</span> 
                                    Luyện giao tiếp tự nhiên & phát triển phản xạ hỏi đáp.
                                </p>
                            </div>
                        </div>
                        
                        <div className="flex-1 p-6 sm:p-10 flex flex-col bg-white overflow-y-auto">
                            <h2 className="text-xl text-gray-800 font-bold mb-3 flex items-center">
                                <Icon name="file-text" className="w-6 h-6 mr-2 text-indigo-600" />
                                Nội dung bài luyện tập
                            </h2>
                            <p className="text-gray-500 mb-6 text-base">
                                Dán văn bản vào đây. Hệ thống sẽ tối ưu hóa chia nhỏ các ý để bạn rèn luyện phản xạ dịch ngược và shadowing một cách tự nhiên nhất.
                            </p>
                            
                            <textarea 
                                value={inputText}
                                onChange={(e) => setInputText(e.target.value)}
                                placeholder="Dán văn bản cần luyện phản xạ vào đây..."
                                className="w-full flex-1 min-h-[200px] p-5 border-2 border-gray-200 rounded-2xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 outline-none resize-none transition-all text-gray-700 bg-gray-50 text-lg"
                            ></textarea>
                            
                            <button 
                                onClick={handleStartProcessing}
                                disabled={!inputText.trim()}
                                className="mt-6 w-full md:w-1/3 mx-auto py-4 bg-indigo-600 text-white rounded-2xl font-bold text-xl shadow-lg hover:bg-indigo-700 transform hover:-translate-y-0.5 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center shrink-0"
                            >
                                <Icon name="play-circle" className="w-6 h-6 mr-2" /> Bắt đầu Luyện tập
                            </button>
                        </div>
                    </div>
                );
            }

            // MÀN HÌNH HỌC TẬP
            return (
                <div className="w-full h-full bg-white sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-gray-200">
                    <div className="bg-white px-6 py-4 shadow-sm z-20 border-b border-gray-200 flex items-center justify-between shrink-0">
                        <div>
                            <span className="text-xs font-black text-gray-400 uppercase tracking-wider">Tiến độ phản xạ</span>
                            <div className="font-bold text-indigo-700 text-lg">Phần {currentIndex + 1} / {chunks.length}</div>
                        </div>
                        <button onClick={() => setChunks([])} className="text-gray-500 hover:text-red-500 p-2 rounded-lg hover:bg-red-50 transition flex items-center font-semibold text-sm">
                            <Icon name="log-out" className="w-4 h-4 mr-1" /> Kết thúc
                        </button>
                    </div>

                    <div className="flex-1 flex flex-col md:flex-row overflow-hidden">
                        
                        <div className="w-full md:w-[35%] lg:w-[30%] flex flex-col border-b md:border-b-0 md:border-r border-gray-200 bg-gray-50 overflow-hidden shrink-0 max-h-[30vh] md:max-h-none">
                            <div className="p-4 bg-gray-100 border-b border-gray-200 font-bold text-gray-700 flex items-center shadow-inner">
                                <Icon name="list" className="w-5 h-5 mr-2 text-indigo-600" /> Lộ trình bài học
                            </div>
                            <div className="overflow-y-auto p-4 flex-1 space-y-3">
                                {chunks.map((chunk, idx) => (
                                    <div 
                                        key={idx}
                                        onClick={() => {
                                            if (idx !== currentIndex) {
                                                setCurrentIndex(idx);
                                                resetTurn();
                                            }
                                        }}
                                        className={`p-4 rounded-xl cursor-pointer transition-all border ${
                                            idx === currentIndex 
                                                ? 'active-chunk shadow-sm' 
                                                : 'bg-white border-gray-200 hover:border-indigo-300 hover:bg-indigo-50 text-gray-500'
                                        }`}
                                    >
                                        <div className="flex items-center mb-1">
                                            <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${idx === currentIndex ? 'bg-indigo-200 text-indigo-800' : 'bg-gray-200 text-gray-600'}`}>
                                                Phần {idx + 1}
                                            </span>
                                            {idx < currentIndex && <Icon name="check-circle-2" className="w-4 h-4 ml-auto text-green-500" />}
                                        </div>
                                        <p className={`text-sm md:text-base ${idx === currentIndex ? 'text-gray-800 font-medium' : 'line-clamp-2'}`}>
                                            {chunk}
                                        </p>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="flex-1 w-full md:w-[65%] lg:w-[70%] flex flex-col bg-white overflow-y-auto relative">
                            
                            <div className="p-4 md:p-8 border-b border-gray-100">
                                <h3 className="text-sm font-bold text-indigo-500 uppercase tracking-wider mb-3 flex items-center">
                                    <Icon name="focus" className="w-4 h-4 mr-2" /> Ngữ cảnh giao tiếp
                                </h3>
                                <div className="bg-indigo-50/50 rounded-2xl p-6 border border-indigo-100 text-gray-800 text-xl font-semibold leading-relaxed shadow-sm">
                                    {chunks[currentIndex]}
                                </div>

                                <div className="mt-4">
                                    {!hintsData && !isLoadingHints && (
                                        <button onClick={fetchHints} className="text-sm font-semibold text-amber-600 hover:text-amber-700 flex items-center bg-amber-50 hover:bg-amber-100 px-4 py-2 rounded-full transition">
                                            <Icon name="lightbulb" className="w-4 h-4 mr-2" /> Hỗ trợ dịch & Phân tích
                                        </button>
                                    )}
                                    {isLoadingHints && (
                                        <span className="text-sm text-amber-600 flex items-center"><Icon name="loader-2" className="w-4 h-4 mr-2 animate-spin" /> BobAI đang phân tích...</span>
                                    )}
                                    {hintsData && (
                                        <div className="mt-3 bg-amber-50 rounded-xl p-4 border border-amber-100 animate-in fade-in">
                                            <p className="text-sm text-gray-700 mb-3"><span className="font-bold text-gray-500">Dịch tự nhiên:</span> <i>{hintsData.translation}</i></p>
                                            <div className="flex flex-wrap gap-2">
                                                {hintsData.suggestions.map((sg, idx) => (
                                                    <span key={idx} className="bg-amber-200 text-amber-900 text-xs font-bold px-3 py-1 rounded-lg">
                                                        {sg.wh_word}: <span className="font-medium text-amber-800">{sg.idea_vi}</span>
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="p-4 md:p-8 flex flex-col gap-6 flex-1 bg-slate-50/50">
                                {!feedback ? (
                                    <div className="flex-1 flex flex-col">
                                        <h3 className="text-gray-700 font-bold mb-3 flex items-center">
                                            <Icon name="edit-3" className="w-5 h-5 mr-2 text-gray-400" />
                                            Phản xạ đặt câu hỏi:
                                        </h3>
                                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 focus-within:border-indigo-400 focus-within:ring-4 focus-within:ring-indigo-500/10 transition-all flex flex-col min-h-[120px] sm:min-h-[150px]">
                                            <textarea
                                                value={userQuestion}
                                                onChange={(e) => setUserQuestion(e.target.value)}
                                                placeholder="Sử dụng từ vựng cốt lõi để đặt câu hỏi tự nhiên..."
                                                className="w-full p-4 sm:p-5 flex-1 outline-none resize-none text-gray-800 bg-transparent text-lg sm:text-xl font-medium rounded-t-2xl"
                                            ></textarea>
                                            
                                            {recognitionError && <p className="text-red-500 text-sm px-4 sm:px-5 pb-2">{recognitionError}</p>}
                                            
                                            <div className="flex flex-col sm:flex-row justify-between items-stretch sm:items-center bg-gray-50 p-3 rounded-b-2xl border-t border-gray-100 gap-2 sm:gap-0">
                                                <button onClick={toggleRecording} className={`flex justify-center items-center px-4 py-2.5 sm:py-2 rounded-xl text-sm font-bold transition-all w-full sm:w-auto ${isRecording ? 'bg-red-100 text-red-600 pulse-recording' : 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-100'}`}>
                                                    <Icon name={isRecording ? "square" : "mic"} className="w-4 h-4 mr-2" /> {isRecording ? "Đang nghe..." : "Thu âm"}
                                                </button>
                                                
                                                <button onClick={evaluateWithAI} disabled={!userQuestion.trim() || isEvaluating} className="bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 text-white px-6 py-2.5 rounded-xl font-bold shadow-sm transition flex justify-center items-center w-full sm:w-auto">
                                                    {isEvaluating ? <><Icon name="loader-2" className="w-4 h-4 mr-2 animate-spin" /> BobAI đang xử lý...</> : <><Icon name="check-circle" className="w-4 h-4 mr-2" /> Kiểm tra phản xạ</>}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="animate-in slide-in-from-bottom-4 duration-500 flex flex-col gap-5 pb-6">
                                        <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-200">
                                            <p className="text-xs text-gray-400 font-bold uppercase tracking-wide mb-1">Phiên bản của bạn:</p>
                                            <p className="text-gray-500 text-lg line-through mb-4">{userQuestion}</p>
                                            
                                            <p className="text-xs text-green-600 font-bold uppercase tracking-wide mb-1 flex items-center">
                                                <Icon name="check-check" className="w-4 h-4 mr-1" /> Phiên bản mượt mà hơn:
                                            </p>
                                            <p className="text-green-700 text-2xl font-bold bg-green-50 p-3 rounded-xl border border-green-100">{feedback.corrected_question}</p>
                                        </div>

                                        <div className="bg-white rounded-2xl p-6 shadow-sm border-l-4" style={{ borderColor: feedback.score >= 80 ? '#10b981' : feedback.score >= 50 ? '#f59e0b' : '#ef4444' }}>
                                            <div className="flex items-start">
                                                <div className={`w-16 h-16 rounded-2xl flex flex-col items-center justify-center text-white font-black shadow-sm mr-5 shrink-0 ${feedback.score >= 80 ? 'bg-green-500' : feedback.score >= 50 ? 'bg-amber-500' : 'bg-red-500'}`}>
                                                    <span className="text-2xl leading-none">{feedback.score}</span>
                                                    <span className="text-[10px] uppercase font-bold opacity-80">Điểm</span>
                                                </div>
                                                <div>
                                                    <h3 className="font-bold text-gray-800 text-lg mb-1">Nhận xét giao tiếp</h3>
                                                    <p className="text-gray-600 leading-relaxed text-base">{feedback.feedback_vi}</p>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-blue-50 rounded-2xl p-6 border border-blue-100">
                                            <h3 className="font-bold text-blue-800 mb-4 flex items-center">
                                                <Icon name="sparkles" className="w-5 h-5 mr-2" /> Nâng cấp phản xạ thực tế:
                                            </h3>
                                            <ul className="space-y-3">
                                                {feedback.suggested_questions.map((q, idx) => (
                                                    <li key={idx} className="bg-white p-3 rounded-xl border border-blue-100 shadow-sm">
                                                        <div className="font-bold text-gray-800 flex items-center"><Icon name="message-circle-question" className="w-4 h-4 text-blue-400 mr-2" /> {q.en}</div>
                                                        <div className="text-sm text-gray-500 ml-6 italic">{q.vi}</div>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {feedback && (
                                <div className="mt-auto bg-white p-4 border-t border-gray-200 flex flex-col sm:flex-row gap-3 shrink-0 z-10 sticky bottom-0">
                                    <button onClick={resetTurn} className="w-full sm:w-auto px-6 py-3 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 transition">
                                        Thử lại câu này
                                    </button>
                                    <button 
                                        onClick={() => {
                                            if (currentIndex < chunks.length - 1) {
                                                setCurrentIndex(currentIndex + 1);
                                                resetTurn();
                                            } else {
                                                setChunks([]);
                                            }
                                        }}
                                        className="w-full flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 transition flex items-center justify-center"
                                    >
                                        {currentIndex < chunks.length - 1 ? "Học câu tiếp theo" : "Hoàn thành bài học"}
                                        <Icon name="arrow-right" className="w-5 h-5 ml-2" />
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
