<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BobEnglish - Hệ thống học tập trực tuyến</title>
    
    <!-- Fix lỗi thiếu favicon 404 -->
    <link rel="icon" href="data:,">
    
    <!-- Core Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Cấu hình Babel ép dùng Classic Runtime để FIX lỗi "react/jsx-runtime" -->
    <script>
        Babel.registerPreset('my-react', {
            presets: [
                [Babel.availablePresets['react'], { runtime: 'classic' }]
            ]
        });
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        
        :root {
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.7);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #f1f5f9;
            min-height: 100vh;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* Hiệu ứng kính hiện đại */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.05);
        }

        /* Animations */
        .animate-fade-up { animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .animate-bounce { animation: bounce 2s infinite; }
        
        @keyframes fadeUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        @keyframes fadeIn { 
            from { opacity: 0; } 
            to { opacity: 1; } 
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(-10%); animation-timing-function: cubic-bezier(0.8,0,1,1); }
            50% { transform: translateY(0); animation-timing-function: cubic-bezier(0,0,0.2,1); }
        }

        /* Card Hover Effects */
        .lesson-card, .rank-card {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform-style: preserve-3d;
        }
        
        @media (hover: hover) {
            .lesson-card:hover {
                transform: translateY(-4px) scale(1.01);
                box-shadow: 0 20px 40px -10px rgba(99, 102, 241, 0.15), 0 10px 20px -5px rgba(0, 0, 0, 0.05);
                border-color: rgba(99, 102, 241, 0.3);
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Rank Colors */
        .rank-1 { background: linear-gradient(135deg, #FFDF00 0%, #D4AF37 100%); color: #fff; border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 10px 25px -5px rgba(212, 175, 55, 0.4); }
        .rank-2 { background: linear-gradient(135deg, #E2E8F0 0%, #94A3B8 100%); color: #fff; border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 10px 25px -5px rgba(148, 163, 184, 0.4); }
        .rank-3 { background: linear-gradient(135deg, #F4A460 0%, #CD7F32 100%); color: #fff; border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 10px 25px -5px rgba(205, 127, 50, 0.4); }
        .rank-1 p, .rank-2 p, .rank-3 p { color: rgba(255,255,255,0.95) !important; }
        .rank-1 h3, .rank-2 h3, .rank-3 h3 { color: #fff !important; text-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .rank-1 .icon-bg, .rank-2 .icon-bg, .rank-3 .icon-bg { background: rgba(255,255,255,0.2) !important; color: #fff !important; backdrop-filter: blur(4px); }
        
        .progress-bar-fill { transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1); }

        /* Dashboard Premium BG */
        .premium-bg {
            background: linear-gradient(145deg, #0f172a 0%, #1e1b4b 100%);
            position: relative;
        }
        .premium-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.2) 0%, transparent 50%),
                        radial-gradient(circle at bottom left, rgba(56, 189, 248, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-900">
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="my-react">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, updateDoc, deleteField } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useRef, useMemo } = React;

        let app, auth, db;
        let firebaseInitError = null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'bob-english-app';

        try {
            const myFirebaseConfig = {
                apiKey: "AIzaSyBfWDsekZ4_KZlKKYz-nDHjcfdPBimL_2I",
                authDomain: "lotrinhhoc.firebaseapp.com",
                projectId: "lotrinhhoc",
                storageBucket: "lotrinhhoc.firebasestorage.app",
                messagingSenderId: "417426834442",
                appId: "1:417426834442:web:a02b1c7765e9f4f3fa4bf3",
                measurementId: "G-0K6L35KMM5"
            };
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : myFirebaseConfig;
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (err) {
            console.error("Lỗi khởi tạo Firebase:", err);
            firebaseInitError = err.message;
        }

        const lessonsData = [
            { id: "200conversation", title: "200 Conversations", subtitle: "Giao tiếp", desc: "Học qua 200 đoạn hội thoại thực tế.", icon: "messages-square", color: "text-cyan-600", bg: "bg-cyan-50", border: "border-cyan-100", path: "200conversation.html" },
            { id: "reading", title: "Reading", subtitle: "Luyện đọc", desc: "Đọc hiểu bài báo và truyện ngắn.", icon: "book-open", color: "text-indigo-600", bg: "bg-indigo-50", border: "border-indigo-100", path: "reading.html" },
            { id: "ipa", title: "Bảng IPA", subtitle: "Phát âm", desc: "Luyện tập chuẩn 44 âm tiếng Anh.", icon: "mic-2", color: "text-blue-600", bg: "bg-blue-50", border: "border-blue-100", path: "ipa.html" },
            { id: "listening", title: "Listening", subtitle: "Luyện nghe", desc: "Luyện nghe qua hội thoại hàng ngày.", icon: "headphones", color: "text-emerald-600", bg: "bg-emerald-50", border: "border-emerald-100", path: "listening.html" },
            { id: "speaking", title: "Speaking", subtitle: "Luyện nói", desc: "Thực hành phản xạ nói tự nhiên.", icon: "message-circle", color: "text-violet-600", bg: "bg-violet-50", border: "border-violet-100", path: "speaking.html" },
            { id: "vocabulary", title: "Vocabulary", subtitle: "Từ vựng", desc: "Học từ mới theo các chủ đề đa dạng.", icon: "sparkles", color: "text-amber-600", bg: "bg-amber-50", border: "border-amber-100", path: "vocabulary.html" },
            { id: "bilingual", title: "Bilingual", subtitle: "Song ngữ", desc: "Nâng cao vốn từ qua tin tức song ngữ.", icon: "languages", color: "text-rose-600", bg: "bg-rose-50", border: "border-rose-100", path: "bilingual.html" },
            { id: "taboo", title: "Taboo", subtitle: "Trò chơi", desc: "Học từ vựng qua trò chơi giải thích từ.", icon: "gamepad-2", color: "text-fuchsia-600", bg: "bg-fuchsia-50", border: "border-fuchsia-100", path: "taboo.html" },
            { id: "tro_choi", title: "Trò chơi", subtitle: "Giải trí", desc: "Khám phá các trò chơi học tập thú vị.", icon: "gamepad-2", color: "text-purple-600", bg: "bg-purple-50", border: "border-purple-100", path: "tro_choi.html" },
            { id: "hoc_dich", title: "Translation", subtitle: "Học Dịch", desc: "Luyện kỹ năng dịch thuật câu và đoạn văn.", icon: "book-text", color: "text-teal-600", bg: "bg-teal-50", border: "border-teal-100", path: "hoc_dich.html" }
        ];

        const getLessonTitle = (path) => { const lesson = lessonsData.find(l => l.path === path); return lesson ? lesson.title : path; };
        const getLessonColor = (path) => { const lesson = lessonsData.find(l => l.path === path); return lesson ? lesson.color.replace('text-', 'bg-') : 'bg-slate-500'; };

        const getTodayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
        
        const getCurrentWeekDates = () => {
            const curr = new Date();
            const day = curr.getDay(); 
            const diff = curr.getDate() - day + (day === 0 ? -6 : 1); 
            const monday = new Date(curr.setDate(diff));
            const dates = [];
            for (let i = 0; i < 7; i++) {
                const nextDay = new Date(monday);
                nextDay.setDate(monday.getDate() + i);
                dates.push(`${nextDay.getFullYear()}-${String(nextDay.getMonth() + 1).padStart(2, '0')}-${String(nextDay.getDate()).padStart(2, '0')}`);
            }
            return dates;
        };

        const getCurrentMonthDates = () => {
            const curr = new Date();
            const year = curr.getFullYear();
            const month = curr.getMonth();
            const numDays = new Date(year, month + 1, 0).getDate(); 
            const dates = [];
            for (let i = 1; i <= numDays; i++) {
                dates.push(`${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`);
            }
            return dates;
        };

        const formatTime = (totalSeconds) => {
            if (!totalSeconds || isNaN(totalSeconds) || totalSeconds < 60) return "0 phút";
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            if (h > 0) {
                return m > 0 ? `${h} tiếng ${m} phút` : `${h} tiếng`;
            }
            return `${m} phút`;
        };

        const getTimeAgo = (timestamp) => {
            if (!timestamp) return "Chưa rõ";
            const diff = Date.now() - timestamp;
            const minutes = Math.floor(diff / 60000);
            if (minutes < 2) return "Vừa xong";
            if (minutes < 60) return `${minutes} phút`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} giờ`;
            const days = Math.floor(hours / 24);
            return `${days} ngày`;
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            const spanRef = useRef(null);
            useEffect(() => {
                if (window.lucide && spanRef.current) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    window.lucide.createIcons({ root: spanRef.current, attrs: { class: className, width: size, height: size }});
                }
            }, [name, size, className]);
            return <span ref={spanRef} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}></span>;
        };

        function App() {
            const [firebaseUser, setFirebaseUser] = useState(null);
            const [isFirebaseReady, setIsFirebaseReady] = useState(false);
            
            const [usersList, setUsersList] = useState([]);
            const [timeData, setTimeData] = useState({});
            const [isLoadingData, setIsLoadingData] = useState(true);

            const [user, setUser] = useState(() => {
                const savedUser = localStorage.getItem('bob_currentUser');
                return savedUser ? JSON.parse(savedUser) : null;
            });
            const [error, setError] = useState('');

            if (firebaseInitError) return <div className="p-10 text-red-500 font-bold">Lỗi CSDL: {firebaseInitError}</div>;

            useEffect(() => {
                if (!auth) return;
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                        else await signInAnonymously(auth);
                    } catch (err) {}
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (u) => { setFirebaseUser(u); if (u) setIsFirebaseReady(true); });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!firebaseUser || !db) return;
                const usersRef = collection(db, 'artifacts', appId, 'public', 'data', 'bob_users');
                const unsubUsers = onSnapshot(usersRef, (snapshot) => {
                    const users = [];
                    snapshot.forEach(doc => users.push({ id: doc.id, ...doc.data() }));
                    if (users.length === 0) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bob_users', 'admin_root'), { username: 'admin', password: '123', role: 'admin', name: 'Quản trị viên' });
                    else { setUsersList(users); setIsLoadingData(false); }
                });

                const timeRef = collection(db, 'artifacts', appId, 'public', 'data', 'bob_timeData');
                const unsubTime = onSnapshot(timeRef, (snapshot) => {
                    const tData = {};
                    snapshot.forEach(doc => { tData[doc.id] = doc.data(); });
                    setTimeData(tData);
                });

                return () => { unsubUsers(); unsubTime(); };
            }, [firebaseUser]);

            useEffect(() => {
                if (user && usersList.length > 0) {
                    const stillExists = usersList.find(x => x.id === user.id);
                    if (!stillExists) { setUser(null); localStorage.removeItem('bob_currentUser'); } 
                    else { setUser(stillExists); localStorage.setItem('bob_currentUser', JSON.stringify(stillExists)); }
                }
            }, [usersList]);

            const handleLogin = (u, p) => {
                const found = usersList.find(x => x.username.toLowerCase() === u.trim().toLowerCase() && x.password === p.trim());
                if (found) { setUser(found); setError(''); } else setError("Tài khoản hoặc mật khẩu không đúng.");
            };

            const handleLogout = () => { 
                setUser(null); 
                localStorage.removeItem('bob_currentUser'); 
                localStorage.removeItem('bob_deviceName');
                localStorage.removeItem('bob_deviceId');
            };

            if (!isFirebaseReady || isLoadingData) return (
                <div className="min-h-screen flex items-center justify-center bg-slate-50">
                    <div className="flex flex-col items-center gap-4 animate-fade-up">
                        <div className="w-12 h-12 border-[3px] border-indigo-100 border-t-indigo-600 rounded-full animate-spin"></div>
                        <p className="text-slate-400 font-bold text-xs uppercase tracking-[0.2em]">Đang khởi động...</p>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-10">
                    {!user ? <LoginScreen onLogin={handleLogin} error={error} /> : (
                        <div className="animate-fade-in">
                            {user.role === 'admin' ? (
                                <main className="mx-auto sm:p-4 lg:p-6 lg:max-w-[1400px]">
                                    <AdminPanel users={usersList} timeData={timeData} db={db} handleLogout={handleLogout} />
                                </main>
                            ) : (
                                <main className="mx-auto sm:p-4 lg:p-6 lg:max-w-[1400px]">
                                    <StudentHub user={user} users={usersList} timeData={timeData} db={db} handleLogout={handleLogout} />
                                </main>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const LoginScreen = ({ onLogin, error }) => {
            const [u, setU] = useState(''); const [p, setP] = useState('');
            return (
                <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-slate-900">
                    <div className="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-indigo-600/30 rounded-full blur-[120px] pointer-events-none"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-cyan-600/20 rounded-full blur-[100px] pointer-events-none"></div>
                    
                    <div className="w-full max-w-sm animate-fade-up relative z-10">
                        <div className="bg-white/10 backdrop-blur-2xl p-8 sm:p-10 rounded-[2.5rem] shadow-2xl border border-white/20">
                            <div className="text-center mb-10">
                                <div className="w-20 h-20 bg-gradient-to-tr from-indigo-500 to-cyan-400 rounded-3xl flex items-center justify-center mx-auto mb-6 text-white shadow-[0_10px_25px_-5px_rgba(99,102,241,0.5)] rotate-3">
                                    <Icon name="rocket" size={40} className="-rotate-3" />
                                </div>
                                <h1 className="text-3xl font-black text-white tracking-tight">BobEnglish</h1>
                                <p className="text-indigo-200 text-sm mt-2 font-medium">Hệ thống học tập chuyên nghiệp</p>
                            </div>
                            <form onSubmit={e => { e.preventDefault(); onLogin(u, p); }} className="space-y-5">
                                {error && <div className="p-4 bg-red-500/10 text-red-300 text-xs font-bold rounded-2xl border border-red-500/20 flex items-center gap-3 backdrop-blur-sm"><Icon name="alert-circle" size={16} /> {error}</div>}
                                <div className="space-y-1.5">
                                    <label className="text-[10px] font-bold text-indigo-200 uppercase tracking-widest ml-1">Tài khoản</label>
                                    <input type="text" value={u} onChange={e=>setU(e.target.value)} className="w-full p-4 bg-white/5 border border-white/10 rounded-2xl outline-none focus:border-indigo-400 focus:bg-white/10 text-white text-sm font-medium transition-all placeholder:text-slate-400" placeholder="Nhập tên đăng nhập..." required />
                                </div>
                                <div className="space-y-1.5">
                                    <label className="text-[10px] font-bold text-indigo-200 uppercase tracking-widest ml-1">Mật khẩu</label>
                                    <input type="password" value={p} onChange={e=>setP(e.target.value)} className="w-full p-4 bg-white/5 border border-white/10 rounded-2xl outline-none focus:border-indigo-400 focus:bg-white/10 text-white text-sm font-medium transition-all placeholder:text-slate-400" placeholder="••••••••" required />
                                </div>
                                <button className="w-full py-4 bg-gradient-to-r from-indigo-500 to-cyan-500 text-white font-black rounded-2xl shadow-[0_10px_20px_-5px_rgba(99,102,241,0.4)] hover:shadow-[0_15px_25px_-5px_rgba(99,102,241,0.5)] active:scale-[0.98] transition-all uppercase text-xs tracking-[0.2em] mt-4 border border-white/10">Đăng nhập</button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const StudentHub = ({ user, users, timeData, db, handleLogout }) => {
            const [activeLesson, setActiveLesson] = useState(null);
            const [currentTab, setCurrentTab] = useState('lessons'); 
            
            const todayStr = getTodayStr();
            const weekDates = useMemo(() => getCurrentWeekDates(), []);
            const monthDates = useMemo(() => getCurrentMonthDates(), []);
            
            const [deviceId] = useState(() => {
                let id = localStorage.getItem('bob_deviceId');
                if (!id) { id = 'dev_' + Math.random().toString(36).substr(2, 9); localStorage.setItem('bob_deviceId', id); }
                return id;
            });
            const [deviceName, setDeviceName] = useState(() => localStorage.getItem('bob_deviceName'));
            const [tempName, setTempName] = useState('');

            const [isEditingName, setIsEditingName] = useState(false);
            const [editNameValue, setEditNameValue] = useState(deviceName || '');
            
            useEffect(() => {
                if (timeData[user.id] && timeData[user.id][deviceId]) {
                    const dbName = timeData[user.id][deviceId].name;
                    if (dbName && dbName !== deviceName) {
                        localStorage.setItem('bob_deviceName', dbName);
                        setDeviceName(dbName);
                        setEditNameValue(dbName);
                    }
                }
            }, [timeData, user.id, deviceId, deviceName]);
            
            const handleUpdateDeviceName = async (e) => {
                e.preventDefault();
                if(editNameValue.trim()) {
                    const newName = editNameValue.trim();
                    localStorage.setItem('bob_deviceName', newName);
                    setDeviceName(newName);
                    setIsEditingName(false);
                    
                    if (db) {
                        const timeRef = doc(db, 'artifacts', appId, 'public', 'data', 'bob_timeData', user.id);
                        const existingDeviceData = timeData[user.id]?.[deviceId] || {};
                        await setDoc(timeRef, {
                            [deviceId]: { 
                                ...existingDeviceData, 
                                name: newName 
                            }
                        }, { merge: true }).catch(console.error);
                    }
                }
            };

            const [localSeconds, setLocalSeconds] = useState(() => Number(timeData[user.id]?.[deviceId]?.times?.[todayStr] || 0));
            const [localLessonStats, setLocalLessonStats] = useState(() => timeData[user.id]?.[deviceId]?.lessonStats || {});
            
            const exactSecondsRef = useRef(localSeconds);
            const exactLessonStatsRef = useRef(localLessonStats);

            const [isIdle, setIsIdle] = useState(false);
            const idleTimeoutRef = useRef(null);
            const isIdleRef = useRef(isIdle); 
            const activeLessonRef = useRef(activeLesson);
            
            const lastSyncedSeconds = useRef(localSeconds);
            const IDLE_LIMIT = 5 * 60 * 1000;

            useEffect(() => { activeLessonRef.current = activeLesson; }, [activeLesson]);
            useEffect(() => { isIdleRef.current = isIdle; }, [isIdle]);

            const resetIdleTimer = () => {
                if (isIdle) return; 
                clearTimeout(idleTimeoutRef.current);
                idleTimeoutRef.current = setTimeout(() => { setIsIdle(true); }, IDLE_LIMIT);
            };

            useEffect(() => {
                if (!deviceName) return;
                window.addEventListener('mousemove', resetIdleTimer);
                window.addEventListener('keydown', resetIdleTimer);
                window.addEventListener('scroll', resetIdleTimer);
                window.addEventListener('touchstart', resetIdleTimer);
                resetIdleTimer();
                return () => {
                    clearTimeout(idleTimeoutRef.current);
                    window.removeEventListener('mousemove', resetIdleTimer);
                    window.removeEventListener('keydown', resetIdleTimer);
                    window.removeEventListener('scroll', resetIdleTimer);
                    window.removeEventListener('touchstart', resetIdleTimer);
                };
            }, [deviceName, isIdle]);

            useEffect(() => {
                const dbSeconds = Number(timeData[user.id]?.[deviceId]?.times?.[todayStr] || 0);
                if (deviceName && dbSeconds > exactSecondsRef.current) {
                    exactSecondsRef.current = dbSeconds;
                    setLocalSeconds(dbSeconds);
                    lastSyncedSeconds.current = dbSeconds;
                    if(timeData[user.id]?.[deviceId]?.lessonStats) {
                        exactLessonStatsRef.current = timeData[user.id][deviceId].lessonStats;
                        setLocalLessonStats(timeData[user.id][deviceId].lessonStats);
                    }
                }
            }, [timeData, user.id, deviceId, todayStr, deviceName]);

            useEffect(() => {
                if (!deviceName) return;
                const timer = setInterval(() => {
                    if (!isIdleRef.current) {
                        exactSecondsRef.current += 1;
                        if (activeLessonRef.current) {
                            const path = activeLessonRef.current.path;
                            exactLessonStatsRef.current = {
                                ...exactLessonStatsRef.current,
                                [path]: Number(exactLessonStatsRef.current[path] || 0) + 1
                            };
                        }
                        if (exactSecondsRef.current % 60 === 0) {
                            setLocalSeconds(exactSecondsRef.current);
                            setLocalLessonStats(exactLessonStatsRef.current);
                        }
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, [deviceName]);

            useEffect(() => {
                if (!deviceName || !db) return;
                if (localSeconds - lastSyncedSeconds.current >= 10) {
                    const timeRef = doc(db, 'artifacts', appId, 'public', 'data', 'bob_timeData', user.id);
                    const existingDeviceData = timeData[user.id]?.[deviceId] || {};
                    const existingTimes = existingDeviceData.times || {};
                    const existingStats = existingDeviceData.lessonStats || {};

                    setDoc(timeRef, { 
                        [deviceId]: {
                            ...existingDeviceData,
                            name: deviceName,
                            times: { ...existingTimes, [todayStr]: localSeconds },
                            lessonStats: { ...existingStats, ...localLessonStats },
                            lastActive: Date.now()
                        }
                    }, { merge: true }).catch(console.error);
                    lastSyncedSeconds.current = localSeconds;
                }
            }, [localSeconds, localLessonStats, user.id, todayStr, deviceId, deviceName, db]);

            const getProfileTotal = (datesArray) => {
                let total = 0;
                const userDevices = timeData[user.id] || {};
                const myNameKey = (deviceName || '').trim().toLowerCase();
                
                Object.entries(userDevices).forEach(([devId, dev]) => {
                    const devNameKey = (dev.name || '').trim().toLowerCase();
                    if (devNameKey === myNameKey) { 
                        datesArray.forEach(date => {
                            if (devId === deviceId && date === todayStr) {
                                // Skip
                            } else {
                                total += Number(dev.times?.[date] || 0);
                            }
                        });
                    }
                });
                
                if (datesArray.includes(todayStr)) { total += Number(localSeconds || 0); }
                return total;
            };

            const getRank = (datesArray) => {
                let allProfiles = [];
                Object.keys(timeData).forEach(uid => {
                    const userDevices = timeData[uid];
                    const profilesInUser = {};
                    
                    Object.entries(userDevices).forEach(([devId, dev]) => {
                        const nameKey = (dev.name || 'Máy ẩn danh').trim().toLowerCase();
                        if (!profilesInUser[nameKey]) profilesInUser[nameKey] = 0;
                        
                        datesArray.forEach(date => {
                            if (user && uid === user.id && devId === deviceId && date === todayStr) {
                                profilesInUser[nameKey] += Number(localSeconds || 0);
                            } else {
                                profilesInUser[nameKey] += Number(dev.times?.[date] || 0);
                            }
                        });
                    });
                    
                    if (user && uid === user.id && localSeconds > 0 && !userDevices[deviceId]) {
                        const myNameKey = (deviceName || 'Máy ẩn danh').trim().toLowerCase();
                        if (!profilesInUser[myNameKey]) profilesInUser[myNameKey] = 0;
                        if (datesArray.includes(todayStr)) profilesInUser[myNameKey] += Number(localSeconds || 0);
                    }

                    Object.entries(profilesInUser).forEach(([nameKey, total]) => {
                        if (total > 0) allProfiles.push({ id: uid + '_' + nameKey, total });
                    });
                });
                
                allProfiles.sort((a, b) => b.total - a.total);
                const myTargetId = user.id + '_' + (deviceName || 'Máy ẩn danh').trim().toLowerCase();
                const index = allProfiles.findIndex(p => p.id === myTargetId);
                return index !== -1 ? index + 1 : 0;
            };

            const getProfileLessonDistribution = () => {
                const userDevices = timeData[user.id] || {};
                const myNameKey = (deviceName || '').trim().toLowerCase();
                const aggregatedStats = {};

                Object.entries(localLessonStats).forEach(([path, sec]) => { aggregatedStats[path] = Number(sec); });

                Object.entries(userDevices).forEach(([devId, dev]) => {
                    const devNameKey = (dev.name || '').trim().toLowerCase();
                    if (devNameKey === myNameKey && devId !== deviceId && dev.lessonStats) {
                        Object.entries(dev.lessonStats).forEach(([path, sec]) => {
                            aggregatedStats[path] = (aggregatedStats[path] || 0) + Number(sec);
                        });
                    }
                });

                const totalLessonTime = Object.values(aggregatedStats).reduce((sum, val) => sum + val, 0);
                if (totalLessonTime === 0) return [];

                return Object.entries(aggregatedStats)
                    .map(([path, sec]) => ({ path, sec, percent: Math.round((sec / totalLessonTime) * 100) }))
                    .sort((a, b) => b.sec - a.sec)
                    .slice(0, 3);
            };

            const myDailyTotal = getProfileTotal([todayStr]); 
            const myWeeklyTotal = getProfileTotal(weekDates);
            const myMonthlyTotal = getProfileTotal(monthDates);
            
            const myWeekRank = getRank(weekDates);
            const myMonthRank = getRank(monthDates);
            const myLessonStats = getProfileLessonDistribution();

            const RankBadge = ({ rank, title }) => {
                if (rank === 0) return (
                    <div className="flex flex-col items-center p-3 bg-white/5 rounded-2xl border border-white/10 w-full sm:w-28 shrink-0 backdrop-blur-sm">
                        <Icon name="minus" size={20} className="text-white/30 mb-1" />
                        <p className="text-[10px] text-white/50 uppercase font-bold tracking-widest">{title}</p>
                    </div>
                );
                
                let iconName = 'star'; let iconColor = 'text-slate-300'; let bgClass = 'bg-white/10'; let textGlow = '';
                if (rank === 1) { iconName = 'crown'; iconColor = 'text-yellow-300'; bgClass = 'bg-gradient-to-b from-yellow-400/20 to-yellow-600/10 border-yellow-400/30'; textGlow = 'text-yellow-300 drop-shadow-[0_0_8px_rgba(253,224,71,0.8)]'; }
                else if (rank === 2) { iconName = 'medal'; iconColor = 'text-slate-200'; bgClass = 'bg-gradient-to-b from-slate-300/20 to-slate-500/10 border-slate-300/30'; textGlow = 'text-slate-200 drop-shadow-[0_0_8px_rgba(226,232,240,0.8)]'; }
                else if (rank === 3) { iconName = 'award'; iconColor = 'text-orange-300'; bgClass = 'bg-gradient-to-b from-orange-400/20 to-orange-600/10 border-orange-400/30'; textGlow = 'text-orange-300 drop-shadow-[0_0_8px_rgba(253,186,116,0.8)]'; }

                return (
                    <div className={`flex flex-col items-center p-3 rounded-2xl border ${bgClass} w-full sm:w-28 shrink-0 relative overflow-hidden group backdrop-blur-sm`}>
                        <div className="absolute inset-0 bg-white/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <Icon name={iconName} size={24} className={`${iconColor} mb-1 drop-shadow-md`} />
                        <p className={`font-black text-xl leading-none mb-1 ${textGlow}`}>Top {rank}</p>
                        <p className="text-[9px] text-white/70 uppercase font-bold tracking-widest">{title}</p>
                    </div>
                );
            };

            if (!deviceName) {
                return (
                    <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4 animate-fade-in">
                        <div className="bg-white p-8 sm:p-10 rounded-[2.5rem] w-full max-w-md shadow-2xl animate-fade-up">
                            <div className="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-3xl flex items-center justify-center mb-6 shadow-inner"><Icon name="user" size={32} /></div>
                            <h3 className="font-black text-2xl mb-2 text-slate-800 tracking-tight">Tên hiển thị của bạn</h3>
                            <p className="text-sm text-slate-500 mb-6 bg-slate-50 p-4 rounded-2xl border border-slate-100 leading-relaxed">
                                Vui lòng nhập tên của bạn (VD: Kim Ngân, Số 1...). <br/><br/>
                                <span className="text-indigo-600 font-semibold"><Icon name="info" size={14} className="inline mr-1 -mt-0.5" />Lưu ý:</span> Điểm trên Bảng xếp hạng sẽ tính theo tên này. Bạn hãy dùng chung 1 tên trên mọi thiết bị nhé!
                            </p>
                            <form onSubmit={(e) => { 
                                e.preventDefault(); 
                                if(tempName.trim()) { 
                                    const newName = tempName.trim();
                                    localStorage.setItem('bob_deviceName', newName); 
                                    setDeviceName(newName); 
                                    if (db) {
                                        const timeRef = doc(db, 'artifacts', appId, 'public', 'data', 'bob_timeData', user.id);
                                        const existingDeviceData = timeData[user.id]?.[deviceId] || {};
                                        setDoc(timeRef, {
                                            [deviceId]: { ...existingDeviceData, name: newName }
                                        }, { merge: true }).catch(console.error);
                                    }
                                }
                            }}>
                                <input type="text" placeholder="Nhập tên của bạn..." value={tempName} onChange={e => setTempName(e.target.value)} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-indigo-500 focus:bg-white text-sm font-medium mb-4 transition-colors" required autoFocus />
                                <button className="w-full py-4 bg-slate-900 text-white font-black rounded-2xl shadow-lg hover:shadow-xl hover:bg-indigo-600 active:scale-[0.98] transition-all uppercase tracking-wider">Tiếp tục</button>
                            </form>
                        </div>
                    </div>
                );
            }

            const IdleWarningModal = () => {
                if (!isIdle) return null;
                return (
                    <div className="fixed inset-0 z-[99999] bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4 animate-fade-in">
                        <div className="bg-white p-8 sm:p-10 rounded-[2.5rem] max-w-sm w-full text-center shadow-2xl border-t-[6px] border-amber-400 animate-fade-up">
                            <div className="w-24 h-24 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner"><Icon name="coffee" size={48} className="animate-pulse-slow" /></div>
                            <h2 className="text-2xl font-black text-slate-800 mb-3 tracking-tight">Đang nghỉ ngơi?</h2>
                            <p className="text-slate-500 text-sm mb-8 leading-relaxed">Hệ thống không nhận diện được thao tác nào trong 5 phút qua. Thời gian học đang được tạm dừng để đảm bảo tính công bằng.</p>
                            <button onClick={() => { setIsIdle(false); resetIdleTimer(); }} className="w-full py-4 bg-amber-500 text-white font-black rounded-2xl shadow-lg hover:bg-amber-600 active:scale-[0.98] transition-all text-sm uppercase tracking-widest">Tôi vẫn đang học!</button>
                        </div>
                    </div>
                );
            };

            const EditNameModal = () => {
                if (!isEditingName) return null;
                return (
                    <div className="fixed inset-0 z-[99999] bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4 animate-fade-in">
                        <div className="bg-white p-8 rounded-[2.5rem] max-w-sm w-full shadow-2xl animate-fade-up">
                            <h3 className="font-black text-2xl mb-2 text-slate-800 tracking-tight">Đổi tên hiển thị</h3>
                            <p className="text-sm text-slate-500 mb-6 leading-relaxed">Tên này sẽ đại diện cho bạn trên Bảng xếp hạng thi đua.</p>
                            <form onSubmit={handleUpdateDeviceName}>
                                <input type="text" value={editNameValue} onChange={e => setEditNameValue(e.target.value)} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-indigo-500 focus:bg-white text-sm font-medium mb-6 transition-colors" required autoFocus />
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setIsEditingName(false)} className="flex-1 py-3.5 bg-slate-100 text-slate-600 font-bold rounded-2xl hover:bg-slate-200 active:scale-[0.98] transition-all text-sm">Hủy</button>
                                    <button type="submit" className="flex-1 py-3.5 bg-indigo-600 text-white font-bold rounded-2xl shadow-lg hover:bg-indigo-700 active:scale-[0.98] transition-all text-sm">Lưu cập nhật</button>
                                </div>
                            </form>
                        </div>
                    </div>
                );
            };

            const GlobalNav = () => (
                <nav className="glass-nav sticky top-0 z-40 border-b border-slate-200/50 px-4 sm:px-6 h-[72px] flex items-center justify-between sm:rounded-t-[2.5rem] mt-0 sm:mt-2">
                    <div className="flex items-center gap-3 cursor-pointer group" onClick={() => setActiveLesson(null)}>
                        <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg group-hover:bg-indigo-700 transition-colors"><Icon name="graduation-cap" size={20} /></div>
                        <span className="text-xl font-black text-slate-800 tracking-tight hidden sm:block">Bob<span className="text-indigo-600">English</span></span>
                    </div>

                    <div className="absolute left-1/2 -translate-x-1/2 flex items-center justify-center pointer-events-none">
                        <div className={`flex items-center gap-2.5 px-4 py-2 rounded-2xl border transition-all duration-500 shadow-sm backdrop-blur-md ${isIdle ? 'bg-amber-50/80 border-amber-200 text-amber-600' : 'bg-emerald-50/80 border-emerald-200 text-emerald-700'}`}>
                            <div className="relative flex items-center justify-center w-3 h-3">
                                {!isIdle && <div className="absolute w-full h-full bg-emerald-400 rounded-full animate-ping opacity-75"></div>}
                                <div className={`relative w-2.5 h-2.5 rounded-full shadow-sm ${isIdle ? 'bg-amber-500' : 'bg-emerald-500'}`}></div>
                            </div>
                            <Icon name="clock" size={16} className={isIdle ? 'text-amber-500' : 'text-emerald-600'} />
                            <span className={`font-bold text-sm sm:text-base tracking-wide mt-0.5`}>
                                {formatTime(localSeconds)}
                            </span>
                            <span className={`hidden sm:block text-[10px] uppercase font-bold tracking-widest px-2 py-0.5 rounded-lg ${isIdle ? 'bg-amber-100/50' : 'bg-emerald-100/50'}`}>
                                {isIdle ? 'Tạm dừng' : 'Đang học'}
                            </span>
                        </div>
                    </div>

                    <div className="flex items-center gap-4">
                        <div className="text-right hidden sm:block">
                            <p className="text-sm font-bold leading-none text-slate-800">{deviceName}</p>
                            <p className="text-[10px] uppercase font-bold text-slate-400 mt-1.5 tracking-wider">TK: {user.name}</p>
                        </div>
                        <button onClick={handleLogout} className="w-10 h-10 flex items-center justify-center bg-slate-100 text-slate-500 rounded-2xl active:bg-red-50 hover:bg-slate-200 hover:text-slate-700 active:text-red-500 transition-colors" title="Đăng xuất"><Icon name="log-out" size={18} /></button>
                    </div>
                </nav>
            );

            if (activeLesson) {
                return (
                    <div className="fixed inset-0 z-[9999] bg-slate-50 flex flex-col animate-fade-in" style={{ height: '100dvh' }}>
                        <IdleWarningModal />
                        <GlobalNav />
                        <div className="h-14 bg-white border-b border-slate-200/60 flex items-center px-4 shrink-0 shadow-sm relative z-10 justify-between">
                            <button onClick={() => setActiveLesson(null)} className="flex items-center gap-2 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 font-bold transition-colors active:scale-95 z-20 px-3 py-2 rounded-xl text-sm"><Icon name="arrow-left" size={18} /> Quay lại</button>
                            <div className="font-black text-slate-800 text-sm flex items-center gap-2.5 px-4 py-1.5 bg-slate-50 rounded-xl border border-slate-100"><Icon name={activeLesson.icon} size={18} className={activeLesson.color} />{activeLesson.title}</div>
                        </div>
                        <div className="flex-1 w-full relative overflow-hidden bg-[#f8fafc]">
                            <iframe src={activeLesson.path} className="absolute top-0 left-0 w-full h-full border-0" title={activeLesson.title}></iframe>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-[1200px] mx-auto space-y-6 sm:space-y-8 animate-fade-in sm:px-4">
                    <IdleWarningModal />
                    <EditNameModal />
                    <GlobalNav />
                    
                    <div className="premium-bg sm:rounded-[2.5rem] p-6 sm:p-10 text-white shadow-2xl relative overflow-hidden flex flex-col gap-8">
                        <div className="relative z-10 flex flex-col md:flex-row justify-between items-start gap-6">
                            <div>
                                <div className="flex items-center gap-4 mb-2">
                                    <div className="w-14 h-14 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center border border-white/20 text-white font-black text-2xl shadow-inner">
                                        {deviceName ? deviceName.charAt(0).toUpperCase() : user.name.charAt(0)}
                                    </div>
                                    <div>
                                        <h2 className="text-2xl sm:text-4xl font-black leading-tight tracking-tight">Hi, {deviceName}! 👋</h2>
                                        <div className="flex items-center gap-2 mt-2">
                                            <p className="text-indigo-200 text-xs sm:text-sm font-medium">Tài khoản chung: <span className="text-white bg-white/10 px-2 py-0.5 rounded-md font-bold border border-white/10">{user.name}</span></p>
                                            <button onClick={() => { setEditNameValue(deviceName); setIsEditingName(true); }} className="text-indigo-300 hover:text-white bg-white/5 border border-transparent hover:border-white/20 p-1.5 rounded-lg transition-all" title="Đổi tên hiển thị">
                                                <Icon name="pencil" size={14} />
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="flex gap-3 w-full md:w-auto">
                                <RankBadge rank={myWeekRank} title="Tuần này" />
                                <RankBadge rank={myMonthRank} title="Tháng này" />
                            </div>
                        </div>
                        
                        <div className="w-full h-px bg-gradient-to-r from-transparent via-indigo-400/30 to-transparent relative z-10"></div>

                        <div className="relative z-10 grid grid-cols-1 lg:grid-cols-12 gap-6 sm:gap-8">
                            <div className="lg:col-span-7 grid grid-cols-3 gap-3 sm:gap-4">
                                <div className="glass-panel p-3 sm:p-5 rounded-2xl flex flex-col justify-center text-center relative overflow-hidden group hover:bg-white/10 transition-colors">
                                    <div className={`absolute top-0 left-0 w-full h-1.5 ${isIdle ? 'bg-amber-500' : 'bg-emerald-500'}`}></div>
                                    <Icon name="sun" size={20} className="text-indigo-300 mx-auto mb-2 opacity-80 group-hover:scale-110 transition-transform" />
                                    <p className="text-[10px] uppercase font-bold text-indigo-200 tracking-widest mb-1.5">Hôm nay</p>
                                    <p className="font-black text-sm sm:text-lg text-white drop-shadow-md">{formatTime(myDailyTotal)}</p>
                                </div>
                                <div className="glass-panel p-3 sm:p-5 rounded-2xl flex flex-col justify-center text-center group hover:bg-white/10 transition-colors">
                                    <Icon name="calendar" size={20} className="text-amber-300 mx-auto mb-2 opacity-80 group-hover:scale-110 transition-transform" />
                                    <p className="text-[10px] uppercase font-bold text-indigo-200 tracking-widest mb-1.5">Tuần này</p>
                                    <p className="font-black text-sm sm:text-lg text-amber-300 drop-shadow-md">{formatTime(myWeeklyTotal)}</p>
                                </div>
                                <div className="glass-panel p-3 sm:p-5 rounded-2xl flex flex-col justify-center text-center group hover:bg-white/10 transition-colors">
                                    <Icon name="calendar-days" size={20} className="text-emerald-300 mx-auto mb-2 opacity-80 group-hover:scale-110 transition-transform" />
                                    <p className="text-[10px] uppercase font-bold text-indigo-200 tracking-widest mb-1.5">Tháng này</p>
                                    <p className="font-black text-sm sm:text-lg text-emerald-300 drop-shadow-md">{formatTime(myMonthlyTotal)}</p>
                                </div>
                            </div>

                            <div className="lg:col-span-5 glass-panel rounded-2xl p-5 sm:p-6 flex flex-col justify-center">
                                <h4 className="text-[11px] font-bold text-indigo-200 uppercase tracking-widest mb-4 flex items-center gap-2"><Icon name="pie-chart" size={16} /> Tỷ trọng bài học</h4>
                                {myLessonStats.length === 0 ? (
                                    <p className="text-sm text-indigo-200/60 italic text-center py-4 bg-black/10 rounded-xl">Bạn chưa bắt đầu học bài nào.</p>
                                ) : (
                                    <div className="space-y-4">
                                        {myLessonStats.map((stat, idx) => (
                                            <div key={idx} className="flex items-center gap-3">
                                                <div className="w-24 truncate text-xs font-bold text-white">{getLessonTitle(stat.path)}</div>
                                                <div className="flex-1 h-2.5 bg-black/20 rounded-full overflow-hidden border border-white/5">
                                                    <div className={`h-full ${getLessonColor(stat.path)} progress-bar-fill rounded-full`} style={{ width: `${stat.percent}%` }}></div>
                                                </div>
                                                <div className="w-10 text-right text-xs font-mono font-bold text-indigo-200">{stat.percent}%</div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    <div className="flex flex-wrap gap-2 bg-slate-200/50 p-2 rounded-[1.25rem] w-full sm:w-fit mx-4 sm:mx-auto relative z-10 border border-slate-200/50">
                        <button onClick={() => setCurrentTab('lessons')} className={`flex-1 sm:flex-none justify-center px-4 sm:px-6 py-3 rounded-xl text-sm font-bold flex items-center gap-2 transition-all ${currentTab === 'lessons' ? 'bg-white text-indigo-600 shadow-sm border border-slate-100' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200/50'}`}><Icon name="book-open" size={18} /> Kho Bài học</button>
                        <button onClick={() => setCurrentTab('leaderboard_week')} className={`flex-1 sm:flex-none justify-center px-4 sm:px-6 py-3 rounded-xl text-sm font-bold flex items-center gap-2 transition-all ${currentTab === 'leaderboard_week' ? 'bg-white text-amber-500 shadow-sm border border-slate-100' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200/50'}`}><Icon name="trophy" size={18} /> BXH Tuần</button>
                        <button onClick={() => setCurrentTab('leaderboard_month')} className={`flex-1 sm:flex-none justify-center px-4 sm:px-6 py-3 rounded-xl text-sm font-bold flex items-center gap-2 transition-all ${currentTab === 'leaderboard_month' ? 'bg-white text-emerald-500 shadow-sm border border-slate-100' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200/50'}`}><Icon name="award" size={18} /> BXH Tháng</button>
                    </div>

                    <div className="px-4 sm:px-0">
                        {currentTab === 'lessons' && (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6 animate-fade-up">
                                {lessonsData.map((item, i) => (
                                    <div key={i} onClick={() => setActiveLesson(item)} className={`lesson-card bg-white p-6 rounded-[2rem] border ${item.border} shadow-sm flex flex-col cursor-pointer group`}>
                                        <div className="flex items-center gap-4 mb-5">
                                            <div className={`w-14 h-14 shrink-0 ${item.bg} ${item.color} rounded-2xl flex items-center justify-center group-hover:scale-110 group-hover:-rotate-3 transition-transform duration-300 shadow-sm`}><Icon name={item.icon} size={26} /></div>
                                            <div>
                                                <h3 className="font-black text-lg text-slate-800 leading-tight tracking-tight">{item.title}</h3>
                                                <p className="text-[10px] uppercase font-bold text-slate-400 mt-1 tracking-widest">{item.subtitle}</p>
                                            </div>
                                        </div>
                                        <p className="text-slate-500 text-sm leading-relaxed font-medium mb-5 flex-1">{item.desc}</p>
                                        <div className="flex items-center justify-between pt-4 border-t border-slate-50 group-hover:border-indigo-50 transition-colors">
                                            <span className="text-indigo-600 font-bold text-xs uppercase tracking-widest flex items-center gap-1.5 group-hover:gap-2.5 transition-all">Vào học <Icon name="arrow-right" size={14} /></span>
                                            <div className="w-8 h-8 rounded-full bg-slate-50 group-hover:bg-indigo-50 flex items-center justify-center transition-colors"><Icon name="play" size={12} className="text-slate-400 group-hover:text-indigo-500 ml-0.5" /></div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                        {currentTab === 'leaderboard_week' && <Leaderboard title="Vinh danh Tuần này" subtitle="Top học viên chăm chỉ nhất tuần" users={users} timeData={timeData} dates={weekDates} label="Thời gian tuần" currentUser={user} currentDevice={deviceId} localSeconds={localSeconds} todayStr={todayStr} deviceName={deviceName} />}
                        {currentTab === 'leaderboard_month' && <Leaderboard title="Tổng kết Tháng" subtitle="Vinh danh học viên xuất sắc nhất tháng" users={users} timeData={timeData} dates={monthDates} label="Thời gian tháng" currentUser={user} currentDevice={deviceId} localSeconds={localSeconds} todayStr={todayStr} deviceName={deviceName} />}
                    </div>
                </div>
            );
        };

        const Leaderboard = ({ title, subtitle, users, timeData, dates, label, currentUser, currentDevice, localSeconds, todayStr, deviceName }) => {
            
            let allProfiles = [];
            
            Object.keys(timeData).forEach(uid => {
                const userDevices = timeData[uid];
                const profilesInUser = {};
                
                Object.entries(userDevices).forEach(([devId, dev]) => {
                    const nameKey = (dev.name || 'Máy ẩn danh').trim().toLowerCase();
                    const displayName = dev.name || 'Máy ẩn danh';
                    
                    if (!profilesInUser[nameKey]) {
                        profilesInUser[nameKey] = { total: 0, displayName: displayName };
                    }
                    
                    dates.forEach(date => {
                        if (currentUser && uid === currentUser.id && devId === currentDevice && date === todayStr) {
                            profilesInUser[nameKey].total += Number(localSeconds || 0);
                        } else {
                            profilesInUser[nameKey].total += Number(dev.times?.[date] || 0);
                        }
                    });
                });
                
                if (currentUser && uid === currentUser.id && localSeconds > 0 && !userDevices[currentDevice]) {
                    const nameKey = (deviceName || 'Máy ẩn danh').trim().toLowerCase();
                    if (!profilesInUser[nameKey]) profilesInUser[nameKey] = { total: 0, displayName: deviceName || 'Máy ẩn danh' };
                    if (dates.includes(todayStr)) profilesInUser[nameKey].total += Number(localSeconds || 0);
                }
                
                Object.entries(profilesInUser).forEach(([nameKey, data]) => {
                    if (data.total > 0) {
                        const accountInfo = users.find(u => u.id === uid);
                        if (accountInfo) {
                            allProfiles.push({
                                id: uid + '_' + nameKey,
                                uid: uid,
                                name: data.displayName, 
                                accountName: accountInfo.name, 
                                total: data.total
                            });
                        }
                    }
                });
            });
            
            const ranking = allProfiles.sort((a, b) => b.total - a.total);

            return (
                <div className="bg-white rounded-[2.5rem] border border-slate-200/60 shadow-md p-6 sm:p-10 animate-fade-up max-w-4xl mx-auto">
                    <div className="text-center mb-10">
                        <div className="w-16 h-16 bg-gradient-to-br from-amber-100 to-orange-100 text-amber-500 rounded-3xl flex items-center justify-center mx-auto mb-5 shadow-sm border border-amber-200/50"><Icon name="crown" size={32} /></div>
                        <h2 className="text-3xl font-black text-slate-800 tracking-tight">{title}</h2>
                        <p className="text-slate-500 text-sm mt-2 font-medium">{subtitle}</p>
                    </div>

                    {ranking.length === 0 ? (
                        <div className="text-center py-16 bg-slate-50 rounded-3xl border-2 border-dashed border-slate-200">
                            <div className="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm"><Icon name="ghost" size={40} className="text-slate-300" /></div>
                            <p className="text-slate-500 font-bold text-base">Chưa có dữ liệu học tập.</p>
                            <p className="text-slate-400 text-sm mt-1">Hãy bắt đầu học ngay để dẫn đầu bảng xếp hạng!</p>
                        </div>
                    ) : (
                        <div className="space-y-3 sm:space-y-4">
                            {ranking.map((student, index) => {
                                const isTop3 = index < 3;
                                const rankClass = index === 0 ? 'rank-1 scale-[1.02] z-10' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : 'bg-slate-50/50 border border-slate-100 text-slate-800 hover:bg-white';
                                const rankIcon = index === 0 ? 'crown' : index === 1 ? 'medal' : index === 2 ? 'award' : '';
                                const isMe = currentUser && student.uid === currentUser.id && student.name.trim().toLowerCase() === (deviceName||'').trim().toLowerCase();
                                
                                return (
                                    <div key={student.id} className={`rank-card p-4 sm:p-5 rounded-2xl flex items-center justify-between gap-3 sm:gap-4 relative ${rankClass} ${isMe && !isTop3 ? 'ring-2 ring-indigo-400 ring-offset-2' : ''}`}>
                                        {isMe && <div className="absolute -left-2 -top-2 bg-indigo-500 text-white text-[9px] font-black uppercase tracking-widest px-2 py-1 rounded-lg shadow-md z-20">Bạn</div>}
                                        <div className="flex items-center gap-4 sm:gap-5 overflow-hidden flex-1 min-w-0">
                                            <div className={`w-12 h-12 sm:w-14 sm:h-14 shrink-0 rounded-2xl flex items-center justify-center font-black text-xl icon-bg shadow-sm ${!isTop3 ? 'bg-white text-slate-400 border border-slate-200' : ''}`}>
                                                {isTop3 ? <Icon name={rankIcon} size={24} className="drop-shadow-sm" /> : `#${index + 1}`}
                                            </div>
                                            <div className="min-w-0 flex-1">
                                                <h3 className={`font-black truncate tracking-tight ${index === 0 ? 'text-lg sm:text-xl' : 'text-base sm:text-lg'}`}>{student.name}</h3>
                                                <p className="text-[10px] sm:text-[11px] font-bold mt-1 opacity-70 uppercase tracking-widest truncate">TK: {student.accountName}</p>
                                            </div>
                                        </div>
                                        <div className="text-right shrink-0 ml-2 sm:ml-4">
                                            <p className={`font-black ${index === 0 ? 'text-base sm:text-lg drop-shadow-md' : 'text-sm sm:text-base'}`}>{formatTime(student.total)}</p>
                                            <p className="text-[9px] sm:text-[10px] uppercase font-bold opacity-70 tracking-widest mt-1">{label}</p>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        const AdminPanel = ({ users, timeData, db, handleLogout }) => {
            const [n, setN] = useState(''); const [u, setU] = useState(''); const [p, setP] = useState('');
            const [addError, setAddError] = useState(''); const [deletingId, setDeletingId] = useState(null);
            
            const [showResetModal, setShowResetModal] = useState(false);
            const [isResetting, setIsResetting] = useState(false);
            const [resetMode, setResetMode] = useState('data_only'); 
            const [sortBy, setSortBy] = useState('month');
            
            const [adminTab, setAdminTab] = useState('manage'); 
            const [trashData, setTrashData] = useState([]);
            const [backupMessage, setBackupMessage] = useState(null);
            const [isRestoringBackup, setIsRestoringBackup] = useState(false);
            const fileInputRef = useRef(null);

            const todayStr = getTodayStr();
            const weekDates = useMemo(() => getCurrentWeekDates(), []);
            const monthDates = useMemo(() => getCurrentMonthDates(), []);
            
            useEffect(() => {
                if (!db) return;
                const unsub = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'bob_trash'), snap => {
                    const list = [];
                    snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                    setTrashData(list.sort((a, b) => b.deletedAt - a.deletedAt));
                });
                return () => unsub();
            }, [db]);

            let allLearners = [];
            users.filter(x => x.role === 'student').forEach(s => {
                const userDevices = timeData[s.id] || {};
                const deviceKeys = Object.keys(userDevices);
                
                if (deviceKeys.length === 0) {
                    allLearners.push({
                        uniqueId: s.id + '_none', accountId: s.id, isDeviceRow: false,
                        accountName: s.name, username: s.username, password: s.password,
                        deviceName: 'Chưa có dữ liệu học',
                        totalToday: 0, weeklyTotal: 0, monthlyTotal: 0, topLesson: null, lastActive: 0
                    });
                } else {
                    const profiles = {};
                    deviceKeys.forEach(devId => {
                        const dev = userDevices[devId];
                        const nameKey = (dev.name || 'Máy ẩn danh').trim().toLowerCase();
                        
                        if (!profiles[nameKey]) {
                            profiles[nameKey] = { originalName: dev.name || 'Máy ẩn danh', devIds: [], totalToday: 0, weeklyTotal: 0, monthlyTotal: 0, lessonStats: {}, lastActive: 0 };
                        }
                        
                        profiles[nameKey].devIds.push(devId);
                        profiles[nameKey].lastActive = Math.max(profiles[nameKey].lastActive, dev.lastActive || 0);
                        profiles[nameKey].totalToday += Number(dev.times?.[todayStr] || 0);
                        weekDates.forEach(d => { profiles[nameKey].weeklyTotal += Number(dev.times?.[d] || 0) });
                        monthDates.forEach(d => { profiles[nameKey].monthlyTotal += Number(dev.times?.[d] || 0) });
                        
                        if (dev.lessonStats) {
                            Object.entries(dev.lessonStats).forEach(([path, sec]) => {
                                profiles[nameKey].lessonStats[path] = (profiles[nameKey].lessonStats[path] || 0) + Number(sec);
                            });
                        }
                    });
                    
                    Object.entries(profiles).forEach(([nameKey, pData]) => {
                        let topLesson = null;
                        const totalStats = Object.values(pData.lessonStats).reduce((sum, val) => sum + val, 0);
                        if (totalStats > 0) {
                            const topPath = Object.keys(pData.lessonStats).sort((a, b) => pData.lessonStats[b] - pData.lessonStats[a])[0];
                            topLesson = { path: topPath, percent: Math.round((pData.lessonStats[topPath] / totalStats) * 100) };
                        }
                        
                        allLearners.push({
                            uniqueId: s.id + '_' + nameKey, accountId: s.id, devIds: pData.devIds, isDeviceRow: true,
                            accountName: s.name, username: s.username, password: s.password,
                            deviceName: pData.originalName,
                            totalToday: pData.totalToday, weeklyTotal: pData.weeklyTotal, monthlyTotal: pData.monthlyTotal,
                            topLesson: topLesson, lastActive: pData.lastActive
                        });
                    });
                }
            });

            allLearners.sort((a, b) => {
                if (sortBy === 'today') return b.totalToday - a.totalToday;
                if (sortBy === 'week') return b.weeklyTotal - a.weeklyTotal;
                return b.monthlyTotal - a.monthlyTotal;
            });

            const handleAdd = async (e) => {
                e.preventDefault(); setAddError('');
                if(users.some(x => x.username.toLowerCase() === u.trim().toLowerCase())) { setAddError("Tên tài khoản này đã tồn tại!"); return; }
                if (!db) { setAddError("Chưa kết nối CSDL."); return; }
                const newId = 'stu_' + Date.now();
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bob_users', newId), { username: u.trim().toLowerCase(), password: p, role: 'student', name: n });
                    setN(''); setU(''); setP('');
                } catch(err) { setAddError("Lỗi lưu Đám mây."); }
            };

            const handleDeleteAccount = async (id) => {
                try {
                    if (db) { 
                        const userToDel = users.find(x => x.id === id);
                        const timeToDel = timeData[id] || {};
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bob_trash', id), {
                            type: 'account',
                            user: userToDel,
                            timeData: timeToDel,
                            deletedAt: Date.now()
                        });
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bob_users', id)); 
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bob_timeData', id)); 
                    }
                    setDeletingId(null);
                } catch(err) {}
            };

            const handleDeleteProfile = async (accountId, devIds) => {
                try {
                    if (db) {
                        const timeDocData = timeData[accountId] || {};
                        const profileData = {};
                        devIds.forEach(id => { if(timeDocData[id]) profileData[id] = timeDocData[id]; });
                        const trashId = `${accountId}_${Date.now()}`;
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bob_trash', trashId), {
                            type: 'profile',
                            accountId: accountId,
                            profileData: profileData,
                            deletedAt: Date.now()
                        });

                        const timeRef = doc(db, 'artifacts', appId, 'public', 'data', 'bob_timeData', accountId);
                        const updates = {};
                        devIds.forEach(id => { updates[id] = deleteField(); });
                        await updateDoc(timeRef, updates);
                    }
                    setDeletingId(null);
                } catch(err) { console.error(err); }
            };

            const handleRestoreFromTrash = async (item) => {
                try {
                    if (db) {
                        if (item.type === 'account') {
                            if (item.user) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bob_users', item.id), item.user);
                            if (item.timeData) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bob_timeData', item.id), item.timeData);
                        } else if (item.type === 'profile') {
                            const timeRef = doc(db, 'artifacts', appId, 'public', 'data', 'bob_timeData', item.accountId);
                            await setDoc(timeRef, item.profileData, { merge: true });
                        }
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bob_trash', item.id));
                    }
                } catch(err) { console.error(err); }
            };

            const handlePermanentDelete = async (id) => {
                try {
                    if (db) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bob_trash', id));
                } catch(err) { console.error(err); }
            };

            const handleResetSystem = async () => {
                setIsResetting(true);
                try {
                    if (db) {
                        const timePromises = Object.keys(timeData).map(uid => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bob_timeData', uid)));
                        await Promise.all(timePromises);
                        if (resetMode === 'all') {
                            const studentPromises = users.filter(x => x.role === 'student').map(s => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bob_users', s.id)));
                            await Promise.all(studentPromises);
                        }
                    }
                    setShowResetModal(false);
                } catch (err) { console.error("Lỗi khi làm mới:", err); }
                setIsResetting(false);
            };

            const handleExportData = () => {
                const data = { users, timeData };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `BobEnglish_Backup_${getTodayStr()}.json`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const handleImportData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.users && data.timeData && db) {
                            setIsRestoringBackup(true);
                            setBackupMessage({ type: 'success', text: 'Đang tiến hành khôi phục...' });
                            
                            for (const u of data.users) {
                                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bob_users', u.id), u);
                            }
                            for (const [uid, tData] of Object.entries(data.timeData)) {
                                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bob_timeData', uid), tData);
                            }
                            
                            setBackupMessage({ type: 'success', text: 'Khôi phục dữ liệu từ file thành công!' });
                            setIsRestoringBackup(false);
                        } else {
                            setBackupMessage({ type: 'error', text: 'File không đúng định dạng sao lưu của BobEnglish.' });
                        }
                    } catch (err) {
                        setBackupMessage({ type: 'error', text: 'File không hợp lệ hoặc có lỗi xảy ra!' });
                        setIsRestoringBackup(false);
                    }
                };
                reader.readAsText(file);
                e.target.value = ''; 
            };

            return (
                <div className="grid grid-cols-1 xl:grid-cols-12 gap-6 animate-fade-in max-w-7xl mx-auto">
                    
                    <div className="xl:col-span-12 bg-slate-900 sticky top-0 z-40 px-4 sm:px-6 py-4 flex flex-col sm:flex-row items-start sm:items-center justify-between rounded-[1.5rem] sm:rounded-[2rem] shadow-xl mb-4 gap-4">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 sm:w-12 sm:h-12 bg-white/10 rounded-2xl flex items-center justify-center text-white border border-white/20"><Icon name="shield-check" size={20} /></div>
                            <div>
                                <span className="text-lg sm:text-xl font-black text-white tracking-tight leading-none">Admin Center</span>
                                <span className="text-[10px] sm:text-xs text-indigo-300 font-bold block mt-0.5 sm:mt-1 uppercase tracking-widest">Quản lý hệ thống</span>
                            </div>
                        </div>
                        <div className="flex flex-wrap items-center gap-2 sm:gap-4">
                            <button onClick={() => setAdminTab('manage')} className={`text-xs sm:text-sm font-bold px-3 py-2 rounded-xl transition-all ${adminTab === 'manage' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white hover:bg-white/10'}`}>Quản lý</button>
                            <button onClick={() => setAdminTab('trash')} className={`text-xs sm:text-sm font-bold px-3 py-2 rounded-xl transition-all flex items-center gap-1.5 ${adminTab === 'trash' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white hover:bg-white/10'}`}>
                                <Icon name="trash" size={14} className="sm:w-4 sm:h-4"/> Thùng rác {trashData.length > 0 && <span className="bg-red-500 text-white text-[9px] px-1.5 py-0.5 rounded-md ml-0.5">{trashData.length}</span>}
                            </button>
                            <button onClick={() => setAdminTab('backup')} className={`text-xs sm:text-sm font-bold px-3 py-2 rounded-xl transition-all flex items-center gap-1.5 ${adminTab === 'backup' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white hover:bg-white/10'}`}>
                                <Icon name="download-cloud" size={14} className="sm:w-4 sm:h-4"/> Sao lưu
                            </button>
                            <button onClick={handleLogout} className="flex items-center gap-1.5 text-xs sm:text-sm font-bold text-white bg-red-500 hover:bg-red-600 px-3 sm:px-5 py-2 sm:py-3 rounded-xl sm:rounded-2xl transition-all shadow-lg active:scale-95 ml-auto sm:ml-0"><Icon name="log-out" size={14} className="sm:w-[18px] sm:h-[18px]" /> Đăng xuất</button>
                        </div>
                    </div>

                    {showResetModal && (
