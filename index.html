<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BobEnglish - Hệ thống học tập trực tuyến</title>
    
    <!-- Core Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #f8fafc;
            min-height: 100vh;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .animate-fade-up { animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .animate-bounce-slow { animation: bounce 2s infinite; }
        
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes bounce { 
            0%, 100% { transform: translateY(-5%); }
            50% { transform: translateY(0); }
        }

        .lesson-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @media (hover: hover) {
            .lesson-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-900">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useRef } = React;

        // --- HỆ THỐNG LƯU TRỮ ĐÁM MÂY ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // --- HELPER FUNCTIONS ---
        const getTodayStr = () => {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const formatTime = (totalSeconds) => {
            if (!totalSeconds) return "00:00:00";
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        };

        // --- COMPONENTS ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const spanRef = useRef(null);

            // Sửa lỗi NotFoundError: Failed to execute 'removeChild' trên React
            // Bằng cách quản lý DOM riêng bên trong một thẻ <span> rỗng
            useEffect(() => {
                if (window.lucide && spanRef.current) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    window.lucide.createIcons({
                        root: spanRef.current,
                        attrs: {
                            class: className,
                            width: size,
                            height: size
                        }
                    });
                }
            }, [name, size, className]);

            return <span ref={spanRef} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}></span>;
        };

        // --- MAIN APP ---
        function App() {
            const [firebaseUser, setFirebaseUser] = useState(null);
            const [isFirebaseReady, setIsFirebaseReady] = useState(false);
            
            const [usersList, setUsersList] = useState([]);
            const [timeData, setTimeData] = useState({});
            const [isLoadingData, setIsLoadingData] = useState(true);

            // Giữ phiên đăng nhập cục bộ
            const [user, setUser] = useState(() => {
                const savedUser = localStorage.getItem('bob_currentUser');
                return savedUser ? JSON.parse(savedUser) : null;
            });
            const [error, setError] = useState('');

            // 1. Xác thực bảo mật Đám mây
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.error("Lỗi xác thực", err);
                    }
                };
                initAuth();
                
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setFirebaseUser(u);
                    if (u) setIsFirebaseReady(true);
                });
                return () => unsubscribe();
            }, []);

            // 2. Lắng nghe và đồng bộ dữ liệu theo thời gian thực
            useEffect(() => {
                if (!firebaseUser) return;
                
                // Đồng bộ danh sách học viên
                const usersRef = collection(db, 'artifacts', appId, 'public', 'data', 'bob_users');
                const unsubUsers = onSnapshot(usersRef, (snapshot) => {
                    const users = [];
                    snapshot.forEach(doc => users.push({ id: doc.id, ...doc.data() }));
                    
                    // Tạo tài khoản mặc định nếu danh sách trống
                    if (users.length === 0) {
                        setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bob_users', 'admin_root'), { username: 'admin', password: '123', role: 'admin', name: 'Quản trị viên' });
                    } else {
                        setUsersList(users);
                        setIsLoadingData(false);
                    }
                }, (err) => {
                    console.error("Lỗi tải danh sách", err);
                    setIsLoadingData(false);
                });

                // Đồng bộ thời gian học
                const timeRef = collection(db, 'artifacts', appId, 'public', 'data', 'bob_timeData');
                const unsubTime = onSnapshot(timeRef, (snapshot) => {
                    const tData = {};
                    snapshot.forEach(doc => { tData[doc.id] = doc.data(); });
                    setTimeData(tData);
                });

                return () => { unsubUsers(); unsubTime(); };
            }, [firebaseUser]);

            // 3. Xử lý trường hợp admin xóa tài khoản đang đăng nhập
            useEffect(() => {
                if (user && usersList.length > 0) {
                    const stillExists = usersList.find(x => x.id === user.id);
                    if (!stillExists) {
                        setUser(null);
                        localStorage.removeItem('bob_currentUser');
                    } else {
                        setUser(stillExists);
                        localStorage.setItem('bob_currentUser', JSON.stringify(stillExists));
                    }
                }
            }, [usersList]);

            const handleLogin = (u, p) => {
                const found = usersList.find(x => x.username.toLowerCase() === u.trim().toLowerCase() && x.password === p.trim());
                if (found) {
                    setUser(found);
                    setError('');
                } else {
                    setError("Tài khoản hoặc mật khẩu không đúng.");
                }
            };

            const handleLogout = () => {
                setUser(null);
                localStorage.removeItem('bob_currentUser');
            };

            if (!isFirebaseReady || isLoadingData) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-50">
                        <div className="flex flex-col items-center gap-4 animate-fade-up">
                            <div className="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
                            <p className="text-slate-500 font-bold text-xs uppercase tracking-widest">Đang tải dữ liệu đám mây...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-10">
                    {!user ? (
                        <LoginScreen onLogin={handleLogin} error={error} />
                    ) : (
                        <div className="animate-fade-in">
                            <nav className="glass-nav sticky top-0 z-50 border-b border-slate-200/60 px-4 sm:px-6 h-16 flex items-center justify-between">
                                <div className="flex items-center gap-2 cursor-pointer" onClick={() => window.location.reload()}>
                                    <div className="w-9 h-9 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-lg">
                                        <Icon name="graduation-cap" size={20} />
                                    </div>
                                    <span className="text-xl font-black text-indigo-600 tracking-tight hidden sm:block">BobEnglish</span>
                                </div>
                                <div className="flex items-center gap-3">
                                    <div className="text-right">
                                        <p className="text-xs font-bold leading-none">{user.name}</p>
                                        <p className="text-[9px] uppercase font-black text-indigo-500 mt-1">{user.role}</p>
                                    </div>
                                    <button onClick={handleLogout} className="w-9 h-9 flex items-center justify-center bg-slate-100 text-slate-500 rounded-xl active:bg-red-50 active:text-red-500 transition-colors">
                                        <Icon name="log-out" size={16} />
                                    </button>
                                </div>
                            </nav>

                            <main className="max-w-5xl mx-auto p-4 sm:p-6 lg:p-8">
                                {user.role === 'admin' ? (
                                    <AdminPanel users={usersList} timeData={timeData} />
                                ) : (
                                    <StudentHub user={user} timeData={timeData} />
                                )}
                            </main>
                        </div>
                    )}
                </div>
            );
        }

        // --- LOGIN COMPONENT ---
        const LoginScreen = ({ onLogin, error }) => {
            const [u, setU] = useState('');
            const [p, setP] = useState('');

            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-slate-50">
                    <div className="w-full max-w-sm animate-fade-up">
                        <div className="bg-white p-8 rounded-[2rem] shadow-xl border border-white">
                            <div className="text-center mb-8">
                                <div className="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-white shadow-lg">
                                    <Icon name="zap" size={28} />
                                </div>
                                <h1 className="text-2xl font-black text-slate-800">Chào bạn!</h1>
                                <p className="text-slate-400 text-sm">Học tập hiệu quả cùng BobEnglish</p>
                            </div>
                            
                            <form onSubmit={e => { e.preventDefault(); onLogin(u, p); }} className="space-y-4">
                                {error && (
                                    <div className="p-3 bg-red-50 text-red-600 text-xs font-bold rounded-xl border border-red-100 flex items-center gap-2 animate-fade-in">
                                        <Icon name="alert-circle" size={14} /> {error}
                                    </div>
                                )}
                                <div className="space-y-1">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Tài khoản</label>
                                    <input type="text" value={u} onChange={e=>setU(e.target.value)} className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-indigo-500 focus:bg-white transition-all text-sm" placeholder="Tên đăng nhập..." required />
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Mật khẩu</label>
                                    <input type="password" value={p} onChange={e=>setP(e.target.value)} className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-indigo-500 focus:bg-white transition-all text-sm" placeholder="••••••••" required />
                                </div>
                                <button className="w-full py-4 bg-indigo-600 text-white font-black rounded-2xl shadow-lg hover:bg-indigo-700 active:scale-95 transition-all uppercase text-xs tracking-[0.2em] mt-2">
                                    Đăng nhập
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        // --- STUDENT HUB COMPONENT ---
        const StudentHub = ({ user, timeData }) => {
            const [activeLesson, setActiveLesson] = useState(null);
            const todayStr = getTodayStr();

            // 1. Khởi tạo và lấy ID Thiết bị duy nhất
            const [deviceId] = useState(() => {
                let id = localStorage.getItem('bob_deviceId');
                if (!id) {
                    id = 'dev_' + Math.random().toString(36).substr(2, 9);
                    localStorage.setItem('bob_deviceId', id);
                }
                return id;
            });

            // 2. Quản lý Tên người học/Tên máy
            const [deviceName, setDeviceName] = useState(() => localStorage.getItem('bob_deviceName'));
            const [tempName, setTempName] = useState('');

            // Quản lý đếm ngược và đồng bộ Đám mây
            const [localSeconds, setLocalSeconds] = useState(() => timeData[user.id]?.[deviceId]?.times?.[todayStr] || 0);
            const lastSyncedSeconds = useRef(localSeconds);
            const latestLocalSeconds = useRef(localSeconds);

            // Đồng bộ bộ đếm cục bộ nếu có sự khác biệt lớn từ DB
            useEffect(() => {
                if (deviceName && timeData[user.id]?.[deviceId]?.times?.[todayStr] > localSeconds) {
                    setLocalSeconds(timeData[user.id][deviceId].times[todayStr]);
                    lastSyncedSeconds.current = timeData[user.id][deviceId].times[todayStr];
                }
            }, [timeData, user.id, deviceId, todayStr, deviceName]);

            // Đếm giờ mỗi giây
            useEffect(() => {
                if (!deviceName) return; // Không đếm giờ nếu chưa đặt tên
                const timer = setInterval(() => {
                    setLocalSeconds(prev => prev + 1);
                }, 1000);
                return () => clearInterval(timer);
            }, [deviceName]);

            // Lưu lên Đám mây sau mỗi 10 giây học
            useEffect(() => {
                if (!deviceName) return;
                latestLocalSeconds.current = localSeconds;
                
                if (localSeconds - lastSyncedSeconds.current >= 10) {
                    const timeRef = doc(db, 'artifacts', appId, 'public', 'data', 'bob_timeData', user.id);
                    setDoc(timeRef, { 
                        [deviceId]: {
                            name: deviceName,
                            times: { [todayStr]: localSeconds }
                        }
                    }, { merge: true }).catch(console.error);
                    lastSyncedSeconds.current = localSeconds;
                }
            }, [localSeconds, user.id, todayStr, deviceId, deviceName]);

            // Lưu nốt phần dư khi thoát
            useEffect(() => {
                return () => {
                    if (deviceName && latestLocalSeconds.current > lastSyncedSeconds.current) {
                        const timeRef = doc(db, 'artifacts', appId, 'public', 'data', 'bob_timeData', user.id);
                        setDoc(timeRef, { 
                            [deviceId]: {
                                name: deviceName,
                                times: { [todayStr]: latestLocalSeconds.current }
                            }
                        }, { merge: true }).catch(console.error);
                    }
                };
            }, [user.id, todayStr, deviceId, deviceName]);

            // Giao diện hỏi tên nếu là máy mới
            if (!deviceName) {
                return (
                    <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                        <div className="bg-white p-8 rounded-[2rem] w-full max-w-sm shadow-2xl animate-fade-up">
                            <div className="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mb-4">
                                <Icon name="smartphone" size={24} />
                            </div>
                            <h3 className="font-black text-xl mb-2 text-slate-800">Định danh thiết bị</h3>
                            <p className="text-sm text-slate-500 mb-6">Bạn đang dùng chung tài khoản. Vui lòng nhập tên của bạn (hoặc tên máy) để theo dõi thời gian học riêng biệt.</p>
                            
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                if(tempName.trim()) {
                                    localStorage.setItem('bob_deviceName', tempName.trim());
                                    setDeviceName(tempName.trim());
                                }
                            }}>
                                <input 
                                    type="text" 
                                    placeholder="VD: Nam, Điện thoại mẹ, iPad Lan..." 
                                    value={tempName} 
                                    onChange={e => setTempName(e.target.value)}
                                    className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-indigo-500 focus:bg-white transition-all text-sm mb-4"
                                    required 
                                    autoFocus
                                />
                                <button className="w-full py-4 bg-indigo-600 text-white font-black rounded-2xl shadow-lg hover:bg-indigo-700 active:scale-95 transition-all text-sm">
                                    Bắt đầu học
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            const isGoalReached = localSeconds >= 3600;

            const lessons = [
                { title: "200 Conversations", subtitle: "Giao tiếp thực tế", desc: "Học qua 200 đoạn hội thoại tiếng Anh giao tiếp thông dụng nhất.", icon: "messages-square", color: "text-cyan-600", bg: "bg-cyan-50", path: "200conversation.html" },
                { title: "Reading", subtitle: "Luyện đọc hiểu", desc: "Cải thiện kỹ năng đọc thông qua bài báo, truyện ngắn.", icon: "book-open", color: "text-indigo-600", bg: "bg-indigo-50", path: "reading.html" },
                { title: "Bảng IPA", subtitle: "Phát âm chuẩn", desc: "Học cách đọc 44 âm trong bảng phiên âm Quốc tế.", icon: "mic-2", color: "text-blue-600", bg: "bg-blue-50", path: "ipa.html" },
                { title: "Listening", subtitle: "Luyện nghe hiểu", desc: "Cải thiện khả năng nghe qua hội thoại thực tế.", icon: "headphones", color: "text-emerald-600", bg: "bg-emerald-50", path: "listening.html" },
                { title: "Speaking", subtitle: "Luyện nói tự tin", desc: "Thực hành giao tiếp để tăng phản xạ nói lưu loát.", icon: "message-circle", color: "text-violet-600", bg: "bg-violet-50", path: "speaking.html" },
                { title: "Vocabulary", subtitle: "Vốn từ vựng", desc: "Ghi nhớ từ mới theo chủ đề thông qua hình ảnh.", icon: "sparkles", color: "text-amber-600", bg: "bg-amber-50", path: "vocabulary.html" },
                { title: "Bilingual", subtitle: "Song ngữ Anh-Việt", desc: "Đọc tin tức và truyện ngắn song ngữ.", icon: "languages", color: "text-rose-600", bg: "bg-rose-50", path: "bilingual.html" },
                { title: "Taboo Game", subtitle: "Trò chơi đố chữ", desc: "Vừa chơi vừa học, giải đố từ vựng.", icon: "gamepad-2", color: "text-orange-600", bg: "bg-orange-50", path: "taboo.html" }
            ];

            if (activeLesson) {
                return (
                    <div className="fixed inset-0 z-[9999] bg-white flex flex-col animate-fade-in" style={{ height: '100dvh' }}>
                        <div className="h-12 sm:h-14 bg-white border-b border-slate-200 flex items-center px-4 shrink-0 shadow-sm relative z-10 justify-between">
                            <button onClick={() => setActiveLesson(null)} className="flex items-center gap-1.5 text-slate-600 hover:text-red-600 font-bold transition-colors active:scale-95 z-20">
                                <Icon name="arrow-left" size={20} /> <span className="text-sm">Thoát</span>
                            </button>
                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none px-20">
                                <span className="font-black text-slate-800 text-sm sm:text-base truncate flex items-center gap-2">
                                    <Icon name={activeLesson.icon} size={16} className={activeLesson.color} />
                                    {activeLesson.title}
                                </span>
                            </div>
                            <div className="z-20 text-[10px] font-mono font-bold text-slate-400 flex items-center gap-1 bg-slate-50 px-2 py-1 rounded-md border border-slate-100">
                                <Icon name="clock" size={12} /> {formatTime(localSeconds)}
                            </div>
                        </div>
                        <div className="flex-1 w-full bg-white relative overflow-hidden">
                            <iframe src={activeLesson.path} className="absolute top-0 left-0 w-full h-full border-0" title={activeLesson.title} allow="camera; microphone; fullscreen; autoplay" style={{ display: 'block' }}></iframe>
                        </div>
                    </div>
                );
            }

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="bg-gradient-to-br from-indigo-600 to-indigo-800 rounded-[2rem] p-6 sm:p-8 text-white shadow-xl relative overflow-hidden">
                        <div className="relative z-10">
                            <h2 className="text-2xl sm:text-3xl font-black mb-2">Chào, {user.name.split(' ').pop()}! 👋</h2>
                            <p className="text-indigo-100 text-sm sm:text-base font-medium opacity-90">
                                Đang học trên: <span className="font-bold text-white bg-white/20 px-2 py-0.5 rounded">{deviceName}</span>
                            </p>
                            
                            <div className="mt-5 inline-block">
                                <div className="flex items-center gap-3 bg-white/20 p-3 rounded-2xl backdrop-blur-sm border border-white/10">
                                    <div className="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center text-white">
                                        <Icon name="timer" size={20} />
                                    </div>
                                    <div>
                                        <p className="text-[10px] uppercase font-bold text-indigo-100 tracking-wider">Thời gian học hôm nay</p>
                                        <div className="flex items-end gap-1">
                                            <p className="font-mono font-black text-xl leading-none tracking-tight">{formatTime(localSeconds)}</p>
                                            <p className="text-xs font-medium text-indigo-200 mb-0.5">/ 01:00:00</p>
                                        </div>
                                    </div>
                                </div>
                                {isGoalReached && (
                                    <div className="mt-3 flex items-center gap-2 bg-gradient-to-r from-emerald-400 to-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg animate-fade-up">
                                        <Icon name="party-popper" size={18} className="animate-bounce-slow" />
                                        Quá tuyệt vời! Bạn đã vượt mục tiêu 1 giờ học hôm nay!
                                    </div>
                                )}
                            </div>
                        </div>
                        <div className="absolute -bottom-10 -right-10 w-48 h-48 bg-white/10 rounded-full blur-3xl pointer-events-none"></div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        {lessons.map((item, i) => (
                            <div key={i} onClick={() => setActiveLesson(item)} className="lesson-card bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm flex flex-col cursor-pointer active:bg-slate-50 transition-colors">
                                <div className="flex items-center gap-4 mb-4">
                                    <div className={`w-12 h-12 shrink-0 ${item.bg} ${item.color} rounded-2xl flex items-center justify-center`}>
                                        <Icon name={item.icon} size={24} />
                                    </div>
                                    <div>
                                        <h3 className="font-extrabold text-lg text-slate-800 leading-none">{item.title}</h3>
                                        <p className="text-[10px] uppercase font-bold text-slate-400 mt-1 tracking-wider">{item.subtitle}</p>
                                    </div>
                                </div>
                                <p className="text-slate-500 text-xs leading-relaxed font-medium mb-4 flex-1">{item.desc}</p>
                                <div className="flex items-center text-indigo-600 font-bold text-[10px] uppercase tracking-widest gap-2">
                                    Vào học ngay <Icon name="chevron-right" size={12} />
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- ADMIN PANEL ---
        const AdminPanel = ({ users, timeData }) => {
            const [n, setN] = useState('');
            const [u, setU] = useState('');
            const [p, setP] = useState('');
            const [addError, setAddError] = useState('');
            const [deletingId, setDeletingId] = useState(null);
            
            const todayStr = getTodayStr();
            const students = users.filter(x => x.role === 'student');

            const handleAdd = async (e) => {
                e.preventDefault();
                setAddError('');
                
                if(users.some(x => x.username.toLowerCase() === u.trim().toLowerCase())) {
                    setAddError("Tên tài khoản này đã tồn tại!");
                    return;
                }

                const newId = 'stu_' + Date.now();
                const newUser = { username: u.trim().toLowerCase(), password: p, role: 'student', name: n };
                
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bob_users', newId), newUser);
                    setN(''); setU(''); setP('');
                } catch(err) {
                    setAddError("Có lỗi xảy ra khi lưu lên Đám mây.");
                }
            };

            const confirmDelete = async (id) => {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bob_users', id));
                    // Xóa luôn lịch sử thời gian của người này cho sạch dữ liệu
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bob_timeData', id));
                    setDeletingId(null);
                } catch(err) {
                    console.error("Lỗi xóa tài khoản", err);
                }
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 animate-fade-in">
                    <div className="lg:col-span-5 order-2 lg:order-1">
                        <div className="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                            <h3 className="font-black text-lg mb-6 flex items-center gap-3">
                                <div className="p-2 bg-indigo-50 text-indigo-600 rounded-lg"><Icon name="user-plus" size={18} /></div>
                                THÊM HỌC VIÊN
                            </h3>
                            <form onSubmit={handleAdd} className="space-y-4">
                                {addError && (
                                    <div className="p-3 bg-red-50 text-red-600 text-xs font-bold rounded-xl border border-red-100 flex items-center gap-2">
                                        <Icon name="alert-circle" size={14} /> {addError}
                                    </div>
                                )}
                                <div className="space-y-1">
                                    <label className="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-2">Tên học viên</label>
                                    <input placeholder="Họ và tên..." value={n} onChange={e=>setN(e.target.value)} className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-indigo-500 text-sm" required />
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div className="space-y-1">
                                        <label className="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-2">Tài khoản</label>
                                        <input placeholder="Username" value={u} onChange={e=>setU(e.target.value)} className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-indigo-500 text-sm" required />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-2">Mật khẩu</label>
                                        <input placeholder="Mật khẩu" value={p} onChange={e=>setP(e.target.value)} className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-indigo-500 text-sm" required />
                                    </div>
                                </div>
                                <button className="w-full py-4 bg-indigo-600 text-white font-bold rounded-2xl hover:bg-indigo-700 active:scale-95 transition-all text-sm shadow-lg shadow-indigo-100 mt-2">
                                    Xác nhận thêm
                                </button>
                            </form>
                        </div>
                    </div>

                    <div className="lg:col-span-7 order-1 lg:order-2">
                        <div className="bg-white rounded-[2rem] border border-slate-100 shadow-sm overflow-hidden flex flex-col h-[500px]">
                            <div className="p-4 bg-slate-50/50 border-b flex justify-between items-center">
                                <div className="flex items-center gap-2">
                                    <Icon name="users" size={14} className="text-slate-400" />
                                    <span className="font-black uppercase tracking-widest text-slate-400 text-[10px]">Quản lý học viên</span>
                                </div>
                                <span className="bg-indigo-600 text-white px-3 py-1 rounded-full text-[9px] font-black">{students.length} tài khoản</span>
                            </div>
                            <div className="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-2">
                                {students.length === 0 ? (
                                    <div className="h-full flex flex-col items-center justify-center opacity-20">
                                        <Icon name="user-x" size={48} />
                                        <p className="font-bold text-xs mt-2">Chưa có học viên</p>
                                    </div>
                                ) : students.map(s => {
                                    // Lấy tất cả thiết bị của tài khoản này
                                    const userDevices = timeData[s.id] || {};
                                    const deviceKeys = Object.keys(userDevices);
                                    
                                    // Tính tổng thời gian của tất cả các máy (Tùy chọn hiển thị)
                                    let totalToday = 0;
                                    deviceKeys.forEach(key => {
                                        totalToday += (userDevices[key].times?.[todayStr] || 0);
                                    });

                                    return (
                                        <div key={s.id} className="p-4 flex justify-between items-start bg-white border border-slate-50 rounded-2xl hover:shadow-md transition-all">
                                            <div className="flex items-start gap-3 w-full">
                                                <div className="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center font-black text-sm shrink-0">{s.name.charAt(0)}</div>
                                                <div className="flex-1">
                                                    <p className="font-bold text-sm text-slate-800 flex items-center gap-2">{s.name}</p>
                                                    <div className="flex items-center gap-2 mt-1 mb-2">
                                                        <p className="text-[10px] font-mono text-slate-400 bg-slate-50 px-2 py-0.5 rounded border border-slate-100">
                                                            U: {s.username} <span className="mx-1 text-slate-300">|</span> P: {s.password}
                                                        </p>
                                                    </div>
                                                    
                                                    {/* Hiển thị chi tiết từng thiết bị học */}
                                                    <div className="space-y-1">
                                                        {deviceKeys.length === 0 ? (
                                                            <span className="text-[10px] text-slate-400 italic">Chưa có dữ liệu học</span>
                                                        ) : (
                                                            deviceKeys.map(dKey => {
                                                                const dData = userDevices[dKey];
                                                                const dSeconds = dData.times?.[todayStr] || 0;
                                                                if (dSeconds === 0) return null; // Ẩn máy nếu hôm nay chưa học
                                                                
                                                                const dGoal = dSeconds >= 3600;
                                                                return (
                                                                    <div key={dKey} className={`text-[10px] font-bold px-2 py-1 rounded inline-flex items-center gap-1.5 mr-1.5 mb-1 ${dGoal ? 'bg-emerald-50 border border-emerald-100 text-emerald-700' : 'bg-slate-50 border border-slate-100 text-slate-600'}`}>
                                                                        <Icon name="smartphone" size={10} className="text-slate-400" /> 
                                                                        <span className="truncate max-w-[100px]">{dData.name}</span>: {formatTime(dSeconds)}
                                                                        {dGoal && <Icon name="check-circle-2" size={10} />}
                                                                    </div>
                                                                );
                                                            })
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            {deletingId === s.id ? (
                                                <div className="flex items-center gap-2 animate-fade-in">
                                                    <button onClick={() => confirmDelete(s.id)} className="text-[10px] font-black bg-red-500 text-white px-3 py-2 rounded-xl active:scale-95 transition-transform uppercase tracking-wider">Xóa ngay</button>
                                                    <button onClick={() => setDeletingId(null)} className="text-[10px] font-black bg-slate-100 text-slate-500 px-3 py-2 rounded-xl active:scale-95 transition-transform uppercase tracking-wider">Hủy</button>
                                                </div>
                                            ) : (
                                                <button onClick={() => setDeletingId(s.id)} className="w-8 h-8 flex items-center justify-center text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-xl transition-colors">
                                                    <Icon name="trash-2" size={16} />
                                                </button>
                                            )}
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
