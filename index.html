                        <div className="fixed inset-0 z-[99999] bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white p-8 rounded-[2.5rem] max-w-md w-full shadow-2xl animate-fade-up border-t-[6px] border-red-500">
                                <div className="text-center mb-8">
                                    <div className="w-20 h-20 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner"><Icon name="alert-triangle" size={40} /></div>
                                    <h3 className="font-black text-2xl mb-2 text-slate-800 tracking-tight">Làm mới Hệ thống</h3>
                                    <p className="text-sm text-slate-500 leading-relaxed">Bạn đang chuẩn bị reset lại dữ liệu của khóa học. Vui lòng chọn chế độ reset phù hợp:</p>
                                </div>
                                
                                <div className="space-y-4 mb-8">
                                    <label className={`flex gap-4 p-4 sm:p-5 border-2 rounded-2xl cursor-pointer transition-all ${resetMode === 'data_only' ? 'border-indigo-500 bg-indigo-50/50 shadow-sm' : 'border-slate-100 hover:border-indigo-300'}`}>
                                        <input type="radio" name="resetMode" checked={resetMode === 'data_only'} onChange={() => setResetMode('data_only')} className="mt-1 w-5 h-5 text-indigo-600 focus:ring-indigo-500" />
                                        <div>
                                            <p className="font-bold text-slate-800 text-base">Chỉ xóa Dữ liệu học</p>
                                            <p className="text-xs text-slate-500 mt-1.5 leading-relaxed">Học viên sẽ mất thời gian học và bảng xếp hạng, nhưng <b className="text-indigo-600">tài khoản đăng nhập vẫn được giữ nguyên</b>.</p>
                                        </div>
                                    </label>
                                    <label className={`flex gap-4 p-4 sm:p-5 border-2 rounded-2xl cursor-pointer transition-all ${resetMode === 'all' ? 'border-red-500 bg-red-50/50 shadow-sm' : 'border-slate-100 hover:border-red-300'}`}>
                                        <input type="radio" name="resetMode" checked={resetMode === 'all'} onChange={() => setResetMode('all')} className="mt-1 w-5 h-5 text-red-600 focus:ring-red-500" />
                                        <div>
                                            <p className="font-bold text-red-700 text-base">Xóa trắng Toàn bộ</p>
                                            <p className="text-xs text-red-500/80 mt-1.5 leading-relaxed">Xóa sạch thời gian VÀ <b className="text-red-600">xóa luôn tất cả tài khoản học viên</b>. Đưa hệ thống về trang thái mới tinh.</p>
                                        </div>
                                    </label>
                                </div>

                                <div className="flex gap-3">
                                    <button disabled={isResetting} onClick={() => setShowResetModal(false)} className="flex-1 py-4 bg-slate-100 text-slate-600 font-bold rounded-2xl hover:bg-slate-200 active:scale-[0.98] transition-all text-sm">Hủy bỏ</button>
                                    <button disabled={isResetting} onClick={handleResetSystem} className="flex-1 py-4 bg-red-600 text-white font-bold rounded-2xl shadow-lg hover:bg-red-700 active:scale-[0.98] transition-all text-sm flex justify-center items-center">
                                        {isResetting ? <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> : 'Xác nhận Reset'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {adminTab === 'trash' && (
                        <div className="xl:col-span-12 bg-white rounded-[2rem] border border-slate-200/60 shadow-sm p-6 sm:p-8">
                            <h2 className="font-black text-2xl text-slate-800 tracking-tight mb-6 flex items-center gap-3"><div className="p-2.5 bg-red-50 text-red-600 rounded-xl"><Icon name="trash-2" size={20}/></div>Thùng Rác Dữ Liệu</h2>
                            {trashData.length === 0 ? (
                                <div className="text-center py-16 bg-slate-50 rounded-3xl border-2 border-dashed border-slate-200">
                                    <Icon name="check-circle-2" size={48} className="mx-auto text-slate-300 mb-3" />
                                    <p className="text-slate-500 font-bold">Thùng rác trống!</p>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    {trashData.map(item => (
                                        <div key={item.id} className="p-5 border border-slate-200 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-50/50">
                                            <div>
                                                <p className="font-bold text-slate-800 text-base">
                                                    {item.type === 'account' ? `Tài khoản: ${item.user?.name} (${item.user?.username})` : `Hồ sơ thiết bị học của account ID: ${item.accountId}`}
                                                </p>
                                                <p className="text-xs text-slate-400 mt-1">Đã xóa lúc: {new Date(item.deletedAt).toLocaleString('vi-VN')}</p>
                                            </div>
                                            <div className="flex gap-2 w-full sm:w-auto">
                                                <button onClick={() => handleRestoreFromTrash(item)} className="flex-1 sm:flex-none px-4 py-2 bg-emerald-600 text-white font-bold text-xs rounded-xl shadow-sm hover:bg-emerald-700 transition-colors flex items-center justify-center gap-1"><Icon name="rotate-ccw" size={14}/> Khôi phục</button>
                                                <button onClick={() => handlePermanentDelete(item.id)} className="flex-1 sm:flex-none px-4 py-2 bg-slate-200 text-slate-700 font-bold text-xs rounded-xl hover:bg-red-100 hover:text-red-600 transition-colors flex items-center justify-center gap-1"><Icon name="x-circle" size={14}/> Xóa vĩnh viễn</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {adminTab === 'backup' && (
                        <div className="xl:col-span-12 bg-white rounded-[2rem] border border-slate-200/60 shadow-sm p-6 sm:p-8">
                            <h2 className="font-black text-2xl text-slate-800 tracking-tight mb-2 flex items-center gap-3"><div className="p-2.5 bg-indigo-50 text-indigo-600 rounded-xl"><Icon name="database" size={20}/></div>Sao Lưu & Khôi Phục Dữ Liệu</h2>
                            <p className="text-slate-500 text-sm mb-8">Xuất file JSON lưu trữ an toàn hoặc khôi phục dữ liệu từ file sao lưu trên máy tính.</p>

                            {backupMessage && (
                                <div className={`p-4 rounded-2xl mb-6 text-sm font-bold flex items-center gap-2 ${backupMessage.type === 'success' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-red-50 text-red-700 border border-red-200'}`}>
                                    <Icon name={backupMessage.type === 'success' ? 'check-circle' : 'alert-circle'} size={18} />
                                    {backupMessage.text}
                                </div>
                            )}

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="p-6 border border-slate-200 rounded-2xl bg-slate-50/50 flex flex-col justify-between gap-6">
                                    <div>
                                        <h3 className="font-bold text-lg text-slate-800 mb-2 flex items-center gap-2"><Icon name="download" size={18} className="text-indigo-600"/> Xuất dữ liệu Sao lưu</h3>
                                        <p className="text-xs text-slate-500 leading-relaxed">Tải xuống toàn bộ tài khoản và tiến trình học tập dưới dạng file JSON để làm dữ liệu dự phòng.</p>
                                    </div>
                                    <button onClick={handleExportData} className="w-full py-4 bg-indigo-600 text-white font-bold rounded-2xl shadow-md hover:bg-indigo-700 transition-all text-sm flex items-center justify-center gap-2"><Icon name="file-down" size={18}/> Tải xuống File Backup (.json)</button>
                                </div>

                                <div className="p-6 border border-slate-200 rounded-2xl bg-slate-50/50 flex flex-col justify-between gap-6">
                                    <div>
                                        <h3 className="font-bold text-lg text-slate-800 mb-2 flex items-center gap-2"><Icon name="upload" size={18} className="text-emerald-600"/> Khôi phục từ File Backup</h3>
                                        <p className="text-xs text-slate-500 leading-relaxed">Chọn file JSON đã sao lưu trước đó để nạp lại toàn bộ tài khoản và thời gian học lên Firebase.</p>
                                    </div>
                                    <input type="file" ref={fileInputRef} onChange={handleImportData} accept=".json" className="hidden" />
                                    <button disabled={isRestoringBackup} onClick={() => fileInputRef.current && fileInputRef.current.click()} className="w-full py-4 bg-emerald-600 text-white font-bold rounded-2xl shadow-md hover:bg-emerald-700 transition-all text-sm flex items-center justify-center gap-2">
                                        {isRestoringBackup ? <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> : <><Icon name="file-up" size={18}/> Tải lên File Backup (.json)</>}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {adminTab === 'manage' && (
                        <>
                            <div className="xl:col-span-3 order-2 xl:order-1">
                                <div className="bg-white p-6 sm:p-8 rounded-[2rem] border border-slate-200/60 shadow-sm sticky top-28">
                                    <h3 className="font-black text-xl mb-6 flex items-center gap-3 tracking-tight text-slate-800"><div className="p-2.5 bg-indigo-50 text-indigo-600 rounded-xl"><Icon name="user-plus" size={20} /></div>Thêm Học Viên</h3>
                                    <form onSubmit={handleAdd} className="space-y-5">
                                        {addError && <div className="p-3 bg-red-50 text-red-600 text-xs font-bold rounded-xl border border-red-100">{addError}</div>}
                                        <div className="space-y-1.5"><label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Tên nhóm / học viên</label><input placeholder="Nhập tên hiển thị..." value={n} onChange={e=>setN(e.target.value)} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-indigo-500 focus:bg-white transition-colors text-sm font-medium" required /></div>
                                        <div className="space-y-1.5"><label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Tài khoản (Username)</label><input placeholder="Nhập tên đăng nhập..." value={u} onChange={e=>setU(e.target.value)} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-indigo-500 focus:bg-white transition-colors text-sm font-medium" required /></div>
                                        <div className="space-y-1.5"><label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Mật khẩu</label><input placeholder="Nhập mật khẩu..." value={p} onChange={e=>setP(e.target.value)} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-indigo-500 focus:bg-white transition-colors text-sm font-medium" required /></div>
                                        <button className="w-full py-4 bg-indigo-600 text-white font-black rounded-2xl hover:bg-indigo-700 active:scale-[0.98] transition-all text-sm shadow-lg mt-4 uppercase tracking-wider">Tạo tài khoản</button>
                                    </form>
                                </div>
                            </div>

                            <div className="xl:col-span-9 order-1 xl:order-2">
                                <div className="bg-white rounded-[2rem] border border-slate-200/60 shadow-sm overflow-hidden flex flex-col h-[850px]">
                                    <div className="p-5 sm:p-6 bg-slate-50/80 border-b flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                        <div className="flex items-center gap-4 w-full sm:w-auto">
                                            <div className="w-12 h-12 bg-white text-indigo-600 rounded-2xl flex items-center justify-center shrink-0 shadow-sm border border-slate-100"><Icon name="activity" size={24} /></div>
                                            <div className="flex-1">
                                                <h2 className="font-black text-xl text-slate-800 tracking-tight">Thống kê Học tập</h2>
                                                <div className="flex items-center gap-2 mt-1">
                                                    <span className="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Lọc theo:</span>
                                                    <select value={sortBy} onChange={e => setSortBy(e.target.value)} className="text-xs border border-slate-200 bg-white rounded-lg px-2 py-1 outline-none font-bold text-indigo-600 cursor-pointer shadow-sm hover:border-indigo-300 transition-colors">
                                                        <option value="month">Thời gian Tháng</option>
                                                        <option value="week">Thời gian Tuần</option>
                                                        <option value="today">Thời gian Hôm nay</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="flex items-center justify-between w-full sm:w-auto gap-3">
                                            <span className="bg-indigo-50 text-indigo-700 px-4 py-2 rounded-xl text-sm font-black border border-indigo-100 shrink-0">{allLearners.length} Hồ sơ</span>
                                            <button onClick={() => setShowResetModal(true)} className="bg-white text-red-600 px-4 py-2 rounded-xl font-bold text-sm flex items-center gap-2 hover:bg-red-50 transition-colors border border-red-200 shadow-sm shrink-0"><Icon name="rotate-ccw" size={16} /> Reset Data</button>
                                        </div>
                                    </div>
                                    
                                    <div className="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6 space-y-4 bg-slate-50/30">
                                        {allLearners.length === 0 ? <div className="h-full flex flex-col items-center justify-center opacity-40"><Icon name="users" size={64} className="mb-4 text-slate-300" /><p className="font-bold text-lg text-slate-500">Chưa có dữ liệu học viên</p></div> 
                                        : allLearners.map((l, index) => {
                                            const isOnline = l.lastActive && (Date.now() - l.lastActive < 120000);
                                            
                                            return (
                                            <div key={l.uniqueId} className="p-5 flex flex-col lg:flex-row gap-5 justify-between items-start lg:items-center bg-white border border-slate-200 rounded-[1.5rem] hover:border-indigo-300 hover:shadow-md transition-all">
                                                <div className="flex items-start sm:items-center gap-4 w-full lg:w-auto flex-1 min-w-0">
                                                    <div className="w-12 h-12 bg-slate-50 text-slate-500 rounded-2xl flex items-center justify-center font-black text-lg shrink-0 border border-slate-200 relative">
                                                        {index + 1}
                                                        {isOnline && <div className="absolute -top-1 -right-1 w-3.5 h-3.5 bg-emerald-500 border-2 border-white rounded-full animate-pulse shadow-sm"></div>}
                                                    </div>
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center gap-2.5 flex-wrap">
                                                            <p className="font-black text-base text-slate-800 truncate tracking-tight">{l.deviceName}</p>
                                                            <span className={`text-[10px] px-2 py-0.5 rounded-lg flex items-center gap-1.5 border shrink-0 font-bold ${isOnline ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'bg-slate-50 text-slate-500 border-slate-200'}`}>
                                                                <span className={`w-1.5 h-1.5 rounded-full ${isOnline ? 'bg-emerald-500 animate-pulse' : 'bg-slate-400'}`}></span>
                                                                {isOnline ? 'Online' : getTimeAgo(l.lastActive)}
                                                            </span>
                                                        </div>
                                                        <p className="text-xs text-slate-400 font-medium mt-1">TK: <span className="font-bold text-slate-600">{l.accountName}</span> ({l.username}) | MK: <span className="font-mono font-bold text-indigo-600">{l.password}</span></p>
                                                    </div>
                                                </div>

                                                <div className="flex flex-wrap items-center gap-4 w-full lg:w-auto justify-between lg:justify-end border-t lg:border-t-0 pt-3 lg:pt-0 border-slate-100">
                                                    <div className="flex items-center gap-4 text-center">
                                                        <div>
                                                            <p className="text-[9px] uppercase font-bold text-slate-400 tracking-wider">Hôm nay</p>
                                                            <p className="font-black text-sm text-slate-800 mt-0.5">{formatTime(l.totalToday)}</p>
                                                        </div>
                                                        <div className="w-px h-8 bg-slate-100"></div>
                                                        <div>
                                                            <p className="text-[9px] uppercase font-bold text-amber-500 tracking-wider">Tuần</p>
                                                            <p className="font-black text-sm text-amber-600 mt-0.5">{formatTime(l.weeklyTotal)}</p>
                                                        </div>
                                                        <div className="w-px h-8 bg-slate-100"></div>
                                                        <div>
                                                            <p className="text-[9px] uppercase font-bold text-emerald-500 tracking-wider">Tháng</p>
                                                            <p className="font-black text-sm text-emerald-600 mt-0.5">{formatTime(l.monthlyTotal)}</p>
                                                        </div>
                                                    </div>

                                                    <div className="flex items-center gap-2">
                                                        {l.isDeviceRow ? (
                                                            <button onClick={() => handleDeleteProfile(l.accountId, l.devIds)} className="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-xl transition-colors" title="Xóa thiết bị này">
                                                                <Icon name="trash" size={18} />
                                                            </button>
                                                        ) : (
                                                            <button onClick={() => handleDeleteAccount(l.accountId)} className="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-xl transition-colors" title="Xóa toàn bộ tài khoản">
                                                                <Icon name="user-x" size={18} />
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                    </div>
                                </div>
                            </div>
                        </>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
