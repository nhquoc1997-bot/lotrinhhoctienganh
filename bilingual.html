<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Tạo Văn Bản Song Ngữ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Tùy chỉnh thanh cuộn cho đẹp mắt */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Styles cho tính năng Click từ tiếng Anh */
        .word-clickable {
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            border-bottom: 1px dashed transparent;
        }
        .word-clickable:hover {
            background-color: #dbeafe; 
            color: #1d4ed8; 
            border-bottom-color: #3b82f6;
        }

        /* Chữ đúng/sai trong chế độ luyện tập */
        .word-correct { color: #16a34a; font-weight: 600; }
        .word-incorrect { color: #dc2626; text-decoration: line-through; opacity: 0.8; }
        .word-missing { color: #d97706; text-decoration: underline; text-decoration-style: dashed; }

        /* Tooltip từ điển */
        #dictPopup {
            position: fixed;
            z-index: 100;
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            border-radius: 0.75rem;
            padding: 1rem;
            min-width: 200px;
            display: none;
            transform: translate(-50%, calc(-100% - 15px));
            pointer-events: none;
        }
        #dictPopup::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
            filter: drop-shadow(0 2px 1px rgba(0,0,0,0.05));
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- THANH THÔNG BÁO (TOAST GLOBAL) -->
    <div id="toast" class="fixed top-4 right-4 px-6 py-3 rounded-xl shadow-xl transform transition-all duration-300 translate-y-[-150%] opacity-0 z-[100] flex items-center gap-3 font-medium">
        <i id="toastIcon" class="ph-fill ph-info text-xl"></i>
        <span id="toastMsg">Thông báo</span>
    </div>

    <!-- MÀN HÌNH ỨNG DỤNG DỊCH (Hiển thị mặc định) -->
    <div id="app-view" class="flex-grow flex flex-col">
        <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-40">
            <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap gap-4 justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 text-white p-2 rounded-lg shadow-md">
                        <i class="ph ph-translate text-2xl"></i>
                    </div>
                    <h1 class="text-xl font-bold text-slate-900">Trình Tạo Song Ngữ</h1>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 bg-slate-100 p-1 rounded-lg border border-slate-200">
                        <select id="langDirection" class="bg-transparent border-none outline-none text-sm font-medium text-slate-700 py-1 px-2 cursor-pointer">
                            <option value="en-vi">Tiếng Anh ➔ Tiếng Việt</option>
                            <option value="vi-en">Tiếng Việt ➔ Tiếng Anh</option>
                        </select>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-grow max-w-6xl mx-auto w-full px-4 py-8 flex flex-col gap-8">
            <!-- Khu vực nhập liệu -->
            <section id="inputSection" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-1 flex flex-col focus-within:ring-2 focus-within:ring-blue-500 transition-all">
                <textarea id="sourceText" class="w-full h-48 md:h-64 p-5 md:p-6 resize-none outline-none text-slate-700 text-lg md:text-xl leading-relaxed placeholder-slate-400 bg-transparent" placeholder="Dán văn bản tiếng Anh của bạn vào đây..."></textarea>
                <div class="flex flex-col md:flex-row justify-between items-center p-3 border-t border-slate-100 bg-slate-50 rounded-b-xl gap-3">
                    <span class="text-xs text-slate-500 font-medium" id="charCount">0 ký tự</span>
                    <div class="flex gap-2 w-full md:w-auto">
                        <button id="translateBtn" class="flex-1 md:flex-none bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 px-6 rounded-lg shadow-sm transition-colors flex justify-center items-center gap-2">
                            <i class="ph ph-translate text-lg"></i> Dịch & Chia đoạn
                        </button>
                        <button id="startPracticeBtn" class="flex-1 md:flex-none bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-6 rounded-lg shadow-sm transition-colors flex justify-center items-center gap-2">
                            <i class="ph ph-barbell text-lg"></i> Luyện dịch từng câu
                        </button>
                    </div>
                </div>
            </section>

            <!-- Trạng thái đang tải -->
            <div id="loadingIndicator" class="hidden flex-col items-center justify-center py-12 gap-4">
                <div class="animate-spin rounded-full h-12 w-12 border-4 border-slate-200 border-t-blue-600"></div>
                <p class="text-slate-500 font-medium animate-pulse">Đang xử lý từng đoạn văn bản...</p>
            </div>

            <!-- Khu vực hiển thị kết quả -->
            <section id="resultSection" class="hidden flex-col gap-4">
                <div class="flex flex-col md:flex-row md:justify-between items-start md:items-center gap-4 mb-2">
                    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2 shrink-0">
                        <i class="ph-fill ph-check-circle text-green-500"></i> Kết quả Song Ngữ
                    </h2>
                    <div class="flex flex-wrap items-center gap-2">
                        <button id="copyEnBtn" class="text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 py-2 px-3 rounded-lg flex items-center gap-1 border border-slate-300 transition-colors">
                            <i class="ph ph-copy"></i> Tiếng Anh
                        </button>
                        <button id="copyViBtn" class="text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 py-2 px-3 rounded-lg flex items-center gap-1 border border-slate-300 transition-colors">
                            <i class="ph ph-copy"></i> Tiếng Việt
                        </button>
                        <button id="copyAllBtn" class="text-sm font-medium text-blue-600 bg-blue-50 hover:bg-blue-100 py-2 px-3 rounded-lg flex items-center gap-1 border border-blue-200 transition-colors">
                            <i class="ph ph-copy"></i> Tất cả
                        </button>
                    </div>
                </div>
                <div id="outputArea" class="flex flex-col gap-4"></div>
            </section>

            <!-- Khu vực Luyện Tập (Mới) -->
            <section id="practiceSection" class="hidden flex-col gap-6 max-w-3xl mx-auto w-full">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                        <i class="ph-fill ph-student text-blue-600"></i> Chế độ Luyện Tập
                    </h2>
                    <button id="exitPracticeBtn" class="text-sm font-medium text-slate-500 hover:text-red-600 py-1 px-3 rounded-lg flex items-center gap-1 border border-slate-200 bg-white">
                        <i class="ph ph-x"></i> Thoát
                    </button>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 flex flex-col gap-6">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                        <span id="practiceProgress" class="bg-blue-100 text-blue-800 text-sm font-bold px-3 py-1 rounded-full">Câu 1 / 10</span>
                        <span id="practiceScore" class="text-slate-500 text-sm font-medium"></span>
                    </div>
                    
                    <div>
                        <p class="text-sm text-slate-500 mb-1 font-medium">Dịch câu sau sang tiếng Anh:</p>
                        <p id="practiceViText" class="text-xl md:text-2xl text-slate-800 font-medium leading-relaxed"></p>
                    </div>

                    <div class="flex flex-col gap-3">
                        <textarea id="practiceInput" class="w-full h-28 p-4 rounded-xl border border-slate-300 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none text-lg text-slate-800 resize-none transition-all" placeholder="Gõ câu trả lời tiếng Anh của bạn vào đây..."></textarea>
                        <button id="checkPracticeBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-xl shadow-sm transition-colors flex items-center justify-center gap-2 w-full text-lg">
                            <i class="ph ph-check-circle"></i> Kiểm tra đáp án
                        </button>
                    </div>

                    <!-- Kết quả kiểm tra -->
                    <div id="practiceFeedback" class="hidden flex-col gap-4 p-5 rounded-xl border">
                        <div id="feedbackTitle" class="font-bold text-lg flex items-center gap-2"></div>
                        
                        <div class="flex flex-col gap-2">
                            <span class="text-sm font-medium text-slate-500">Bài làm của bạn:</span>
                            <div id="userAnswerDiff" class="text-lg leading-relaxed bg-slate-50 p-3 rounded-lg border border-slate-200"></div>
                        </div>

                        <div class="flex flex-col gap-2 mt-2">
                            <span class="text-sm font-medium text-slate-500">Câu gốc (Click vào từ để tra/nghe):</span>
                            <div id="correctAnswerOriginal" class="text-lg md:text-xl leading-relaxed text-blue-900 font-medium bg-blue-50 p-4 rounded-lg border border-blue-100"></div>
                        </div>

                        <button id="nextPracticeBtn" class="mt-4 bg-slate-800 hover:bg-slate-900 text-white font-medium py-3 px-6 rounded-xl shadow-sm transition-colors flex items-center justify-center gap-2 w-full">
                            Tiếp theo <i class="ph ph-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </section>
        </main>

        <footer class="bg-slate-900 text-slate-400 py-6 text-center text-sm mt-auto">
            <p>Sử dụng Google Translate API để dịch thuật tự động.</p>
        </footer>

        <!-- Popup Từ Điển -->
        <div id="dictPopup" class="flex flex-col gap-2">
            <div class="flex items-center gap-2 border-b border-slate-100 pb-2">
                <div class="bg-blue-100 p-1.5 rounded-full flex items-center justify-center"><i class="ph-fill ph-speaker-high text-blue-600"></i></div>
                <span id="dictWord" class="font-bold text-slate-800 text-lg"></span>
            </div>
            <div id="dictMeaning" class="text-slate-600 text-base font-medium">Đang tra...</div>
        </div>
    </div>

    <!-- LOGIC ỨNG DỤNG -->
    <script>
        // --- UTILS (TOAST) ---
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');
            
            toastMsg.textContent = message;
            if (type === 'error') {
                toast.className = "fixed top-4 right-4 px-6 py-3 rounded-xl shadow-xl transform transition-all duration-300 z-[100] flex items-center gap-3 font-medium bg-red-500 text-white";
                toastIcon.className = "ph-fill ph-warning-circle text-xl";
            } else {
                toast.className = "fixed top-4 right-4 px-6 py-3 rounded-xl shadow-xl transform transition-all duration-300 z-[100] flex items-center gap-3 font-medium bg-green-500 text-white";
                toastIcon.className = "ph-fill ph-check-circle text-xl";
            }
            toast.style.transform = 'translateY(0)';
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.transform = 'translateY(-150%)';
                toast.style.opacity = '0';
            }, 3000);
        }

        // Helper function copy text to clipboard
        function copyTextToClipboard(text, successMsg) {
            if (!text.trim()) return;
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = text.trim();
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            
            try {
                document.execCommand('copy');
                showToast(successMsg, 'success');
            } catch (err) {
                showToast('Lỗi khi sao chép!', 'error');
            }
            document.body.removeChild(tempTextArea);
        }

        // --- APP LOGIC (TRANSLATOR) ---
        const sourceText = document.getElementById('sourceText');
        const translateBtn = document.getElementById('translateBtn');
        const startPracticeBtn = document.getElementById('startPracticeBtn');
        const inputSection = document.getElementById('inputSection');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const resultSection = document.getElementById('resultSection');
        const practiceSection = document.getElementById('practiceSection');
        const outputArea = document.getElementById('outputArea');
        const langDirection = document.getElementById('langDirection');
        const charCount = document.getElementById('charCount');
        const copyAllBtn = document.getElementById('copyAllBtn');
        const copyEnBtn = document.getElementById('copyEnBtn');
        const copyViBtn = document.getElementById('copyViBtn');

        sourceText.addEventListener('input', () => {
            charCount.textContent = `${sourceText.value.length} ký tự`;
        });

        async function translateText(text, sl, tl) {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                return data[0].map(item => item[0]).join('');
            } catch (error) {
                return "[Lỗi dịch thuật. Vui lòng kiểm tra kết nối mạng]";
            }
        }

        function wrapWordsForEnglish(text) {
            return text.split(/([\W]+)/).map(part => {
                if (/[a-zA-Z]/.test(part)) {
                    const safeWord = part.replace(/'/g, "\\'");
                    return `<span class="word-clickable" onclick="window.handleWordClick(event, '${safeWord}')">${part}</span>`;
                }
                return part;
            }).join('');
        }

        window.handleWordClick = async function(event, word) {
            event.stopPropagation();
            
            // Text-to-Speech
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            }

            // Popup
            const popup = document.getElementById('dictPopup');
            const dictWord = document.getElementById('dictWord');
            const dictMeaning = document.getElementById('dictMeaning');

            dictWord.textContent = word;
            dictMeaning.innerHTML = '<span class="animate-pulse text-slate-400">Đang dịch nghĩa...</span>';
            
            popup.style.display = 'flex';
            popup.style.left = `${event.clientX}px`;
            popup.style.top = `${event.clientY}px`;

            try {
                const translated = await translateText(word, 'en', 'vi');
                dictMeaning.textContent = translated.toLowerCase();
            } catch (e) {
                dictMeaning.textContent = 'Không tra được.';
            }

            setTimeout(() => { popup.style.display = 'none'; }, 4000);
        };

        document.addEventListener('click', () => {
            const popup = document.getElementById('dictPopup');
            if (popup) popup.style.display = 'none';
        });

        // HÀM TÁCH CÂU DỰA VÀO DẤU CHẤM, CHẤM HỎI, CHẤM THAN
        function splitIntoSentences(text) {
            // Regex tìm các câu kết thúc bằng . ! ? theo sau là khoảng trắng hoặc hết chuỗi
            const regex = /[^.!?]+[.!?]+(?:\s|$)/g;
            let sentences = text.match(regex);
            
            if (!sentences) {
                // Nếu không có dấu câu nào, trả về toàn bộ text như 1 câu
                return [text.trim()].filter(s => s);
            }
            return sentences.map(s => s.trim()).filter(s => s !== '');
        }

        // --- TÍNH NĂNG 1: DỊCH & CHIA ĐOẠN (BÌNH THƯỜNG) ---
        translateBtn.addEventListener('click', async () => {
            const text = sourceText.value.trim();
            if (!text) {
                showToast('Vui lòng nhập đoạn văn bản cần dịch!', 'error');
                return;
            }

            const dir = langDirection.value.split('-');
            const sourceLang = dir[0];
            const targetLang = dir[1];

            // Gom cụm 2 câu
            let chunks = [];
            const paragraphs = text.split(/\n+/).filter(p => p.trim() !== '');
            
            paragraphs.forEach(p => {
                const sents = p.match(/[^.!?]+[.!?]*/g) || [p];
                let currentChunk = [];
                sents.forEach(s => {
                    const trimmed = s.trim();
                    if (!trimmed) return;
                    currentChunk.push(trimmed);
                    if (currentChunk.length >= 2) {
                        chunks.push(currentChunk.join(' '));
                        currentChunk = [];
                    }
                });
                if (currentChunk.length > 0) chunks.push(currentChunk.join(' '));
            });

            // Giao diện loading
            translateBtn.disabled = true;
            translateBtn.classList.add('opacity-70', 'cursor-not-allowed');
            sourceText.disabled = true;
            resultSection.classList.add('hidden');
            outputArea.innerHTML = '';
            loadingIndicator.classList.replace('hidden', 'flex');

            try {
                for (let i = 0; i < chunks.length; i++) {
                    const originalP = chunks[i];
                    const translatedP = await translateText(originalP, sourceLang, targetLang);

                    const displayOriginal = sourceLang === 'en' ? wrapWordsForEnglish(originalP) : originalP;
                    const displayTranslated = targetLang === 'en' ? wrapWordsForEnglish(translatedP) : translatedP;

                    const row = document.createElement('div');
                    row.className = 'fade-in grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-8 p-5 md:p-7 bg-white rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-all relative group';

                    const col1 = document.createElement('div');
                    col1.className = 'text-slate-800 leading-relaxed text-lg md:text-[1.15rem] font-medium tracking-wide';
                    col1.innerHTML = displayOriginal;

                    const col2 = document.createElement('div');
                    col2.className = 'text-blue-900 leading-relaxed text-lg md:text-[1.15rem] pt-4 border-t border-slate-100 md:pt-0 md:border-t-0 md:border-l md:pl-8 md:border-slate-200';
                    col2.innerHTML = displayTranslated;

                    row.appendChild(col1);
                    row.appendChild(col2);
                    outputArea.appendChild(row);

                    await new Promise(r => setTimeout(r, 200));
                }

                loadingIndicator.classList.replace('flex', 'hidden');
                resultSection.classList.remove('hidden');
                practiceSection.classList.add('hidden'); // Ẩn vùng luyện tập nếu đang mở
                resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

            } catch (error) {
                showToast('Có lỗi xảy ra trong quá trình xử lý!', 'error');
                loadingIndicator.classList.replace('flex', 'hidden');
            } finally {
                translateBtn.disabled = false;
                translateBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                sourceText.disabled = false;
            }
        });

        // --- CÁC HÀM XỬ LÝ NÚT COPY ---
        
        copyAllBtn.addEventListener('click', () => {
            const rows = outputArea.querySelectorAll('.grid');
            let finalString = '';
            rows.forEach(row => {
                const originalText = row.children[0].textContent;
                const translatedText = row.children[1].textContent;
                finalString += originalText.trim() + '\n' + translatedText.trim() + '\n\n';
            });
            copyTextToClipboard(finalString, 'Đã sao chép toàn bộ!');
        });

        copyEnBtn.addEventListener('click', () => {
            const rows = outputArea.querySelectorAll('.grid');
            const isEnVi = langDirection.value === 'en-vi';
            let finalString = '';
            rows.forEach(row => {
                // Nếu dịch Anh->Việt thì Anh ở cột 1, nếu Việt->Anh thì Anh ở cột 2
                const text = isEnVi ? row.children[0].textContent : row.children[1].textContent;
                finalString += text.trim() + '\n\n';
            });
            copyTextToClipboard(finalString, 'Đã sao chép phần Tiếng Anh!');
        });

        copyViBtn.addEventListener('click', () => {
            const rows = outputArea.querySelectorAll('.grid');
            const isEnVi = langDirection.value === 'en-vi';
            let finalString = '';
            rows.forEach(row => {
                // Nếu dịch Anh->Việt thì Việt ở cột 2, nếu Việt->Anh thì Việt ở cột 1
                const text = isEnVi ? row.children[1].textContent : row.children[0].textContent;
                finalString += text.trim() + '\n\n';
            });
            copyTextToClipboard(finalString, 'Đã sao chép phần Tiếng Việt!');
        });

        // --- TÍNH NĂNG 2: CHẾ ĐỘ LUYỆN TẬP (MỚI) ---
        let practiceData = [];
        let currentPracticeIndex = 0;

        const practiceProgress = document.getElementById('practiceProgress');
        const practiceViText = document.getElementById('practiceViText');
        const practiceInput = document.getElementById('practiceInput');
        const checkPracticeBtn = document.getElementById('checkPracticeBtn');
        const practiceFeedback = document.getElementById('practiceFeedback');
        const feedbackTitle = document.getElementById('feedbackTitle');
        const userAnswerDiff = document.getElementById('userAnswerDiff');
        const correctAnswerOriginal = document.getElementById('correctAnswerOriginal');
        const nextPracticeBtn = document.getElementById('nextPracticeBtn');
        const exitPracticeBtn = document.getElementById('exitPracticeBtn');

        startPracticeBtn.addEventListener('click', async () => {
            const text = sourceText.value.trim();
            if (!text) {
                showToast('Vui lòng dán văn bản tiếng Anh vào trước!', 'error');
                return;
            }
            if (langDirection.value !== 'en-vi') {
                showToast('Chế độ này hoạt động tốt nhất khi dịch Tiếng Anh ➔ Tiếng Việt. Đang tự chuyển hướng...', 'info');
                langDirection.value = 'en-vi';
            }

            // Giao diện loading
            translateBtn.disabled = true;
            startPracticeBtn.disabled = true;
            resultSection.classList.add('hidden');
            practiceSection.classList.add('hidden');
            loadingIndicator.classList.replace('hidden', 'flex');
            
            // Lấy danh sách các câu
            const sentences = splitIntoSentences(text);
            practiceData = [];

            try {
                // Dịch từng câu một để tạo Flashcard
                for (let i = 0; i < sentences.length; i++) {
                    const enSentence = sentences[i];
                    const viSentence = await translateText(enSentence, 'en', 'vi');
                    practiceData.push({ en: enSentence, vi: viSentence });
                    // Delay nhỏ để tránh spam API
                    await new Promise(r => setTimeout(r, 200)); 
                }

                if (practiceData.length > 0) {
                    currentPracticeIndex = 0;
                    inputSection.classList.add('hidden');
                    loadingIndicator.classList.replace('flex', 'hidden');
                    practiceSection.classList.remove('hidden');
                    loadPracticeQuestion();
                } else {
                    showToast('Không tìm thấy câu nào hợp lệ.', 'error');
                    loadingIndicator.classList.replace('flex', 'hidden');
                }

            } catch (error) {
                showToast('Lỗi khi chuẩn bị bài tập. Vui lòng thử lại.', 'error');
                loadingIndicator.classList.replace('flex', 'hidden');
            } finally {
                translateBtn.disabled = false;
                startPracticeBtn.disabled = false;
            }
        });

        function loadPracticeQuestion() {
            const currentQA = practiceData[currentPracticeIndex];
            practiceProgress.textContent = `Câu ${currentPracticeIndex + 1} / ${practiceData.length}`;
            practiceViText.textContent = currentQA.vi;
            
            practiceInput.value = '';
            practiceInput.disabled = false;
            practiceInput.focus();
            
            checkPracticeBtn.classList.remove('hidden');
            practiceFeedback.classList.add('hidden');
        }

        function cleanWord(w) {
            return w.toLowerCase().replace(/[^\w\s]/gi, '');
        }

        checkPracticeBtn.addEventListener('click', () => {
            const userInputText = practiceInput.value.trim();
            if (!userInputText) {
                showToast('Vui lòng nhập câu trả lời của bạn.', 'error');
                return;
            }

            const currentQA = practiceData[currentPracticeIndex];
            const originalEn = currentQA.en;

            // Xử lý logic so sánh đúng sai đơn giản (so sánh từng từ)
            const targetWords = originalEn.split(/\s+/);
            const targetWordsClean = targetWords.map(cleanWord);
            
            const userWords = userInputText.split(/\s+/);
            
            let isPerfect = cleanWord(originalEn) === cleanWord(userInputText);
            let diffHtml = '';

            // Tạo HTML để chỉ ra chỗ sai cho người dùng
            userWords.forEach(word => {
                const cWord = cleanWord(word);
                if (!cWord) {
                    diffHtml += word + ' ';
                    return;
                }
                
                if (targetWordsClean.includes(cWord)) {
                    diffHtml += `<span class="word-correct">${word}</span> `;
                } else {
                    diffHtml += `<span class="word-incorrect">${word}</span> `;
                }
            });

            // Hiển thị giao diện feedback
            practiceInput.disabled = true;
            checkPracticeBtn.classList.add('hidden');
            practiceFeedback.classList.remove('hidden');
            practiceFeedback.classList.remove('bg-green-50', 'bg-red-50', 'border-green-200', 'border-red-200');

            if (isPerfect) {
                feedbackTitle.innerHTML = `<i class="ph-fill ph-check-circle text-green-500"></i> <span class="text-green-700">Chính xác tuyệt đối!</span>`;
                practiceFeedback.classList.add('bg-green-50', 'border-green-200');
            } else {
                feedbackTitle.innerHTML = `<i class="ph-fill ph-x-circle text-red-500"></i> <span class="text-red-700">Chưa hoàn toàn chính xác. Hãy xem kỹ lỗi sai!</span>`;
                practiceFeedback.classList.add('bg-red-50', 'border-red-200');
            }

            userAnswerDiff.innerHTML = diffHtml.trim();
            // Áp dụng bọc từ (wrapWordsForEnglish) vào câu gốc để học viên có thể click vào tra từ
            correctAnswerOriginal.innerHTML = wrapWordsForEnglish(originalEn);
        });

        nextPracticeBtn.addEventListener('click', () => {
            currentPracticeIndex++;
            if (currentPracticeIndex < practiceData.length) {
                loadPracticeQuestion();
            } else {
                // Hoàn thành
                practiceSection.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-10 text-center flex flex-col items-center gap-4">
                        <i class="ph-fill ph-trophy text-6xl text-yellow-500"></i>
                        <h2 class="text-2xl font-bold text-slate-800">Hoàn thành bài luyện tập!</h2>
                        <p class="text-slate-600 mb-4">Bạn đã luyện dịch xong ${practiceData.length} câu.</p>
                        <button onclick="document.getElementById('exitPracticeBtn').click()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-sm transition-colors">
                            Trở về màn hình chính
                        </button>
                    </div>
                `;
            }
        });

        exitPracticeBtn.addEventListener('click', () => {
            // Reset UI về ban đầu
            practiceSection.classList.add('hidden');
            inputSection.classList.remove('hidden');
            
            // Nếu mất nút Thoát do innerHTML ghi đè ở trên, reload lại phần DOM
            if(!document.getElementById('practiceViText')) {
                location.reload(); 
            }
        });

    </script>
</body>
</html>
