            {
                id: 'lesson-1',
                title: 'Bài 1: Âm /i:/',
                sound: '/i:/ (Âm i dài)',
                cards: [
                    { vocab: '1. sheep (con cừu)', vie1: 'Tôi nhìn thấy một con cừu (sheep) trên đồng cỏ.', eng1: 'I see a sheep on the grass.', vie2: 'Tôi lại gần con cừu (sheep) để vuốt ve (to pet) nó.', eng2: 'I walk close to the sheep to pet it.' },
                    { vocab: '2. eat (ăn)', vie1: 'Tôi ngồi xuống để ăn (to eat) bữa sáng.', eng1: 'I sit down to eat breakfast.', vie2: 'Tôi chọn trái cây tươi để ăn (to eat) mỗi ngày.', eng2: 'I choose fresh fruit to eat every day.' },
                    { vocab: '3. see (nhìn thấy)', vie1: 'Tôi mở cửa sổ để nhìn thấy (to see) mặt trời.', eng1: 'I open the window to see the sun.', vie2: 'Tôi cảm thấy rất vui khi nhìn thấy (to see) những người bạn cũ.', eng2: 'I feel very happy to see old friends.' },
                    { vocab: '4. meet (gặp)', vie1: 'Tôi đến quán cà phê để gặp (to meet) đồng nghiệp.', eng1: 'I go to the café to meet my colleague.', vie2: 'Tôi lên lịch để gặp (to meet) đối tác mới.', eng2: 'I set a schedule to meet a new partner.' },
                    { vocab: '5. read (đọc)', vie1: 'Tôi mở một cuốn sách để đọc (to read) vào buổi tối.', eng1: 'I open a book to read in the evening.', vie2: 'Tôi dành một giờ để đọc (to read) tin tức.', eng2: 'I spend an hour to read the news.' },
                    { vocab: '6. green (màu xanh lá)', vie1: 'Tôi mặc một chiếc áo màu xanh lá (green) để đi (to go) ra ngoài.', eng1: 'I wear a green shirt to go out.', vie2: 'Tôi rất thích màu xanh lá (green) của thiên nhiên.', eng2: 'I love the green color of nature.' },
                    { vocab: '7. key (chìa khóa)', vie1: 'Tôi cầm chiếc chìa khóa (key) để mở (to open) cửa.', eng1: 'I hold the key to open the door.', vie2: 'Tôi cất chiếc chìa khóa (key) để tránh (to avoid) bị mất.', eng2: 'I store the key to avoid losing it.' },
                    { vocab: '8. team (đội / nhóm)', vie1: 'Tôi làm việc cùng đội (team) của mình để hoàn thành (to complete) dự án.', eng1: 'I work with my team to complete the project.', vie2: 'Tôi luôn hỗ trợ đội (team) để đạt (to get) kết quả tốt nhất.', eng2: 'I support my team to get the best results.' }
                ],
                fullEng: "I see a sheep on the grass. I walk close to the sheep to pet it. I sit down to eat breakfast. I choose fresh fruit to eat every day. I open the window to see the sun. I feel very happy to see old friends. I go to the café to meet my colleague. I set a schedule to meet a new partner. I open a book to read in the evening. I spend an hour to read the news. I wear a green shirt to go out. I love the green color of nature. I hold the key to open the door. I store the key to avoid losing it. I work with my team to complete the project. I support my team to get the best results.",
                fullVie: "Tôi nhìn thấy một con cừu trên bãi cỏ. Tôi bước lại gần con cừu để vuốt ve nó. Tôi ngồi xuống ăn sáng. Tôi chọn trái cây tươi để ăn mỗi ngày. Tôi mở cửa sổ để ngắm nhìn ánh mặt trời. Tôi cảm thấy rất vui khi gặp lại những người bạn cũ. Tôi đến quán cà phê để gặp đồng nghiệp. Tôi lên lịch gặp gỡ một đối tác mới. Tôi mở sách ra đọc vào buổi tối. Tôi dành một giờ để đọc tin tức. Tôi mặc chiếc áo màu xanh lá cây khi ra ngoài. Tôi yêu sắc xanh của thiên nhiên. Tôi cầm chìa khóa để mở cửa. Tôi cất giữ chìa khóa cẩn thận để tránh bị mất. Tôi làm việc cùng nhóm để hoàn thành dự án. Tôi hỗ trợ nhóm của mình để đạt được kết quả tốt nhất."
            },
            {
                id: 'lesson-2',
                title: 'Bài 2: Âm /ɪ/',
                sound: '/ɪ/ (Âm i ngắn)',
                cards: [
                    { vocab: '1. ship (con tàu)', vie1: 'Tôi lên một con tàu (ship) để đi (to travel) ra đảo.', eng1: 'I board a ship to travel to the island.', vie2: 'Tôi đứng trên con tàu (ship) để ngắm (to see) biển.', eng2: 'I stand on the ship to see the sea.' },
                    { vocab: '2. sit (ngồi)', vie1: 'Tôi chọn một chiếc ghế để ngồi (to sit) nghỉ ngơi.', eng1: 'I choose a chair to sit and rest.', vie2: 'Tôi kéo ghế lại gần để ngồi (to sit) cùng bạn bè.', eng2: 'I pull up a chair to sit with my friends.' },
                    { vocab: '3. fish (con cá / cá)', vie1: 'Tôi đi ra hồ để câu (to catch) cá (fish).', eng1: 'I go to the lake to catch fish.', vie2: 'Tôi mua cá tươi (fish) để nấu (to cook) bữa tối.', eng2: 'I buy fresh fish to cook dinner.' },
                    { vocab: '4. big (lớn / to)', vie1: 'Tôi chọn một căn phòng lớn (big) để ở (to stay).', eng1: 'I choose a big room to stay.', vie2: 'Tôi cần một chiếc xe lớn (big) để chở (to carry) đồ đạc.', eng2: 'I need a big car to carry my things.' },

                    { vocab: '6. rich (giàu có / phong phú)', vie1: 'Tôi cố gắng làm việc để trở nên (to become) giàu có (rich).', eng1: 'I try to work hard to become rich.', vie2: 'Tôi ăn trái cây để có (to get) nguồn dinh dưỡng phong phú (rich).', eng2: 'I eat fruit to get a rich source of nutrition.' },
                    { vocab: '7. city (thành phố)', vie1: 'Tôi chuyển đến thành phố (city) để tìm (to find) việc làm.', eng1: 'I move to the city to find a job.', vie2: 'Tôi đi dạo quanh thành phố (city) để khám phá (to explore) các con phố.', eng2: 'I walk around the city to explore the streets.' },
                    { vocab: '8. pig (con heo / con lợn)', vie1: 'Tôi đến trang trại để xem (to see) con heo (pig).', eng1: 'I go to the farm to see the pig.', vie2: 'Tôi cho con heo (pig) ăn (to eat) rau củ tươi.', eng2: 'I feed the pig vegetables to eat.' }
                ],
                fullEng: "I board a ship to travel to the island. I stand on the ship to see the sea. I choose a chair to sit and rest. I pull up a chair to sit with my friends. I go to the lake to catch fish. I buy fresh fish to cook dinner. I choose a big room to stay. I need a big car to carry my things. I choose to live in a quiet place. I move here to live near my family. I try to work hard to become rich. I eat fruit to get a rich source of nutrition. I move to the city to find a job. I walk around the city to explore the streets. I go to the farm to see the pig. I feed the pig vegetables to eat.",
                fullVie: "Tôi lên tàu để đi ra đảo. Tôi đứng trên tàu ngắm nhìn biển cả. Tôi chọn một chiếc ghế để ngồi nghỉ ngơi. Tôi kéo ghế lại gần để ngồi cùng bạn bè. Tôi ra hồ để câu cá. Tôi mua cá tươi về nấu bữa tối. Tôi chọn một căn phòng rộng rãi để ở. Tôi cần một chiếc xe lớn để chở đồ đạc. Tôi chọn sống ở một nơi yên tĩnh. Tôi chuyển đến đây để sống gần gia đình. Tôi nỗ lực làm việc để trở nên giàu có. Tôi ăn trái cây để bổ sung nguồn dinh dưỡng dồi dào. Tôi chuyển đến thành phố để tìm việc làm. Tôi đi dạo quanh thành phố để khám phá các con phố. Tôi đến trang trại để xem con lợn. Tôi cho lợn ăn rau."
            },
            {
                id: 'lesson-3',
                title: 'Bài 3: Âm /e/',
                sound: '/e/ (Âm e ngắn)',
                cards: [
                    { vocab: '1. bed (chiếc giường)', vie1: 'Tôi nằm xuống chiếc giường (bed) để nghỉ (to rest) ngơi.', eng1: 'I lie on the bed to rest.', vie2: 'Tôi dọn chiếc giường (bed) để giữ (to keep) phòng gọn gàng.', eng2: 'I make the bed to keep the room tidy.' },
                    { vocab: '2. pen (cây bút)', vie1: 'Tôi lấy một cây bút (pen) để ghi (to write) chép bài.', eng1: 'I take a pen to write notes.', vie2: 'Tôi mượn một cây bút (pen) để ký (to sign) tên.', eng2: 'I borrow a pen to sign my name.' },
                    { vocab: '3. head (cái đầu)', vie1: 'Tôi gật đầu (head) để đồng ý (to agree) với kế hoạch.', eng1: 'I nod my head to agree with the plan.', vie2: 'Tôi đội mũ lên đầu (head) để che (to protect) nắng.', eng2: 'I wear a hat on my head to protect from the sun.' },
                    { vocab: '4. red (màu đỏ)', vie1: 'Tôi chọn một cái áo màu đỏ (red) để mặc (to wear) hôm nay.', eng1: 'I choose a red shirt to wear today.', vie2: 'Tôi mua những quả táo màu đỏ (red) để ăn (to eat).', eng2: 'I buy red apples to eat.' },
                    { vocab: '5. ten (số mười / 10)', vie1: 'Tôi đếm đến mười (ten) để giữ (to keep) bình tĩnh.', eng1: 'I count to ten to keep calm.', vie2: 'Tôi dành mười (ten) phút để tập (to exercise) thể dục.', eng2: 'I spend ten minutes to exercise.' },
                    { vocab: '6. friend (người bạn)', vie1: 'Tôi gọi cho người bạn (friend) để rủ (to invite) đi chơi.', eng1: 'I call my friend to invite them out.', vie2: 'Tôi lắng nghe người bạn (friend) để hiểu (to understand) họ hơn.', eng2: 'I listen to my friend to understand them better.' },
                    { vocab: '7. check (kiểm tra)', vie1: 'Tôi mở lịch để kiểm tra (to check) thời gian.', eng1: 'I open the calendar to check the time.', vie2: 'Tôi đọc lại bài để kiểm tra (to check) lỗi chính tả.', eng2: 'I reread the text to check for mistakes.' },
                    { vocab: '8. letter (lá thư)', vie1: 'Tôi viết một lá thư (letter) để gửi (to send) cho người thân.', eng1: 'I write a letter to send to my family.', vie2: 'Tôi dán tem lên lá thư (letter) để gửi (to mail) đi.', eng2: 'I put a stamp on the letter to mail it.' }
                ],
                fullEng: "I lie on the bed to rest. I make the bed to keep the room tidy. I take a pen to write notes. I borrow a pen to sign my name. I nod my head to agree with the plan. I wear a hat on my head to protect from the sun. I choose a red shirt to wear today. I buy red apples to eat. I count to ten to keep calm. I spend ten minutes to exercise. I call my friend to invite them out. I listen to my friend to understand them better. I open the calendar to check the time. I reread the text to check for mistakes. I write a letter to send to my family. I put a stamp on the letter to mail it.",

            },
            {

                title: 'Bài 4: Âm /ɑː/',
                sound: '/ɑː/ (Âm a dài)',
                cards: [
                    { vocab: '1. car (xe hơi / ô tô)', vie1: 'Tôi lái chiếc xe hơi (car) để đi (to drive) làm.', eng1: 'I drive the car to go to work.', vie2: 'Tôi rửa chiếc xe hơi (car) để làm (to make) nó sạch đẹp.', eng2: 'I wash the car to make it clean.' },

                    { vocab: '4. park (công viên)', vie1: 'Tôi đi đến công viên (park) để chạy (to run) bộ.', eng1: 'I go to the park to run.', vie2: 'Tôi ghé công viên (park) để hít (to breathe) thở không khí an lành.', eng2: 'I visit the park to breathe fresh air.' },
                    { vocab: '5. dark (bóng tối / tối)', vie1: 'Tôi bật đèn khi trời tối (dark) để nhìn (to see) rõ hơn.', eng1: 'I turn on the light when it is dark to see better.', vie2: 'Tôi mở rèm lúc trời tối (dark) để ngắm (to watch) thành phố.', eng2: 'I open the curtain when it is dark to watch the city.' },
                    { vocab: '6. art (nghệ thuật)', vie1: 'Tôi học nghệ thuật (art) để phát triển (to develop) sáng tạo.', eng1: 'I study art to develop creativity.', vie2: 'Tôi ngắm bức tranh nghệ thuật (art) để thư giãn (to relax).', eng2: 'I view the art piece to relax.' },

                    { vocab: '4. how (như thế nào / làm sao)', vie1: 'Tôi học cách (how) để nói (to speak) tiếng Anh lưu loát.', eng1: 'I learn how to speak English fluently.', vie2: 'Tôi hỏi làm sao (how) để sửa (to fix) lỗi này.', eng2: 'I ask how to fix this problem.' },
                    { vocab: '5. mouse (con chuột)', vie1: 'Tôi dùng con chuột (mouse) để điều khiển (to control) máy tính.', eng1: 'I use a mouse to control the computer.', vie2: 'Tôi mua một con chuột (mouse) mới để làm việc (to work) nhanh hơn.', eng2: 'I buy a new mouse to work faster.' },
                    { vocab: '6. town (thị trấn / thành phố)', vie1: 'Tôi đến thị trấn (town) để mua (to buy) đồ dùng.', eng1: 'I go to town to buy supplies.', vie2: 'Tôi sống ở thị trấn (town) này để tận hưởng (to enjoy) sự yên bình.', eng2: 'I live in this town to enjoy the peace.' },
                    { vocab: '7. down (xuống)', vie1: 'Tôi ngồi xuống (down) để bắt đầu (to start) bài học.', eng1: 'I sit down to start the lesson.', vie2: 'Tôi nhìn xuống (down) để tìm (to look for) chìa khóa.', eng2: 'I look down to look for the key.' },
                    { vocab: '8. sound (âm thanh)', vie1: 'Tôi mở âm thanh (sound) để nghe (to listen to) âm nhạc.', eng1: 'I turn on the sound to listen to music.', vie2: 'Tôi kiểm tra âm thanh (sound) để chuẩn bị (to prepare) cho buổi họp.', eng2: 'I check the sound to prepare for the meeting.' }
                ],
                fullEng: "I start now to finish the work early. I leave now to catch the train. I build a house to live with my family. I clean the house to welcome guests. I go out to breathe fresh air. I step out to answer the phone. I learn how to speak English fluently. I ask how to fix this problem. I use a mouse to control the computer. I buy a new mouse to work faster. I go to town to buy supplies. I live in this town to enjoy the peace. I sit down to start the lesson. I look down to look for the key. I turn on the sound to listen to music. I check the sound to prepare for the meeting.",
                fullVie: "Tôi bắt đầu bây giờ để hoàn thành công việc sớm. Tôi rời đi bây giờ để đón chuyến tàu. Tôi xây một ngôi nhà để sống cùng gia đình. Tôi dọn dẹp ngôi nhà để đón khách. Tôi đi ra ngoài để hít thở không khí tươi mát. Tôi bước ra ngoài để nghe điện thoại. Tôi học cách để nói tiếng Anh lưu loát. Tôi hỏi làm sao để sửa lỗi này. Tôi dùng con chuột để điều khiển máy tính. Tôi mua một con chuột mới để làm việc nhanh hơn. Tôi đến thị trấn để mua đồ dùng. Tôi sống ở thị trấn này để tận hưởng sự yên bình. Tôi ngồi xuống để bắt đầu bài học. Tôi nhìn xuống để tìm chìa khóa. Tôi mở âm thanh để nghe âm nhạc. Tôi kiểm tra âm thanh để chuẩn bị cho buổi họp."
            },
            {
                id: 'lesson-15',
                title: 'Bài 15: Âm /ɪə/',
                sound: '/ɪə/ (Nguyên âm đôi)',
                cards: [
                    { vocab: '1. here (ở đây)', vie1: 'Tôi đứng ở đây (here) để đợi (to wait for) bạn.', eng1: 'I stand here to wait for you.', vie2: 'Tôi sống ở đây (here) để làm việc (to work) cho công ty.', eng2: 'I live here to work for the company.' },
                    { vocab: '2. near (gần)', vie1: 'Tôi ở gần (near) trường để đi (to walk) bộ đi học.', eng1: 'I stay near the school to walk to class.', vie2: 'Tôi ngồi gần (near) cửa sổ để lấy (to get) ánh sáng.', eng2: 'I sit near the window to get light.' },
                    { vocab: '3. ear (tai)', vie1: 'Tôi bịt tai (ear) lại để tránh (to avoid) tiếng ồn.', eng1: 'I cover my ear to avoid the noise.', vie2: 'Tôi ghé tai (ear) để lắng nghe (to listen to) bí mật.', eng2: 'I lend an ear to listen to the secret.' },
                    { vocab: '4. dear (thân yêu / đắt)', vie1: 'Tôi gửi thư cho người bạn thân yêu (dear) để thăm hỏi (to ask about) sức khỏe.', eng1: 'I write to my dear friend to ask about health.', vie2: 'Tôi giữ món đồ thân thương (dear) để nhớ (to remember) về kỉ niệm.', eng2: 'I keep this dear item to remember the past.' },
                    { vocab: '5. year (năm)', vie1: 'Tôi học chăm chỉ mỗi năm (year) để đạt (to achieve) thành công.', eng1: 'I study hard every year to achieve success.', vie2: 'Tôi đi du lịch mỗi năm (year) để mở rộng (to expand) tầm mắt.', eng2: 'I travel every year to expand my horizon.' },
                    { vocab: '6. clear (rõ ràng / dọn dẹp)', vie1: 'Tôi giải thích rõ ràng (clear) để giúp (to help) mọi người hiểu.', eng1: 'I make it clear to help everyone understand.', vie2: 'Tôi dọn dẹp (clear) bàn để bắt đầu (to start) làm việc.', eng2: 'I clear the table to start working.' },
                    { vocab: '7. beer (bia)', vie1: 'Tôi uống một ly bia (beer) để ăn mừng (to celebrate) chiến thắng.', eng1: 'I drink a beer to celebrate the victory.', vie2: 'Tôi mua bia (beer) để đãi (to treat) bạn bè.', eng2: 'I buy beer to treat my friends.' },
                    { vocab: '8. cheer (cổ vũ / reo hò)', vie1: 'Tôi cổ vũ (cheer) để tiếp (to give) năng lượng cho đội nhà.', eng1: 'I cheer to give energy to the home team.', vie2: 'Tôi nâng ly ăn mừng (cheer) để chúc (to wish) mừng sinh nhật.', eng2: 'I cheer to wish a happy birthday.' }
                ],
                fullEng: "I stand here to wait for you. I live here to work for the company. I stay near the school to walk to class. I sit near the window to get light. I cover my ear to avoid the noise. I lend an ear to listen to the secret. I write to my dear friend to ask about health. I keep this dear item to remember the past. I study hard every year to achieve success. I travel every year to expand my horizon. I make it clear to help everyone understand. I clear the table to start working. I drink a beer to celebrate the victory. I buy beer to treat my friends. I cheer to give energy to the home team. I cheer to wish a happy birthday.",
                fullVie: "Tôi đứng ở đây để đợi bạn. Tôi sống ở đây để làm việc cho công ty. Tôi ở gần trường để đi bộ đi học. Tôi ngồi gần cửa sổ để lấy ánh sáng. Tôi bịt tai lại để tránh tiếng ồn. Tôi ghé tai để lắng nghe bí mật. Tôi viết thư cho người bạn thân yêu để thăm hỏi sức khỏe. Tôi giữ món đồ thân thương để nhớ về kỷ niệm. Tôi học chăm chỉ mỗi năm để đạt thành công. Tôi đi du lịch mỗi năm để mở rộng tầm mắt. Tôi giải thích rõ ràng để giúp mọi người hiểu. Tôi dọn dẹp bàn để bắt đầu làm việc. Tôi uống một ly bia để ăn mừng chiến thắng. Tôi mua bia để đãi bạn bè. Tôi cổ vũ để tiếp năng lượng cho đội nhà. Tôi nâng ly ăn mừng để chúc mừng sinh nhật."
            },
            {

                sound: '/eə/ (Nguyên âm đôi)',
                cards: [
                    { vocab: '1. hair (tóc)', vie1: 'Tôi cắt tóc (hair) để nhìn (to look) gọn gàng hơn.', eng1: 'I cut my hair to look neater.', vie2: 'Tôi chải tóc (hair) để chuẩn bị (to prepare) đi ra ngoài.', eng2: 'I comb my hair to prepare to go out.' },

                    { vocab: '6. care (chăm sóc / quan tâm)', vie1: 'Tôi chăm sóc (care) cây cối để giúp (to help) chúng phát triển.', eng1: 'I care for plants to help them grow.', vie2: 'Tôi quan tâm (care) đến bạn bè để xây dựng (to build) tình bạn đẹp.', eng2: 'I care about my friends to build a good friendship.' },

                    { vocab: '8. wear (mặc / đeo)', vie1: 'Tôi mặc (wear) áo khoác để giữ (to keep) ấm.', eng1: 'I wear a coat to keep warm.', vie2: 'Tôi đeo (wear) kính để nhìn (to see) rõ hơn.', eng2: 'I wear glasses to see better.' }
                ],
                fullEng: "I cut my hair to look neater. I comb my hair to prepare to go out. I pull the chair to sit down. I buy this chair to work comfortably. I ask where to find the bus stop. I search where to buy good books. I open the window to get fresh air. I breathe the air to relax my mind. I go there to attend the meeting. I stand there to take a photo. I care for plants to help them grow. I care about my friends to build a good friendship. I share food to help my colleagues. I share knowledge to inspire students. I wear a coat to keep warm. I wear glasses to see better.",
                fullVie: "Tôi cắt tóc để nhìn gọn gàng hơn. Tôi chải tóc để chuẩn bị đi ra ngoài. Tôi kéo chiếc ghế để ngồi xuống. Tôi mua chiếc ghế này để làm việc thoải mái. Tôi hỏi ở đâu để tìm bến xe. Tôi tìm xem ở đâu để mua sách hay. Tôi mở cửa sổ để đón không khí tươi mát. Tôi hít thở không khí để thư giãn đầu óc. Tôi đi đến đó để tham dự cuộc họp. Tôi đứng ở đó để chụp một bức ảnh. Tôi chăm sóc cây cối để giúp chúng phát triển. Tôi quan tâm đến bạn bè để xây dựng tình bạn đẹp. Tôi chia sẻ thức ăn để giúp đỡ đồng nghiệp. Tôi chia sẻ kiến thức để truyền cảm hứng cho học sinh. Tôi mặc áo khoác để giữ ấm. Tôi đeo kính để nhìn rõ hơn."
            },
            {
                id: 'lesson-17',

                sound: '/ʊə/ (Nguyên âm đôi)',
                cards: [
                    { vocab: '1. tour (chuyến du lịch / đi tour)', vie1: 'Tôi đặt một chuyến du lịch (tour) để khám phá (to explore) đất nước.', eng1: 'I book a tour to explore the country.', vie2: 'Tôi tham gia chuyến đi (tour) để thư giãn (to relax) cuối tuần.', eng2: 'I join the tour to relax on the weekend.' },
                    { vocab: '2. poor (nghèo / tội nghiệp)', vie1: 'Tôi quyên góp cho người nghèo (poor) để hỗ trợ (to support) cuộc sống của họ.', eng1: 'I donate to the poor to support their lives.', vie2: 'Tôi giúp đỡ cậu bé tội nghiệp (poor) để cải thiện (to improve) tương lai của cậu ấy.', eng2: 'I help the poor boy to improve his future.' },
                    { vocab: '3. sure (chắc chắn)', vie1: 'Tôi kiểm tra kỹ để chắc chắn (sure) hoàn thành (to complete) đúng hạn.', eng1: 'I check carefully to be sure to complete on time.', vie2: 'Tôi hỏi lại để chắc chắn (sure) hiểu (to understand) yêu cầu.', eng2: 'I ask again to be sure to understand the request.' },

                    { vocab: '5. cure (chữa trị)', vie1: 'Tôi dùng thuốc để chữa trị (cure) khỏi bệnh cảm cúm.', eng1: 'I use medicine to cure the cold.', vie2: 'Tôi tìm phương pháp để chữa trị (cure) giảm căng thẳng.', eng2: 'I find ways to cure stress.' },

                fullEng: "I book a tour to explore the country. I join the tour to relax on the weekend. I donate to the poor to support their lives. I help the poor boy to improve his future. I check carefully to be sure to complete on time. I ask again to be sure to understand the request. I drink pure water to protect my health. I use pure honey to make medicine. I use medicine to cure the cold. I find ways to cure stress. I guide the tourist to visit the city. I help the tourist to find the hotel. I stay calm to avoid feeling furious. I explain clearly to stop them from feeling furious. I learn from experience to become mature. I think deeply to make a mature decision.",
                fullVie: "Tôi đặt một chuyến du lịch để khám phá đất nước. Tôi tham gia chuyến đi để thư giãn cuối tuần. Tôi quyên góp cho người nghèo để hỗ trợ cuộc sống của họ. Tôi giúp đỡ cậu bé tội nghiệp để cải thiện tương lai của cậu ấy. Tôi kiểm tra kỹ để chắc chắn hoàn thành đúng hạn. Tôi hỏi lại để chắc chắn hiểu yêu cầu. Tôi uống nước tinh khiết để bảo vệ sức khỏe. Tôi dùng mật ong nguyên chất để làm thuốc. Tôi dùng thuốc để chữa trị khỏi bệnh cảm cúm. Tôi tìm phương pháp để chữa trị giảm căng thẳng. Tôi hướng dẫn cho khách du lịch để tham quan thành phố. Tôi giúp khách du lịch để tìm khách sạn. Tôi giữ bình tĩnh để tránh cảm giác giận dữ. Tôi giải thích rõ ràng để ngắt sự giận dữ của họ. Tôi học hỏi kinh nghiệm để trở nên trưởng thành. Tôi suy nghĩ thấu đáo để đưa ra quyết định trưởng thành."

            {
                id: 'lesson-18',
                title: 'Bài 18: Phụ âm /p/ & /b/',
                sound: '/p/ & /b/ (Phụ âm bật môi)',

                ],
                fullEng: "I think carefully to make a choice. I spend three days to finish the report. Every month, I check to evaluate results. I say thanks to show gratitude. The thin book helps readers to easily carry it. I throw the ball to practice reflexes. I study math to develop logical thinking. I choose both options to optimize efficiency. This lesson is useful to improve skills. My mother cooks to care for the family. I work with colleagues to complete the project. I select that option to save time. They discuss to find a common direction. I go there to meet the partner. The weather today is cool to go for a walk. I breathe fresh air to relieve fatigue.",
                fullVie: "Tôi suy nghĩ cẩn thận để đưa ra lựa chọn. Tôi mất ba ngày để hoàn thành báo cáo. Mỗi tháng, tôi kiểm tra để đánh giá kết quả. Tôi gửi lời cảm ơn để thể hiện lòng biết ơn. Quyển sách mỏng giúp người đọc dễ mang theo. Tôi ném bóng để luyện tập phản xạ. Tôi học môn toán để phát triển tư duy logic. Tôi chọn cả hai phương án để tối ưu hiệu quả. Bài học này rất hữu ích để cải thiện kỹ năng. Mẹ nấu ăn để chăm sóc gia đình. Tôi làm việc với đồng nghiệp để hoàn thành dự án. Tôi chọn phương án đó để tiết kiệm thời gian. Họ thảo luận để tìm hướng đi chung. Tôi đến đó để gặp đối tác. Thời tiết hôm nay rất mát mẻ để đi dạo. Tôi hít thở không khí trong lành để giải tỏa mệt mỏi."
            }
        ];

        // Text-to-Speech Engine
        function speakText(text, event) {
            if (event) event.stopPropagation();

            // Stop any ongoing speech
            window.speechSynthesis.cancel();

            // Clean text
            const cleanText = text.replace(/[\(\)]/g, '').trim();

            if (!cleanText) return;

            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-US';
            utterance.rate = currentSpeechRate;

            // Highlight word if event came from clickable element
            let targetElem = null;
            if (event && event.currentTarget) {
                targetElem = event.currentTarget;
                targetElem.classList.add('speaking-active');
            }

            utterance.onend = () => {
                if (targetElem) {
                    targetElem.classList.remove('speaking-active');
                }
            };

            utterance.onerror = () => {
                if (targetElem) {
                    targetElem.classList.remove('speaking-active');
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        function stopSpeech() {
            window.speechSynthesis.cancel();
            document.querySelectorAll('.speaking-active').forEach(el => el.classList.remove('speaking-active'));
        }

        function setSpeed(speed) {
            currentSpeechRate = speed;
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'text-blue-600', 'shadow-sm');
                btn.classList.add('text-slate-600');
            });
            const activeBtn = document.getElementById(`speed-${speed}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-white', 'text-blue-600', 'shadow-sm');
                activeBtn.classList.remove('text-slate-600');
            }
        }

        // Convert Sentence to Clickable Word Spans
        function makeSentenceInteractive(sentence) {
            const words = sentence.split(' ');
            return words.map(word => {
                // Keep punctuation outside speech trigger
                const cleanWord = word.replace(/[^a-zA-Z0-9']/g, "");
                if(!cleanWord) return word;
                return `<span class="clickable-word" onclick="speakText('${cleanWord}', event)" title="Bấm để nghe từ '${cleanWord}'">${word}</span>`;
            }).join(' ');
        }

        // Render Navigation Bar
        function renderNavigation(filteredList = lessonsData) {
            const nav = document.getElementById('lessonNav');
            if(filteredList.length === 0) {
                nav.innerHTML = `<div class="text-xs text-slate-400 text-center py-6">Không tìm thấy bài học phù hợp</div>`;
                return;
            }
            nav.innerHTML = filteredList.map((lesson) => {
                const isActive = lesson.id === activeLessonId;
                return `
                    <button onclick="switchLesson('${lesson.id}')" 
                        class="w-full text-left px-3.5 py-2.5 rounded-xl font-medium text-sm transition flex items-center justify-between ${
                            isActive 
                            ? 'bg-blue-50 text-blue-700 font-semibold shadow-xs border border-blue-100' 
                            : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                        }">
                        <div class="flex items-center space-x-2.5 overflow-hidden">
                            <i class="fa-solid ${isActive ? 'fa-book-open text-blue-600' : 'fa-book text-slate-400'} text-xs"></i>
                            <span class="truncate">${lesson.title}</span>
                        </div>
                        <span class="text-xs ${isActive ? 'bg-blue-200/60 text-blue-800' : 'bg-slate-100 text-slate-500'} px-2 py-0.5 rounded-full shrink-0 font-normal">
                            ${lesson.sound.split(' ')[0]}
                        </span>
                    </button>
                `;
            }).join('');
        }

        function filterLessons() {
            const query = document.getElementById('searchLessonInput').value.toLowerCase().trim();
            if(!query) {
                renderNavigation(lessonsData);
                return;
            }
            const filtered = lessonsData.filter(lesson => 
                lesson.title.toLowerCase().includes(query) ||
                lesson.sound.toLowerCase().includes(query) ||
                lesson.fullEng.toLowerCase().includes(query) ||
                lesson.fullVie.toLowerCase().includes(query)
            );
            renderNavigation(filtered);
        }

        // Render Active Lesson Content
        function renderLesson(lessonId) {
            const lesson = lessonsData.find(l => l.id === lessonId);
            if (!lesson) return;

            const main = document.getElementById('mainContent');
            
            // Get index for pagination
            const currentIndex = lessonsData.findIndex(l => l.id === lessonId);
            const prevLesson = lessonsData[currentIndex - 1];
            const nextLesson = lessonsData[currentIndex + 1];

            let html = `
                <div class="max-w-4xl mx-auto space-y-5 sm:space-y-6 pb-12">
                    
                    <!-- Lesson Header Banner -->
                    <div class="bg-gradient-to-r from-blue-600 via-indigo-600 to-indigo-700 rounded-2xl p-5 sm:p-6 text-white shadow-md relative overflow-hidden">
                        <div class="absolute -right-6 -bottom-6 opacity-10 text-8xl sm:text-9xl font-black select-none pointer-events-none">
                            ${lesson.sound.split(' ')[0]}
                        </div>
                        <div class="relative z-10">
                            <div class="inline-flex items-center gap-1.5 bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-xs font-medium mb-2">
                                <i class="fa-solid fa-graduation-cap text-amber-300"></i> IPA Phonetics Series (1 - 23)
                            </div>
                            <h2 class="text-xl sm:text-2xl md:text-3xl font-bold mb-1">${lesson.title.toUpperCase()}</h2>
                            <p class="text-blue-100 text-xs sm:text-sm font-medium"><i class="fa-solid fa-waveform mr-1.5"></i>Trọng tâm âm: ${lesson.sound}</p>
                        </div>
                    </div>

                    <!-- Cards Section -->
                    <div class="grid grid-cols-1 gap-4">
            `;

            lesson.cards.forEach((card) => {
                // Extract word for standalone sound icon
                const targetWord = card.vocab.split('.')[1]?.split('(')[0]?.trim() || '';

                html += `
                    <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-xs hover:shadow-md transition">
                        <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-3 gap-2">
                            <div class="text-base sm:text-xl font-bold text-red-600 flex items-center space-x-2">
                                <span>${card.vocab}</span>
                            </div>
                            <button onclick="speakText('${targetWord}', event)" class="px-3 py-2 bg-red-50 hover:bg-red-100 text-red-600 active:bg-red-200 rounded-xl text-xs sm:text-sm font-bold flex items-center space-x-1.5 transition shrink-0 active:scale-95 shadow-2xs">
                                <i class="fa-solid fa-volume-high text-sm"></i>
                                <span>Phát âm từ</span>
                            </button>
                        </div>

                        <!-- Sentence Pairs -->
                        <div class="space-y-3.5">
                            <div class="bg-slate-50/90 p-3.5 sm:p-4 rounded-xl border border-slate-200/80 shadow-2xs">
                                <!-- Prominent Vietnamese sentence -->
                                <div class="bg-amber-100/90 border-l-4 border-amber-500 rounded-r-lg px-3 py-2 mb-2.5">
                                    <p class="text-slate-900 font-bold text-base sm:text-lg leading-snug flex items-start gap-2">
                                        <i class="fa-solid fa-language text-amber-700 text-base sm:text-lg mt-0.5 shrink-0"></i>
                                        <span>${card.vie1}</span>
                                    </p>
                                </div>
                                <!-- English interactive sentence -->
                                <div class="flex items-center justify-between gap-2 pt-1">
                                    <p class="font-bold text-blue-900 text-base sm:text-lg leading-relaxed">
                                        ${makeSentenceInteractive(card.eng1)}
                                    </p>
                                    <button onclick="speakText('${card.eng1.replace(/'/g, "\\'")}', event)" class="w-10 h-10 min-w-[40px] bg-blue-100/80 hover:bg-blue-600 hover:text-white text-blue-700 rounded-full flex items-center justify-center transition shrink-0 active:scale-95 shadow-2xs" title="Nghe cả câu">
                                        <i class="fa-solid fa-volume-high text-base"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="bg-slate-50/90 p-3.5 sm:p-4 rounded-xl border border-slate-200/80 shadow-2xs">
                                <!-- Prominent Vietnamese sentence -->
                                <div class="bg-amber-100/90 border-l-4 border-amber-500 rounded-r-lg px-3 py-2 mb-2.5">
                                    <p class="text-slate-900 font-bold text-base sm:text-lg leading-snug flex items-start gap-2">
                                        <i class="fa-solid fa-language text-amber-700 text-base sm:text-lg mt-0.5 shrink-0"></i>
                                        <span>${card.vie2}</span>
                                    </p>
                                </div>
                                <!-- English interactive sentence -->
                                <div class="flex items-center justify-between gap-2 pt-1">
                                    <p class="font-bold text-blue-900 text-base sm:text-lg leading-relaxed">
                                        ${makeSentenceInteractive(card.eng2)}
                                    </p>
                                    <button onclick="speakText('${card.eng2.replace(/'/g, "\\'")}', event)" class="w-10 h-10 min-w-[40px] bg-blue-100/80 hover:bg-blue-600 hover:text-white text-blue-700 rounded-full flex items-center justify-center transition shrink-0 active:scale-95 shadow-2xs" title="Nghe cả câu">
                                        <i class="fa-solid fa-volume-high text-base"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>

                    <!-- Paragraph Reading Section -->
                    <div class="bg-white rounded-2xl p-4 sm:p-6 border border-slate-200 shadow-sm space-y-4">
                        <div class="flex items-center justify-between border-b border-slate-100 pb-3 gap-2">
                            <h3 class="font-bold text-slate-800 text-base sm:text-lg flex items-center space-x-2">
                                <i class="fa-solid fa-headphones text-blue-600"></i>
                                <span>Bản đọc Tiếng Anh liền mạch</span>
                            </h3>
                            <button onclick="speakText('${lesson.fullEng.replace(/'/g, "\\'")}', event)" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs sm:text-sm font-semibold flex items-center space-x-1.5 shadow-sm transition active:scale-95 shrink-0">
                                <i class="fa-solid fa-play"></i>
                                <span>Nghe toàn đoạn</span>
                            </button>
                        </div>

                        <!-- Continuous English Text -->
                        <div class="p-4 bg-sky-50/70 rounded-xl border border-sky-100 text-slate-800 font-medium leading-relaxed text-base sm:text-lg">
                            ${makeSentenceInteractive(lesson.fullEng)}
                        </div>

                        <!-- Vietnamese Translation -->
                        <div class="pt-2">
                            <h4 class="font-bold text-amber-800 text-base sm:text-lg mb-2 flex items-center space-x-2">
                                <i class="fa-solid fa-book-open text-amber-600"></i>
                                <span>Bản dịch Tiếng Việt (Nổi bật)</span>
                            </h4>
                            <div class="p-4 bg-amber-50/90 rounded-xl border-2 border-amber-300 text-slate-900 font-semibold text-base sm:text-lg leading-relaxed shadow-2xs">
                                "${lesson.fullVie}"
                            </div>
                        </div>
                    </div>

                    <!-- Bottom Pagination Navigation -->
                    <div class="flex items-center justify-between gap-3 pt-4">
                        ${prevLesson ? `
                            <button onclick="switchLesson('${prevLesson.id}')" class="flex-1 sm:flex-initial px-4 py-3 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold text-sm sm:text-base rounded-xl transition flex items-center justify-center space-x-2 shadow-xs active:scale-95">
                                <i class="fa-solid fa-arrow-left"></i>
                                <span>${prevLesson.title}</span>
                            </button>
                        ` : '<div class="flex-1 sm:flex-initial"></div>'}

                        ${nextLesson ? `
                            <button onclick="switchLesson('${nextLesson.id}')" class="flex-1 sm:flex-initial px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm sm:text-base rounded-xl transition flex items-center justify-center space-x-2 shadow-xs active:scale-95">
                                <span>${nextLesson.title}</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        ` : '<div class="flex-1 sm:flex-initial"></div>'}
                    </div>

                </div>
            `;

            main.innerHTML = html;
            main.scrollTop = 0; // Scroll back to top
        }

        // Switch Lesson Action
        function switchLesson(id) {
            stopSpeech();
            activeLessonId = id;
            renderNavigation();
            renderLesson(id);

            // Close sidebar on mobile after selection
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        }

        // Toggle Mobile Sidebar Drawer
        document.getElementById('toggleSidebarBtn').addEventListener('click', () => {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        });

        document.getElementById('sidebarOverlay').addEventListener('click', () => {
            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('sidebarOverlay').classList.add('hidden');
        });

        // Initialize App on DOM Load
        window.onload = function() {
            renderNavigation();
            renderLesson(activeLessonId);
        };
    </script>
</body>
</html>
