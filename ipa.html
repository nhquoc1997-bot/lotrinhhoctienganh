<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang học Tiếng Anh - Phong cách Elsa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0fdf4; }
        .card { transition: transform 0.2s ease, box-shadow 0.2s ease; cursor: pointer; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        .speak-icon { cursor: pointer; color: #3b82f6; transition: all 0.2s ease; }
        .speak-icon svg { width: 1.75rem; height: 1.75rem; }
        .speak-icon:hover { color: #1d4ed8; transform: scale(1.1); }
        .speak-icon.loading { animation: pulse 1s infinite; color: #9ca3af; pointer-events: none; }
        
        .phoneme-btn { transition: all 0.2s ease; }
        .phoneme-btn.active { background-color: #3b82f6; color: white; transform: scale(1.05); box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5); border-color: #3b82f6; }
        
        /* Mic Animation */
        .mic-btn { transition: all 0.3s ease; }
        .mic-btn.recording { 
            animation: pulse-red 1.5s infinite; 
            background-color: #ef4444; 
            color: white; 
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Modal styling */
        #practice-modal { display: none; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 50; }
        #practice-modal.active { display: flex; animation: fadeIn 0.2s ease-out; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Interactive Sentence Word */
        .interactive-word { cursor: pointer; transition: all 0.2s; border-bottom: 2px solid transparent; }
        .interactive-word:hover { color: #3b82f6; border-bottom: 2px dashed #3b82f6; transform: translateY(-1px); }

        /* Diff Highlight Styles */
        .diff-char { display: inline-block; padding: 0 1px; }
        .char-correct { color: #16a34a; } /* Green */
        .char-missing { color: #dc2626; text-decoration: underline; text-decoration-style: wavy; font-weight: bold; background-color: #fee2e2; border-radius: 4px;} /* Red */
        .char-extra { color: #ea580c; text-decoration: line-through; font-size: 0.8em; opacity: 0.8;} /* Orange */
        
        .word-correct { color: #16a34a; }
        .word-missing { color: #dc2626; text-decoration: line-through; font-weight: bold; background-color: #fee2e2; padding: 0 4px; border-radius: 4px;}
        .word-extra { color: #ea580c; text-decoration: line-through; font-size: 0.8em; background-color: #ffedd5; padding: 0 4px; border-radius: 4px;}
    </style>
</head>
<body class="text-gray-800">

    <!-- Main Content -->
    <div id="main-content">
        <header class="bg-white shadow-sm border-b sticky top-0 z-40">
            <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 text-white p-2 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-black text-gray-800 tracking-tight">English Coach</h1>
                        <p id="welcome-message" class="text-xs text-gray-500 font-medium">Sẵn sàng luyện tập!</p>
                    </div>
                </div>
                
                <!-- Theo dõi tiến độ học tập -->
                <div class="flex items-center gap-3">
                    <div class="text-right hidden sm:block">
                        <p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Tiến độ</p>
                        <p id="progress-text" class="text-sm font-extrabold text-blue-600">0 / 0 từ</p>
                    </div>
                    <div class="w-16 sm:w-24 h-2.5 bg-gray-100 rounded-full overflow-hidden border border-gray-200 shadow-inner">
                        <div id="progress-bar" class="h-full bg-blue-500 transition-all duration-700 ease-out" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </header>

        <main class="container mx-auto px-4 py-8 max-w-5xl">
            
            <!-- Phoneme Selector -->
            <section class="mb-8 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                 <h2 class="text-lg font-bold mb-4 text-gray-800 flex items-center gap-2">
                     <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                     Chọn âm cần luyện tập
                </h2>
                 <div id="phoneme-navigation" class="space-y-6"></div>
            </section>

            <!-- Word List Area -->
            <section id="phoneme-content-display" class="mb-12">
                <!-- Nội dung danh sách từ sẽ hiển thị ở đây -->
            </section>

        </main>
    </div>

    <!-- Practice Modal (Elsa Style) -->
    <div id="practice-modal" class="fixed inset-0 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden relative flex flex-col max-h-[95vh]">
            
            <!-- Review Navigation -->
            <div id="review-nav" class="hidden bg-blue-600 text-white px-4 py-3 flex justify-between items-center shadow-md z-20">
                <button id="review-prev" class="px-3 py-1 bg-blue-700 hover:bg-blue-800 rounded-lg flex items-center gap-1 transition text-sm font-medium">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> Trước
                </button>
                <div class="font-bold tracking-widest text-sm bg-blue-800/50 px-3 py-1 rounded-full" id="review-counter">1/8</div>
                <button id="review-next" class="px-3 py-1 bg-blue-700 hover:bg-blue-800 rounded-lg flex items-center gap-1 transition text-sm font-medium">
                    Tiếp <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>

            <!-- Close btn -->
            <button id="close-modal" class="absolute top-4 right-4 text-gray-400 hover:text-red-500 bg-gray-100 hover:bg-red-50 rounded-full p-2 z-30 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <div class="p-6 md:p-8 overflow-y-auto" id="modal-scroll-area">
                <div class="text-center mb-6 mt-2">
                    <span id="modal-phoneme-badge" class="inline-block bg-blue-100 text-blue-800 font-mono font-bold px-3 py-1 rounded-full text-sm mb-2 shadow-sm border border-blue-200">/i:/</span>
                    <h2 id="modal-word" class="text-5xl font-black text-gray-800 mb-2 tracking-tight">sheep</h2>
                    <p id="modal-transcription" class="text-xl text-gray-500 font-mono mb-1">/ʃiːp/</p>
                    <p id="modal-meaning" class="text-md text-blue-600 font-medium">con cừu</p>
                </div>

                <!-- Theory Box -->
                <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-8 shadow-sm">
                    <h4 class="text-amber-800 font-bold mb-1 text-sm flex items-center gap-2 uppercase tracking-wider">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Mẹo phát âm
                    </h4>
                    <p id="modal-theory" class="text-amber-900 text-sm leading-relaxed">Hướng dẫn phát âm chi tiết sẽ ở đây.</p>
                </div>

                <!-- Word Practice Section -->
                <div class="bg-gray-50 rounded-3xl p-6 mb-6 border border-gray-100 text-center relative shadow-sm">
                    <h3 class="text-xs font-black text-gray-400 uppercase tracking-wider mb-4 absolute top-4 left-6">Bước 1: Luyện Từ</h3>
                    
                    <div class="flex justify-center items-center gap-6 mt-6">
                        <button id="listen-word-btn" class="speak-icon flex items-center justify-center bg-white p-4 rounded-full shadow border hover:border-blue-500 hover:shadow-md" title="Nghe mẫu">
                            <svg fill="currentColor" viewBox="0 0 24 24"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.66 1.905H6.44l4.5 4.5c.945.945 2.56.276 2.56-1.06V4.06ZM18.584 5.106a.75.75 0 0 1 1.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 0 1-1.06-1.06 8.25 8.25 0 0 0 0-11.668.75.75 0 0 1 0-1.06Z" /><path d="M15.932 7.757a.75.75 0 0 1 1.061 0 6 6 0 0 1 0 8.486.75.75 0 0 1-1.06-1.061 4.5 4.5 0 0 0 0-6.364.75.75 0 0 1 0-1.06Z" /></svg>
                        </button>

                        <button id="record-word-btn" class="mic-btn bg-gray-800 hover:bg-gray-900 text-white p-6 rounded-full shadow-lg" title="Nhấn để đọc">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                        </button>
                    </div>

                    <!-- Result Area Word -->
                    <div id="word-result-area" class="mt-8 hidden flex-col items-center w-full bg-white p-4 rounded-2xl border">
                        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full border-4 border-gray-200 mb-3 relative shadow-inner bg-white">
                            <span id="word-score" class="text-2xl font-black">0%</span>
                        </div>
                        <p class="text-xs text-gray-400 mb-1 uppercase tracking-wider font-bold">Phân tích âm thanh</p>
                        <div id="word-detailed-feedback" class="text-4xl mb-2 tracking-widest font-black font-mono"></div>
                        <div id="word-analysis-box" class="w-full mt-2 text-sm text-gray-600 text-left"></div>
                    </div>
                </div>

                <!-- Sentence Practice Section -->
                <div class="bg-blue-50/50 rounded-3xl p-6 border border-blue-100 text-center relative shadow-sm">
                    <h3 class="text-xs font-black text-blue-400 uppercase tracking-wider mb-4 absolute top-4 left-6">Bước 2: Luyện Câu</h3>
                    
                    <div class="mt-8 mb-6">
                        <p id="modal-sentence" class="text-2xl font-semibold text-gray-800 mb-2 leading-relaxed"></p>
                        <p id="modal-sentence-meaning" class="text-sm text-gray-500 mt-2"></p>
                    </div>

                    <div class="flex justify-center items-center gap-6">
                        <button id="listen-sentence-btn" class="speak-icon flex items-center justify-center bg-white p-4 rounded-full shadow border border-blue-100 hover:border-blue-500 text-blue-600" title="Nghe cả câu">
                            <svg fill="currentColor" viewBox="0 0 24 24"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.66 1.905H6.44l4.5 4.5c.945.945 2.56.276 2.56-1.06V4.06ZM18.584 5.106a.75.75 0 0 1 1.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 0 1-1.06-1.06 8.25 8.25 0 0 0 0-11.668.75.75 0 0 1 0-1.06Z" /><path d="M15.932 7.757a.75.75 0 0 1 1.061 0 6 6 0 0 1 0 8.486.75.75 0 0 1-1.06-1.061 4.5 4.5 0 0 0 0-6.364.75.75 0 0 1 0-1.06Z" /></svg>
                        </button>

                        <button id="record-sentence-btn" class="mic-btn bg-blue-600 hover:bg-blue-700 text-white p-6 rounded-full shadow-lg" title="Ghi âm cả câu">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                        </button>
                    </div>

                    <!-- Result Area Sentence -->
                    <div id="sentence-result-area" class="mt-8 hidden flex-col items-center w-full bg-white p-4 rounded-2xl border border-blue-100">
                        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full border-4 border-gray-200 mb-3 bg-white">
                            <span id="sentence-score" class="text-xl font-black">0%</span>
                        </div>
                        <p class="text-xs text-gray-400 mb-2 uppercase tracking-wider font-bold">Phân tích câu</p>
                        <div id="sentence-detailed-feedback" class="text-xl mb-2 tracking-wide font-medium leading-relaxed bg-gray-50 p-4 rounded-xl border border-gray-100 w-full"></div>
                        <div id="sentence-analysis-box" class="w-full mt-2 text-sm text-left"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

<script type="module">
        // --- Core App Logic ---
        function initializeAppContent() {
            // Dữ liệu nâng cao ĐẦY ĐỦ 44 ÂM
            const phoneticsData = {
                "Nguyên âm đơn (Monophthongs)": {
                    '/i:/': {
                        description: 'Âm i dài: Miệng mở rộng sang hai bên như đang mỉm cười, căng cơ miệng. Âm kéo dài.',
                        words: [ 
                            { word: "sheep", transcription: "/ʃiːp/", meaning: "con cừu", theory: "Kéo dài âm /i:/, nhớ chu môi ở âm /ʃ/ đầu tiên.", sentence: "Look at that fluffy white sheep.", sentenceMeaning: "Nhìn con cừu trắng lông xù kia kìa." }, 
                            { word: "eat", transcription: "/iːt/", meaning: "ăn", theory: "Căng miệng cho âm /i:/, kết thúc bằng âm /t/ nhẹ.", sentence: "I want to eat a big apple.", sentenceMeaning: "Tôi muốn ăn một quả táo lớn." },
                            { word: "see", transcription: "/siː/", meaning: "nhìn", theory: "Xì hơi âm /s/ rồi kéo dài âm /i:/ rạng rỡ.", sentence: "I can see the ocean from here.", sentenceMeaning: "Tôi có thể nhìn thấy đại dương từ đây." },
                            { word: "meet", transcription: "/miːt/", meaning: "gặp gỡ", theory: "Mím môi /m/ rồi căng mép kéo dài /i:/.", sentence: "It is nice to meet you.", sentenceMeaning: "Rất vui được gặp bạn." },
                            { word: "read", transcription: "/riːd/", meaning: "đọc", theory: "Chu môi /r/, kéo dài /i:/ và rung nhẹ âm /d/.", sentence: "I read a book every night.", sentenceMeaning: "Tôi đọc sách mỗi đêm." },
                            { word: "green", transcription: "/ɡriːn/", meaning: "màu xanh", theory: "Lướt nhanh /gr/, ngân dài /i:/ và kết thúc ở /n/ mũi.", sentence: "The grass is very green today.", sentenceMeaning: "Hôm nay cỏ rất xanh." },
                            { word: "key", transcription: "/kiː/", meaning: "chìa khóa", theory: "Bật hơi /k/ từ cuống họng, kéo dài /i:/.", sentence: "Where is my car key?", sentenceMeaning: "Chìa khóa xe của tôi ở đâu?" },
                            { word: "team", transcription: "/tiːm/", meaning: "đội", theory: "Bật /t/, kéo dài /i:/ và mím môi /m/ ở cuối.", sentence: "We are a great team.", sentenceMeaning: "Chúng ta là một đội tuyệt vời." }
                        ]
                    },
                    '/ɪ/': {
                        description: 'Âm i ngắn: Miệng mở tự nhiên, hơi hẹp. Âm phát ra dứt khoát, ngắn gọn.',
                        words: [ 
                            { word: "ship", transcription: "/ʃɪp/", meaning: "con tàu", theory: "Đọc dứt khoát âm /ɪ/, không kéo dài. Khác biệt rõ với 'sheep'.", sentence: "The ship is sailing on the ocean.", sentenceMeaning: "Con tàu đang căng buồm trên đại dương." }, 
                            { word: "sit", transcription: "/sɪt/", meaning: "ngồi", theory: "Âm /s/ xì nhẹ, theo sau là âm /ɪ/ dứt khoát và chặn hơi âm /t/.", sentence: "Please sit down on this chair.", sentenceMeaning: "Làm ơn hãy ngồi xuống chiếc ghế này." },
                            { word: "fish", transcription: "/fɪʃ/", meaning: "con cá", theory: "Răng cắn nhẹ môi dưới tạo âm /f/, âm /ɪ/ ngắn và xì /ʃ/.", sentence: "He caught a very big fish.", sentenceMeaning: "Anh ấy đã bắt được một con cá rất to." },
                            { word: "big", transcription: "/bɪg/", meaning: "to lớn", theory: "Rung thanh quản ở cả /b/ và /g/, kẹp giữa là âm /ɪ/ dứt khoát.", sentence: "That is a big house.", sentenceMeaning: "Đó là một ngôi nhà lớn." },
                            { word: "live", transcription: "/lɪv/", meaning: "sống", theory: "Âm /ɪ/ cực ngắn, răng trên cắn môi dưới rung /v/ ở cuối.", sentence: "Where do you live?", sentenceMeaning: "Bạn sống ở đâu?" },
                            { word: "rich", transcription: "/rɪtʃ/", meaning: "giàu có", theory: "Kết thúc từ bằng cách giật mạnh môi tạo âm /tʃ/.", sentence: "He is a rich man.", sentenceMeaning: "Anh ấy là một người đàn ông giàu có." },
                            { word: "city", transcription: "/ˈsɪti/", meaning: "thành phố", theory: "Nhấn mạnh âm /sɪ/ đầu tiên thật gọn gàng.", sentence: "I love this beautiful city.", sentenceMeaning: "Tôi yêu thành phố xinh đẹp này." },
                            { word: "pig", transcription: "/pɪg/", meaning: "con lợn", theory: "Bật hơi /p/ mạnh, âm /ɪ/ ngắn và rung yết hầu /g/.", sentence: "The pig is eating now.", sentenceMeaning: "Con lợn đang ăn bây giờ." }
                        ]
                    },
                    '/e/': {
                        description: 'Miệng mở tự nhiên, lưỡi hạ thấp. Giống âm "e" trong tiếng Việt nhưng dứt khoát hơn.',
                        words: [
                            { word: "bed", transcription: "/bed/", meaning: "cái giường", theory: "Giữ miệng mở tự nhiên, phát âm /e/ ngắn dứt khoát.", sentence: "I sleep in a big bed.", sentenceMeaning: "Tôi ngủ trên một chiếc giường lớn." },
                            { word: "pen", transcription: "/pen/", meaning: "cái bút", theory: "Bật hơi mạnh âm /p/, kết hợp âm /e/ và ngân nhẹ âm mũi /n/.", sentence: "This is my favorite pen.", sentenceMeaning: "Đây là cây bút yêu thích của tôi." },
                            { word: "head", transcription: "/hed/", meaning: "cái đầu", theory: "Đẩy hơi nhẹ cho âm /h/, nối nhanh vào /e/ và chặn lại ở /d/.", sentence: "My head hurts today.", sentenceMeaning: "Hôm nay đầu tôi bị đau." },
                            { word: "red", transcription: "/red/", meaning: "màu đỏ", theory: "Tròn môi âm /r/, lướt nhanh qua /e/.", sentence: "She wears a red dress.", sentenceMeaning: "Cô ấy mặc một chiếc váy đỏ." },
                            { word: "ten", transcription: "/ten/", meaning: "số mười", theory: "Bật lưỡi mạnh /t/, vào ngay âm /e/ dứt khoát.", sentence: "I have ten apples.", sentenceMeaning: "Tôi có mười quả táo." },
                            { word: "friend", transcription: "/frend/", meaning: "bạn bè", theory: "Tổ hợp phụ âm /fr/ cần đọc lướt nhanh trước khi vào /e/.", sentence: "He is my best friend.", sentenceMeaning: "Anh ấy là bạn thân nhất của tôi." },
                            { word: "check", transcription: "/tʃek/", meaning: "kiểm tra", theory: "Giật môi âm /tʃ/ đầu, và khậc nhẹ âm /k/ ở cuối.", sentence: "Please check your email.", sentenceMeaning: "Vui lòng kiểm tra email của bạn." },
                            { word: "letter", transcription: "/ˈletər/", meaning: "lá thư", theory: "Nhấn mạnh âm /le/ dứt khoát.", sentence: "I sent a letter to him.", sentenceMeaning: "Tôi đã gửi một lá thư cho anh ấy." }
                        ]
                    },
                    '/æ/': {

            // --- HỆ THỐNG AUDIO NATIVE ---
            const speechService = {

            // --- THUẬT TOÁN LCS (Longest Common Subsequence) ĐỂ TÌM DIFF ---
            function getDiff(expectedArr, spokenArr) {
                const n = expectedArr.length;
                const m = spokenArr.length;
                const dp = Array(n + 1).fill(null).map(() => Array(m + 1).fill(0));

                for (let i = 1; i <= n; i++) {
                    for (let j = 1; j <= m; j++) {
                        if (expectedArr[i - 1].toLowerCase() === spokenArr[j - 1].toLowerCase()) {
                            dp[i][j] = dp[i - 1][j - 1] + 1;
                        } else {
                            dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                        }
                    }
                }

                let i = n, j = m;
                const diff = [];
                while (i > 0 || j > 0) {
                    if (i > 0 && j > 0 && expectedArr[i - 1].toLowerCase() === spokenArr[j - 1].toLowerCase()) {
                        diff.unshift({ type: 'correct', value: expectedArr[i - 1] });
                        i--; j--;
                    } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
                        diff.unshift({ type: 'extra', value: spokenArr[j - 1] });
                        j--;
                    } else if (i > 0 && (j === 0 || dp[i][j - 1] < dp[i - 1][j])) {
                        diff.unshift({ type: 'missing', value: expectedArr[i - 1] });
                        i--;
                    }
                }
                return diff;
            }

            // --- PHÂN TÍCH LỖI CHUYÊN SÂU THEO ÂM ---
            function getDetailedFeedback(expected, spoken, type) {
                const cleanExpected = expected.replace(/[.,!?]/g, "").trim();
                const cleanSpoken = spoken.replace(/[.,!?]/g, "").trim();

                let html = "";
                let score = 0;
                let analysis = "";

                if (type === 'word') {
                    const spokenWord = cleanSpoken.split(" ")[0] || ""; 
                    const expectedChars = cleanExpected.split('');
                    const spokenChars = spokenWord.split('');

                    const diffs = getDiff(expectedChars, spokenChars);
                    
                    // Logic phân tách phụ âm đầu, nguyên âm, phụ âm cuối
                    const vowelsList = ['a', 'e', 'i', 'o', 'u', 'y'];
                    const expLower = cleanExpected.toLowerCase();
                    let firstVowelIdx = -1;
                    let lastVowelIdx = -1;
                    
                    // Tìm vị trí nhóm nguyên âm
                    for (let k = 0; k < expLower.length; k++) {
                        if (vowelsList.includes(expLower[k])) {
                            if (firstVowelIdx === -1) firstVowelIdx = k;
                            lastVowelIdx = k;
                        }
                    }

                    let correctChars = 0;
                    let expIdx = 0;
                    
                    let initialErrors = [];
                    let vowelErrors = [];
                    let finalErrors = [];
                    let extraErrors = [];

                    diffs.forEach(d => {
                        if (d.type === 'correct') {
                            html += `<span class="diff-char char-correct">${d.value}</span>`;
                            correctChars++;
                            expIdx++;
                        } else if (d.type === 'missing') {
                            html += `<span class="diff-char char-missing" title="Thiếu âm này">${d.value}</span>`;
                            
                            // Phân loại lỗi
                            const charLower = d.value.toLowerCase();
                            if (vowelsList.includes(charLower)) {
                                vowelErrors.push(d.value);
                            } else {
                                if (expIdx <= firstVowelIdx || firstVowelIdx === -1) {
                                    initialErrors.push(d.value);
                                } else if (expIdx > lastVowelIdx) {
                                    finalErrors.push(d.value);
                                } else {
                                    vowelErrors.push(d.value); // Lỗi phụ âm giữa từ
                                }
                            }
                            expIdx++;
                        } else if (d.type === 'extra') {
                            extraErrors.push(d.value);
                        }
                    });

                    score = expectedChars.length > 0 ? Math.round((correctChars / expectedChars.length) * 100) : 0;
                    
                    if (score < 100 && spokenWord.length > 0) {
                        analysis = `<div class="mb-3 text-sm text-gray-700 font-medium">Hệ thống nhận diện thành: <strong class="text-red-600 bg-red-50 px-2 py-0.5 rounded border border-red-100 uppercase tracking-widest">"${spokenWord}"</strong></div>`;
                        analysis += `<ul class="space-y-3">`;
                        
                        if (initialErrors.length > 0) {
                            analysis += `<li class="flex items-start gap-3 bg-white p-3 rounded-xl border-l-4 border-red-400 shadow-sm">
                                <span class="text-red-500 mt-0.5 text-lg">🎯</span>
                                <div><strong class="text-gray-800 block mb-1">Lỗi Phụ Âm Đầu (Initial Consonant):</strong> Bạn đọc sai hoặc thiếu âm <strong class="text-red-600 bg-red-50 px-1.5 py-0.5 rounded">"${initialErrors.join('')}"</strong> ở đầu từ.</div>
                            </li>`;
                        }
                        if (vowelErrors.length > 0) {
                            analysis += `<li class="flex items-start gap-3 bg-white p-3 rounded-xl border-l-4 border-orange-400 shadow-sm">
                                <span class="text-orange-500 mt-0.5 text-lg">👄</span>
                                <div><strong class="text-gray-800 block mb-1">Lỗi Nguyên Âm (Vowels):</strong> Khẩu hình miệng của âm <strong class="text-orange-600 bg-orange-50 px-1.5 py-0.5 rounded">"${vowelErrors.join('')}"</strong> chưa chuẩn xác.</div>
                            </li>`;
                        }
                        if (finalErrors.length > 0) {
                            analysis += `<li class="flex items-start gap-3 bg-white p-3 rounded-xl border-l-4 border-purple-500 shadow-sm">
                                <span class="text-purple-500 mt-0.5 text-lg">🛑</span>
                                <div><strong class="text-gray-800 block mb-1">Lỗi Phụ Âm Cuối (Ending Sound):</strong> Bạn đã quên bật đuôi âm <strong class="text-purple-600 bg-purple-50 px-1.5 py-0.5 rounded">"${finalErrors.join('')}"</strong>. Cố gắng chặn hơi hoặc bật nhẹ cuối câu nhé.</div>
                            </li>`;
                        }
                        if (finalErrors.length === 0 && extraErrors.length > 0 && expIdx > lastVowelIdx) {
                            analysis += `<li class="flex items-start gap-3 bg-white p-3 rounded-xl border-l-4 border-yellow-400 shadow-sm">
                                <span class="text-yellow-600 mt-0.5 text-lg">💡</span>
                                <div><strong class="text-gray-800 block mb-1">Lỗi Dư Âm:</strong> Bạn có xu hướng xì thêm hoặc nối âm <strong class="text-yellow-600 bg-yellow-50 px-1.5 py-0.5 rounded">"${extraErrors.join('')}"</strong> không cần thiết.</div>
                            </li>`;
                        }
                        
                        analysis += `</ul>`;
                    } else if (spokenWord === "") {
                        analysis = "Chưa nghe thấy âm thanh. Vui lòng đọc lớn hơn.";
                    } else {
                        analysis = `<div class="text-green-600 font-bold flex items-center gap-2 mt-2"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Tuyệt vời! Bạn phát âm rất chuẩn xác cả âm đầu, giữa và cuối.</div>`;
                    }

                } else {
                    // DIFF THEO TỪ (Dành cho Câu) - Vẫn giữ nguyên phân tích độ mượt
                    const expectedWords = cleanExpected.split(/\s+/);
                    const spokenWords = cleanSpoken.split(/\s+/);

                    const diffs = getDiff(expectedWords, spokenWords);
                    
                    let correctWords = 0;
                    diffs.forEach(d => {

                            correctWords++;

                        } else if (d.type === 'extra') {
                            html += `<span class="word-extra inline-block mr-1" title="Bạn đọc dư/nhầm thành từ này">${d.value}</span>`;
                        }
                    });

                    score = expectedWords.length > 0 ? Math.round((correctWords / expectedWords.length) * 100) : 0;
                    
                    if (score < 100 && cleanSpoken.length > 0) {
                        analysis = `<div class="bg-white p-3 rounded-xl border border-red-100">Hệ thống ghi nhận: <span class="italic text-gray-500">"${cleanSpoken}"</span>.<br/><br/>Bạn đã đọc <strong class="text-red-500">sót từ (gạch đỏ)</strong> hoặc <strong class="text-orange-500">dư từ (màu cam nhỏ)</strong>. Hãy chú ý kỹ phần bị gạch bỏ.</div>`;
                    } else if (cleanSpoken.length === 0) {
                        analysis = "Chưa nghe thấy âm thanh. Vui lòng đọc lớn hơn.";
                    } else {
                        analysis = `<div class="text-green-600 font-bold flex items-center gap-2 mt-2"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Độ lưu loát tuyệt vời!</div>`;
                    }
                }

                if(score > 100) score = 100;
                return { html, score, analysis };
            }

            function getScoreColorClass(score) {
                if (score >= 80) return "border-green-500 text-green-600 bg-green-50";

                                    <span class="bg-white text-blue-600 px-4 py-1 rounded-2xl shadow-sm">${phoneme}</span>
                                    <button onclick="window.playUnifiedAudio('${data.words[0].word}')" class="text-white hover:text-blue-100 bg-blue-700/50 p-2 rounded-full cursor-pointer transition-colors backdrop-blur-sm">
                                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.66 1.905H6.44l4.5 4.5c.945.945 2.56.276 2.56-1.06V4.06ZM18.584 5.106a.75.75 0 0 1 1.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 0 1-1.06-1.06 8.25 8.25 0 0 0 0-11.668.75.75 0 0 1 0-1.06Z" /><path d="M15.932 7.757a.75.75 0 0 1 1.061 0 6 6 0 0 1 0 8.486.75.75 0 0 1-1.06-1.061 4.5 4.5 0 0 0 0-6.364.75.75 0 0 1 0-1.06Z" /></svg>
                                    </button>
                                </h3>
                                <p class="text-blue-100 text-sm md:text-base font-medium max-w-xl leading-relaxed">${data.description}</p>
                            </div>
                            <button id="start-review-btn" class="bg-white text-blue-600 hover:bg-blue-50 px-6 py-3 rounded-xl font-black shadow-md flex items-center justify-center gap-2 transition-transform hover:scale-105 whitespace-nowrap">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                                Ôn tập âm này
                            </button>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${wordsHtml}
                    </div>
                `;

                contentContainer.querySelectorAll('.card').forEach(card => {
                    card.addEventListener('click', () => {
                        const idx = parseInt(card.dataset.idx);
                        openPracticeModal(phoneme, data.words[idx], false, data.words, idx);
                    });
                });

                document.getElementById('start-review-btn').addEventListener('click', () => {
                    openPracticeModal(phoneme, data.words[0], true, data.words, 0);
                });
            }

            // --- Modal Luyện Tập ---
            const modal = document.getElementById('practice-modal');
            let activeRecordType = null;

            function openPracticeModal(phoneme, wordData, isReview = false, wordsArray = [], index = 0) {
                currentPhonemeContext = phoneme;
                currentWordData = wordData;
                isReviewMode = isReview;
                reviewWords = wordsArray;
                currentReviewIndex = index;
                
                document.getElementById('modal-phoneme-badge').textContent = phoneme;
                document.getElementById('modal-word').textContent = wordData.word;
                document.getElementById('modal-transcription').textContent = wordData.transcription;
                document.getElementById('modal-meaning').textContent = wordData.meaning;
                document.getElementById('modal-theory').textContent = wordData.theory || "Hãy cố gắng phát âm thật rõ ràng.";
                
                const sentenceWords = (wordData.sentence || "").split(" ");
                const interactiveSentenceHtml = sentenceWords.map(w => {
                    const cleanWord = w.replace(/[^a-zA-Z]/g, '');
                    return `<span class="interactive-word inline-block mr-1" onclick="window.playUnifiedAudio('${cleanWord}')" title="Nghe từ: ${cleanWord}">${w}</span>`;
                }).join("");
                
                document.getElementById('modal-sentence').innerHTML = interactiveSentenceHtml;
                document.getElementById('modal-sentence-meaning').textContent = wordData.sentenceMeaning || "";

                document.getElementById('word-result-area').classList.add('hidden');
                document.getElementById('sentence-result-area').classList.add('hidden');
                
                const reviewNav = document.getElementById('review-nav');
                if (isReviewMode && reviewWords.length > 0) {
                    reviewNav.classList.remove('hidden');
                    document.getElementById('review-counter').textContent = `${currentReviewIndex + 1} / ${reviewWords.length}`;
                    
                    const prevBtn = document.getElementById('review-prev');
                    prevBtn.style.visibility = currentReviewIndex > 0 ? 'visible' : 'hidden';
                    
                    const nextBtn = document.getElementById('review-next');
                    if (currentReviewIndex < reviewWords.length - 1) {
                        nextBtn.style.display = 'flex';
                        nextBtn.innerHTML = `Tiếp <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>`;
                    } else {
                        nextBtn.style.display = 'flex';
                        nextBtn.innerHTML = `Hoàn thành <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
                    }
                } else {
                    reviewNav.classList.add('hidden');
                }

                modal.classList.add('active');
                document.getElementById('modal-scroll-area').scrollTop = 0;
            }

            document.getElementById('review-prev').addEventListener('click', () => {
                if (currentReviewIndex > 0) {
                    openPracticeModal(currentPhonemeContext, reviewWords[currentReviewIndex - 1], true, reviewWords, currentReviewIndex - 1);
                }
            });

            document.getElementById('review-next').addEventListener('click', () => {
                if (currentReviewIndex < reviewWords.length - 1) {
                    openPracticeModal(currentPhonemeContext, reviewWords[currentReviewIndex + 1], true, reviewWords, currentReviewIndex + 1);
                } else {
                    modal.classList.remove('active');
                    alert(`Tuyệt vời! Bạn đã hoàn thành ôn tập âm ${currentPhonemeContext}`);
                }
            });

            document.getElementById('close-modal').addEventListener('click', () => {
                if(isRecording && recognition) recognition.stop();
                if(speechSynthesis) speechSynthesis.cancel();
                modal.classList.remove('active');
            });

            document.getElementById('listen-word-btn').addEventListener('click', (e) => {
                window.playUnifiedAudio(currentWordData.word, e.currentTarget);
            });

            document.getElementById('listen-sentence-btn').addEventListener('click', (e) => {
                window.playUnifiedAudio(currentWordData.sentence, e.currentTarget);
            });

            function startRecording(type) {
                if (!recognition) {
                    alert("Trình duyệt không hỗ trợ nhận diện giọng nói (Khuyên dùng Chrome/Safari mới nhất).");
                    return;
                }
                if (isRecording) {
                    recognition.stop();
                    return;
                }
                
                activeRecordType = type;
                expectedText = type === 'word' ? currentWordData.word : currentWordData.sentence;
                
                document.getElementById(`record-${type}-btn`).classList.add('recording');

                try {
                    recognition.start();
                } catch(e) {
                    stopRecordingUI();
                }
            }

            document.getElementById('record-word-btn').addEventListener('click', () => startRecording('word'));
            document.getElementById('record-sentence-btn').addEventListener('click', () => startRecording('sentence'));

            function stopRecordingUI() {
                document.getElementById('record-word-btn').classList.remove('recording');
                document.getElementById('record-sentence-btn').classList.remove('recording');
            }

            function handleRecognitionResult(transcript) {
                const type = activeRecordType;
                
                const feedback = getDetailedFeedback(expectedText, transcript, type);
                const colorClass = getScoreColorClass(feedback.score);
                
                const area = document.getElementById(`${type}-result-area`);
                const scoreCircle = area.querySelector('div');
                const scoreText = document.getElementById(`${type}-score`);
                const feedbackDisplay = document.getElementById(`${type}-detailed-feedback`);
                const analysisBox = document.getElementById(`${type}-analysis-box`);
                
                area.classList.remove('hidden');
                area.classList.add('flex');
                
                scoreCircle.className = `inline-flex items-center justify-center w-${type==='word'?'20':'16'} h-${type==='word'?'20':'16'} rounded-full border-4 mb-3 relative shadow-inner ${colorClass}`;
                scoreText.textContent = `${feedback.score}%`;
                scoreText.className = `text-${type==='word'?'2xl':'xl'} font-black ${colorClass.split(' ')[1]}`; 
                
                feedbackDisplay.innerHTML = feedback.html;
                
                // Set explicitly for the new beautiful layout
                if (feedback.analysis) {
                    analysisBox.innerHTML = feedback.analysis;
                } else {
                    analysisBox.innerHTML = '';
                }

                if (feedback.score >= 70 && currentWordData) {
                    if (!completedWords.includes(currentWordData.word)) {
                        completedWords.push(currentWordData.word);
                        localStorage.setItem('elsa_completed_words', JSON.stringify(completedWords));
                        updateProgressUI();
                        
                        if(currentCategoryContext && currentPhonemeContext && !isReviewMode) {
                            displayWordList(currentCategoryContext, currentPhonemeContext);
                        }
                    }

                    if(isReviewMode && type === 'word') {
                        // Tự động chuyển hoặc tự đọc câu tùy ý...
                    }
                }
            }

            // --- Khởi tạo ứng dụng ---
            function addPhonemeNavListeners() {
                const buttons = document.querySelectorAll('.phoneme-btn');
                buttons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        buttons.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        displayWordList(btn.dataset.category, btn.dataset.phoneme);
                    });
                });
            }
            
            renderPhonemeNavigation();
            addPhonemeNavListeners();
            
            const firstButton = document.querySelector('.phoneme-btn');
            if(firstButton) firstButton.click();
        }

        document.addEventListener('DOMContentLoaded', initializeAppContent);
    </script>
</body>
</html>
