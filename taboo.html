            // --- FIREBASE STATE ---
            const [user, setUser] = useState(null);
            const [notebook, setNotebook] = useState({});

            // --- APP NAVIGATION STATE ---
            // screens: 'home', 'translate', 'notebook'
            const [screen, setScreen] = useState('home');

            // --- HOME & TRANSLATE STATE ---
            const [theme, setTheme] = useState('all');
            const [shuffledPack, setShuffledPack] = useState([...wordDatabase]);
            const [homeIndex, setHomeIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [selectedWord, setSelectedWord] = useState(null);
            const [viText, setViText] = useState('');
            const [enText, setEnText] = useState('');
            const [isTranslating, setIsTranslating] = useState(false);

            // --- UTILS ---
            const shuffle = (array) => {
                let res = [...array];
                for (let i = res.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [res[i], res[j]] = [res[j], res[i]];
                }
                return res;
            };

            useEffect(() => {
                const initVoices = () => window.speechSynthesis.getVoices();
                initVoices();
                if (window.speechSynthesis.onvoiceschanged !== undefined) {
                    window.speechSynthesis.onvoiceschanged = initVoices;
                }
            }, []);

            const getNaturalVoice = useCallback(() => {
                if (!window.speechSynthesis) return null;
                const voices = window.speechSynthesis.getVoices();
                if (!voices.length) return null;

                const preferredNames = [
                    'Google US English', 'Google UK English Female', 
                    'Samantha', 'Daniel', 'Karen', 'Moira', 'Tessa',
                    'Microsoft Aria Online (Natural) - English (United States)',
                    'Microsoft Guy Online (Natural) - English (United States)',
                    'en-US-Network'
                ];

                for (const name of preferredNames) {
                    const voice = voices.find(v => v.name === name);
                    if (voice) return voice;
                }

                const premiumVoice = voices.find(v => 
                    v.lang.startsWith('en') && 
                    (v.name.includes('Natural') || v.name.includes('Online') || v.name.includes('Premium'))
                );
                if (premiumVoice) return premiumVoice;

                return voices.find(v => v.lang === 'en-US') || voices.find(v => v.lang.startsWith('en')) || voices[0];
            }, []);

            const speak = useCallback((text) => {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                const bestVoice = getNaturalVoice();
                
                if (bestVoice) {
                    utterance.voice = bestVoice;
                }
                
                utterance.rate = 0.9;
                utterance.pitch = 1.0;

                window.speechSynthesis.speak(utterance);
            }, [getNaturalVoice]);

            // --- FIREBASE EFFECT ---
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        console.error("Lỗi xác thực:", error);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const notebookRef = collection(db, 'artifacts', appId, 'users', user.uid, 'notebook');
                const unsubscribe = onSnapshot(notebookRef, (snapshot) => {
                    const data = {};
                    snapshot.forEach(doc => {
                        data[doc.id] = doc.data();
                    });
                    setNotebook(data);
                }, (error) => console.error("Lỗi tải Sổ tay:", error));
                
                return () => unsubscribe();
            }, [user]);

            // --- THEME HANDLER ---
            useEffect(() => {
                const filtered = theme === 'all' ? wordDatabase : wordDatabase.filter(w => w.category === theme);
                setShuffledPack(shuffle(filtered));
                setHomeIndex(0);
                setIsFlipped(false);
            }, [theme]);

            // --- TRANSLATE HANDLER ---
            const handleTranslate = async () => {
                if (!viText.trim()) return;
                setIsTranslating(true);
                try {
                    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=vi&tl=en&dt=t&q=${encodeURIComponent(viText)}`;
                    const response = await fetch(url);
                    const data = await response.json();
                    const translatedText = data[0].map(item => item[0]).join('');
                    setEnText(translatedText);

                    if (user && selectedWord) {
                        const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'notebook', selectedWord.keyword);
                        await setDoc(docRef, {
                            keyword: selectedWord.keyword,
                            category: selectedWord.category,
                            vi: viText,
                            en: translatedText,
                            timestamp: Date.now()
                        }, { merge: true });
                    }
                } catch (error) {
                    console.error(error);
                    alert("Lỗi dịch thuật. Vui lòng kiểm tra lại kết nối mạng!");
                } finally {
                    setIsTranslating(false);
                }
            };

            const openTranslate = (word) => {
                setSelectedWord(word);
                if (notebook[word.keyword]) {
                    setViText(notebook[word.keyword].vi || '');
                    setEnText(notebook[word.keyword].en || '');
                } else {
                    setViText('');
                    setEnText('');
                }
                setScreen('translate');
            };

            const currentHomeWord = shuffledPack[homeIndex];
            const themes = [...new Set(wordDatabase.map(w => w.category))];

            return (
                <div className="max-w-md mx-auto w-full p-4 min-h-screen flex flex-col justify-center">

                    {/* ================= HOME SCREEN ================= */}
                    {screen === 'home' && currentHomeWord && (
                        <div className="glass-panel p-5 flex flex-col animate-in fade-in duration-500">
                            <div className="flex justify-between items-center mb-6">
                                <div>
                                    <h1 className="text-2xl font-black text-blue-300 uppercase tracking-wide">Vocab Master</h1>
                                    <p className="text-xs text-slate-300 mt-1 font-medium">Học từ vựng & Dịch ý tưởng</p>
                                </div>
                                <button onClick={() => setScreen('notebook')} className="bg-white/10 hover:bg-white/20 p-2.5 rounded-xl flex items-center gap-2 transition-all border border-white/10">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="text-amber-300"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                                </button>
                            </div>
                            
                            <select value={theme} onChange={(e) => setTheme(e.target.value)} className="w-full bg-slate-800/80 border border-slate-600 text-white py-3.5 px-4 rounded-xl text-lg font-bold shadow-inner outline-none mb-6">
                                <option value="all">🌟 Tất cả chủ đề ({wordDatabase.length} từ)</option>
                                {themes.map(t => <option key={t} value={t}>📚 {t}</option>)}
                            </select>

                            <div className="perspective-1000 h-96 w-full cursor-pointer relative mb-6" onClick={() => setIsFlipped(!isFlipped)}>
                                <div className={`w-full h-full transition-transform duration-500 preserve-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                                    <div className="absolute w-full h-full backface-hidden bg-white text-slate-900 rounded-[2rem] p-6 flex flex-col items-center shadow-xl border-t-8 border-blue-500">
                                        <div className="w-full h-28 mb-4 rounded-xl bg-slate-50 flex items-center justify-center overflow-hidden">
                                            <img src={`https://tse2.mm.bing.net/th?q=${encodeURIComponent(currentHomeWord.keyword + " simple cartoon vector illustration")}&w=300&h=300&c=7&rs=1&p=0`} className="h-full object-contain mix-blend-multiply opacity-90" alt="Illustration" />
                                        </div>
                                        <div className="flex gap-3 items-center mb-1 w-full justify-center">
                                            <h2 className="text-[28px] font-black text-slate-800 truncate uppercase tracking-tight">{currentHomeWord.keyword}</h2>
                                            <button onClick={(e) => { e.stopPropagation(); speak(currentHomeWord.keyword); }} className="p-2.5 bg-blue-100 hover:bg-blue-200 rounded-full text-blue-600 transition-colors shadow-sm active:scale-95">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                                            </button>
                                        </div>
                                        <p className="text-slate-400 font-mono font-medium mb-3">{currentHomeWord.ipa}</p>
                                        
                                        <div className="w-full bg-slate-100 rounded-xl p-3 mt-auto">
                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-widest text-center mb-2">Từ khóa liên quan</p>
                                            <div className="flex flex-wrap justify-center gap-1.5">
                                                {currentHomeWord.taboo.map((w, i) => (
                                                    <span key={i} className="text-sm font-bold text-slate-600 bg-white px-2.5 py-1 rounded-md shadow-sm border border-slate-200">{w}</span>
                                                ))}
                                            </div>
                                        </div>
                                        <p className="mt-4 text-xs text-blue-400 font-semibold animate-pulse">Chạm vào thẻ để xem nghĩa Tiếng Việt</p>
                                    </div>

                                    <div className="absolute w-full h-full backface-hidden bg-slate-800 text-white rounded-[2rem] p-6 flex flex-col items-center justify-center shadow-xl rotate-y-180 border-t-8 border-indigo-500">
                                        <h2 className="text-4xl font-black text-indigo-300 uppercase mb-8 text-center leading-tight">{currentHomeWord.vietnamese_keyword}</h2>
                                        
                                        <div className="w-full bg-slate-700/50 rounded-xl p-4">
                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-widest text-center mb-3">Nghĩa của từ khóa liên quan</p>
                                            <div className="flex flex-wrap justify-center gap-2">
                                                {currentHomeWord.vietnamese_taboo.map((w, i) => (
                                                    <span key={i} className="text-base font-bold text-white bg-slate-600 px-3 py-1.5 rounded-lg">{w}</span>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="flex gap-4 mb-4">
                                <button onClick={() => { setHomeIndex((homeIndex - 1 + shuffledPack.length) % shuffledPack.length); setIsFlipped(false); }} className="flex-1 bg-white/10 hover:bg-white/20 py-3.5 rounded-xl font-bold transition-all border border-white/5 flex items-center justify-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                                    TRƯỚC
                                </button>
                                <button onClick={() => { setHomeIndex((homeIndex + 1) % shuffledPack.length); setIsFlipped(false); }} className="flex-1 bg-white/10 hover:bg-white/20 py-3.5 rounded-xl font-bold transition-all border border-white/5 flex items-center justify-center gap-2">
                                    TIẾP
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                                </button>
                            </div>
                            
                            <button onClick={() => openTranslate(currentHomeWord)} className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 py-4 rounded-xl font-black uppercase text-lg shadow-lg flex items-center justify-center gap-2 transition-all active:scale-[0.98]">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
                                Dịch & Lưu Sổ Tay
                            </button>
                        </div>
                    )}

                    {/* ================= TRANSLATE SCREEN ================= */}
                    {screen === 'translate' && selectedWord && (
                        <div className="glass-panel p-6 flex flex-col h-[90vh] animate-in fade-in slide-in-from-bottom-4 duration-300">
                            <div className="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
                                <button onClick={() => setScreen('home')} className="p-2.5 bg-white/10 hover:bg-white/20 rounded-xl transition-all">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                                </button>
                                <h2 className="text-xl font-black uppercase tracking-wider">Trợ Lý Dịch</h2>
                                <button onClick={() => setScreen('notebook')} className="p-2.5 bg-white/10 hover:bg-white/20 rounded-xl transition-all text-amber-400">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                                </button>
                            </div>

                            <div className="bg-gradient-to-r from-blue-900/50 to-indigo-900/50 border border-blue-500/30 p-5 rounded-[1.5rem] mb-6 text-center shadow-inner">
                                <p className="text-[11px] text-blue-300 font-bold uppercase tracking-widest mb-1">Từ vựng mục tiêu</p>
                                <h3 className="text-2xl font-black text-white">
                                    {selectedWord.keyword}
                                </h3>
                                <p className="text-sm font-medium text-indigo-300 mt-1">({selectedWord.vietnamese_keyword})</p>
                            </div>

                            <div className="flex flex-col gap-5 flex-grow">
                                <div className="bg-white rounded-2xl p-4 shadow-sm relative">
                                    <span className="absolute -top-2.5 left-4 bg-blue-500 text-white text-[10px] font-black uppercase tracking-widest px-2 py-0.5 rounded-md shadow-sm">Ý tưởng Tiếng Việt</span>
                                    <textarea 
                                        value={viText}
                                        onChange={(e) => setViText(e.target.value)}
                                        placeholder="Viết một câu tiếng Việt có chứa từ này..."
                                        className="w-full h-28 bg-transparent outline-none text-slate-800 resize-none font-medium text-base pt-2 placeholder:text-slate-400"
                                    />
                                </div>

                                <button 
                                    onClick={handleTranslate} 
                                    disabled={!viText.trim() || isTranslating}
                                    className="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-black text-[15px] uppercase tracking-wide transition-all disabled:opacity-50 flex items-center justify-center gap-2 shadow-lg shadow-blue-900/20 active:scale-[0.98]"
                                >
                                    {isTranslating ? (
                                        <>
                                            <svg className="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                            ĐANG DỊCH...
                                        </>
                                    ) : (
                                        <>
                                            DỊCH & LƯU VÀO SỔ TAY
                                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
                                        </>
                                    )}
                                </button>

                                <div className="bg-slate-800/80 rounded-2xl p-5 border-2 border-slate-700 flex-grow overflow-y-auto relative custom-scrollbar">
                                    <span className="absolute -top-2.5 left-4 bg-slate-600 text-white text-[10px] font-black uppercase tracking-widest px-2 py-0.5 rounded-md">Bản dịch Tiếng Anh</span>
                                    {!enText ? (
                                        <div className="flex flex-col items-center justify-center h-full text-slate-500">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="mb-2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                                            <p className="italic text-sm">Bản dịch sẽ xuất hiện ở đây</p>
                                        </div>
                                    ) : (
                                        <div className="pt-2">
                                            <p className="text-[17px] font-medium leading-relaxed text-blue-50">
                                                {enText.split(/(\s+)/).map((segment, idx) => {
                                                    if (/\s+/.test(segment)) return <span key={idx}>{segment}</span>;
                                                    return (
                                                        <span 
                                                            key={idx} 
                                                            onClick={() => speak(segment.replace(/[.,!?]/g, ''))} 
                                                            className="clickable-word hover:text-blue-300 transition-colors"
                                                        >
                                                            {segment}
                                                        </span>
                                                    );
                                                })}
                                            </p>
                                        </div>
                                    )}
                                </div>
                                
                                <div className="bg-blue-900/30 border border-blue-800/50 rounded-xl p-3 flex items-center gap-3 text-blue-200">
                                    <div className="bg-blue-800/80 p-2 rounded-full text-blue-300">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M5 18v-6a6 6 0 0 1 12 0v6"/><path d="M12 2v4"/><path d="M12 13v9"/></svg>
                                    </div>
                                    <p className="text-[12px] font-medium leading-snug">
                                        <strong className="text-blue-100 block mb-0.5">Mẹo luyện nói:</strong> Chạm vào từng từ tiếng Anh ở trên để nghe phát âm.
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ================= NOTEBOOK SCREEN ================= */}
                    {screen === 'notebook' && (
                        <div className="glass-panel p-6 flex flex-col h-[90vh] animate-in fade-in slide-in-from-bottom-4 duration-300">
                            <div className="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
                                <h2 className="text-2xl font-black uppercase flex items-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="text-amber-400"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                                    Sổ Tay
                                </h2>
                                <button onClick={() => setScreen('home')} className="p-2.5 bg-white/10 hover:bg-white/20 rounded-xl transition-all">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                                </button>
                            </div>

                            <div className="overflow-y-auto pr-2 space-y-4 flex-grow custom-scrollbar">
                                {Object.keys(notebook).length === 0 ? (
                                    <div className="flex flex-col items-center justify-center h-full opacity-60">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="mb-4 text-slate-400"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                                        <p className="font-bold text-lg mb-1">Sổ tay trống</p>
                                        <p className="text-sm text-center px-4">Hãy dùng tính năng "Dịch & Lưu Sổ Tay" ở thẻ từ vựng để tạo ghi chú nhé.</p>
                                    </div>
                                ) : (
                                    Object.values(notebook).sort((a, b) => b.timestamp - a.timestamp).map((item, idx) => (
                                        <div key={idx} className="bg-slate-800/80 p-5 rounded-2xl border border-slate-700 shadow-md relative overflow-hidden group">
                                            <div className="absolute top-0 left-0 w-1.5 h-full bg-amber-400"></div>
                                            <div className="flex justify-between items-start mb-3 pl-2">
                                                <h4 className="font-black text-amber-400 text-lg uppercase tracking-tight">{item.keyword}</h4>
                                                <span className="text-[10px] bg-slate-700/80 text-slate-300 font-bold uppercase tracking-wider px-2 py-1 rounded-md border border-slate-600">{item.category}</span>
                                            </div>
                                            <div className="pl-2">
                                                <p className="text-[14px] text-slate-300 italic mb-3 pb-3 border-b border-slate-700/50">"{item.vi}"</p>
                                                <p className="font-medium text-white text-[15px] leading-relaxed">
                                                    {item.en.split(/(\s+)/).map((segment, i) => {
                                                        if (/\s+/.test(segment)) return <span key={i}>{segment}</span>;
                                                        return (
                                                            <span 
                                                                key={i} 
                                                                onClick={() => speak(segment.replace(/[.,!?]/g, ''))} 
                                                                className="clickable-word hover:text-amber-300 transition-colors"
                                                                title="Chạm để nghe"
                                                            >
                                                                {segment}
                                                            </span>
                                                        );
                                                    })}
                                                </p>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
