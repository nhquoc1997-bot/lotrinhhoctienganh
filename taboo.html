            { category: 'Kinh doanh', keyword: 'INVESTMENT', ipa: '/ɪnˈvest.mənt/', taboo: ['Money', 'Return', 'Risk', 'Stock', 'Bank'], vietnamese_keyword: 'Sự đầu tư', vietnamese_taboo: ['Tiền bạc', 'Lợi nhuận', 'Rủi ro', 'Cổ phiếu', 'Ngân hàng'] },
            { category: 'Kinh doanh', keyword: 'PROFIT', ipa: '/ˈprɒf.ɪt/', taboo: ['Money', 'Gain', 'Loss', 'Business', 'Revenue'], vietnamese_keyword: 'Lợi nhuận', vietnamese_taboo: ['Tiền bạc', 'Đạt được', 'Thua lỗ', 'Doanh nghiệp', 'Doanh thu'] },
            { category: 'Kinh doanh', keyword: 'BANKRUPTCY', ipa: '/ˈbæŋ.krəpt.si/', taboo: ['Fail', 'Money', 'Close', 'Debt', 'Business'], vietnamese_keyword: 'Phá sản', vietnamese_taboo: ['Thất bại', 'Tiền bạc', 'Đóng cửa', 'Nợ nần', 'Doanh nghiệp'] },
            { category: 'Kinh doanh', keyword: 'STARTUP', ipa: '/ˈstɑːt.ʌp/', taboo: ['New', 'Company', 'Founder', 'Idea', 'Tech'], vietnamese_keyword: 'Khởi nghiệp', vietnamese_taboo: ['Mới', 'Công ty', 'Người sáng lập', 'Ý tưởng', 'Công nghệ'] },
            { category: 'Kinh doanh', keyword: 'MARKETING', ipa: '/ˈmɑː.kɪ.tɪŋ/', taboo: ['Sell', 'Advertise', 'Product', 'Customer', 'Brand'], vietnamese_keyword: 'Tiếp thị', vietnamese_taboo: ['Bán', 'Quảng cáo', 'Sản phẩm', 'Khách hàng', 'Thương hiệu'] },
            { category: 'Kinh doanh', keyword: 'STRATEGY', ipa: '/ˈstræt.ə.dʒi/', taboo: ['Plan', 'Goal', 'Business', 'Win', 'Future'], vietnamese_keyword: 'Chiến lược', vietnamese_taboo: ['Kế hoạch', 'Mục tiêu', 'Doanh nghiệp', 'Chiến thắng', 'Tương lai'] },
            { category: 'Kinh doanh', keyword: 'CONTRACT', ipa: '/ˈkɒn.trækt/', taboo: ['Sign', 'Paper', 'Agreement', 'Lawyer', 'Deal'], vietnamese_keyword: 'Hợp đồng', vietnamese_taboo: ['Ký', 'Tờ giấy', 'Thỏa thuận', 'Luật sư', 'Giao dịch'] },
            { category: 'Kinh doanh', keyword: 'STOCK', ipa: '/stɒk/', taboo: ['Market', 'Share', 'Company', 'Trade', 'Price'], vietnamese_keyword: 'Cổ phiếu', vietnamese_taboo: ['Thị trường', 'Cổ phần', 'Công ty', 'Giao dịch', 'Giá cả'] },
            { category: 'Kinh doanh', keyword: 'NEGOTIATION', ipa: '/nəˌɡəʊ.ʃiˈeɪ.ʃən/', taboo: ['Talk', 'Deal', 'Price', 'Agree', 'Meeting'], vietnamese_keyword: 'Sự đàm phán', vietnamese_taboo: ['Nói chuyện', 'Giao dịch', 'Giá cả', 'Đồng ý', 'Cuộc họp'] },
            { category: 'Kinh doanh', keyword: 'INFLATION', ipa: '/ɪnˈfleɪ.ʃən/', taboo: ['Price', 'Money', 'Rise', 'Economy', 'Value'], vietnamese_keyword: 'Lạm phát', vietnamese_taboo: ['Giá cả', 'Tiền bạc', 'Tăng lên', 'Nền kinh tế', 'Giá trị'] }
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [notebook, setNotebook] = useState({});
            const [screen, setScreen] = useState('home'); // home, translate, notebook
            const [theme, setTheme] = useState('all');
            const [shuffledPack, setShuffledPack] = useState([...wordDatabase]);
            const [homeIndex, setHomeIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [selectedWord, setSelectedWord] = useState(null);
            const [viText, setViText] = useState('');
            const [enText, setEnText] = useState('');
            const [isTranslating, setIsTranslating] = useState(false);

            // --- UTILS ---
            const shuffle = (array) => {
                let res = [...array];
                for (let i = res.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [res[i], res[j]] = [res[j], res[i]];
                }
                return res;
            };

            useEffect(() => {
                const initVoices = () => window.speechSynthesis.getVoices();
                initVoices();
                if (window.speechSynthesis.onvoiceschanged !== undefined) {
                    window.speechSynthesis.onvoiceschanged = initVoices;
                }
            }, []);

            const getNaturalVoice = useCallback(() => {
                if (!window.speechSynthesis) return null;
                const voices = window.speechSynthesis.getVoices();
                if (!voices.length) return null;
                
                // Prioritize natural sounding voices
                const preferredNames = [
                    'Google US English', 'Samantha', 'Daniel', 'Karen', 
                    'Microsoft Aria Online (Natural) - English (United States)'
                ];
                for (const name of preferredNames) {
                    const voice = voices.find(v => v.name === name);
                    if (voice) return voice;
                }
                return voices.find(v => v.lang === 'en-US') || voices[0];
            }, []);

            const speak = useCallback((text) => {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                const bestVoice = getNaturalVoice();
                if (bestVoice) utterance.voice = bestVoice;
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }, [getNaturalVoice]);

            useEffect(() => {
                if (isFirebaseActive && auth) {
                    const initAuth = async () => {
                        try {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                await signInAnonymously(auth);
                            }
                        } catch (error) {
                            console.error("Auth error:", error);
                        }
                    };
                    initAuth();
                    const unsubscribe = onAuthStateChanged(auth, setUser);
                    return () => unsubscribe();
                } else {
                    const localData = localStorage.getItem('vocab_master_notebook');
                    if (localData) setNotebook(JSON.parse(localData));
                }
            }, []);

            useEffect(() => {
                if (isFirebaseActive && user && db) {
                    const notebookRef = collection(db, 'artifacts', appId, 'users', user.uid, 'notebook');
                    const unsubscribe = onSnapshot(notebookRef, (snapshot) => {
                        const data = {};
                        snapshot.forEach(doc => { data[doc.id] = doc.data(); });
                        setNotebook(data);
                    }, (error) => console.error("Snapshot error:", error));
                    return () => unsubscribe();
                }
            }, [user]);

            useEffect(() => {
                const filtered = theme === 'all' ? wordDatabase : wordDatabase.filter(w => w.category === theme);
                setShuffledPack(shuffle(filtered));
                setHomeIndex(0);
                setIsFlipped(false);
            }, [theme]);

            const handleTranslate = async () => {
                if (!viText.trim()) return;
                setIsTranslating(true);
                try {
                    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=vi&tl=en&dt=t&q=${encodeURIComponent(viText)}`;
                    const response = await fetch(url);
                    const data = await response.json();
                    const translatedText = data[0].map(item => item[0]).join('');
                    setEnText(translatedText);

                    const newNoteData = {
                        keyword: selectedWord.keyword,
                        category: selectedWord.category,
                        vi: viText,
                        en: translatedText,
                        timestamp: Date.now()
                    };

                    if (isFirebaseActive && user && db && selectedWord) {
                        const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'notebook', selectedWord.keyword);
                        await setDoc(docRef, newNoteData, { merge: true });
                    } else {
                        const currentNotes = { ...notebook };
                        currentNotes[selectedWord.keyword] = newNoteData;
                        setNotebook(currentNotes);
                        localStorage.setItem('vocab_master_notebook', JSON.stringify(currentNotes));
                    }
                } catch (error) {
                    console.error("Translation Error:", error);
                } finally {
                    setIsTranslating(false);
                }
            };

            const openTranslate = (word) => {
                setSelectedWord(word);
                if (notebook[word.keyword]) {
                    setViText(notebook[word.keyword].vi || '');
                    setEnText(notebook[word.keyword].en || '');
                } else {
                    setViText('');
                    setEnText('');
                }
                setScreen('translate');
            };

            const currentHomeWord = shuffledPack[homeIndex];
            const themes = [...new Set(wordDatabase.map(w => w.category))];

            // Helper to get aesthetic image URLs
            const getImageUrl = (keyword) => {
                // Using Bing search with 'aesthetic photography' to get professional, natural looks
                return `https://tse2.mm.bing.net/th?q=${encodeURIComponent(keyword + " aesthetic beautiful photography high quality")}&w=600&h=400&c=7&rs=1&p=0`;
            };

            return (
                <div className="max-w-md mx-auto w-full p-4 min-h-screen flex flex-col justify-center relative z-10">

                    {/* ================= HOME SCREEN ================= */}
                    {screen === 'home' && currentHomeWord && (
                        <div className="animate-fade-in-up w-full">
                            {/* Header Section */}
                            <div className="flex justify-between items-center mb-6 px-1">
                                <div>
                                    <h1 className="text-3xl font-extrabold tracking-tight text-white flex items-center gap-2">
                                        Vocab<span className="text-transparent bg-clip-text bg-gradient-to-r from-primary-400 to-purple-400">Master</span>
                                    </h1>
                                    <p className="text-sm text-gray-400 mt-1 font-medium">Nâng tầm vốn từ của bạn</p>
                                </div>
                                <button onClick={() => setScreen('notebook')} className="bg-white/5 hover:bg-white/10 p-3 rounded-2xl flex items-center justify-center transition-all border border-white/10 shadow-lg backdrop-blur-md active:scale-95">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="text-amber-400"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                                </button>
                            </div>
                            
                            {/* Theme Selector */}
                            <div className="relative mb-8 group">
                                <div className="absolute inset-y-0 left-4 flex items-center pointer-events-none">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-primary-400"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                                </div>
                                <select 
                                    value={theme} 
                                    onChange={(e) => setTheme(e.target.value)} 
                                    className="w-full bg-dark-800/60 backdrop-blur-xl border border-white/10 text-white py-4 pl-12 pr-10 rounded-2xl text-[15px] font-semibold appearance-none outline-none focus:border-primary-500/50 focus:ring-2 focus:ring-primary-500/20 transition-all shadow-lg cursor-pointer"
                                >
                                    <option value="all">Tất cả chủ đề</option>
                                    {themes.map(t => <option key={t} value={t}>{t}</option>)}
                                </select>
                                <div className="absolute inset-y-0 right-4 flex items-center pointer-events-none">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-gray-400"><path d="m6 9 6 6 6-6"/></svg>
                                </div>
                            </div>

                            {}
                            <div className="perspective-1000 h-[420px] w-full cursor-pointer relative mb-8" onClick={() => setIsFlipped(!isFlipped)}>
                                <div className={`w-full h-full transition-transform duration-700 ease-out preserve-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                                    
                                    {/* FRONT OF CARD */}
                                    <div className="absolute w-full h-full backface-hidden bg-white rounded-[2rem] card-shadow overflow-hidden flex flex-col border border-white/20">
                                        {/* Image Header */}
                                        <div className="relative h-56 w-full bg-gray-100 shrink-0">
                                            <img 
                                                src={getImageUrl(currentHomeWord.keyword)} 
                                                className="w-full h-full object-cover" 
                                                alt={currentHomeWord.keyword}
                                                onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1557682250-33bd709cbe85?w=600&h=400&fit=crop'; }}
                                            />
                                            {/* Gradient Overlay for smooth transition */}
                                            <div className="absolute inset-0 bg-gradient-to-t from-white via-white/40 to-transparent"></div>
                                            
                                            {/* Category Tag */}
                                            <div className="absolute top-4 left-4 bg-black/30 backdrop-blur-md text-white text-xs font-bold px-3 py-1.5 rounded-full uppercase tracking-wide border border-white/20 shadow-sm">
                                                {currentHomeWord.category}
                                            </div>
                                        </div>

                                        {/* Content Area */}
                                        <div className="flex-1 px-6 pb-6 pt-2 flex flex-col items-center bg-white">
                                            <div className="flex gap-3 items-center mb-1 w-full justify-center">
                                                <h2 className="text-[32px] font-black text-gray-900 tracking-tight uppercase">{currentHomeWord.keyword}</h2>
                                                <button onClick={(e) => { e.stopPropagation(); speak(currentHomeWord.keyword); }} className="p-2.5 bg-primary-50 text-primary-600 rounded-full hover:bg-primary-100 transition-colors shadow-sm active:scale-95">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                                                </button>
                                            </div>
                                            <p className="text-gray-500 font-mono text-sm font-medium mb-4 tracking-wide bg-gray-100 px-3 py-1 rounded-lg">{currentHomeWord.ipa}</p>
                                            
                                            <div className="w-full mt-auto">
                                                <div className="flex flex-wrap justify-center gap-2">
                                                    {currentHomeWord.taboo.map((w, i) => (
                                                        <span key={i} className="text-xs font-bold text-gray-600 bg-gray-50 px-3 py-1.5 rounded-lg border border-gray-200 shadow-sm">{w}</span>
                                                    ))}
                                                </div>
                                            </div>
                                            <p className="mt-5 text-[11px] text-gray-400 font-semibold uppercase tracking-widest flex items-center gap-1.5">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.54 15H17a2 2 0 0 0-2 2v4.54"/><path d="M7 3.34V5a3 3 0 0 0 3 3v0a2 2 0 0 1 2 2v0c0 1.1.9 2 2 2v0a2 2 0 0 0 2-2v0c0-1.1.9-2 2-2h1.66"/><path d="M11 21.95V18a2 2 0 0 0-2-2v0a2 2 0 0 1-2-2v-1a2 2 0 0 0-2-2H2.05"/><circle cx="12" cy="12" r="10"/></svg>
                                                Chạm để lật thẻ
                                            </p>
                                        </div>
                                    </div>

                                    {/* BACK OF CARD */}
                                    <div className="absolute w-full h-full backface-hidden bg-gradient-to-br from-dark-800 to-dark-900 rounded-[2rem] card-shadow rotate-y-180 flex flex-col items-center justify-center p-8 border border-white/10">
                                        <div className="absolute top-0 right-0 p-6 opacity-10 pointer-events-none">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
                                        </div>
                                        <h2 className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-br from-white to-gray-400 uppercase mb-8 text-center leading-tight z-10">{currentHomeWord.vietnamese_keyword}</h2>
                                        
                                        <div className="w-full bg-white/5 backdrop-blur-md rounded-2xl p-5 border border-white/10 z-10">
                                            <p className="text-[11px] font-bold text-gray-400 uppercase tracking-widest text-center mb-4">Các từ liên quan</p>
                                            <div className="flex flex-wrap justify-center gap-2">
                                                {currentHomeWord.vietnamese_taboo.map((w, i) => (
                                                    <span key={i} className="text-sm font-semibold text-white bg-white/10 px-3 py-1.5 rounded-lg border border-white/5">{w}</span>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {}
                            <div className="flex gap-3 mb-5">
                                <button onClick={() => { setHomeIndex((homeIndex - 1 + shuffledPack.length) % shuffledPack.length); setIsFlipped(false); }} className="flex-1 bg-dark-800/50 hover:bg-dark-700/80 backdrop-blur-md py-4 rounded-2xl font-bold transition-all border border-white/10 flex items-center justify-center gap-2 text-sm uppercase tracking-wide text-gray-300 shadow-lg active:scale-95">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                                    Trước
                                </button>
                                <button onClick={() => { setHomeIndex((homeIndex + 1) % shuffledPack.length); setIsFlipped(false); }} className="flex-1 bg-dark-800/50 hover:bg-dark-700/80 backdrop-blur-md py-4 rounded-2xl font-bold transition-all border border-white/10 flex items-center justify-center gap-2 text-sm uppercase tracking-wide text-gray-300 shadow-lg active:scale-95">
                                    Tiếp
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                                </button>
                            </div>
                            
                            <button onClick={() => openTranslate(currentHomeWord)} className="w-full bg-gradient-to-r from-primary-600 to-purple-600 hover:from-primary-500 hover:to-purple-500 py-4 rounded-2xl font-black uppercase tracking-wide text-[15px] shadow-[0_10px_25px_-5px_rgba(59,130,246,0.5)] flex items-center justify-center gap-3 transition-all active:scale-[0.98] border border-white/10 text-white relative overflow-hidden group">
                                <div className="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="relative z-10"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 Z"/></svg>
                                <span className="relative z-10">Tạo câu & Lưu Sổ Tay</span>
                            </button>
                        </div>
                    )}

                    {}
                    {screen === 'translate' && selectedWord && (
                        <div className="glass-panel p-6 flex flex-col h-[92vh] animate-fade-in-up relative overflow-hidden">
                            {/* Header */}
                            <div className="flex justify-between items-center mb-6 z-10">
                                <button onClick={() => setScreen('home')} className="p-2.5 bg-white/5 hover:bg-white/10 rounded-2xl transition-all border border-white/10 shadow-sm backdrop-blur-md active:scale-95">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                                </button>
                                <h2 className="text-lg font-bold uppercase tracking-widest text-gray-300">Dịch thuật</h2>
                                <button onClick={() => setScreen('notebook')} className="p-2.5 bg-white/5 hover:bg-white/10 rounded-2xl transition-all border border-white/10 shadow-sm backdrop-blur-md text-amber-400 active:scale-95">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                                </button>
                            </div>

                            {/* Target Word Display */}
                            <div className="bg-gradient-to-br from-dark-800 to-dark-900 border border-white/10 p-5 rounded-[1.5rem] mb-6 text-center shadow-lg relative overflow-hidden z-10">
                                <div className="absolute top-[-20px] right-[-20px] w-20 h-20 bg-primary-500/20 rounded-full blur-xl"></div>
                                <p className="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-1.5">Từ vựng mục tiêu</p>
                                <h3 className="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-300">
                                    {selectedWord.keyword}
                                </h3>
                                <p className="text-sm font-semibold text-primary-400 mt-1">{selectedWord.vietnamese_keyword}</p>
                            </div>

                            {/* Input / Output Area */}
                            <div className="flex flex-col gap-4 flex-grow z-10">
                                {/* VN Input */}
                                <div className="bg-white/5 backdrop-blur-md rounded-2xl p-4 border border-white/10 shadow-inner focus-within:border-primary-500/50 transition-colors relative">
                                    <span className="absolute -top-3 left-4 bg-dark-900 text-gray-300 text-[10px] font-bold uppercase tracking-widest px-2 py-0.5 rounded-md border border-white/10">Viết câu (Tiếng Việt)</span>
                                    <textarea 
                                        value={viText}
                                        onChange={(e) => setViText(e.target.value)}
                                        placeholder="Ví dụ: Tôi thích chơi bóng đá vào cuối tuần..."
                                        className="w-full h-24 bg-transparent outline-none text-white resize-none font-medium text-base pt-2 placeholder:text-gray-600 custom-scrollbar"
                                    />
                                </div>

                                {/* Action Button */}
                                <button 
                                    onClick={handleTranslate} 
                                    disabled={!viText.trim() || isTranslating}
                                    className="w-full bg-primary-600 hover:bg-primary-500 py-4 rounded-2xl font-bold text-[14px] uppercase tracking-wider transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 shadow-lg active:scale-[0.98] border border-primary-400/30 text-white"
                                >
                                    {isTranslating ? (
                                        <>
                                            <svg className="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                            Đang xử lý...
                                        </>
                                    ) : (
                                        <>
                                            Dịch & Lưu
                                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
                                        </>
                                    )}
                                </button>

                                {/* EN Output */}
                                <div className="bg-dark-800/80 backdrop-blur-xl rounded-2xl p-5 border border-white/10 flex-grow overflow-y-auto relative custom-scrollbar shadow-inner mt-2">
                                    <span className="absolute -top-3 left-4 bg-primary-600 text-white text-[10px] font-bold uppercase tracking-widest px-2 py-0.5 rounded-md shadow-sm">Bản dịch (Tiếng Anh)</span>
                                    {!enText ? (
                                        <div className="flex flex-col items-center justify-center h-full text-gray-600 gap-2">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                                            <p className="text-sm font-medium">Bản dịch sẽ hiển thị ở đây</p>
                                        </div>
                                    ) : (
                                        <div className="pt-2">
                                            <p className="text-[17px] font-medium leading-relaxed text-gray-100">
                                                {enText.split(/(\s+)/).map((segment, idx) => {
                                                    if (/\s+/.test(segment)) return <span key={idx}>{segment}</span>;
                                                    return (
                                                        <span 
                                                            key={idx} 
                                                            onClick={() => speak(segment.replace(/[.,!?]/g, ''))} 
                                                            className="cursor-pointer hover:text-primary-400 hover:bg-primary-900/30 px-1 -mx-1 rounded transition-colors duration-200"
                                                        >
                                                            {segment}
                                                        </span>
                                                    );
                                                })}
                                            </p>
                                        </div>
                                    )}
                                </div>
                                
                                {/* Tip */}
                                <div className="bg-dark-800/50 border border-white/5 rounded-xl p-3 flex items-start gap-3 text-gray-400 backdrop-blur-sm z-10 mt-1">
                                    <div className="mt-0.5 text-primary-400">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12h4l3-9 5 18 3-9h5"/></svg>
                                    </div>
                                    <p className="text-[12px] font-medium leading-relaxed">
                                        <span className="text-gray-300 font-bold">Mẹo tương tác:</span> Chạm vào từng từ tiếng Anh trong bản dịch để nghe máy đọc chuẩn xác phát âm.
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {screen === 'notebook' && (
                        <div className="glass-panel p-6 flex flex-col h-[92vh] animate-fade-in-up">
                            {/* Header */}
                            <div className="flex justify-between items-center mb-6 pb-4 border-b border-white/10 shrink-0">
                                <h2 className="text-xl font-black uppercase tracking-widest flex items-center gap-2 text-white">
                                    <div className="p-2 bg-amber-400/20 rounded-xl text-amber-400">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                                    </div>
                                    Sổ Tay
                                </h2>
                                <button onClick={() => setScreen('home')} className="p-2.5 bg-white/5 hover:bg-white/10 rounded-2xl transition-all border border-white/10 shadow-sm backdrop-blur-md active:scale-95">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                                </button>
                            </div>

                            {/* Content List */}
                            <div className="overflow-y-auto pr-2 space-y-4 flex-grow custom-scrollbar">
                                {Object.keys(notebook).length === 0 ? (
                                    <div className="flex flex-col items-center justify-center h-full text-gray-500 gap-4">
                                        <div className="p-4 bg-dark-800 rounded-full border border-white/5">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                                        </div>
                                        <div className="text-center">
                                            <p className="font-bold text-lg text-gray-300 mb-1">Sổ tay đang trống</p>
                                            <p className="text-sm px-4">Hãy dùng tính năng "Dịch & Lưu" để lưu lại các câu ví dụ nhé.</p>
                                        </div>
                                    </div>
                                ) : (
                                    Object.values(notebook).sort((a, b) => b.timestamp - a.timestamp).map((item, idx) => (
                                        <div key={idx} className="bg-dark-800/60 p-5 rounded-[1.5rem] border border-white/10 shadow-lg relative overflow-hidden backdrop-blur-sm group hover:border-white/20 transition-colors">
                                            <div className="absolute top-0 left-0 w-1.5 h-full bg-gradient-to-b from-primary-400 to-purple-500"></div>
                                            
                                            <div className="flex justify-between items-start mb-3 pl-2">
                                                <h4 className="font-black text-white text-lg tracking-tight uppercase">{item.keyword}</h4>
                                                <span className="text-[10px] bg-white/5 text-gray-300 font-bold uppercase tracking-wider px-2 py-1 rounded-md border border-white/10">{item.category}</span>
                                            </div>
                                            
                                            <div className="pl-2 space-y-3">
                                                <div className="relative">
                                                    <div className="absolute -left-2 top-0 bottom-0 w-[2px] bg-gray-700"></div>
                                                    <p className="text-[14px] text-gray-400 italic pl-3 leading-relaxed">"{item.vi}"</p>
                                                </div>
                                                
                                                <p className="font-medium text-white text-[15px] leading-relaxed bg-white/5 p-3 rounded-xl border border-white/5">
                                                    {item.en.split(/(\s+)/).map((segment, i) => {
                                                        if (/\s+/.test(segment)) return <span key={i}>{segment}</span>;
                                                        return (
                                                            <span 
                                                                key={i} 
                                                                onClick={() => speak(segment.replace(/[.,!?]/g, ''))} 
                                                                className="cursor-pointer hover:text-primary-400 transition-colors"
                                                            >
                                                                {segment}
                                                            </span>
                                                        );
                                                    })}
                                                </p>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
