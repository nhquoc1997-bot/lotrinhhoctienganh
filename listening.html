<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Dictation & Shadowing</title>
    
    <!-- Tailwind CSS cho giao diện -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Cấu hình module import để sử dụng React trực tiếp trên trình duyệt -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
          "lucide-react": "https://esm.sh/lucide-react@0.292.0"
        }
      }
    </script>
    
    <!-- Babel để biên dịch JSX sang Javascript -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
      /* Hiệu ứng loading đơn giản */
      body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
      #root { min-height: 100vh; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
          Play, Pause, FastForward, Rewind, CheckCircle, XCircle, Mic, RefreshCw, 
          HelpCircle, ArrowRight, Volume2, BookOpen, Eye,
          AlertTriangle, Loader2
        } from 'lucide-react';

        // --- HELPER FUNCTIONS ---
        const cleanText = (text) => text.replace(/[^\w\s]|_/g, "").replace(/\s+/g, " ").toLowerCase().trim();

        const compareSentences = (target, input) => {
          const targetWords = cleanText(target).split(" ");
          const inputWords = cleanText(input).split(" ");
          let correctCount = 0;
          
          const result = targetWords.map((tWord, i) => {
            const iWord = inputWords[i] || "";
            const isCorrect = tWord === iWord;
            if (isCorrect) correctCount++;
            return { word: tWord, inputWord: iWord, isCorrect };
          });

          const accuracy = Math.round((correctCount / targetWords.length) * 100) || 0;
          return { result, accuracy };
        };

        const splitIntoSentences = (text) => {
          return text.match(/[^.!?]+[.!?]+/g) || [text];
        };

        const createWavFile = (base64Audio, sampleRate = 24000) => {
          try {
            const cleanBase64 = base64Audio.replace(/\s/g, ''); 
            const binaryString = window.atob(cleanBase64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            const buffer = bytes.buffer;
            
            const wavBuffer = new ArrayBuffer(44 + buffer.byteLength);
            const view = new DataView(wavBuffer);
            
            const writeString = (view, offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };
            
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + buffer.byteLength, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); 
            view.setUint16(22, 1, true); 
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true); 
            view.setUint16(32, 2, true); 
            view.setUint16(34, 16, true); 
            writeString(view, 36, 'data');
            view.setUint32(40, buffer.byteLength, true);
            
            new Uint8Array(wavBuffer, 44).set(new Uint8Array(buffer));
            const blob = new Blob([wavBuffer], { type: 'audio/wav' });
            return URL.createObjectURL(blob);
          } catch (e) {
            console.error("Lỗi giải mã âm thanh:", e);
            return null; 
          }
        };

        function App() {
          // --- APP STATES ---
          const [appState, setAppState] = useState('input'); // input, practice, results
          const [rawText, setRawText] = useState("I started learning English eight years ago because I wanted a better job. I hope this system helps everyone improve their listening skills.");
          const [sentences, setSentences] = useState([]);
          const [currentIdx, setCurrentIdx] = useState(0);
          const [inputError, setInputError] = useState('');
          
          // Audio states
          const [voices, setVoices] = useState([]);
          const [selectedVoiceURI, setSelectedVoiceURI] = useState("");
          const [speed, setSpeed] = useState(1.0);
          const [isPlaying, setIsPlaying] = useState(false);
          const [isAudioLoading, setIsAudioLoading] = useState(false);
          const [audioCache, setAudioCache] = useState({}); 
          const audioRef = useRef(null);
          
          // Practice states
          const [userInput, setUserInput] = useState("");
          const [feedback, setFeedback] = useState(null);
          const [hintType, setHintType] = useState(null); 
          
          // New Flow states
          const [practiceStep, setPracticeStep] = useState('dictation'); 
          const [translation, setTranslation] = useState("");
          const [isTranslating, setIsTranslating] = useState(false);
          const [translationFeedback, setTranslationFeedback] = useState(null);
          const [showEnglishHint, setShowEnglishHint] = useState(false); 
          
          // Shadowing states
          const [isRecording, setIsRecording] = useState(false);
          const [shadowingResult, setShadowingResult] = useState(null);
          const [shadowingError, setShadowingError] = useState('');

          // --- TRANSLATION API ---
          const fetchTranslation = async (text, retries = 5) => {
            const apiKey = ""; 
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < retries; i++) {
              try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text: `Dịch câu tiếng Anh sau sang tiếng Việt một cách tự nhiên, ngắn gọn (chỉ trả về kết quả dịch, không giải thích): "${text}"` }] }]
                  })
                });
                if (!res.ok) throw new Error("API error");
                const data = await res.json();
                
                const transText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (transText) return transText.trim();
                
                throw new Error("Invalid format or Safety block");
              } catch (err) {
                if (i === retries - 1) return "Không thể tải bản dịch lúc này.";
                await new Promise(r => setTimeout(r, delays[i]));
              }
            }
          };

          // --- AUDIO SETUP ---
          useEffect(() => {
            const loadVoices = () => {
              const availableVoices = window.speechSynthesis.getVoices();
              let usVoices = availableVoices.filter(v => v.lang.toLowerCase().includes('en-us') || v.lang.toLowerCase().includes('en_us'));
              if (usVoices.length === 0) usVoices = availableVoices.filter(v => v.lang.toLowerCase().startsWith('en'));
              if (usVoices.length === 0) usVoices = availableVoices;
              
              setVoices(usVoices);
              if (usVoices.length > 0 && !selectedVoiceURI) {
                setSelectedVoiceURI(usVoices[0].voiceURI);
              }
            };

            loadVoices();
            window.speechSynthesis.onvoiceschanged = loadVoices;
            
            return () => { 
              window.speechSynthesis.cancel(); 
              if (audioRef.current) audioRef.current.pause();
            };
          }, []);

          useEffect(() => {
            if (audioRef.current) audioRef.current.playbackRate = speed;
          }, [speed]);

          const fallbackPlayAudio = (textToPlay) => {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(textToPlay);
            const voice = voices.find(v => v.voiceURI === selectedVoiceURI);
            if (voice) utterance.voice = voice;
            utterance.rate = speed;
            
            utterance.onstart = () => setIsPlaying(true);
            utterance.onend = () => setIsPlaying(false);
            
            window.speechSynthesis.speak(utterance);
          };

          const playAudio = async (textToPlayParam) => {
            const text = textToPlayParam || sentences[currentIdx];
            if (!text) return;

            if (isPlaying && !textToPlayParam) {
              if (audioRef.current) audioRef.current.pause();
              window.speechSynthesis.cancel();
              setIsPlaying(false);
              return;
            }

            setIsPlaying(true);
            window.speechSynthesis.cancel(); 

            try {
              let url = audioCache[text];
              
              if (!url) {
                setIsAudioLoading(true);
                const apiKey = ""; 
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text }] }],
                    generationConfig: {
                      responseModalities: ["AUDIO"],
                      speechConfig: {
                        voiceConfig: {
                          prebuiltVoiceConfig: { voiceName: "Aoede" } 
                        }
                      }
                    },
                    model: "gemini-2.5-flash-preview-tts"
                  })
                });
                
                if (!response.ok) throw new Error("Lỗi tải âm thanh AI");
                const data = await response.json();
                const audioPart = data.candidates?.[0]?.content?.parts?.[0]?.inlineData;
                
                if (!audioPart) throw new Error("Dữ liệu âm thanh trống");
                
                const mimeType = audioPart.mimeType;
                const rateMatch = mimeType.match(/rate=(\d+)/);
                const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
                
                url = createWavFile(audioPart.data, sampleRate);
                if (!url) throw new Error("Không thể decode file WAV");
                
                setAudioCache(prev => ({ ...prev, [text]: url }));
              }

              setIsAudioLoading(false);
              
              const audio = new Audio(url);
              audio.playbackRate = speed;
              audio.onended = () => setIsPlaying(false);
              audio.onerror = () => { setIsPlaying(false); fallbackPlayAudio(text); }; 
              
              audioRef.current = audio;
              
              audio.play().catch(err => {
                console.warn("Lỗi AutoPlay:", err);
                setIsPlaying(false);
                fallbackPlayAudio(text); 
              });

            } catch (error) {
              console.warn("Chuyển về giọng offline:", error);
              setIsAudioLoading(false);
              fallbackPlayAudio(text);
            }
          };

          // --- ACTIONS ---
          const handleStart = () => {
            setInputError('');
            const parsed = splitIntoSentences(rawText).map(s => s.trim()).filter(s => s.length > 0);
            if (parsed.length === 0) {
              setInputError("Vui lòng nhập đoạn văn bản tiếng Anh hợp lệ!");
              return;
            }
            setSentences(parsed);
            setCurrentIdx(0);
            setUserInput("");
            setFeedback(null);
            setPracticeStep('dictation');
            setTranslation("");
            setTranslationFeedback(null);
            setShowEnglishHint(false);
            setAppState('practice');
          };

          const handleCheck = () => {
            if (!userInput.trim()) return;
            const currentSentence = sentences[currentIdx];
            const { result, accuracy } = compareSentences(currentSentence, userInput);
            setFeedback({ result, accuracy });
            setHintType(null); 
            setPracticeStep('feedback');
          };

          const handleProceedToTranslation = async () => {
            setPracticeStep('translation');
            setUserInput("");
            setTranslationFeedback(null);
            setShowEnglishHint(false);
            setIsTranslating(true);
            playAudio(); 
            const trans = await fetchTranslation(sentences[currentIdx]);
            setTranslation(trans);
            setIsTranslating(false);
          };

          const handleCheckTranslation = () => {
            const { accuracy } = compareSentences(sentences[currentIdx], userInput);
            if (accuracy === 100) {
              setTranslationFeedback(null);
              handleProceedToShadowing();
            } else {
              setTranslationFeedback("Câu bạn nhập chưa chính xác 100%. Hãy nhớ lại lỗi sai trước đó và thử lại nhé!");
            }
          };

          const handleProceedToShadowing = () => {
            setShadowingError('');
            setPracticeStep('shadowing');
          };

          const handleNext = () => {
            if (currentIdx < sentences.length - 1) {
              setCurrentIdx(currentIdx + 1);
              setUserInput("");
              setFeedback(null);
              setHintType(null);
              setShadowingResult(null);
              setPracticeStep('dictation');
              setTranslation("");
              setTranslationFeedback(null);
              setShowEnglishHint(false);
            } else {
              setAppState('results');
            }
          };

          const generateHint = () => {
            if (!hintType) return null;
            const words = sentences[currentIdx].split(" ");
            const len = words.length;
            let hintWords = [...words];

            if (hintType === 'start') {
              for (let i = Math.floor(len/3); i < len; i++) hintWords[i] = "___";
            } else if (hintType === 'end') {
              for (let i = 0; i < Math.floor(len*2/3); i++) hintWords[i] = "___";
            } else if (hintType === 'middle') {
              for (let i = 0; i < Math.floor(len/3); i++) hintWords[i] = "___";
              for (let i = Math.floor(len*2/3); i < len; i++) hintWords[i] = "___";
            } else if (hintType === 'keywords') {
              hintWords = words.map(w => w.length > 4 ? w : "___"); 
            }
            return hintWords.join(" ");
          };

          const startShadowing = () => {
            setShadowingError('');
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
              setShadowingError("Trình duyệt của bạn không hỗ trợ nhận diện giọng nói. Vui lòng dùng Chrome trên máy tính hoặc Android.");
              return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => setIsRecording(true);
            
            recognition.onresult = (event) => {
              const transcript = event.results[0][0].transcript;
              const { accuracy } = compareSentences(sentences[currentIdx], transcript);
              setShadowingResult({ transcript, accuracy });
            };

            recognition.onerror = (e) => {
              console.error(e);
              setShadowingError("Có lỗi xảy ra khi nhận diện giọng nói. Vui lòng thử lại.");
              setIsRecording(false);
            };

            recognition.onend = () => setIsRecording(false);
            
            recognition.start();
          };

          // --- RENDERERS ---
          const renderInputScreen = () => (
            <div className="max-w-3xl w-full mx-auto p-6 md:p-8 bg-white rounded-3xl shadow-xl border border-slate-200 mt-6">
              <h1 className="text-2xl md:text-3xl font-bold text-indigo-600 mb-3 flex items-center gap-2">
                <Volume2 size={32} /> Smart Dictation & Shadowing
              </h1>
              <p className="text-gray-600 mb-6 font-medium">Dán văn bản tiếng Anh vào đây. Hệ thống sẽ chia câu và tự động thiết lập giọng đọc để bạn luyện nghe chép chính tả ngay lập tức.</p>
              
              {inputError && (
                <div className="mb-4 p-3 bg-red-50 text-red-600 border border-red-200 rounded-xl font-medium text-sm flex items-center gap-2">
                  <AlertTriangle size={18}/> {inputError}
                </div>
              )}

              <textarea 
                className="w-full h-48 md:h-64 p-5 border-2 border-indigo-100 rounded-2xl focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100 resize-none text-lg text-gray-700 outline-none transition-all"
                value={rawText}
                onChange={(e) => setRawText(e.target.value)}
                placeholder="Dán đoạn văn tiếng Anh của bạn vào đây..."
              />

              <div className="mt-6 flex justify-center">
                <button 
                  onClick={handleStart}
                  className="w-full md:w-auto px-10 py-4 bg-indigo-600 hover:bg-indigo-700 text-white text-lg font-bold rounded-2xl transition shadow-lg shadow-indigo-200 flex items-center justify-center gap-2"
                >
                  Bắt đầu luyện tập <ArrowRight size={24} />
                </button>
              </div>
            </div>
          );

          const renderPracticeScreen = () => {
            const progress = ((currentIdx) / sentences.length) * 100;

            return (
              <div className="max-w-3xl w-full mx-auto p-4 md:p-8 bg-white rounded-3xl shadow-xl border border-slate-200 mt-6 overflow-hidden">
                {/* Progress Bar */}
                <div className="mb-6 md:mb-8">
                  <div className="flex justify-between text-xs md:text-sm font-bold text-gray-500 mb-2">
                    <span>Câu {currentIdx + 1} / {sentences.length}</span>
                    <span className="text-indigo-600">Tiến độ: {Math.round(progress)}%</span>
                  </div>
                  <div className="w-full bg-slate-100 rounded-full h-2 md:h-3">
                    <div className="bg-gradient-to-r from-indigo-500 to-purple-500 h-2 md:h-3 rounded-full transition-all duration-500 shadow-sm" style={{ width: `${progress}%` }}></div>
                  </div>
                </div>

                {/* Audio Player */}
                <div className="flex flex-col items-center bg-indigo-50/50 border border-indigo-100 p-4 md:p-6 rounded-3xl mb-6 md:mb-8 shadow-sm relative overflow-hidden">
                  <div className="flex flex-wrap justify-center items-center gap-2 md:gap-3 mb-4 md:mb-6 relative z-10">
                    {[0.7, 0.85, 1.0].map(s => (
                      <button 
                        key={s} 
                        onClick={() => setSpeed(s)} 
                        className={`px-3 py-1 md:px-4 md:py-1.5 rounded-full text-xs md:text-sm font-bold transition-all ${speed === s ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-indigo-600 border border-indigo-200 hover:bg-indigo-100'}`}
                      >
                        {s}x
                      </button>
                    ))}
                  </div>
                  
                  <button 
                    onClick={() => playAudio()}
                    disabled={isAudioLoading}
                    className={`w-20 h-20 md:w-24 md:h-24 flex items-center justify-center rounded-full text-white shadow-xl transition-all duration-300 relative z-10 disabled:opacity-80 ${isPlaying || isAudioLoading ? 'bg-indigo-400 scale-105' : 'bg-indigo-600 hover:bg-indigo-700 hover:scale-105 hover:shadow-indigo-300/50'}`}
                  >
                    {isAudioLoading ? <Loader2 size={36} className="animate-spin md:w-10 md:h-10" /> :
                     isPlaying ? <Volume2 size={36} className="animate-pulse md:w-10 md:h-10" /> : 
                     <Play size={40} className="ml-2 md:w-11 md:h-11" />}
                  </button>
                  <p className="mt-4 text-sm text-indigo-500 font-bold tracking-wide uppercase relative z-10">Bấm để nghe audio</p>
                </div>

                {/* --- STEP 1: DICTATION --- */}
                {practiceStep === 'dictation' && (
                  <div className="animate-in fade-in duration-500">
                    <div className="mb-6">
                      <div className="flex items-center gap-2 mb-3">
                        <HelpCircle size={20} className="text-orange-500" />
                        <span className="text-base font-bold text-slate-700">Bạn không nghe được phần nào?</span>
                      </div>
                      <div className="flex flex-wrap gap-2">
                        <button onClick={() => setHintType('start')} className="px-4 py-2 text-sm font-bold bg-orange-50 border border-orange-200 text-orange-600 rounded-xl hover:bg-orange-100 transition-colors">Đầu câu</button>
                        <button onClick={() => setHintType('middle')} className="px-4 py-2 text-sm font-bold bg-orange-50 border border-orange-200 text-orange-600 rounded-xl hover:bg-orange-100 transition-colors">Giữa câu</button>
                        <button onClick={() => setHintType('end')} className="px-4 py-2 text-sm font-bold bg-orange-50 border border-orange-200 text-orange-600 rounded-xl hover:bg-orange-100 transition-colors">Cuối câu</button>
                        <button onClick={() => setHintType('keywords')} className="px-4 py-2 text-sm font-bold bg-orange-50 border border-orange-200 text-orange-600 rounded-xl hover:bg-orange-100 transition-colors">Từ khóa</button>
                      </div>
                      {hintType && (
                        <div className="mt-4 p-4 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 text-base md:text-lg font-mono tracking-wide shadow-inner break-words">
                          {generateHint()}
                        </div>
                      )}
                    </div>

                    <div className="mb-6">
                      <textarea
                        className="w-full p-4 md:p-5 text-base md:text-lg border-2 border-slate-200 rounded-2xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 transition-all outline-none resize-none bg-slate-50 focus:bg-white"
                        rows="4"
                        placeholder="Gõ lại những gì bạn nghe được..."
                        value={userInput}
                        onChange={(e) => setUserInput(e.target.value)}
                        onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleCheck(); } }}
                      />
                    </div>

                    <button 
                      onClick={handleCheck}
                      disabled={!userInput.trim()}
                      className="w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-white text-lg font-black rounded-2xl transition-all shadow-lg shadow-emerald-200 disabled:opacity-50"
                    >
                      Kiểm tra đáp án
                    </button>
                  </div>
                )}

                {/* --- STEP 2: FEEDBACK --- */}
                {practiceStep === 'feedback' && feedback && (
                  <div className="animate-in fade-in duration-500">
                    <div className={`p-4 md:p-6 rounded-2xl border-2 mb-6 shadow-sm ${feedback.accuracy === 100 ? 'bg-emerald-50 border-emerald-200' : 'bg-red-50 border-red-200'}`}>
                      <h3 className={`text-lg md:text-xl font-black mb-4 flex items-center gap-2 ${feedback.accuracy === 100 ? 'text-emerald-600' : 'text-red-600'}`}>
                        {feedback.accuracy === 100 ? <CheckCircle size={24}/> : <XCircle size={24}/>}
                        Độ chính xác: {feedback.accuracy}%
                      </h3>
                      
                      <div className="text-base md:text-xl leading-loose md:leading-relaxed mb-6 font-medium text-slate-800 break-words">
                        {feedback.result.map((item, idx) => (
                          <span key={idx} className={`inline-block mr-1 mb-1 px-1.5 py-0.5 rounded-md ${item.isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800 underline decoration-red-500 decoration-2'}`}>
                            {item.isCorrect ? item.word : (item.inputWord || "_thiếu_")}
                          </span>
                        ))}
                      </div>

                      {feedback.accuracy < 100 && (
                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                          <p className="text-xs md:text-sm font-bold text-slate-400 uppercase tracking-wider mb-2">Câu gốc đúng:</p>
                          <p className="text-slate-800 text-base md:text-lg font-medium break-words">{sentences[currentIdx]}</p>
                        </div>
                      )}
                    </div>

                    <div className="flex flex-col sm:flex-row gap-4">
                      <button 
                        onClick={() => { setPracticeStep('dictation'); setUserInput(""); }}
                        className="flex-1 py-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-2xl transition-colors flex items-center justify-center gap-2 border border-slate-200"
                      >
                        <RefreshCw size={20} /> Nhập lại
                      </button>
                      <button 
                        onClick={handleProceedToTranslation}
                        className="flex-1 py-4 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-2xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-blue-200"
                      >
                        Hiểu nghĩa & Ghi nhớ <ArrowRight size={20} />
                      </button>
                    </div>
                  </div>
                )}

                {/* --- STEP 3: TRANSLATION & REINFORCEMENT --- */}
                {practiceStep === 'translation' && (
                  <div className="bg-blue-50 p-4 md:p-8 rounded-3xl border border-blue-100 mb-6 text-center shadow-sm">
                    <h4 className="text-lg md:text-xl text-blue-800 font-black mb-6 flex items-center justify-center gap-2">
                      <BookOpen size={24} /> Hiểu nghĩa & Ghi nhớ
                    </h4>
                    
                    <div className="bg-white p-4 md:p-5 rounded-2xl mb-6 shadow-sm border border-blue-100 text-left">
                      <p className="text-slate-400 text-xs font-black uppercase tracking-wider mb-2">Tiếng Anh:</p>
                      {showEnglishHint ? (
                        <p className="text-base md:text-lg text-slate-800 font-medium mb-5 pb-5 border-b border-slate-100 break-words">
                          {sentences[currentIdx]}
                        </p>
                      ) : (
                        <div className="mb-5 pb-5 border-b border-slate-100">
                          <button 
                            onClick={() => setShowEnglishHint(true)}
                            className="flex items-center gap-2 px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs md:text-sm font-bold w-full sm:w-auto justify-center"
                          >
                            <Eye size={18} /> Bấm để xem lại câu tiếng Anh
                          </button>
                        </div>
                      )}
                      
                      <p className="text-slate-400 text-xs font-black uppercase tracking-wider mb-2">Tiếng Việt:</p>
                      {isTranslating ? (
                        <p className="text-blue-500 font-medium flex items-center gap-2 text-sm md:text-base"><Loader2 size={18} className="animate-spin"/> Đang dịch bằng AI...</p>
                      ) : (
                        <p className="text-lg md:text-xl text-blue-700 font-bold leading-relaxed break-words">{translation}</p>
                      )}
                    </div>

                    {feedback.accuracy < 100 ? (
                      <div className="text-left">
                        <p className="text-sm text-blue-800 font-bold mb-3 flex items-start gap-2">
                          <span className="text-xl leading-none">💡</span>
                          Hãy nghe lại và nhập lại câu Tiếng Anh thật chính xác nhé:
                        </p>
                        <textarea
                          className="w-full p-4 text-base border-2 border-blue-200 rounded-2xl focus:border-blue-500 focus:ring-4 outline-none resize-none mb-3 bg-white"
                          rows="4"
                          placeholder="Gõ lại câu tiếng Anh..."
                          value={userInput}
                          onChange={(e) => setUserInput(e.target.value)}
                          onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleCheckTranslation(); } }}
                        />
                        {translationFeedback && <p className="text-red-500 text-sm font-bold mb-4 flex items-center gap-1"><AlertTriangle size={16}/> {translationFeedback}</p>}
                        <button 
                          onClick={handleCheckTranslation}
                          disabled={!userInput.trim() || isTranslating}
                          className="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white text-lg font-black rounded-2xl disabled:opacity-50"
                        >
                          Xác nhận độ hiểu câu
                        </button>
                      </div>
                    ) : (
                      <div className="mt-8">
                        <p className="text-emerald-600 font-bold mb-6 bg-emerald-50 py-3 px-4 rounded-xl border border-emerald-100">
                          🎉 Bạn đã chép chuẩn 100% ở bước trước! Hãy chuyển sang luyện phát âm ngay.
                        </p>
                        <button 
                          onClick={handleProceedToShadowing}
                          className="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white text-lg font-black rounded-2xl flex justify-center items-center gap-2"
                        >
                          Luyện phát âm (Shadowing) <ArrowRight size={20} />
                        </button>
                      </div>
                    )}
                  </div>
                )}

                {/* --- STEP 4: SHADOWING --- */}
                {practiceStep === 'shadowing' && (
                  <div className="bg-indigo-50 p-4 md:p-8 rounded-3xl border border-indigo-100 mb-6 text-center shadow-sm">
                    <h4 className="text-indigo-800 font-black mb-2 flex items-center justify-center gap-2 text-lg md:text-xl">
                      <Mic size={24} /> Luyện phát âm (Shadowing)
                    </h4>
                    <p className="text-xs md:text-sm text-indigo-600 font-medium mb-6">Bấm nút Micro, nghe lại audio và đọc đuổi theo nhé.</p>
                    
                    <div className="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-indigo-100 mb-8 relative">
                      <p className="text-lg md:text-xl text-slate-800 font-medium leading-relaxed break-words">{sentences[currentIdx]}</p>
                    </div>

                    {shadowingError && (
                      <div className="mb-6 p-3 bg-red-50 text-red-600 border border-red-200 rounded-xl font-medium text-xs md:text-sm break-words">
                        {shadowingError}
                      </div>
                    )}

                    <div className="flex justify-center gap-8 items-center mb-8 relative">
                      <button 
                        onClick={() => playAudio()} 
                        disabled={isAudioLoading}
                        className="w-16 h-16 flex items-center justify-center bg-white text-indigo-600 rounded-full hover:bg-indigo-100 border border-indigo-200 shadow-md transform hover:scale-105 disabled:opacity-50"
                        title="Nghe lại"
                      >
                        {isAudioLoading ? <Loader2 size={28} className="animate-spin" /> : <Volume2 size={28}/>}
                      </button>
                      
                      <div className="relative">
                        {isRecording && <div className="absolute inset-0 bg-red-400 rounded-full animate-ping opacity-75"></div>}
                        <button 
                          onClick={startShadowing}
                          className={`relative z-10 w-20 h-20 flex items-center justify-center rounded-full text-white shadow-xl transition-all duration-300 transform ${isRecording ? 'bg-red-500 scale-110 shadow-red-300' : 'bg-indigo-600 hover:bg-indigo-700 hover:scale-105 shadow-indigo-300'}`}
                          title="Ghi âm"
                        >
                          <Mic size={36} />
                        </button>
                      </div>
                    </div>
                    
                    {shadowingResult && (
                      <div className="mt-4 p-4 md:p-5 bg-white rounded-2xl shadow-sm border border-indigo-100 text-left">
                        <p className="text-xs font-black text-slate-400 uppercase tracking-wider mb-2">Hệ thống nghe được:</p>
                        <p className="font-medium text-slate-800 text-base md:text-lg mb-4 break-words">"{shadowingResult.transcript}"</p>
                        <div className={`p-3 rounded-xl border flex items-center gap-2 text-base md:text-lg font-bold ${shadowingResult.accuracy > 80 ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'bg-orange-50 text-orange-600 border-orange-200'}`}>
                          {shadowingResult.accuracy > 80 ? <CheckCircle size={20}/> : <RefreshCw size={20}/>}
                          Điểm phát âm: {shadowingResult.accuracy}%
                        </div>
                      </div>
                    )}

                    <div className="mt-8 border-t border-indigo-100 pt-8">
                      <button 
                        onClick={handleNext}
                        className="w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-lg rounded-2xl flex items-center justify-center gap-2"
                      >
                        {currentIdx < sentences.length - 1 ? 'Chuyển sang Câu tiếp theo' : 'Hoàn thành bài tập'} <ArrowRight size={20} />
                      </button>
                    </div>
                  </div>
                )}
              </div>
            );
          };

          const renderResultsScreen = () => (
            <div className="max-w-xl mx-auto w-full p-8 md:p-12 bg-white rounded-3xl shadow-xl border border-slate-200 mt-10 text-center">
              <div className="w-28 h-28 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-8 shadow-inner border border-emerald-200">
                <CheckCircle size={56} />
              </div>
              <h2 className="text-3xl md:text-4xl font-black text-slate-800 mb-4">Tuyệt vời!</h2>
              <p className="text-slate-500 mb-10 text-lg font-medium">Bạn đã hoàn thành xuất sắc bài luyện nghe chép chính tả & Shadowing.</p>
              <button 
                onClick={() => setAppState('input')}
                className="py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-lg rounded-2xl w-full flex items-center justify-center gap-2"
              >
                <RefreshCw size={20} /> Luyện tập bài mới
              </button>
            </div>
          );

          return (
            <div className="min-h-screen pb-20 flex flex-col items-center">
              <header className="max-w-4xl w-full mx-auto p-4 bg-white shadow-sm border-b border-slate-200 rounded-b-3xl flex items-center justify-center mb-6">
                <div className="flex items-center gap-3">
                  <div className="bg-indigo-600 p-2.5 rounded-xl shadow-md">
                    <Volume2 className="w-5 h-5 text-white" />
                  </div>
                  <h1 className="text-xl font-black text-slate-800 tracking-tight">Listening & Shadowing AI</h1>
                </div>
              </header>

              <div className="w-full px-4">
                {appState === 'input' && renderInputScreen()}
                {appState === 'practice' && renderPracticeScreen()}
                {appState === 'results' && renderResultsScreen()}
              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
