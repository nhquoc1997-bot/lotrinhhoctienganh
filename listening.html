<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Dictation - Premium Female AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX transpiling -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root {
            --primary: #db2777; /* Hồng đậm sang trọng cho giọng nữ */
            --primary-soft: #fdf2f8;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            background: radial-gradient(circle at top left, #fafaf9 0%, #f5f5f4 100%);
            overscroll-behavior-y: contain;
        }

        .animate-in { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.03), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
        }

        .voice-pulse-ring {
            animation: pulse-ring 1.8s cubic-bezier(0.24, 0, 0.38, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(219, 39, 119, 0.5); }
            70% { transform: scale(1); box-shadow: 0 0 0 30px rgba(219, 39, 119, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(219, 39, 119, 0); }
        }

        button { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        button:active { transform: scale(0.92); }
        
        textarea { font-size: 16px !important; } 
        
        .hint-text {
            letter-spacing: 0.12em;
            background: linear-gradient(90deg, #db2777 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="text-slate-900 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const apiKey = "AIzaSyDctVXHQgKDY3MscN4vSW_LtulGfV9tN-c"; 

        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                'headphones': <path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3" />,
                'zap': <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z" />,
                'play': <path d="m7 4 12 8-12 8V4z" />,
                'pause': <React.Fragment><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></React.Fragment>,
                'rotate-ccw': <React.Fragment><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></React.Fragment>,
                'mic': <React.Fragment><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></React.Fragment>,
                'arrow-right': <React.Fragment><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></React.Fragment>,
                'award': <React.Fragment><circle cx="12" cy="8" r="7"/><path d="M8.21 13.89L7 23l5-3 5 3-1.21-9.12"/><path d="M22 12a10 10 0 0 1-20 0"/></React.Fragment>,
                'lightbulb': <React.Fragment><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A5 5 0 0 0 8 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></React.Fragment>,
                'check-circle': <React.Fragment><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></React.Fragment>
            };

            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        const pcmToWav = (pcmBuffer, sampleRate = 24000) => {
            const buffer = new ArrayBuffer(44 + pcmBuffer.byteLength);
            const view = new DataView(buffer);
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
            };
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + pcmBuffer.byteLength, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); 
            view.setUint16(22, 1, true); 
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, pcmBuffer.byteLength, true);
            new Uint8Array(buffer, 44).set(new Uint8Array(pcmBuffer));
            return new Blob([buffer], { type: 'audio/wav' });
        };

        function App() {
            const [appState, setAppState] = useState('input');
            const [rawText, setRawText] = useState("Technology is best when it brings people together. Learning a new language is like gaining a second soul.");
            const [sentences, setSentences] = useState([]);
            const [currentIdx, setCurrentIdx] = useState(0);
            const [practiceStep, setPracticeStep] = useState('dictation');
            const [userInput, setUserInput] = useState("");
            const [feedback, setFeedback] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [speed, setSpeed] = useState(1.0);
            const [isFetching, setIsFetching] = useState(false);
            const [showHint, setShowHint] = useState(false);

            const audioRef = useRef(new Audio());
            const audioCache = useRef({});
            const prefetchQueue = useRef(new Set());

            const fetchAudio = async (text) => {
                if (audioCache.current[text]) return audioCache.current[text];
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Act as a warm, professional female native English speaker. Speak clearly with natural emotion, proper rhythm, and clear pauses at punctuation. Ensure a high-pitched, distinctly female voice tone: ${text}` }] }],
                            generationConfig: {
                                responseModalities: ["AUDIO"],
                                speechConfig: {
                                    voiceConfig: {
                                        prebuiltVoiceConfig: { voiceName: "Aoede" } // Giọng nữ chuẩn và tự nhiên hơn
                                    }
                                }
                            }
                        })
                    });
                    const data = await response.json();
                    const base64 = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                    if (!base64) return null;
                    const binary = window.atob(base64);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                    const blob = pcmToWav(bytes.buffer);
                    audioCache.current[text] = blob;
                    return blob;
                } catch (e) { return null; }
            };

            const prefetchNext = useCallback(async (idx) => {
                for (let i = 1; i <= 2; i++) {
                    const targetIdx = idx + i;
                    if (targetIdx < sentences.length) {
                        const text = sentences[targetIdx];
                        if (!prefetchQueue.current.has(text)) {
                            prefetchQueue.current.add(text);
                            fetchAudio(text);
                        }
                    }
                }
            }, [sentences]);

            useEffect(() => {
                if (appState === 'practice') prefetchNext(currentIdx);
            }, [currentIdx, appState, prefetchNext]);

            const handlePlay = async () => {
                if (audioRef.current.paused && audioRef.current.src === "") {
                    audioRef.current.load();
                }

                if (isPlaying) {
                    audioRef.current.pause();
                    audioRef.current.currentTime = 0;
                    setIsPlaying(false);
                    return;
                }

                const text = sentences[currentIdx];
                let blob = audioCache.current[text];
                
                if (!blob) {
                    setIsFetching(true);
                    blob = await fetchAudio(text);
                    setIsFetching(false);
                }

                if (blob) {
                    const url = URL.createObjectURL(blob);
                    audioRef.current.src = url;
                    audioRef.current.playbackRate = speed;
                    
                    const playPromise = audioRef.current.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            setIsPlaying(true);
                        }).catch(e => {
                            window.showMessage("Chạm lại để nghe giọng nữ.");
                        });
                    }

                    audioRef.current.onended = () => { 
                        setIsPlaying(false); 
                        URL.revokeObjectURL(url); 
                    };
                } else {
                    // Fallback to Web Speech with female preference
                    const ut = new SpeechSynthesisUtterance(text);
                    const voices = window.speechSynthesis.getVoices();
                    const femaleVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Female') || v.name.includes('Google US English')));
                    if (femaleVoice) ut.voice = femaleVoice;
                    ut.rate = speed;
                    ut.onend = () => setIsPlaying(false);
                    window.speechSynthesis.speak(ut);
                    setIsPlaying(true);
                }
            };

            const handleStart = () => {
                const list = rawText.match(/[^.!?]+[.!?]+|\S+/g)?.map(s => s.trim()).filter(s => s.length > 2) || [];
                if (list.length === 0) return window.showMessage("Vui lòng nhập thêm văn bản.");
                
                audioRef.current.load();
                setSentences(list);
                setCurrentIdx(0);
                setAppState('practice');
                setPracticeStep('dictation');
                setShowHint(false);
            };

            const handleCheck = () => {
                const targetText = sentences[currentIdx];
                const clean = (t) => t.replace(/[^\w\s]|_/g, "").replace(/\s+/g, " ").toLowerCase().trim();
                const targetClean = clean(targetText).split(" ");
                const inputClean = clean(userInput).split(" ");
                let correct = 0;
                const result = targetClean.map((t, i) => {
                    const isOk = t === inputClean[i];
                    if (isOk) correct++;
                    const originalWord = targetText.split(/\s+/)[i] || t;
                    return { word: originalWord, isCorrect: isOk };
                });
                setFeedback({ accuracy: Math.round((correct/targetClean.length)*100), result });
                setPracticeStep('feedback');
            };

            const nextStep = () => {
                if (currentIdx < sentences.length - 1) {
                    setCurrentIdx(prev => prev + 1);
                    setUserInput("");
                    setFeedback(null);
                    setPracticeStep('dictation');
                    setShowHint(false);
                } else {
                    setAppState('results');
                }
            };

            const getHintText = () => {
                const words = sentences[currentIdx].split(/\s+/);
                return words.map(word => {
                    if (word.length <= 2) return word;
                    return word[0] + "_".repeat(word.length - 1);
                }).join(" ");
            };

            return (
                <div className="min-h-screen flex flex-col items-center pb-20 pt-4 px-4 overflow-x-hidden">
                    <header className="w-full max-w-2xl px-6 py-4 flex items-center justify-between sticky top-4 z-50 glass-panel rounded-3xl mb-8">
                        <div className="flex items-center gap-3">
                            <div className="bg-pink-600 p-2 rounded-2xl text-white shadow-lg">
                                <Icon name="headphones" size={20}/>
                            </div>
                            <h1 className="font-extrabold text-slate-800 tracking-tight text-lg">Dictate<span className="text-pink-600">Pro</span></h1>
                        </div>
                        <div className="flex items-center gap-2">
                            <span className="text-[10px] font-black text-pink-600 bg-pink-50 px-3 py-1 rounded-full tracking-widest border border-pink-100 uppercase italic">Natural Female</span>
                        </div>
                    </header>

                    <main className="w-full max-w-xl">
                        {appState === 'input' && (
                            <div className="glass-panel p-8 rounded-[2.5rem] animate-in">
                                <h2 className="text-2xl font-black text-slate-800 mb-6 flex items-center gap-2">
                                    <Icon name="zap" className="text-pink-600" size={24}/> Văn bản luyện tập
                                </h2>
                                <textarea 
                                    className="w-full h-56 p-6 border-2 border-slate-100 rounded-3xl focus:border-pink-400 focus:ring-4 focus:ring-pink-100 outline-none transition-all bg-white/50 leading-relaxed font-semibold text-lg" 
                                    value={rawText} 
                                    onChange={e => setRawText(e.target.value)}
                                    placeholder="Dán văn bản tiếng Anh tại đây..."
                                />
                                <button onClick={handleStart} className="w-full mt-8 py-5 bg-pink-600 text-white font-black rounded-3xl shadow-2xl flex items-center justify-center gap-3 hover:bg-pink-700 active:scale-95 text-xl">
                                    Bắt đầu học ngay <Icon name="play" size={20}/>
                                </button>
                            </div>
                        )}

                        {appState === 'practice' && (
                            <div className="space-y-8 animate-in">
                                <div className="flex items-center justify-between px-4">
                                    <div className="flex flex-col">
                                        <span className="text-[10px] font-black text-slate-400 tracking-widest uppercase mb-1">Tiến độ</span>
                                        <span className="text-sm font-bold text-slate-800">{currentIdx + 1} / {sentences.length}</span>
                                    </div>
                                    <div className="h-2.5 w-32 bg-slate-200 rounded-full overflow-hidden shadow-inner">
                                        <div className="h-full bg-gradient-to-r from-pink-500 to-purple-500 transition-all duration-700" style={{width: `${((currentIdx+1)/sentences.length)*100}%`}}></div>
                                    </div>
                                </div>

                                <div className="glass-panel p-8 rounded-[3rem] flex flex-col items-center relative overflow-hidden">
                                    <div className="w-full flex justify-center mb-8 relative z-10">
                                        <div className="p-1.5 bg-slate-100/80 rounded-2xl flex gap-1 shadow-inner">
                                            {[0.8, 1.0, 1.2, 1.5].map(s => (
                                                <button 
                                                    key={s} 
                                                    onClick={() => setSpeed(s)} 
                                                    className={`w-12 py-2.5 rounded-xl text-[10px] font-black transition-all ${speed === s ? 'bg-white text-pink-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                                                >
                                                    {s}x
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <button 
                                        onClick={handlePlay}
                                        className={`w-32 h-32 rounded-full flex items-center justify-center text-white shadow-2xl transition-all relative z-10 ${isPlaying ? 'bg-pink-400 voice-pulse-ring' : 'bg-pink-600 hover:bg-pink-500 active:scale-90 shadow-pink-200'}`}
                                    >
                                        {isFetching ? (
                                            <div className="w-12 h-12 border-4 border-white/30 border-t-white rounded-full animate-spin"></div>
                                        ) : isPlaying ? (
                                            <Icon name="pause" size={48} className="fill-current"/>
                                        ) : (
                                            <Icon name="play" className="ml-2 fill-current" size={56}/>
                                        )}
                                    </button>
                                    <p className="mt-8 text-[11px] font-black text-pink-500 uppercase tracking-[0.3em] relative z-10">
                                        {isPlaying ? "Đang phát giọng Nữ..." : "Chạm để nghe"}
                                    </p>
                                </div>

                                <div className="glass-panel p-8 rounded-[3rem] shadow-xl">
                                    {practiceStep === 'dictation' && (
                                        <div className="space-y-6">
                                            <div className="flex items-center justify-between">
                                                <span className="text-xs font-black text-slate-400 uppercase tracking-widest">Nghe và chép lại</span>
                                                <button 
                                                    onClick={() => setShowHint(!showHint)}
                                                    className={`flex items-center gap-2 px-4 py-2 rounded-xl text-[10px] font-black transition-all ${showHint ? 'bg-amber-100 text-amber-600' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}
                                                >
                                                    <Icon name="lightbulb" size={14}/> {showHint ? "Ẩn gợi ý" : "Gợi ý"}
                                                </button>
                                            </div>

                                            {showHint && (
                                                <div className="p-5 bg-amber-50/50 border border-amber-100 rounded-2xl animate-in text-center italic">
                                                    <p className="hint-text font-mono text-sm break-words tracking-widest">{getHintText()}</p>
                                                </div>
                                            )}

                                            <textarea 
                                                className="w-full p-6 border-2 border-slate-100 rounded-[2rem] focus:border-pink-400 focus:ring-4 focus:ring-pink-50 outline-none h-40 leading-relaxed font-bold text-xl bg-white/50 shadow-inner"
                                                placeholder="Gõ lại những gì bạn nghe..."
                                                value={userInput}
                                                onChange={e => setUserInput(e.target.value)}
                                            />
                                            <button 
                                                onClick={handleCheck} 
                                                disabled={!userInput.trim()} 
                                                className="w-full py-5 bg-gradient-to-r from-emerald-600 to-emerald-500 text-white font-black rounded-3xl shadow-xl shadow-emerald-100 transition-all text-xl active:scale-95"
                                            >
                                                KIỂM TRA
                                            </button>
                                        </div>
                                    )}

                                    {practiceStep === 'feedback' && feedback && (
                                        <div className="space-y-8 animate-in">
                                            <div className={`p-8 rounded-[2.5rem] border-2 text-center ${feedback.accuracy === 100 ? 'bg-emerald-50 border-emerald-100' : 'bg-rose-50 border-rose-100'}`}>
                                                <div className="text-4xl font-black mb-6 flex items-center justify-center gap-2">
                                                    <span className={feedback.accuracy === 100 ? 'text-emerald-600' : 'text-rose-500'}>{feedback.accuracy}%</span>
                                                    <Icon name={feedback.accuracy === 100 ? "check-circle" : "zap"} className={feedback.accuracy === 100 ? 'text-emerald-500' : 'text-rose-500'} size={32}/>
                                                </div>
                                                <div className="text-xl leading-relaxed font-bold flex flex-wrap gap-x-3 justify-center">
                                                    {feedback.result.map((word, i) => (
                                                        <span key={i} className={word.isCorrect ? 'text-emerald-700' : 'text-rose-600 underline decoration-wavy decoration-rose-300'}>
                                                            {word.word}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>

                                            <div className="flex flex-col gap-4">
                                                {feedback.accuracy < 100 && (
                                                    <button 
                                                        onClick={() => { setPracticeStep('dictation'); setUserInput(""); setShowHint(false); }}
                                                        className="w-full py-6 bg-orange-500 text-white font-black rounded-[2rem] shadow-xl shadow-orange-100 flex items-center justify-center gap-3 text-2xl active:scale-95 transition-all"
                                                    >
                                                        <Icon name="rotate-ccw" size={28}/> NHẬP LẠI
                                                    </button>
                                                )}
                                                <div className="grid grid-cols-2 gap-4">
                                                    <button onClick={() => setAppState('input')} className="py-5 bg-white border-2 border-slate-100 text-slate-700 font-bold rounded-3xl">Đổi bài</button>
                                                    <button onClick={nextStep} className="py-5 bg-slate-900 text-white font-black rounded-3xl shadow-2xl flex items-center justify-center gap-2 active:scale-95 transition-all">Câu kế <Icon name="arrow-right" size={18}/></button>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {appState === 'results' && (
                            <div className="glass-panel p-12 rounded-[3.5rem] shadow-2xl text-center animate-in">
                                <div className="w-24 h-24 bg-gradient-to-tr from-pink-600 to-purple-600 text-white rounded-3xl flex items-center justify-center mx-auto mb-8 rotate-12 shadow-2xl shadow-pink-100">
                                    <Icon name="award" size={48}/>
                                </div>
                                <h2 className="text-4xl font-black text-slate-800 mb-4 tracking-tight">Tuyệt vời!</h2>
                                <p className="text-slate-500 font-medium mb-12 leading-relaxed text-lg">Bạn đã hoàn thành bài học với giọng nữ tự nhiên nhất.</p>
                                <button onClick={() => window.location.reload()} className="w-full py-6 bg-pink-600 text-white font-black rounded-[2rem] shadow-2xl flex items-center justify-center gap-3 hover:bg-pink-700 text-xl transition-all">
                                    <Icon name="rotate-ccw" size={24}/> LUYỆN BÀI MỚI
                                </button>
                            </div>
                        )}
                    </main>

                    <div id="toast" className="fixed bottom-10 left-1/2 -translate-x-1/2 z-[100] pointer-events-none opacity-0 transition-opacity">
                        <div className="bg-slate-900/90 backdrop-blur-md text-white px-8 py-4 rounded-3xl text-xs font-black uppercase tracking-widest shadow-2xl"></div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        window.showMessage = (msg) => {
            const box = document.getElementById('toast');
            if (box) { box.firstChild.innerText = msg; box.style.opacity = '1'; setTimeout(() => box.style.opacity = '0', 3000); }
        };
    </script>
</body>
</html>
