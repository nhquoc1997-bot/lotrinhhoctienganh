        const [testEvaluated, setTestEvaluated] = useState(false);

        const [isListening, setIsListening] = useState(false);
        const [transcript, setTranscript] = useState('');
        const [showHint, setShowHint] = useState(false);
        const [evaluation, setEvaluation] = useState(null); 
        const [error, setError] = useState('');
        
        // Thêm state để tạo hiệu ứng nhấp nháy UI khi đang đọc
        const [isPlayingTTS, setIsPlayingTTS] = useState(false);

        const recognitionRef = useRef(null);

        // --- THIẾT LẬP APP (MIC & AUDIO) ---
        useEffect(() => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognitionRef.current = recognition;
            } else {
            setError('Trình duyệt không hỗ trợ nhận diện giọng nói. Hãy dùng Chrome hoặc Edge.');
            }

            // Gọi lại getVoices trong useEffect để đảm bảo React cũng nắm được danh sách
            if (window.speechSynthesis) {
                window.speechSynthesis.getVoices();
            }
        }, []);

        // ==========================================
        // 2. HÀM ĐỌC VĂN BẢN THÔNG MINH (TÍCH HỢP TỪ DỰ ÁN AUDIO MODULE)
        // ==========================================
        const playTTS = (text, customRate = null) => {
            if (!('speechSynthesis' in window)) {
                console.warn("Trình duyệt của bạn không hỗ trợ đọc văn bản.");
                return;
            }

            // Dừng mọi âm thanh đang phát
            window.speechSynthesis.cancel(); 
            const cleanText = text.trim();
            const utterance = new SpeechSynthesisUtterance(cleanText); 
            utterance.lang = 'en-US'; 

            // --- LỌC GIỌNG ĐỌC THÔNG MINH ---
            const isAppleDevice = /(Mac|iPhone|iPod|iPad)/i.test(navigator.userAgent);
            
            if (!isAppleDevice) {
                // Trên Windows/Android: Tìm giọng Google/Natural hoặc Premium
                const voices = window.speechSynthesis.getVoices();
                const premiumVoice = voices.find(v => 
                    v.name.includes('Google US English') || 
                    v.name.includes('Natural') || 
                    v.name.includes('Premium')
                );
                
                // Nếu có giọng tốt sẽ gán vào, nếu không có hệ thống tự dùng mặc định
                if (premiumVoice) {
                    utterance.voice = premiumVoice;
                }
            }
            // Nếu là thiết bị Apple, ta không gán utterance.voice để hệ thống tự dùng giọng Siri tự nhiên của máy

            // Tinh chỉnh tốc độ: 
            if (customRate !== null) {
                utterance.rate = customRate;
            } else {
                utterance.rate = cleanText.includes(' ') ? 1.0 : 0.8; 
            }

            // Hiệu ứng giao diện (pulse effect) giống như Audio Module
            utterance.onstart = () => setIsPlayingTTS(true);
            utterance.onend = () => setIsPlayingTTS(false);
            utterance.onerror = () => setIsPlayingTTS(false);

            window.speechSynthesis.speak(utterance); 
        };

        // Đọc 1 từ cụ thể khi click
        const playWord = (word) => {
            const cleanWord = word.replace(/[.,!?]/g, '');
            // Không truyền customRate để kích hoạt tốc độ 0.8 tự động
            playTTS(cleanWord); 
        };

        // --- TÍNH ĐIỂM ---
        const calculateScore = (spoken, target) => {
            const cleanWord = (w) => w.toLowerCase().replace(/[.,!?]/g, '').trim();
            const targetWords = target.split(' ').map(w => ({ original: w, clean: cleanWord(w) }));
            const spokenWords = spoken.split(' ').map(cleanWord);
            
            let correctCount = 0;
            const wordFeedback = targetWords.map(tw => {
            const isCorrect = spokenWords.includes(tw.clean);
            if (isCorrect) correctCount++;
            return { word: tw.original, isCorrect };
            });

            const score = Math.round((correctCount / targetWords.length) * 100);
            return { score, wordFeedback };
        };

        // --- BẮT ĐẦU NGHE (MICRO) ---
        const handleListen = async (targetText) => {
            if (!recognitionRef.current) return;
            setError(''); 
            setTranscript(''); 
            setEvaluation(null); 
            setTestEvaluated(false); 
            if(window.speechSynthesis) window.speechSynthesis.cancel(); // Tắt giọng đọc mẫu nếu đang đọc
            setIsPlayingTTS(false); // Xóa hiệu ứng play nếu có
            
            // Khởi động Nhận diện giọng nói (Chấm điểm)
            recognitionRef.current.onresult = (event) => {
            const spokenText = event.results[0][0].transcript;
            setTranscript(spokenText);
            const result = calculateScore(spokenText, targetText);
            setEvaluation(result);
            setIsListening(false);

            if (screen === 'TEST') {
                setTestEvaluated(true);
                if (result.score >= 80) setTestScore(prev => prev + 1);
            }
            };

            recognitionRef.current.onerror = (event) => {
            if (event.error !== 'aborted') setError('Không nghe được giọng nói. Thử lại nhé.');
            setIsListening(false);
            };
            recognitionRef.current.onend = () => {
            setIsListening(false);
            };

            try { 
            recognitionRef.current.start(); 
            setIsListening(true); 
            } catch (e) { 
            console.log('Mic is busy'); 
            }
        };

        // --- ĐIỀU HƯỚNG ---
        const goHome = () => { setScreen('MENU'); resetStates(); };
        const startLearn = (partIdx) => { setActivePartIdx(partIdx); setCurrentLessonIdx(0); resetStates(); setScreen('LEARN'); };
        const startTest = (partIdx) => {
            const shuffled = [...COURSE_DATA[partIdx].lessons].sort(() => 0.5 - Math.random());
            setActivePartIdx(partIdx); setTestQuestions(shuffled); setTestCurrentIdx(0); setTestScore(0); resetStates(); setScreen('TEST');
        };
        const resetStates = () => { 
            setTranscript(''); setEvaluation(null); setShowHint(false); setError(''); 
            setTestEvaluated(false); 
            setIsPlayingTTS(false);
            if(window.speechSynthesis) window.speechSynthesis.cancel();
        };
        const handleRetry = () => {
            setTranscript(''); 
            setEvaluation(null); 
            setError(''); 
            setIsPlayingTTS(false);
            if(window.speechSynthesis) window.speechSynthesis.cancel();
        };
        const handleNextLearn = () => { if (currentLessonIdx < COURSE_DATA[activePartIdx].lessons.length - 1) { setCurrentLessonIdx(currentLessonIdx + 1); resetStates(); } };
        const handleNextTest = () => { if (testCurrentIdx < testQuestions.length - 1) { setTestCurrentIdx(testCurrentIdx + 1); resetStates(); } else { setScreen('RESULT'); } };

        // --- RENDER MÀN HÌNH CHÍNH (MENU) ---
        if (screen === 'MENU') {
            return (
            <div className="min-h-screen bg-gray-900 flex items-center justify-center p-4 font-sans sm:py-8">
                <div className="w-full max-w-[400px] h-[800px] max-h-[90vh] bg-gray-50 rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col border-[8px] border-gray-800">
                <div className="bg-amber-400 p-6 pt-10 pb-8 text-gray-900 rounded-b-3xl shadow-sm relative">
                    <h1 className="text-3xl font-black mb-1">BobSpeaker</h1>
                    <p className="font-medium opacity-80 flex items-center gap-1.5">Luyện Phát Âm Tiếng Anh</p>
                </div>
                
                <div className="flex-1 overflow-y-auto p-4 flex flex-col gap-4 pb-8">
                    {COURSE_DATA.map((part, idx) => (
                    <div key={part.id} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col gap-3">
                        <div className="flex items-start gap-3">
                        <div className="bg-amber-100 text-amber-600 p-3 rounded-xl shrink-0"><BookOpen size={24} /></div>
                        <div>
                            <h3 className="font-bold text-gray-800 text-lg leading-tight">{part.title}</h3>
                            <p className="text-sm text-gray-500 line-clamp-2 mt-1">{part.desc}</p>
                            <p className="text-xs text-amber-500 font-bold mt-1">{part.lessons.length} Bài học</p>
                        </div>
                        </div>
                        <div className="grid grid-cols-2 gap-2 mt-2">
                        <button onClick={() => startLearn(idx)} className="bg-blue-50 text-blue-600 font-semibold py-2.5 rounded-xl text-sm hover:bg-blue-100 transition-colors">Học ngay</button>
                        <button onClick={() => startTest(idx)} className="bg-amber-50 text-amber-600 font-semibold py-2.5 rounded-xl text-sm flex items-center justify-center gap-1.5 hover:bg-amber-100 transition-colors"><Award size={16} /> Kiểm tra</button>
                        </div>
                    </div>
                    ))}
                </div>
                </div>
            </div>
            );
        }

        // --- RENDER MÀN HÌNH KẾT QUẢ ---
        if (screen === 'RESULT') {
            const percentage = Math.round((testScore / testQuestions.length) * 100);
            return (
            <div className="min-h-screen bg-gray-900 flex items-center justify-center p-4 font-sans sm:py-8">
                <div className="w-full max-w-[400px] h-[800px] max-h-[90vh] bg-white rounded-[2.5rem] shadow-2xl relative flex flex-col border-[8px] border-gray-800 p-8 items-center text-center pt-24">
                <Trophy size={80} className={`${percentage >= 80 ? 'text-amber-400' : 'text-gray-300'} mb-6`} />
                <h2 className="text-3xl font-black text-gray-800 mb-2">Hoàn thành!</h2>
                <p className="text-gray-500 font-medium mb-8">Bài kiểm tra: {COURSE_DATA[activePartIdx].title}</p>
                
                <div className="bg-gray-50 w-full rounded-2xl p-6 mb-8 border border-gray-100">
                    <p className="text-sm text-gray-400 uppercase tracking-widest font-bold mb-2">Số câu đúng</p>
                    <div className="text-5xl font-black text-blue-600">{testScore} <span className="text-2xl text-gray-400">/ {testQuestions.length}</span></div>
                </div>

                <div className="flex flex-col gap-3 w-full mt-auto">
                    <button onClick={() => startTest(activePartIdx)} className="bg-amber-400 text-gray-900 font-bold py-4 rounded-xl shadow-lg shadow-amber-200">Làm lại bài kiểm tra</button>
                    <button onClick={goHome} className="bg-gray-100 text-gray-600 font-bold py-4 rounded-xl hover:bg-gray-200">Về trang chủ</button>
                </div>
                </div>
            </div>
            );
        }

        // --- RENDER MÀN HÌNH LUYỆN TẬP & KIỂM TRA ---
        const isTest = screen === 'TEST';
        const currentLessonList = isTest ? testQuestions : COURSE_DATA[activePartIdx].lessons;
        const currentGlobalIdx = isTest ? testCurrentIdx : currentLessonList;
        const lesson = currentLessonList[isTest ? testCurrentIdx : currentLessonIdx];
        const progress = ((isTest ? testCurrentIdx : currentLessonIdx) / currentLessonList.length) * 100;

        return (
            <div className="min-h-screen bg-gray-900 flex items-center justify-center p-4 font-sans sm:py-8">
            <div className="w-full max-w-[400px] h-[800px] max-h-[90vh] bg-white rounded-[2.5rem] shadow-2xl relative overflow-hidden flex flex-col border-[8px] border-gray-800">
                
                {/* Header App */}
                <div className={`px-4 pt-8 pb-4 flex items-center justify-between z-10 ${isTest ? 'bg-indigo-50' : 'bg-white'}`}>
                <button onClick={goHome} className="text-gray-400 hover:text-gray-600 p-2"><ArrowLeft size={24} /></button>
                <div className="flex-1 mx-2 h-2.5 bg-gray-200 rounded-full overflow-hidden">
                    <div className={`h-full transition-all duration-500 ease-out rounded-full ${isTest ? 'bg-indigo-500' : 'bg-amber-400'}`} style={{ width: `${progress}%` }} />
                </div>
                <div className={`font-bold text-sm px-2 ${isTest ? 'text-indigo-600' : 'text-amber-500'}`}>
                    {(isTest ? testCurrentIdx : currentLessonIdx) + 1}/{currentLessonList.length}
                </div>
                </div>

                {/* Content */}
                <div className="flex-1 px-6 flex flex-col pt-4 overflow-y-auto pb-44">
                <div className="mb-3">
                    <span className={`px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${isTest ? 'bg-indigo-100 text-indigo-700' : 'bg-amber-100 text-amber-700'}`}>
                    {isTest ? 'Chế độ kiểm tra' : 'Luyện nói'}
                    </span>
                </div>

                <h2 className="text-2xl font-bold text-gray-800 mb-6 leading-snug">"{lesson.vn}"</h2>

                {!isTest && (
                    <>
                    {!showHint && !evaluation ? (
                        <button onClick={() => setShowHint(true)} className="w-full py-4 border-2 border-dashed border-gray-300 rounded-2xl text-gray-500 font-medium hover:bg-gray-50 transition-colors flex items-center justify-center gap-2">
                        <Info size={20} /> Xem gợi ý tiếng Anh
                        </button>
                    ) : (
                        <div className="bg-blue-50 rounded-2xl p-5 border border-blue-100">
                        <div className="flex justify-between items-start mb-3">
                            <p className="text-blue-900 font-semibold text-xl leading-relaxed flex flex-wrap gap-x-1.5 gap-y-1 flex-1">
                            {evaluation ? (
                                evaluation.wordFeedback.map((item, i) => (
                                <span 
                                    key={i} 
                                    onClick={() => playWord(item.word)}
                                    className={`cursor-pointer hover:opacity-70 transition-opacity ${item.isCorrect ? "text-green-600" : "text-red-500 underline decoration-wavy decoration-red-300"}`}
                                    title="Bấm để nghe từ này"
                                >
                                    {item.word}
                                </span>
                                ))
                            ) : ( 
                                lesson.en.split(' ').map((word, idx) => (
                                <span 
                                    key={idx} 
                                    onClick={() => playWord(word)} 
                                    className="cursor-pointer hover:text-blue-600 hover:bg-blue-100 rounded px-1 -mx-1 transition-colors"
                                    title="Bấm để nghe từ này"
                                >
                                    {word}
                                </span>
                                ))
                            )}
                            </p>
                            
                            {/* Nút Đọc Giọng Tích hợp (Có hiệu ứng Pulse) */}
                            <div className="flex gap-1 ml-2 shrink-0">
                            <button onClick={() => playTTS(lesson.en, 0.5)} className={`bg-white p-2 rounded-full shadow-sm transition-all ${isPlayingTTS ? 'text-blue-400 animate-pulse' : 'text-blue-600 hover:bg-blue-50'}`} title="Đọc chậm">
                                <Volume1 size={20} />
                            </button>
                            <button onClick={() => playTTS(lesson.en, 0.85)} className={`bg-white p-2 rounded-full shadow-sm transition-all ${isPlayingTTS ? 'text-blue-400 animate-pulse' : 'text-blue-600 hover:bg-blue-50'}`} title="Đọc bình thường">
                                <Volume2 size={20} />
                            </button>
                            </div>
                        </div>
                        <div className="text-sm text-blue-700 opacity-80 border-t border-blue-200 pt-3 flex items-center justify-between mt-2">
                            <span>💡 {lesson.hint}</span>
                            <span className="text-[10px] font-bold text-blue-500 bg-blue-100 px-2 py-1 rounded-full whitespace-nowrap ml-2">Bấm vào từ để nghe</span>
                        </div>
                        </div>
                    )}
                    </>
                )}

                {isTest && testEvaluated && evaluation && (
                    <div className="bg-indigo-50 rounded-2xl p-5 border border-indigo-100 mt-2">
                        <div className="flex justify-between items-start">
                        <div className="flex-1">
                            <p className="text-xs uppercase font-bold text-indigo-400 mb-2">Đáp án chính xác (Bấm từ để nghe):</p>
                            <p className="text-indigo-900 font-semibold text-xl leading-relaxed flex flex-wrap gap-x-1.5 gap-y-1">
                            {evaluation.wordFeedback.map((item, i) => (
                                <span 
                                key={i} 
                                onClick={() => playWord(item.word)}
                                className={`cursor-pointer hover:opacity-70 transition-opacity ${item.isCorrect ? "text-green-600" : "text-red-500 underline decoration-wavy decoration-red-300"}`}
                                >
                                {item.word}
                                </span>
                            ))}
                            </p>
                        </div>
                        
                        {/* Nút Đọc Giọng Tích hợp trong Bài Kiểm tra */}
                        <div className="flex gap-1 ml-2 shrink-0">
                            <button onClick={() => playTTS(lesson.en, 0.5)} className={`bg-white p-2 rounded-full shadow-sm transition-all ${isPlayingTTS ? 'text-indigo-400 animate-pulse' : 'text-indigo-600 hover:bg-indigo-50'}`} title="Đọc chậm">
                            <Volume1 size={20} />
                            </button>
                            <button onClick={() => playTTS(lesson.en, 0.85)} className={`bg-white p-2 rounded-full shadow-sm transition-all ${isPlayingTTS ? 'text-indigo-400 animate-pulse' : 'text-indigo-600 hover:bg-indigo-50'}`} title="Đọc bình thường">
                            <Volume2 size={20} />
                            </button>
                        </div>
                        </div>
                    </div>
                )}

                {error && <div className="mt-4 p-3 bg-red-50 text-red-600 rounded-xl text-sm flex items-center gap-2"><AlertCircle size={16} /> {error}</div>}

                {transcript && !isListening && (
                    <div className="mt-4">
                    <p className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Bạn đã nói:</p>
                    <p className="text-gray-600 italic bg-gray-50 p-4 rounded-xl border border-gray-100">"{transcript}"</p>
                    </div>
                )}
                </div>

                {/* Footer Controls */}
                <div className="absolute bottom-0 left-0 w-full bg-white border-t border-gray-100 px-6 py-6 flex flex-col items-center pb-8 z-20">
                {evaluation && (
                    <div className="w-full flex items-center justify-between mb-4">
                    <div className="flex items-center gap-2">
                        {evaluation.score >= 80 ? (
                        <span className="flex items-center gap-1.5 text-green-600 font-bold bg-green-50 px-3 py-1.5 rounded-lg whitespace-nowrap"><CheckCircle2 size={18} /> Tuyệt!</span>
                        ) : (
                        <span className="flex items-center gap-1.5 text-red-600 font-bold bg-red-50 px-3 py-1.5 rounded-lg whitespace-nowrap">Đạt {evaluation.score}%</span>
                        )}
                    </div>
                    
                    <div className="flex gap-2">
                        {/* NÚT "THỬ LẠI" */}
                        {!isTest && (
                        <button onClick={handleRetry} className="bg-gray-100 text-gray-700 px-4 py-2.5 rounded-xl font-bold flex items-center gap-1 hover:bg-gray-200 transition-colors">
                            <RefreshCw size={18} /> Thử lại
                        </button>
                        )}
                        
                        {!isTest && currentLessonIdx === currentLessonList.length - 1 ? (
                        <button onClick={() => startTest(activePartIdx)} className="bg-amber-500 text-white px-4 py-2.5 rounded-xl font-bold flex items-center gap-1 animate-pulse">
                            Kiểm tra <Award size={18} />
                        </button>
                        ) : (
                        <button onClick={isTest ? handleNextTest : handleNextLearn} className="bg-gray-900 text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-1">
                            Tiếp <ChevronRight size={18} />
                        </button>
                        )}
                    </div>
                    </div>
                )}

                <button
                    onClick={() => handleListen(lesson.en)}
                    // Nút Micro chính bị khóa (giới hạn) khi đã có điểm hoặc đã làm xong bài kiểm tra
                    disabled={evaluation !== null || (isTest && testEvaluated)} 
                    className={`w-20 h-20 rounded-full flex items-center justify-center transition-all duration-300 ${
                    isListening ? 'bg-red-500 text-white shadow-[0_0_0_8px_rgba(239,68,68,0.2)] animate-pulse-ring' 
                        : (evaluation || (isTest && testEvaluated)) ? 'bg-gray-100 text-gray-400 cursor-not-allowed'
                        : isTest ? 'bg-indigo-500 text-white shadow-xl shadow-indigo-200 hover:scale-105 active:scale-95'
                        : 'bg-amber-400 text-gray-900 shadow-xl shadow-amber-200 hover:scale-105 active:scale-95'
                    }`}
                >
                    <Mic size={isListening ? 32 : 36} />
                </button>
                <p className="text-gray-400 text-sm mt-3 font-medium">
                    {isListening ? 'Đang nghe...' : (isTest && testEvaluated) ? 'Bấm Tiếp để sang câu sau' : evaluation ? 'Đã ghi âm xong' : 'Chạm để nói'}
                </p>
                </div>
            </div>
            </div>
        );
        }

        // --- Render the App ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
