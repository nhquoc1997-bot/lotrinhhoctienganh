        function App() {
            const [selectedTopic, setSelectedTopic] = useState(null);
            const [currentStep, setCurrentStep] = useState(0);
            const [showTrans, setShowTrans] = useState(false);
            const [isSpeaking, setIsSpeaking] = useState(false);

            // Nâng cấp TTS
            const speak = useCallback((text) => {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                const voices = window.speechSynthesis.getVoices();
                
                // Chọn giọng tự nhiên nhất
                const preferredVoice = voices.find(v => 
                    (v.name.includes("Google") || v.name.includes("Enhanced") || v.name.includes("Natural")) 
                    && v.lang.startsWith("en")
                ) || voices.find(v => v.lang.startsWith("en-US"));
                
                if (preferredVoice) utterance.voice = preferredVoice;
                utterance.rate = 0.9;
                utterance.pitch = 1.05;
                
                utterance.onstart = () => setIsSpeaking(true);
                utterance.onend = () => setIsSpeaking(false);
                window.speechSynthesis.speak(utterance);
            }, []);

            const currentQuestion = useMemo(() => 
                selectedTopic ? selectedTopic.questions[currentStep] : null
            , [selectedTopic, currentStep]);

            const progress = selectedTopic ? ((currentStep + 1) / 10) * 100 : 0;

            const next = () => {
                if (currentStep < 9) {
                    setCurrentStep(prev => prev + 1);
                    setShowTrans(false);
                } else {
                    setSelectedTopic(null);
                }
            };

            const back = () => {
                if (currentStep > 0) {
                    setCurrentStep(prev => prev - 1);
                    setShowTrans(false);
                }
            };

            return (
                <div className="max-w-6xl mx-auto px-4 py-8 md:py-12">
                    {/* Header */}
                    <div className="flex justify-between items-center mb-10">
                        <div>
                            <h1 className="text-3xl font-extrabold text-slate-900 tracking-tight">SpeakMaster Pro</h1>
                            <p className="text-slate-500 font-medium">Luyện nói Tiếng Anh B1-B2 • 200 Câu hỏi</p>
                        </div>
                        {selectedTopic && (
                            <button 
                                onClick={() => setSelectedTopic(null)}
                                className="p-3 bg-white border border-slate-200 rounded-full hover:bg-slate-50 transition-all shadow-sm"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                            </button>
                        )}
                    </div>

                    {!selectedTopic ? (
                        <div className="animate-in fade-in duration-700">
                            {/* B1 Topics */}
                            <div className="mb-10">
                                <h2 className="text-lg font-black text-blue-600 uppercase tracking-widest mb-6 flex items-center gap-3">
                                    <span className="w-8 h-1 bg-blue-600 rounded-full"></span>
                                    10 Chủ đề trình độ B1
                                </h2>
                                <div className="topic-grid">
                                    {APP_DATA.slice(0, 10).map(t => (
                                        <TopicCard key={t.id} topic={t} onClick={() => { setSelectedTopic(t); setCurrentStep(0); }} />
                                    ))}
                                </div>
                            </div>

                            {/* B2 Topics */}
                            <div>
                                <h2 className="text-lg font-black text-indigo-600 uppercase tracking-widest mb-6 flex items-center gap-3">
                                    <span className="w-8 h-1 bg-indigo-600 rounded-full"></span>
                                    10 Chủ đề trình độ B2
                                </h2>
                                <div className="topic-grid">
                                    {APP_DATA.slice(10, 20).map(t => (
                                        <TopicCard key={t.id} topic={t} onClick={() => { setSelectedTopic(t); setCurrentStep(0); }} />
                                    ))}
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="max-w-3xl mx-auto animate-in slide-in-from-bottom-8 duration-500">
                            {/* Progress bar */}
                            <div className="mb-10 text-center">
                                <div className="flex justify-between text-[11px] font-black text-slate-400 uppercase tracking-widest mb-3">
                                    <span>{selectedTopic.topic}</span>
                                    <span>Câu {currentStep + 1} / 10</span>
                                </div>
                                <div className="w-full h-3 bg-slate-200 rounded-full overflow-hidden shadow-inner">
                                    <div className="h-full bg-blue-600 progress-bar" style={{width: `${progress}%`}}></div>
                                </div>
                            </div>

                            {/* Flashcard */}
                            <div className="glass-card rounded-[3rem] p-10 md:p-16 shadow-2xl relative overflow-hidden">
                                <div className={`absolute top-0 right-0 px-8 py-2 rounded-bl-3xl text-[10px] font-black uppercase tracking-widest ${selectedTopic.level === 'B1' ? 'bg-blue-600 text-white' : 'bg-indigo-600 text-white'}`}>
                                    Level {selectedTopic.level}
                                </div>

                                <div className="min-h-[200px] flex flex-col items-center justify-center text-center">
                                    <h3 className="text-3xl md:text-4xl font-extrabold text-slate-800 leading-tight mb-10">
                                        {currentQuestion.text}
                                    </h3>

                                    <div className="flex gap-4 items-center">
                                        <button 
                                            onClick={() => speak(currentQuestion.text)}
                                            className={`w-20 h-20 rounded-full flex items-center justify-center transition-all active:scale-90 ${isSpeaking ? 'bg-blue-600 text-white pulse-ring' : 'bg-blue-50 text-blue-600 hover:bg-blue-100'}`}
                                        >
                                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                                        </button>
                                        <button 
                                            onClick={() => setShowTrans(!showTrans)}
                                            className="px-6 py-3 border-2 border-slate-100 rounded-2xl font-bold text-slate-400 hover:text-blue-600 hover:border-blue-100 transition-all"
                                        >
                                            {showTrans ? 'Ẩn bản dịch' : 'Xem bản dịch'}
                                        </button>
                                    </div>

                                    {showTrans && (
                                        <p className="mt-10 text-xl font-semibold text-slate-500 italic animate-in fade-in slide-in-from-top-4 duration-300">
                                            "{currentQuestion.trans}"
                                        </p>
                                    )}
                                </div>

                                {/* Vocabulary */}
                                <div className="mt-16 pt-10 border-t border-slate-100">
                                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Vocabulary Support</p>
                                    <div className="flex flex-wrap gap-3">
                                        {currentQuestion.vocab.map((v, i) => (
                                            <div 
                                                key={i} 
                                                onClick={() => speak(v.w)}
                                                className="bg-slate-50 px-5 py-3 rounded-2xl cursor-pointer hover:bg-blue-50 border border-transparent hover:border-blue-200 transition-all flex flex-col items-start"
                                            >
                                                <span className="font-bold text-slate-800">{v.w}</span>
                                                <span className="text-[10px] text-slate-400 font-medium">{v.m}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Actions */}
                                <div className="mt-12 flex gap-4">
                                    <button 
                                        disabled={currentStep === 0}
                                        onClick={back}
                                        className="flex-1 py-5 bg-white border border-slate-200 rounded-[1.5rem] font-bold text-slate-500 hover:bg-slate-50 transition-all disabled:opacity-0"
                                    >
                                        Quay lại
                                    </button>
                                    <button 
                                        onClick={next}
                                        className="flex-[2] py-5 bg-slate-900 text-white rounded-[1.5rem] font-black text-lg shadow-xl shadow-slate-200 hover:bg-blue-600 transition-all active:scale-[0.98]"
                                    >
                                        {currentStep === 9 ? 'Hoàn thành' : 'Tiếp theo'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function TopicCard({ topic, onClick }) {
            return (
                <div 
                    onClick={onClick}
                    className="glass-card p-6 rounded-3xl cursor-pointer hover:-translate-y-1 hover:shadow-xl transition-all border-l-4 group"
                    style={{ borderLeftColor: topic.level === 'B1' ? '#2563eb' : '#4f46e5' }}
                >
                    <div className="flex justify-between items-start mb-4">
                        <span className={`text-[10px] font-black px-2 py-0.5 rounded-lg uppercase tracking-widest ${topic.level === 'B1' ? 'bg-blue-50 text-blue-600' : 'bg-indigo-50 text-indigo-600'}`}>
                            {topic.level}
                        </span>
                        <div className="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-300 group-hover:bg-blue-600 group-hover:text-white transition-all shadow-inner">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                        </div>
                    </div>
                    <h3 className="text-xl font-extrabold text-slate-800 leading-tight group-hover:text-blue-700 transition-colors">{topic.topic}</h3>
                    <p className="mt-3 text-[11px] font-black text-slate-400 uppercase tracking-widest">10 Questions</p>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
