                { id: 3, text: "What are the pros and cons of cloning?", trans: "Ưu nhược điểm của việc nhân bản vô tính là gì?", vocab: [{w: "Cloning", m: "Nhân bản vô tính"}, {w: "Organ transplant", m: "Ghép tạng"}, {w: "Identity", m: "Bản sắc"}, {w: "Moral issue", m: "Vấn đề đạo đức"}, {w: "Unnatural", m: "Trái tự nhiên"}] },
                { id: 4, text: "Should people have the right to choose when they die (Euthanasia)?", trans: "Con người có nên có quyền chọn cái chết êm ái (Trợ tử)?", vocab: [{w: "Euthanasia", m: "Trợ tử/Cái chết êm ái"}, {w: "Terminal illness", m: "Bệnh nan y"}, {w: "Suffering", m: "Sự đau đớn"}, {w: "Dignity", m: "Nhân phẩm"}, {w: "Controversial", m: "Gây tranh cãi"}] },
                { id: 5, text: "Is it right to create artificial organs for transplants?", trans: "Tạo nội tạng nhân tạo để cấy ghép có đúng đắn không?", vocab: [{w: "Artificial organ", m: "Nội tạng nhân tạo"}, {w: "Shortage", m: "Sự thiếu hụt"}, {w: "Lifesaving", m: "Cứu mạng"}, {w: "Rejection", m: "Sự đào thải (y học)"}, {w: "Prolong life", m: "Kéo dài tuổi thọ"}] },
                { id: 6, text: "How far should science go in trying to extend human life?", trans: "Khoa học nên tiến xa đến đâu trong việc kéo dài tuổi thọ?", vocab: [{w: "Immortality", m: "Sự bất tử"}, {w: "Overpopulation", m: "Bùng nổ dân số"}, {w: "Quality of life", m: "Chất lượng sống"}, {w: "Limit", m: "Giới hạn"}, {w: "Resource allocation", m: "Phân bổ tài nguyên"}] },
                { id: 7, text: "Should healthcare be free for everyone?", trans: "Chăm sóc sức khỏe có nên miễn phí cho tất cả mọi người?", vocab: [{w: "Universal healthcare", m: "Y tế toàn dân"}, {w: "Human right", m: "Nhân quyền"}, {w: "Taxpayer", m: "Người đóng thuế"}, {w: "Quality", m: "Chất lượng"}, {w: "Accessible", m: "Dễ tiếp cận"}] },
                { id: 8, text: "Do fast food companies have a moral responsibility for obesity?", trans: "Các công ty đồ ăn nhanh có trách nhiệm đạo đức với nạn béo phì không?", vocab: [{w: "Responsibility", m: "Trách nhiệm"}, {w: "Obesity", m: "Béo phì"}, {w: "Marketing tactic", m: "Chiến thuật tiếp thị"}, {w: "Personal choice", m: "Lựa chọn cá nhân"}, {w: "Regulate", m: "Kiểm soát/Quy định"}] },
                { id: 9, text: "Should vaccinations be mandatory by law?", trans: "Tiêm chủng có nên bị bắt buộc bởi luật pháp không?", vocab: [{w: "Mandatory", m: "Bắt buộc"}, {w: "Herd immunity", m: "Miễn dịch cộng đồng"}, {w: "Outbreak", m: "Sự bùng phát"}, {w: "Personal freedom", m: "Tự do cá nhân"}, {w: "Protect", m: "Bảo vệ"}] },
                { id: 10, text: "What is the biggest ethical dilemma in modern medicine?", trans: "Tình huống tiến thoái lưỡng nan về đạo đức lớn nhất trong y học hiện đại là gì?", vocab: [{w: "Dilemma", m: "Tiến thoái lưỡng nan"}, {w: "Resource scarcity", m: "Sự khan hiếm tài nguyên"}, {w: "Prioritize", m: "Ưu tiên"}, {w: "Profit vs Care", m: "Lợi nhuận vs Chăm sóc"}, {w: "Complex", m: "Phức tạp"}] }
            ]},
            { id: 36, topic: "Đa dạng văn hóa (Diversity)", level: "B2", questions: [
                { id: 1, text: "Why is cultural diversity important in a society?", trans: "Tại sao đa dạng văn hóa lại quan trọng trong một xã hội?", vocab: [{w: "Tolerance", m: "Sự khoan dung"}, {w: "Perspective", m: "Góc nhìn"}, {w: "Enrich", m: "Làm phong phú"}, {w: "Harmony", m: "Sự hòa hợp"}, {w: "Prejudice", m: "Định kiến"}] },
                { id: 2, text: "How does immigration affect a country's culture?", trans: "Sự nhập cư ảnh hưởng đến văn hóa một quốc gia như thế nào?", vocab: [{w: "Immigration", m: "Sự nhập cư"}, {w: "Melting pot", m: "Nồi lẩu thập cẩm (đa VH)"}, {w: "Integration", m: "Sự hội nhập"}, {w: "Multicultural", m: "Đa văn hóa"}, {w: "Clash", m: "Sự xung đột"}] },
                { id: 3, text: "What are the challenges of living in a multicultural society?", trans: "Thách thức khi sống trong xã hội đa văn hóa là gì?", vocab: [{w: "Language barrier", m: "Rào cản ngôn ngữ"}, {w: "Discrimination", m: "Sự phân biệt đối xử"}, {w: "Misunderstanding", m: "Sự hiểu lầm"}, {w: "Stereotype", m: "Khuôn mẫu/Định kiến"}, {w: "Respect", m: "Tôn trọng"}] },
                { id: 4, text: "Should immigrants be forced to adopt the local culture?", trans: "Người nhập cư có nên bị buộc phải theo văn hóa địa phương?", vocab: [{w: "Assimilate", m: "Đồng hóa"}, {w: "Retain", m: "Giữ lại"}, {w: "Identity", m: "Bản sắc"}, {w: "Impose", m: "Áp đặt"}, {w: "Balance", m: "Sự cân bằng"}] },
                { id: 5, text: "How can schools promote cultural understanding among students?", trans: "Trường học có thể thúc đẩy sự hiểu biết văn hóa giữa học sinh thế nào?", vocab: [{w: "Curriculum", m: "Chương trình học"}, {w: "Exchange program", m: "Chương trình trao đổi"}, {w: "Celebrate", m: "Kỷ niệm/Tôn vinh"}, {w: "Empathy", m: "Sự đồng cảm"}, {w: "Inclusive", m: "Bao hàm/Hòa nhập"}] },
                { id: 6, text: "Is globalization destroying unique local cultures?", trans: "Có phải toàn cầu hóa đang phá hủy các văn hóa địa phương độc đáo?", vocab: [{w: "Homogenization", m: "Sự đồng nhất hóa"}, {w: "Westernization", m: "Tây phương hóa"}, {w: "Preserve", m: "Bảo tồn"}, {w: "Erosion", m: "Sự xói mòn/Mất dần"}, {w: "Adapt", m: "Thích nghi"}] },
                { id: 7, text: "What can we learn from interacting with people from different backgrounds?", trans: "Ta học được gì khi tương tác với người từ các bối cảnh khác nhau?", vocab: [{w: "Broaden horizons", m: "Mở rộng tầm nhìn"}, {w: "Open-minded", m: "Cởi mở"}, {w: "Overcome bias", m: "Vượt qua thành kiến"}, {w: "Insight", m: "Cái nhìn sâu sắc"}, {w: "Global citizen", m: "Công dân toàn cầu"}] },
                { id: 8, text: "Do you think language translation apps will make learning languages obsolete?", trans: "Bạn có nghĩ ứng dụng dịch thuật sẽ khiến việc học ngôn ngữ trở nên lỗi thời?", vocab: [{w: "Obsolete", m: "Lỗi thời"}, {w: "Nuance", m: "Sắc thái ý nghĩa"}, {w: "Emotion", m: "Cảm xúc"}, {w: "Convenience", m: "Sự tiện lợi"}, {w: "Irreplaceable", m: "Không thể thay thế"}] },
                { id: 9, text: "How does traditional food help preserve cultural identity?", trans: "Thức ăn truyền thống giúp bảo tồn bản sắc văn hóa thế nào?", vocab: [{w: "Recipe", m: "Công thức"}, {w: "Pass down", m: "Truyền lại"}, {w: "Symbolize", m: "Tượng trưng"}, {w: "Authenticity", m: "Tính nguyên bản"}, {w: "Heritage", m: "Di sản"}] },
                { id: 10, text: "Why do some people resist cultural changes?", trans: "Tại sao một số người chống lại những thay đổi văn hóa?", vocab: [{w: "Conservative", m: "Bảo thủ"}, {w: "Fear of the unknown", m: "Sợ những điều chưa biết"}, {w: "Comfort zone", m: "Vùng an toàn"}, {w: "Threat", m: "Mối đe dọa"}, {w: "Nostalgia", m: "Sự hoài niệm"}] }
            ]},
            { id: 37, topic: "Năng lượng tái tạo (Renewable Energy)", level: "B2", questions: [
                { id: 1, text: "Why is the shift to renewable energy important?", trans: "Tại sao việc chuyển sang năng lượng tái tạo lại quan trọng?", vocab: [{w: "Sustainability", m: "Sự bền vững"}, {w: "Depletion", m: "Sự cạn kiệt"}, {w: "Fossil fuel", m: "Nhiên liệu hóa thạch"}, {w: "Emission", m: "Khí thải"}, {w: "Mitigate", m: "Làm giảm nhẹ"}] },
                { id: 2, text: "What are the main types of renewable energy used in your country?", trans: "Các loại năng lượng tái tạo chính được dùng ở nước bạn là gì?", vocab: [{w: "Solar power", m: "Năng lượng mặt trời"}, {w: "Wind turbine", m: "Tuabin gió"}, {w: "Hydropower", m: "Thủy điện"}, {w: "Abundant", m: "Dồi dào"}, {w: "Geographical", m: "Thuộc địa lý"}] },
                { id: 3, text: "What are the drawbacks of using solar and wind power?", trans: "Nhược điểm của việc sử dụng năng lượng mặt trời và gió là gì?", vocab: [{w: "Intermittent", m: "Không liên tục"}, {w: "Storage", m: "Lưu trữ"}, {w: "Initial cost", m: "Chi phí ban đầu"}, {w: "Space-consuming", m: "Tốn không gian"}, {w: "Weather-dependent", m: "Phụ thuộc thời tiết"}] },
                { id: 4, text: "Should governments tax companies that use fossil fuels heavily?", trans: "Chính phủ có nên đánh thuế nặng các công ty dùng nhiên liệu hóa thạch?", vocab: [{w: "Carbon tax", m: "Thuế carbon"}, {w: "Incentive", m: "Động lực/Khuyến khích"}, {w: "Penalize", m: "Trừng phạt"}, {w: "Transition", m: "Sự chuyển đổi"}, {w: "Economic impact", m: "Tác động kinh tế"}] },
                { id: 5, text: "Do you think nuclear power is a safe alternative to coal?", trans: "Bạn có nghĩ điện hạt nhân là giải pháp an toàn thay cho than đá?", vocab: [{w: "Nuclear power", m: "Điện hạt nhân"}, {w: "Radioactive waste", m: "Chất thải phóng xạ"}, {w: "Disaster", m: "Thảm họa"}, {w: "Efficient", m: "Hiệu quả"}, {w: "Controversial", m: "Gây tranh cãi"}] },
                { id: 6, text: "How can ordinary citizens save energy at home?", trans: "Người dân bình thường có thể tiết kiệm năng lượng ở nhà thế nào?", vocab: [{w: "Energy-efficient", m: "Tiết kiệm năng lượng"}, {w: "Appliance", m: "Thiết bị"}, {w: "Insulation", m: "Cách nhiệt"}, {w: "Unplug", m: "Rút phích cắm"}, {w: "Habit", m: "Thói quen"}] },
                { id: 7, text: "Will electric cars completely replace gas cars in the future?", trans: "Xe điện có hoàn toàn thay thế xe xăng trong tương lai không?", vocab: [{w: "Electric vehicle (EV)", m: "Xe điện"}, {w: "Charging station", m: "Trạm sạc"}, {w: "Battery lifespan", m: "Tuổi thọ pin"}, {w: "Phase out", m: "Loại bỏ dần"}, {w: "Mainstream", m: "Xu hướng chủ đạo"}] },
                { id: 8, text: "What are the economic benefits of the green energy sector?", trans: "Lợi ích kinh tế của lĩnh vực năng lượng xanh là gì?", vocab: [{w: "Job creation", m: "Tạo việc làm"}, {w: "Innovation", m: "Sự đổi mới"}, {w: "Long-term investment", m: "Đầu tư dài hạn"}, {w: "Independence", m: "Sự độc lập"}, {w: "Boost", m: "Thúc đẩy"}] },
                { id: 9, text: "Is it the responsibility of developed nations to help poorer countries transition to green energy?", trans: "Các nước phát triển có trách nhiệm giúp nước nghèo chuyển đổi năng lượng xanh?", vocab: [{w: "Financial aid", m: "Viện trợ tài chính"}, {w: "Technology transfer", m: "Chuyển giao công nghệ"}, {w: "Global issue", m: "Vấn đề toàn cầu"}, {w: "Obligation", m: "Nghĩa vụ"}, {w: "Fairness", m: "Sự công bằng"}] },
                { id: 10, text: "What is the biggest obstacle to achieving 100% renewable energy?", trans: "Trở ngại lớn nhất để đạt 100% năng lượng tái tạo là gì?", vocab: [{w: "Infrastructure", m: "Cơ sở hạ tầng"}, {w: "Vested interest", m: "Lợi ích nhóm"}, {w: "Cost", m: "Chi phí"}, {w: "Grid system", m: "Hệ thống điện lưới"}, {w: "Political will", m: "Ý chí chính trị"}] }
            ]},
            { id: 38, topic: "Thiết kế Đô thị (Urban Planning)", level: "B2", questions: [
                { id: 1, text: "What makes a city a good place to live?", trans: "Điều gì khiến một thành phố trở thành nơi đáng sống?", vocab: [{w: "Livability", m: "Mức độ đáng sống"}, {w: "Infrastructure", m: "Cơ sở hạ tầng"}, {w: "Amenity", m: "Tiện nghi"}, {w: "Safety", m: "Sự an toàn"}, {w: "Green space", m: "Không gian xanh"}] },
                { id: 2, text: "Should cars be banned from city centers?", trans: "Có nên cấm ô tô vào trung tâm thành phố?", vocab: [{w: "Pedestrian zone", m: "Khu vực đi bộ"}, {w: "Congestion", m: "Sự tắc nghẽn"}, {w: "Air quality", m: "Chất lượng không khí"}, {w: "Inconvenience", m: "Sự bất tiện"}, {w: "Promote", m: "Thúc đẩy"}] },
                { id: 3, text: "How does the architecture of a city affect its people?", trans: "Kiến trúc của thành phố ảnh hưởng đến người dân thế nào?", vocab: [{w: "Aesthetics", m: "Thẩm mỹ"}, {w: "Mood", m: "Tâm trạng"}, {w: "Functionality", m: "Tính ứng dụng"}, {w: "Heritage", m: "Di sản"}, {w: "Identity", m: "Bản sắc"}] },
                { id: 4, text: "What are the main problems with rapid urbanization?", trans: "Các vấn đề chính của đô thị hóa nhanh chóng là gì?", vocab: [{w: "Overcrowding", m: "Quá đông đúc"}, {w: "Slum", m: "Khu ổ chuột"}, {w: "Strain", m: "Sự quá tải/áp lực"}, {w: "Pollution", m: "Ô nhiễm"}, {w: "Inequality", m: "Sự bất bình đẳng"}] },
                { id: 5, text: "How important are public parks in urban areas?", trans: "Công viên công cộng quan trọng thế nào ở khu vực đô thị?", vocab: [{w: "Recreation", m: "Sự giải trí"}, {w: "Lung of the city", m: "Lá phổi thành phố"}, {w: "Socialize", m: "Giao lưu"}, {w: "Well-being", m: "Sức khỏe tốt"}, {w: "Oasis", m: "Ốc đảo"}] },
                { id: 6, text: "Should historical buildings be preserved or demolished for new developments?", trans: "Nên bảo tồn hay phá bỏ tòa nhà lịch sử để phát triển dự án mới?", vocab: [{w: "Preservation", m: "Sự bảo tồn"}, {w: "Demolish", m: "Phá dỡ"}, {w: "Modernization", m: "Sự hiện đại hóa"}, {w: "Compromise", m: "Sự thỏa hiệp"}, {w: "Cultural value", m: "Giá trị văn hóa"}] },
                { id: 7, text: "How can cities become more environmentally friendly?", trans: "Làm sao để các thành phố trở nên thân thiện với môi trường hơn?", vocab: [{w: "Sustainable", m: "Bền vững"}, {w: "Waste management", m: "Quản lý rác thải"}, {w: "Eco-friendly", m: "Thân thiện MT"}, {w: "Public transport", m: "Giao thông công cộng"}, {w: "Renewable", m: "Tái tạo"}] },
                { id: 8, text: "What is the role of public transportation in urban planning?", trans: "Vai trò của giao thông công cộng trong quy hoạch đô thị là gì?", vocab: [{w: "Accessibility", m: "Khả năng tiếp cận"}, {w: "Reduce traffic", m: "Giảm lưu lượng xe"}, {w: "Affordable", m: "Giá cả phải chăng"}, {w: "Network", m: "Mạng lưới"}, {w: "Efficiency", m: "Hiệu quả"}] },
                { id: 9, text: "Is it better to build tall skyscrapers or spread the city out?", trans: "Xây nhà chọc trời hay mở rộng diện tích thành phố thì tốt hơn?", vocab: [{w: "High-rise", m: "Nhà cao tầng"}, {w: "Urban sprawl", m: "Sự mở rộng đô thị"}, {w: "Land scarcity", m: "Sự khan hiếm đất"}, {w: "Density", m: "Mật độ"}, {w: "Commute", m: "Đi lại"}] },
                { id: 10, text: "What will the 'smart cities' of the future look like?", trans: "Thành phố thông minh trong tương lai sẽ trông như thế nào?", vocab: [{w: "Interconnected", m: "Kết nối liên thông"}, {w: "Sensor", m: "Cảm biến"}, {w: "Automated", m: "Tự động hóa"}, {w: "Data-driven", m: "Dựa trên dữ liệu"}, {w: "Optimize", m: "Tối ưu hóa"}] }
            ]},
            { id: 39, topic: "Tâm lý đám đông (Mob Psychology)", level: "B2", questions: [
                { id: 1, text: "Why do people often conform to the behavior of a group?", trans: "Tại sao mọi người thường hùa theo hành vi của một nhóm?", vocab: [{w: "Conformity", m: "Sự tuân theo"}, {w: "Peer pressure", m: "Áp lực đồng trang lứa"}, {w: "Fit in", m: "Hòa nhập"}, {w: "Fear of missing out", m: "Sợ bị bỏ lỡ (FOMO)"}, {w: "Instinct", m: "Bản năng"}] },
                { id: 2, text: "How does anonymity on the internet affect people's behavior?", trans: "Sự ẩn danh trên internet ảnh hưởng đến hành vi con người ra sao?", vocab: [{w: "Anonymity", m: "Sự ẩn danh"}, {w: "Cyberbullying", m: "Bắt nạt qua mạng"}, {w: "Lack of accountability", m: "Thiếu trách nhiệm"}, {w: "Aggressive", m: "Hung hăng"}, {w: "Unleash", m: "Giải phóng"}] },
                { id: 3, text: "Can you think of a time when the 'wisdom of the crowd' was wrong?", trans: "Bạn có thể nghĩ ra lúc nào mà 'trí tuệ đám đông' bị sai không?", vocab: [{w: "Mob mentality", m: "Tâm lý bầy đàn"}, {w: "Irrational", m: "Phi lý trí"}, {w: "Panic", m: "Sự hoảng loạn"}, {w: "Blindly follow", m: "Mù quáng làm theo"}, {w: "Critical thinking", m: "Tư duy phản biện"}] },
                { id: 4, text: "How do advertising companies use group psychology to sell products?", trans: "Các công ty QC dùng tâm lý nhóm để bán hàng thế nào?", vocab: [{w: "Manipulate", m: "Thao túng"}, {w: "Trend", m: "Xu hướng"}, {w: "Endorsement", m: "Sự chứng thực (bởi người nổi tiếng)"}, {w: "Scarcity", m: "Sự khan hiếm"}, {w: "Desire", m: "Khao khát"}] },
                { id: 5, text: "Is it always good to follow the rules of society?", trans: "Có phải lúc nào cũng tốt khi tuân theo các quy tắc xã hội?", vocab: [{w: "Norm", m: "Chuẩn mực"}, {w: "Status quo", m: "Hiện trạng"}, {w: "Rebel", m: "Nổi loạn"}, {w: "Progress", m: "Sự tiến bộ"}, {w: "Question", m: "Đặt câu hỏi/Nghi ngờ"}] },
                { id: 6, text: "Why do rumors spread so quickly in a group?", trans: "Tại sao tin đồn lại lan truyền quá nhanh trong một nhóm?", vocab: [{w: "Rumor", m: "Tin đồn"}, {w: "Gossip", m: "Chuyện phiếm"}, {w: "Curiosity", m: "Sự tò mở"}, {w: "Exaggerate", m: "Phóng đại"}, {w: "Verify", m: "Xác minh"}] },
                { id: 7, text: "What makes a person a strong independent thinker?", trans: "Điều gì tạo nên một người suy nghĩ độc lập mạnh mẽ?", vocab: [{w: "Independent", m: "Độc lập"}, {w: "Analyze", m: "Phân tích"}, {w: "Objective", m: "Khách quan"}, {w: "Stand one's ground", m: "Giữ vững lập trường"}, {w: "Courage", m: "Sự can đảm"}] },
                { id: 8, text: "How does panic buying happen during a crisis?", trans: "Hiện tượng mua sắm hoảng loạn xảy ra thế nào trong khủng hoảng?", vocab: [{w: "Panic buying", m: "Mua sắm hoảng loạn"}, {w: "Shortage", m: "Sự thiếu hụt"}, {w: "Hoard", m: "Tích trữ"}, {w: "Contagious", m: "Có tính lây lan"}, {w: "Survival", m: "Sự sinh tồn"}] },
                { id: 9, text: "Do leaders create followers, or do followers create leaders?", trans: "Lãnh đạo tạo ra người theo sau, hay người theo sau tạo ra lãnh đạo?", vocab: [{w: "Charisma", m: "Sự uy tín/Quyến rũ"}, {w: "Dynamic", m: "Động lực học"}, {w: "Represent", m: "Đại diện"}, {w: "Mutual", m: "Lẫn nhau"}, {w: "Inspire", m: "Truyền cảm hứng"}] },
                { id: 10, text: "How can individuals protect themselves from negative group influence?", trans: "Cá nhân có thể bảo vệ mình khỏi ảnh hưởng xấu từ nhóm thế nào?", vocab: [{w: "Self-awareness", m: "Tự nhận thức"}, {w: "Boundary", m: "Ranh giới"}, {w: "Evaluate", m: "Đánh giá"}, {w: "Distance", m: "Giữ khoảng cách"}, {w: "Core value", m: "Giá trị cốt lõi"}] }
            ]},
            { id: 40, topic: "Lãnh đạo & Tương lai (Leadership)", level: "B2", questions: [
                { id: 1, text: "Are great leaders born or made?", trans: "Lãnh đạo xuất chúng là bẩm sinh hay do rèn luyện?", vocab: [{w: "Innate", m: "Bẩm sinh"}, {w: "Acquire", m: "Đạt được/Học được"}, {w: "Cultivate", m: "Trau dồi"}, {w: "Experience", m: "Kinh nghiệm"}, {w: "Potential", m: "Tiềm năng"}] },
                { id: 2, text: "What is the difference between a boss and a leader?", trans: "Sự khác biệt giữa sếp và nhà lãnh đạo là gì?", vocab: [{w: "Dictate", m: "Ra lệnh"}, {w: "Guide", m: "Hướng dẫn"}, {w: "Empathy", m: "Sự đồng cảm"}, {w: "Micromanage", m: "Quản lý vi mô"}, {w: "Empower", m: "Trao quyền"}] },
                { id: 3, text: "How important is communication in leadership?", trans: "Giao tiếp quan trọng thế nào trong vai trò lãnh đạo?", vocab: [{w: "Articulate", m: "Lưu loát/Rõ ràng"}, {w: "Active listening", m: "Lắng nghe chủ động"}, {w: "Transparency", m: "Sự minh bạch"}, {w: "Misunderstanding", m: "Sự hiểu lầm"}, {w: "Bridge the gap", m: "Thu hẹp khoảng cách"}] },
                { id: 4, text: "Should a leader always be confident?", trans: "Một người lãnh đạo có nên luôn luôn tự tin không?", vocab: [{w: "Confidence", m: "Sự tự tin"}, {w: "Vulnerability", m: "Sự dễ tổn thương"}, {w: "Arrogance", m: "Sự kiêu ngạo"}, {w: "Acknowledge", m: "Thừa nhận"}, {w: "Authentic", m: "Chân thực"}] },
                { id: 5, text: "What is the biggest challenge leaders face in the modern workplace?", trans: "Thách thức lớn nhất của lãnh đạo trong môi trường hiện đại là gì?", vocab: [{w: "Adaptability", m: "Khả năng thích ứng"}, {w: "Remote work", m: "Làm việc từ xa"}, {w: "Generation gap", m: "Khoảng cách thế hệ"}, {w: "Mental health", m: "Sức khỏe tinh thần"}, {w: "Rapid change", m: "Thay đổi chóng mặt"}] },
                { id: 6, text: "How should a leader handle failure?", trans: "Một nhà lãnh đạo nên xử lý sự thất bại như thế nào?", vocab: [{w: "Take responsibility", m: "Nhận trách nhiệm"}, {w: "Blame", m: "Đổ lỗi"}, {w: "Learn from mistakes", m: "Học từ sai lầm"}, {w: "Resilience", m: "Sự kiên cường"}, {w: "Bounce back", m: "Vực dậy"}] },
                { id: 7, text: "Is it better for a leader to be loved or feared?", trans: "Lãnh đạo được yêu mến hay bị sợ hãi thì tốt hơn?", vocab: [{w: "Respect", m: "Sự tôn trọng"}, {w: "Intimidate", m: "Dọa nạt"}, {w: "Affection", m: "Sự yêu mến"}, {w: "Authoritarian", m: "Độc đoán"}, {w: "Balance", m: "Sự cân bằng"}] },
                { id: 8, text: "How does technology change the role of a manager?", trans: "Công nghệ thay đổi vai trò của một người quản lý thế nào?", vocab: [{w: "Data-driven", m: "Dựa trên dữ liệu"}, {w: "Automate", m: "Tự động hóa"}, {w: "Track progress", m: "Theo dõi tiến độ"}, {w: "Human touch", m: "Sự kết nối con người"}, {w: "Facilitator", m: "Người điều phối"}] },
                { id: 9, text: "What skills will be most important for future leaders?", trans: "Kỹ năng nào sẽ quan trọng nhất đối với các nhà lãnh đạo tương lai?", vocab: [{w: "Emotional intelligence", m: "Trí tuệ cảm xúc"}, {w: "Visionary", m: "Có tầm nhìn xa"}, {w: "Agility", m: "Sự nhanh nhạy"}, {w: "Inclusive", m: "Hòa nhập/Bao hàm"}, {w: "Tech-savvy", m: "Am hiểu công nghệ"}] },
                { id: 10, text: "Can anyone learn to be a good leader?", trans: "Bất cứ ai cũng có thể học để trở thành lãnh đạo tốt đúng không?", vocab: [{w: "Willingness", m: "Sự sẵn lòng"}, {w: "Self-awareness", m: "Tự nhận thức"}, {w: "Mentorship", m: "Sự cố vấn"}, {w: "Practice", m: "Thực hành"}, {w: "Continuous learning", m: "Học tập không ngừng"}] }
            ]}
        ];

        function App() {
            const [selectedTopic, setSelectedTopic] = useState(null);
            const [currentStep, setCurrentStep] = useState(0);
            const [showTrans, setShowTrans] = useState(false);
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [showSummary, setShowSummary] = useState(false);
            
            const [isCopied, setIsCopied] = useState(false);

            const [user, setUser] = useState(null);
            const [isLoadingData, setIsLoadingData] = useState(isCloudEnabled);

            const [globalData, setGlobalData] = useState(() => {
                if (!isCloudEnabled) {
                    const saved = localStorage.getItem('speakmaster_progress');
                    return saved ? JSON.parse(saved) : {};
                }
                return {};
            });
            
            useEffect(() => {
                if (!isCloudEnabled) return; 
                
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        console.error("Lỗi đồng bộ tài khoản:", error);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!isCloudEnabled || !user) return; 
                
                const progressRef = collection(db, 'artifacts', appId, 'users', user.uid, 'topicProgress');
                
                const unsubscribe = onSnapshot(progressRef, (snapshot) => {
                    const newData = {};
                    snapshot.forEach(doc => {
                        newData[doc.id] = doc.data().answers || {};
                    });
                    setGlobalData(newData);
                    setIsLoadingData(false);
                }, (error) => {
                    console.error("Lỗi tải Sổ tay từ Cloud:", error);
                    setIsLoadingData(false);
                });
                
                return () => unsubscribe();
            }, [user]);

            const saveProgressData = async (topicId, step, dataObject) => {
                setGlobalData(prev => {
                    const nextData = {
                        ...prev,
                        [topicId]: {
                            ...(prev[topicId] || {}),
                            [step]: dataObject
                        }
                    };
                    
                    if (!isCloudEnabled) {
                        localStorage.setItem('speakmaster_progress', JSON.stringify(nextData));
                    }
                    return nextData;
                });

                if (isCloudEnabled && user) {
                    try {
                        const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'topicProgress', String(topicId));
                        await setDoc(docRef, {
                            answers: {
                                [step]: dataObject
                            }
                        }, { merge: true });
                    } catch (error) {
                        console.error("Lỗi lưu sổ tay lên Đám mây:", error);
                    }
                }
            };
            
            const [isTranslating, setIsTranslating] = useState(false);
            const [translationError, setTranslationError] = useState("");

            useEffect(() => {
                const initVoices = () => {
                    window.speechSynthesis.getVoices();
                };
                initVoices();
                if (window.speechSynthesis.onvoiceschanged !== undefined) {
                    window.speechSynthesis.onvoiceschanged = initVoices;
                }
            }, []);

            const getNaturalVoice = useCallback(() => {
                const voices = window.speechSynthesis.getVoices();
                if (!voices.length) return null;

                const preferredNames = [
                    'Google US English', 'Google UK English Female', 'Google UK English Male',
                    'Samantha', 'Daniel', 'Karen', 'Arthur',
                    'Microsoft Aria Online (Natural) - English (United States)'
                ];
                const naturalKeywords = ['Natural', 'Premium', 'Enhanced', 'Online'];

                for (const name of preferredNames) {
                    const voice = voices.find(v => v.name === name);
                    if (voice) return voice;
                }

                const premiumVoice = voices.find(v => 
                    v.lang.startsWith('en') && naturalKeywords.some(keyword => v.name.includes(keyword))
                );
                if (premiumVoice) return premiumVoice;

                return voices.find(v => v.lang === 'en-US') || voices.find(v => v.lang.startsWith('en')) || voices[0];
            }, []);

            const speak = useCallback((text) => {
                if (!window.speechSynthesis) return;
                
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                
                const bestVoice = getNaturalVoice();
                if (bestVoice) {
                    utterance.voice = bestVoice;
                }

                utterance.rate = 0.85;
                utterance.pitch = 1.0; 
                
                utterance.onstart = () => setIsSpeaking(true);
                utterance.onend = () => setIsSpeaking(false);
                utterance.onerror = () => setIsSpeaking(false);
                
                window.speechSynthesis.speak(utterance);
            }, [getNaturalVoice]);

            const handleWordClick = (word) => {
                const cleanWord = word.replace(/[.,!?";:()[\]{}]/g, ''); 
                if (cleanWord.trim()) {
                    speak(cleanWord);
                }
            };

            const currentQuestion = useMemo(() => 
                selectedTopic ? selectedTopic.questions[currentStep] : null
            , [selectedTopic, currentStep]);

            const progress = selectedTopic ? ((currentStep + 1) / selectedTopic.questions.length) * 100 : 0;
            
            const currentTopicData = selectedTopic ? (globalData[selectedTopic.id] || {}) : {};

            const handleViTextChange = (e) => {
                const text = e.target.value;
                const currentData = currentTopicData[currentStep] || {};
                const newData = { ...currentData, vi: text };
                saveProgressData(selectedTopic.id, currentStep, newData);
            };

            const next = () => {
                if (currentStep < selectedTopic.questions.length - 1) {
                    setCurrentStep(prev => prev + 1);
                    setShowTrans(false);
                    setTranslationError("");
                    window.speechSynthesis.cancel();
                } else {
                    setShowSummary(true);
                    window.speechSynthesis.cancel();
                }
            };

            const back = () => {
                if (currentStep > 0) {
                    setCurrentStep(prev => prev - 1);
                    setShowTrans(false);
                    setTranslationError("");
                    window.speechSynthesis.cancel();
                }
            };

            const closeTopic = () => {
                setSelectedTopic(null);
                setShowSummary(false);
                setIsCopied(false);
                window.speechSynthesis.cancel();
            }

            const copySummaryToClipboard = () => {
                if (!selectedTopic) return;
                
                let textToCopy = `📚 SỔ TAY ÔN TẬP: ${selectedTopic.topic}\n`;
                textToCopy += `================================\n\n`;
                
                let hasContent = false;
                
                selectedTopic.questions.forEach((q, idx) => {
                    const t = currentTopicData[idx];
                    if (t && (t.vi || t.en)) {
                        hasContent = true;
                        textToCopy += `Q${idx + 1}: ${q.text}\n`;
                        if (t.vi) textToCopy += `📝 Ý tưởng (VI): ${t.vi}\n`;
                        if (t.en) textToCopy += `🗣️ Bản dịch AI (EN): ${t.en}\n`;
                        textToCopy += `--------------------------------\n\n`;
                    }
                });
                
                if (!hasContent) {
                    textToCopy += `Chưa có ý tưởng nào được lưu trong chủ đề này.\n`;
                }

                const textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand("copy");
                    setIsCopied(true);
                    setTimeout(() => setIsCopied(false), 2500);
                } catch (err) {
                    console.error("Lỗi khi copy: ", err);
                }
                document.body.removeChild(textArea);
            };

            const handleTranslate = async () => {
                const currentViText = currentTopicData[currentStep]?.vi || "";
                if (!currentViText.trim()) return;

                setIsTranslating(true);
                setTranslationError("");
                
                try {
                    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=vi&tl=en&dt=t&q=${encodeURIComponent(currentViText)}`;
                    const response = await fetch(url);
                    
                    if (!response.ok) throw new Error('API Error');
                    
                    const data = await response.json();
                    const translatedText = data[0].map(item => item[0]).join('');

                    if (translatedText) {
                        const currentData = currentTopicData[currentStep] || {};
                        const newData = { ...currentData, en: translatedText.trim() };
                        saveProgressData(selectedTopic.id, currentStep, newData);
                    } else {
                        setTranslationError("Không nhận được bản dịch hợp lệ.");
                    }
                } catch (error) {
                    console.error(error);
                    setTranslationError("Lỗi kết nối dịch thuật. Vui lòng kiểm tra mạng.");
                } finally {
                    setIsTranslating(false);
                }
            };

            const currentViText = currentTopicData[currentStep]?.vi || "";
            const currentEnText = currentTopicData[currentStep]?.en || "";

            const handleOpenTopic = (t) => {
                setSelectedTopic(t);
                const tData = globalData[t.id] || {};
                const firstUncompleted = t.questions.findIndex((_, idx) => !tData[idx]?.en);
                setCurrentStep(firstUncompleted === -1 ? 0 : firstUncompleted);
                setShowSummary(false);
            };

            return (
                <div className="max-w-6xl mx-auto px-4 py-8 md:py-12">
                    <div className="flex justify-between items-center mb-10">
                        <div>
                            <h1 className="text-3xl font-extrabold text-slate-900 tracking-tight">SpeakMaster Pro Max</h1>
                            <p className="text-slate-500 font-medium mt-1">Luyện nói Tiếng Anh B1-B2 • Dịch ý tưởng thông minh</p>
                        </div>
                        
                        <div className="flex gap-3">
                            {selectedTopic && (
                                <React.Fragment>
                                    {!showSummary && (
                                        <button 
                                            onClick={() => setShowSummary(true)}
                                            className="px-4 py-2.5 bg-amber-50 border border-amber-200 text-amber-700 rounded-xl font-bold hover:bg-amber-100 transition-all shadow-sm flex items-center gap-2"
                                            title="Xem Sổ Tay Ôn Tập"
                                        >
                                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                                            <span className="hidden sm:inline">Sổ tay</span>
                                        </button>
                                    )}
                                    <button 
                                        onClick={closeTopic}
                                        className="p-2.5 bg-white border border-slate-200 rounded-xl hover:bg-red-50 hover:text-red-600 hover:border-red-200 transition-all shadow-sm flex items-center justify-center"
                                        title="Thoát chủ đề về Trang chủ"
                                    >
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                                    </button>
                                </React.Fragment>
                            )}
                        </div>
                    </div>

                    {!selectedTopic ? (
                        <div className="animate-in fade-in duration-700">
                            {isLoadingData ? (
                                <div className="flex flex-col items-center justify-center py-24 text-slate-400">
                                    <svg className="spinner w-12 h-12 mb-4 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                    <p className="font-semibold tracking-wide text-lg text-slate-600">Đang đồng bộ Sổ tay từ Cloud...</p>
                                </div>
                            ) : (
                                <React.Fragment>
                                    <div className="mb-12">
                                        <h2 className="text-lg font-black text-blue-600 uppercase tracking-widest mb-6 flex items-center gap-3">
                                            <span className="w-8 h-1.5 bg-blue-600 rounded-full"></span>
                                            Chủ đề trình độ B1 (20 Topics)
                                        </h2>
                                        <div className="topic-grid">
                                            {APP_DATA.filter(t => t.level === 'B1').map(t => (
                                                <TopicCard key={t.id} topic={t} onClick={() => handleOpenTopic(t)} progressData={globalData[t.id] || {}} />
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <h2 className="text-lg font-black text-indigo-600 uppercase tracking-widest mb-6 flex items-center gap-3">
                                            <span className="w-8 h-1.5 bg-indigo-600 rounded-full"></span>
                                            Chủ đề trình độ B2 (20 Topics)
                                        </h2>
                                        <div className="topic-grid">
                                            {APP_DATA.filter(t => t.level === 'B2').map(t => (
                                                <TopicCard key={t.id} topic={t} onClick={() => handleOpenTopic(t)} progressData={globalData[t.id] || {}} />
                                            ))}
                                        </div>
                                    </div>
                                </React.Fragment>
                            )}
                        </div>
                    ) : showSummary ? (
                        <div className="max-w-4xl mx-auto animate-in slide-in-from-bottom-8 duration-500">
                            <div className="glass-card rounded-[2.5rem] p-8 md:p-12 shadow-xl border-t-8 border-t-amber-400">
                                <div className="text-center mb-10">
                                    <div className="w-20 h-20 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                                    </div>
                                    <h2 className="text-3xl font-extrabold text-slate-800">Sổ Tay Ôn Tập</h2>
                                    <p className="text-slate-500 font-medium mt-2">Chủ đề: {selectedTopic.topic}</p>
                                    
                                    <div className="mt-5 inline-flex items-center gap-2 bg-blue-50 text-blue-600 px-4 py-2 rounded-full text-sm font-medium border border-blue-100 shadow-sm">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                                        Bấm vào từng từ tiếng Anh để nghe phát âm, hoặc bấm nút loa để nghe cả câu
                                    </div>
                                </div>

                                <div className="space-y-6 mb-10">
                                    {selectedTopic.questions.map((q, idx) => {
                                        const t = currentTopicData[idx];
                                        if (!t || (!t.vi && !t.en)) return null; 
                                        
                                        return (
                                            <div key={idx} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm relative group">
                                                <h4 className="font-bold text-slate-800 mb-4 flex gap-2">
                                                    <span className="text-amber-500">Q{idx + 1}:</span> {q.text}
                                                </h4>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                        <span className="text-[11px] font-black text-slate-400 uppercase tracking-widest block mb-2">Ý tưởng (VI)</span>
                                                        <p className="text-slate-600 italic text-[15px]">{t.vi}</p>
                                                    </div>
                                                    <div className="bg-blue-50/50 p-4 rounded-xl border border-blue-100">
                                                        <div className="flex justify-between items-center mb-2">
                                                            <span className="text-[11px] font-black text-blue-400 uppercase tracking-widest block">Bản dịch (EN)</span>
                                                            <button 
                                                                onClick={() => speak(t.en)}
                                                                className="p-1.5 bg-blue-100 text-blue-600 rounded-full hover:bg-blue-200 transition-colors shadow-sm"
                                                                title="Nghe toàn bộ câu tiếng Anh"
                                                            >
                                                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                                                            </button>
                                                        </div>
                                                        <p className="text-slate-800 font-medium text-[15px] leading-relaxed">
                                                            {t.en.split(/(\s+)/).map((segment, index) => {
                                                                if (/\s+/.test(segment)) {
                                                                    return <span key={index}>{segment}</span>;
                                                                }
                                                                return (
                                                                    <span 
                                                                        key={index} 
                                                                        onClick={() => handleWordClick(segment)}
                                                                        className="font-medium text-slate-800 clickable-word cursor-pointer hover:bg-blue-200 hover:text-blue-800 rounded px-0.5 transition-colors"
                                                                        title="Bấm để nghe phát âm"
                                                                    >
                                                                        {segment}
                                                                    </span>
                                                                );
                                                            })}
                                                        </p>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                    
                                    {Object.keys(currentTopicData).length === 0 && (
                                        <div className="text-center py-12 bg-slate-50 rounded-2xl border border-dashed border-slate-200 text-slate-400 italic">
                                            Bạn chưa lưu ý tưởng nào trong sổ tay này.<br/>Hãy quay lại học và dịch nhé!
                                        </div>
                                    )}
                                </div>

                                <div className="flex flex-col sm:flex-row gap-4">
                                    <button 
                                        onClick={() => setShowSummary(false)}
                                        className="flex-1 py-4 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200 transition-all border border-slate-200 flex items-center justify-center gap-2"
                                    >
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                                        Quay lại học tiếp
                                    </button>

                                    <button 
                                        onClick={copySummaryToClipboard}
                                        className={`flex-[2] py-4 rounded-xl font-bold transition-all shadow-lg flex items-center justify-center gap-2 text-white ${isCopied ? 'bg-green-500 hover:bg-green-600' : 'bg-blue-600 hover:bg-blue-700'}`}
                                    >
                                        {isCopied ? (
                                            <React.Fragment>
                                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                Đã copy thành công!
                                            </React.Fragment>
                                        ) : (
                                            <React.Fragment>
                                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                                Copy toàn bộ Sổ tay
                                            </React.Fragment>
                                        )}
                                    </button>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="max-w-4xl mx-auto animate-in slide-in-from-bottom-8 duration-500">
                            <div className="mb-8 text-center">
                                <div className="flex justify-between text-[12px] font-black text-slate-400 uppercase tracking-widest mb-3">
                                    <span>{selectedTopic.topic}</span>
                                    <span className="bg-slate-200 text-slate-600 px-3 py-1 rounded-full">Câu {currentStep + 1} / {selectedTopic.questions.length}</span>
                                </div>
                                <div className="w-full h-3 bg-slate-200 rounded-full overflow-hidden shadow-inner">
                                    <div className={`h-full progress-bar ${selectedTopic.level === 'B1' ? 'bg-blue-600' : 'bg-indigo-600'}`} style={{width: `${progress}%`}}></div>
                                </div>
                            </div>

                            <div className="glass-card rounded-[2.5rem] p-8 md:p-12 shadow-2xl relative overflow-hidden border-t-8 border-t-blue-500">
                                <div className={`absolute top-0 right-0 px-8 py-2 rounded-bl-3xl text-[11px] font-black uppercase tracking-widest shadow-md ${selectedTopic.level === 'B1' ? 'bg-blue-600 text-white' : 'bg-indigo-600 text-white'}`}>
                                    Level {selectedTopic.level}
                                </div>

                                <div className="min-h-[180px] flex flex-col items-center justify-center text-center mt-6">
                                    <h3 className="text-3xl md:text-4xl font-extrabold text-slate-800 leading-tight mb-8">
                                        {currentQuestion.text}
                                    </h3>

                                    <div className="flex gap-4 items-center">
                                        <button 
                                            onClick={() => speak(currentQuestion.text)}
                                            className={`w-16 h-16 rounded-full flex items-center justify-center transition-all active:scale-90 ${isSpeaking ? (selectedTopic.level === 'B1' ? 'bg-blue-600 text-white pulse-ring' : 'bg-indigo-600 text-white pulse-ring') : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                            title="Nghe câu hỏi"
                                        >
                                            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                                        </button>
                                        <button 
                                            onClick={() => setShowTrans(!showTrans)}
                                            className="px-6 py-3 border-2 border-slate-200 rounded-2xl font-bold text-slate-500 hover:text-slate-800 hover:border-slate-300 transition-all bg-white"
                                        >
                                            {showTrans ? 'Ẩn nghĩa Tiếng Việt' : 'Xem nghĩa Tiếng Việt'}
                                        </button>
                                    </div>

                                    {showTrans && (
                                        <p className="mt-8 text-xl font-semibold text-slate-600 italic animate-in fade-in slide-in-from-top-4 duration-300 bg-slate-50 p-4 rounded-2xl w-full border border-slate-100">
                                            "{currentQuestion.trans}"
                                        </p>
                                    )}
                                </div>

                                <div className="mt-12 pt-8 border-t-2 border-dashed border-slate-200">
                                    <div className="flex items-center gap-2 mb-5">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={selectedTopic.level === 'B1' ? 'text-blue-500' : 'text-indigo-500'}><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                                        <p className="text-[11px] font-black text-slate-400 uppercase tracking-widest">Từ vựng gợi ý (Bấm để nghe)</p>
                                    </div>
                                    
                                    <div className="flex flex-wrap gap-3">
                                        {currentQuestion.vocab.map((v, i) => (
                                            <button 
                                                key={i} 
                                                onClick={() => speak(v.w)}
                                                className={`text-left flex-grow sm:flex-grow-0 bg-white px-5 py-3.5 rounded-2xl cursor-pointer transition-all flex flex-col justify-center border shadow-sm active:scale-95 hover:-translate-y-0.5 ${selectedTopic.level === 'B1' ? 'hover:bg-blue-50 border-slate-200 hover:border-blue-300 hover:shadow-blue-100' : 'hover:bg-indigo-50 border-slate-200 hover:border-indigo-300 hover:shadow-indigo-100'}`}
                                            >
                                                <span className="font-extrabold text-slate-800 text-[16px] mb-1">{v.w}</span>
                                                <span className="text-[13px] text-slate-500 font-medium">{v.m}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="mt-12 pt-8 border-t-2 border-dashed border-slate-200 bg-slate-50/50 -mx-8 -mb-8 px-8 pb-8 rounded-b-[2.5rem]">
                                    <div className="flex items-center justify-between mb-5">
                                        <div className="flex items-center gap-2">
                                            <div className={`p-1.5 rounded-lg ${selectedTopic.level === 'B1' ? 'bg-blue-100 text-blue-600' : 'bg-indigo-100 text-indigo-600'}`}>
                                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
                                            </div>
                                            <p className="text-[12px] font-black text-slate-700 uppercase tracking-widest">Trợ lý dịch ý tưởng (Google Translate)</p>
                                        </div>
                                    </div>
                                    
                                    <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
                                        <div className="flex flex-col gap-3">
                                            <textarea 
                                                value={currentViText}
                                                onChange={handleViTextChange}
                                                placeholder="Viết ý tưởng câu trả lời của bạn bằng tiếng Việt vào đây..."
                                                className="w-full h-40 p-4 rounded-2xl bg-white border-2 border-slate-200 focus:border-blue-400 focus:ring-4 focus:ring-blue-100 resize-none transition-all outline-none text-slate-700 text-[15px] leading-relaxed shadow-sm"
                                            ></textarea>
                                            <button 
                                                onClick={handleTranslate}
                                                disabled={!currentViText.trim() || isTranslating}
                                                className={`w-full py-3.5 rounded-xl font-bold text-white transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed active:scale-[0.98] shadow-md ${selectedTopic.level === 'B1' ? 'bg-blue-600 hover:bg-blue-700' : 'bg-indigo-600 hover:bg-indigo-700'}`}
                                            >
                                                {isTranslating ? (
                                                    <React.Fragment>
                                                        <svg className="spinner w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                                        Đang dịch...
                                                    </React.Fragment>
                                                ) : (
                                                    <React.Fragment>
                                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
                                                        Dịch sang Tiếng Anh
                                                    </React.Fragment>
                                                )}
                                            </button>
                                            {translationError && <p className="text-red-500 text-sm font-medium pl-1">{translationError}</p>}
                                        </div>
                                        
                                        <div className="flex flex-col gap-3">
                                            <div className="w-full h-40 p-5 rounded-2xl bg-blue-50/30 border-2 border-blue-100 overflow-y-auto relative text-[17px] shadow-inner">
                                                {!currentEnText ? (
                                                    <div className="flex flex-col items-center justify-center h-full text-slate-300 opacity-60">
                                                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="mb-2"><path d="M21 15a2 2 0 0 1-2-2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                                                        <span className="italic text-sm font-medium">Bản dịch sẽ xuất hiện ở đây...</span>
                                                    </div>
                                                ) : (
                                                    <div>
                                                        {currentEnText.split(/(\s+)/).map((segment, index) => {
                                                            if (/\s+/.test(segment)) {
                                                                return <span key={index}>{segment}</span>;
                                                            }
                                                            return (
                                                                <span 
                                                                    key={index} 
                                                                    onClick={() => handleWordClick(segment)}
                                                                    className="font-medium text-slate-800 clickable-word cursor-pointer"
                                                                    title="Bấm để nghe phát âm"
                                                                >
                                                                    {segment}
                                                                </span>
                                                            );
                                                        })}
                                                    </div>
                                                )}
                                            </div>
                                            
                                            <div className="bg-blue-50 border border-blue-100 rounded-xl p-3 flex items-center gap-3 text-blue-700">
                                                <div className="bg-blue-100 p-2 rounded-full">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M5 18v-6a6 6 0 0 1 12 0v6"/><path d="M12 2v4"/><path d="M12 13v9"/></svg>
                                                </div>
                                                <p className="text-[13px] font-semibold">
                                                    Mẹo học: <span className="font-normal text-blue-600">Bấm thẳng vào từng từ tiếng Anh ở trên để nghe phát âm và tập đọc theo.</span>
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="mt-8 flex gap-4 pt-4">
                                <button 
                                    disabled={currentStep === 0}
                                    onClick={back}
                                    className="flex-1 py-4 bg-slate-100 rounded-[1.2rem] font-bold text-slate-600 hover:bg-slate-200 transition-all disabled:opacity-30 disabled:cursor-not-allowed border border-slate-200"
                                >
                                    Quay lại
                                </button>
                                <button 
                                    onClick={next}
                                    className={`flex-[2] py-4 text-white rounded-[1.2rem] font-black text-lg shadow-xl transition-all active:scale-[0.98] flex justify-center items-center gap-2 ${selectedTopic.level === 'B1' ? 'bg-blue-600 hover:bg-blue-700 shadow-blue-200' : 'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-200'}`}
                                >
                                    {currentStep === selectedTopic.questions.length - 1 ? (
                                        <React.Fragment>
                                            Hoàn thành & Mở Sổ Tay
                                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                                        </React.Fragment>
                                    ) : (
                                        <React.Fragment>
                                            Câu tiếp theo
                                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                                        </React.Fragment>
                                    )}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function TopicCard({ topic, onClick, progressData }) {
            const completedCount = Object.keys(progressData).filter(key => progressData[key]?.en).length;
            const percent = Math.round((completedCount / topic.questions.length) * 100);

            return (
                <div 
                    onClick={onClick}
                    className="glass-card p-6 rounded-[2rem] cursor-pointer hover:-translate-y-1.5 hover:shadow-xl transition-all border-l-4 group relative overflow-hidden flex flex-col justify-between"
                    style={{ borderLeftColor: topic.level === 'B1' ? '#2563eb' : '#4f46e5' }}
                >
                    <div>
                        <div className="flex justify-between items-start mb-5">
                            <span className={`text-[11px] font-black px-3 py-1 rounded-xl uppercase tracking-widest ${topic.level === 'B1' ? 'bg-blue-100 text-blue-700' : 'bg-indigo-100 text-indigo-700'}`}>
                                Level {topic.level}
                            </span>
                            <div className="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 group-hover:bg-slate-800 group-hover:text-white transition-all shadow-sm z-10">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                            </div>
                        </div>
                        <h3 className="text-xl font-extrabold text-slate-800 leading-tight group-hover:text-slate-900 mb-1 z-10 relative">{topic.topic}</h3>
                        <p className="mt-3 text-[12px] font-bold text-slate-400 flex items-center gap-1.5 z-10 relative">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                            {topic.questions.length} Câu hỏi • Có Sổ tay lưu từ
                        </p>
                    </div>

                    <div className="mt-6 pt-5 border-t border-slate-100 z-10 relative">
                        <div className="flex justify-between text-[11px] font-bold text-slate-500 mb-2">
                            <span>Tiến độ học</span>
                            <span className={percent === 100 ? "text-green-600" : ""}>{percent}%</span>
                        </div>
                        <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                            <div 
                                className={`h-full rounded-full transition-all duration-500 ${percent === 100 ? 'bg-green-500' : (topic.level === 'B1' ? 'bg-blue-500' : 'bg-indigo-500')}`} 
                                style={{width: `${percent}%`}}
                            ></div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
